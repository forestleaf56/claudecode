<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Emberhollow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--panel:#15181f;--panel2:#1d2129;--line:#3b3427;--ember:#ff9a3c;--ember2:#ffcf7a;--txt:#eadfc8;--mut:#8f8571;--good:#8fd18a;--bad:#e86a5a;--blue:#7fb6ff;--focus:#ffd27a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:Nunito,"Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.hidden{display:none!important}
.sa{padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
#hud{position:fixed;inset:0;pointer-events:none;z-index:6}
#bars{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:4px}
.bar{display:flex;align-items:center;gap:5px;font-size:13px;text-shadow:0 1px 2px #000}
.bar i{display:block;width:clamp(70px,16vw,130px);height:11px;background:#0009;border:1px solid #fff2;border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 3px #000a}
.bar b{display:block;height:100%;width:50%;border-radius:8px;transition:width .2s;box-shadow:inset 0 2px 0 #ffffff40}
#track{margin-top:6px;border-radius:0 10px 10px 0!important;max-width:min(46vw,300px);font-size:12px;line-height:1.3;background:#0009;border-left:3px solid var(--ember);padding:4px 7px;border-radius:4px;text-shadow:0 1px 2px #000}
#track:empty{display:none}
#track .q{color:var(--ember2);font-weight:bold}
#clock{border-radius:14px!important;position:absolute;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));text-align:right;font-size:13px;background:#0009;padding:5px 9px;border-radius:8px;border:1px solid #fff1;line-height:1.35;text-shadow:0 1px 2px #000}
#clock .big{font-size:16px;font-weight:bold;color:var(--ember2)}
#hotbar{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto;background:linear-gradient(#1a1712cc,#0c0a08dd);padding:5px;border-radius:18px;border:1px solid #ffffff1a;box-shadow:0 6px 20px #0008}
.slot{position:relative;width:clamp(34px,7.2vw,50px);height:clamp(34px,7.2vw,50px);background:radial-gradient(circle at 35% 30%,#ffffff17,#ffffff06);border:2px solid #ffffff14;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,4vw,28px);line-height:1}
.slot .ic{position:relative;z-index:1;filter:drop-shadow(0 1px 1px #000)}
.slot .tint{position:absolute;inset:4px;border-radius:50%;opacity:.42;filter:blur(1px)}
.slot .n{position:absolute;right:2px;bottom:0;font-size:11px;font-weight:bold;z-index:2;text-shadow:0 0 2px #000,0 0 2px #000}
.slot .k{position:absolute;left:3px;top:0;font-size:9px;color:var(--mut);z-index:2}
.slot.sel{border-color:var(--ember);box-shadow:0 0 8px var(--ember)}
.slot.pick{border-color:var(--blue);box-shadow:0 0 8px var(--blue)}
#prompt{position:absolute;left:50%;bottom:calc(max(8px,env(safe-area-inset-bottom)) + clamp(50px,9vw,66px));transform:translateX(-50%);background:#000b;padding:3px 10px;border-radius:12px;font-size:13px;white-space:nowrap}
#prompt:empty{display:none}
#boss{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;font-size:13px;width:min(50vw,360px);text-shadow:0 1px 2px #000}
#boss i{display:block;height:10px;background:#0009;border:1px solid #fff3;border-radius:5px;overflow:hidden;margin-top:2px}
#boss b{display:block;height:100%;background:linear-gradient(90deg,#a2242a,#ff6a3c)}
#toasts{position:fixed;top:22%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:40}
.toast{background:#0b0a08d8;border:1px solid var(--line);padding:6px 14px;border-radius:20px;font-weight:800;font-size:14px;animation:tf 2.8s forwards;text-align:center;max-width:80vw}
@keyframes tf{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#saved{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));right:max(10px,env(safe-area-inset-right));font-size:12px;color:var(--mut);opacity:0;transition:opacity .4s;pointer-events:none}
/* touch */
#touch{position:fixed;inset:0;pointer-events:none;z-index:5}
#stickZone{position:absolute;left:0;top:18%;width:45%;bottom:0;pointer-events:auto}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid #ffffff30;background:#ffffff0a;transform:translate(-50%,-50%);display:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:#ffffff40}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2e2820cc,#0c0a08cc);border:2px solid #ffffff30;box-shadow:0 4px 14px #0008;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
.tb:active,.tb.on{background:#ff9a3c55}
#tA{width:74px;height:74px;right:calc(max(14px,env(safe-area-inset-right)) + 4px);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 120px);font-weight:bold}
#tX{width:66px;height:66px;right:calc(max(14px,env(safe-area-inset-right)) + 86px);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 70px)}
#tInv{width:42px;height:42px;right:calc(max(10px,env(safe-area-inset-right)) + 96px);top:calc(max(8px,env(safe-area-inset-top)) + 84px);font-size:18px}
#tMenu{width:42px;height:42px;right:max(10px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 84px);font-size:18px}
#tMap{width:42px;height:42px;right:calc(max(10px,env(safe-area-inset-right)) + 48px);top:calc(max(8px,env(safe-area-inset-top)) + 84px);font-size:18px}
#tCraft{width:42px;height:42px;right:calc(max(10px,env(safe-area-inset-right)) + 144px);top:calc(max(8px,env(safe-area-inset-top)) + 84px);font-size:18px}
/* panels */
.layer{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#000a}
.panel{background:linear-gradient(#191c24,#121419);border:2px solid var(--line);border-radius:22px;box-shadow:0 10px 40px #000;width:min(96vw,900px);height:min(92vh,640px);display:flex;flex-direction:column;overflow:hidden;position:relative}
.ptabs{display:flex;gap:2px;overflow-x:auto;background:#0d0f14;border-bottom:1px solid var(--line);flex:none;scrollbar-width:none;padding-right:44px}
.ptabs::-webkit-scrollbar{display:none}
.tab{padding:9px 12px;font-size:14px;white-space:nowrap;color:var(--mut);border-bottom:3px solid transparent}
.tab.act{color:var(--ember2);border-color:var(--ember)}
.pbody{flex:1;overflow-y:auto;padding:10px;overscroll-behavior:contain}
.pclose{position:absolute;right:6px;top:4px;width:36px;height:36px;font-size:20px;border-radius:8px;background:#000;z-index:2}
.f.focus,.f:focus-visible{outline:3px solid var(--focus)!important;outline-offset:1px;z-index:3}
.btn{background:linear-gradient(#352d1f,#231d14);border:1px solid #6b5636;border-radius:14px;padding:8px 14px;font-weight:800;box-shadow:inset 0 1px 0 #ffffff14;color:var(--txt);font-size:14px}
.btn:active{filter:brightness(1.3)}
.btn.pri{background:linear-gradient(#8a4a18,#5e300e);border-color:#ff9a3c}
.btn[disabled],.btn.dis{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(40px,8vw,52px),1fr));gap:4px}
.grid .slot{width:100%;height:auto;aspect-ratio:1}
.row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:var(--panel2);margin-bottom:5px;border:1px solid #ffffff0a}
.row .ic{font-size:24px;width:34px;text-align:center;flex:none;position:relative}
.row .grow{flex:1;min-width:0}
.row .nm{font-weight:bold;font-size:14px}
.row .ds{font-size:12px;color:var(--mut)}
.have{color:var(--good)}.lack{color:var(--bad)}
.h2{font-size:15px;color:var(--ember2);margin:8px 0 6px;font-weight:bold}
.info{background:var(--panel2);border-radius:14px;padding:8px;margin:8px 0;min-height:60px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chip{padding:5px 10px;border-radius:14px;background:#262a33;font-size:13px;border:1px solid #ffffff12}
.chip.act{background:#6b3a12;border-color:var(--ember)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.eq{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.eq .slot{width:48px;height:48px}
.stat{display:inline-block;margin:2px 8px 2px 0;font-size:13px}
/* dialog */
#dlg{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(96vw,760px);background:linear-gradient(#1b1e26,#121419);border:2px solid var(--line);border-radius:22px;padding:10px 12px;z-index:25;box-shadow:0 6px 30px #000}
#dHead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
#dPor{font-size:34px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 40% 35%,#3a3226,#15120e);border-radius:50%;border:2px solid #6b5636}
#dName{font-weight:bold;color:var(--ember2);font-size:16px}
#dHearts{font-size:12px;color:#e86a8a}
#dText{font-size:15px;line-height:1.45;min-height:44px;max-height:34vh;overflow-y:auto;white-space:pre-wrap}
#dOpts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
/* title */
#title{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 70%,#2a1608 0%,#0b0d12 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
#title h1{font-size:clamp(36px,9vw,70px);margin:0;letter-spacing:3px;font-weight:900;background:linear-gradient(180deg,#ffe2a8,#ff9a3c 60%,#d8582a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px #ff6a0070)}
#title .sub{color:var(--mut);font-size:clamp(13px,3vw,17px);margin-bottom:10px}
#title .btn{min-width:220px;font-size:17px;padding:10px 18px}
#emb{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffb060;box-shadow:0 0 6px #ff8a30;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}10%{opacity:1}to{transform:translateY(-100vh);opacity:0}}
#story{position:fixed;inset:0;z-index:45;background:#05060a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
#storyT{max-width:640px;font-size:clamp(16px,3.6vw,21px);line-height:1.6;font-family:Georgia,serif;color:#e8d8b8;min-height:40vh;display:flex;align-items:center}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:44}
#modal{position:fixed;inset:0;z-index:60;background:#000b;display:flex;align-items:center;justify-content:center}
#modalBox{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:16px;max-width:min(92vw,460px);text-align:center}
#modalT{margin-bottom:12px;font-size:15px;line-height:1.4;white-space:pre-wrap}
#modalB{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* fishing */
#fish{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:22;background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:12px;text-align:center;width:min(90vw,380px)}
#fishBar{position:relative;height:26px;background:#0b1a2a;border-radius:13px;overflow:hidden;margin:10px 0;border:1px solid #fff2}
#fishZone{position:absolute;top:0;bottom:0;background:#4caf5088;border-left:2px solid #8f8;border-right:2px solid #8f8}
#fishNeedle{position:absolute;top:-2px;bottom:-2px;width:4px;background:#fff;box-shadow:0 0 6px #fff}
#fishMsg{font-size:16px;min-height:22px}
#fishHits{font-size:20px;letter-spacing:4px}
.mapwrap{position:relative;width:100%;display:flex;justify-content:center}
.mapwrap canvas{max-width:100%;max-height:calc(min(92vh,640px) - 110px);image-rendering:pixelated;border:1px solid var(--line);border-radius:6px;background:#000}
.lore{font-family:Georgia,serif;line-height:1.5;font-size:14px}
.bar.low i{animation:pulse 1s infinite}
@media (orientation:portrait){body.touchui #tA{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 140px)}body.touchui #tX{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 96px)}body.touchui #prompt{bottom:calc(max(8px,env(safe-area-inset-bottom)) + 60px)}}
#splash{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,#fff8ea 0%,#f8e6c8 55%,#efd3aa 100%);opacity:1;transition:opacity .6s ease}
#splash.out{opacity:0}
#splashCv{width:min(78vmin,440px);height:min(78vmin,440px);opacity:0;transform:scale(.94);transition:opacity .9s ease,transform 1.2s ease}
#splash.on #splashCv{opacity:1;transform:scale(1)}
@keyframes pulse{50%{box-shadow:0 0 8px #f44}}
</style>
</head>

'use strict';
/* ===================== EMBERHOLLOW ===================== */
/* ---------- utils ---------- */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let R=Math.random;

function hash2(x,y,s){let h=(x*374761393+y*668265263+s*982451653)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return lerp(lerp(a,b,u),lerp(c,d,u),v);}

 finn:{n:['Finn the Innkeeper','Krögaren Finn'],por:'👨‍🍳',x:87,y:103,shop:'finn',pal:['#d89870','#e8a030','#8a2a2a','#3a2a2a'],loves:['ember_feast','chili_stew','moonmelon','pumpkin'],likes:['egg','honey','tomato','meat'],hates:['ash','bone','stone'],
  l:[['Hungry? Of course you are. Everyone is hungry in the Dusk.','Hungrig? Klart du är. Alla är hungriga i Skymningen.'],
   ['A hot stew warms you better than any coat.','En varm gryta värmer bättre än någon rock.'],
   ['Cook at a campfire for simple things. A proper pot for the rest.','Laga enkla saker vid en lägereld. En riktig gryta för resten.'],
   ['There is a cat that hangs about behind the inn. Shy little thing.','Det finns en katt som håller till bakom värdshuset. Blyg liten sak.']],
  h:[['I used to run a busy inn. Songs every night. We will sing again, you will see.','Jag drev ett livligt värdshus förr. Sång varje kväll. Vi ska sjunga igen, ska du se.'],
   ['You eat like a wolf and fight like one too. I like that.','Du äter som en varg och slåss som en också. Det gillar jag.']],
  hg:[[['bread',5]],[['hearty_stew',3]],[['ember_feast',1]]]},
 grim:{n:['Grim the Miner','Gruvarbetaren Grim'],por:'⛏️',x:80,y:81,shop:'grim',pal:['#b88868','#5a5a5a','#4a4a3a','#2a2a2a'],loves:['diamond','voidshard','hearty_stew','gold_bar'],likes:['coal','iron_ore','roast_meat','bread'],hates:['flower','moonpetal','berries'],
  l:[['The deeper you go, the richer the rock. And the meaner the bats.','Ju djupare du går, desto rikare berg. Och elakare fladdermöss.'],
   ['Every five levels there is a lift. Use it. Save your legs.','Var femte nivå finns en hiss. Använd den. Spara dina ben.'],
   ['Torches! Never go down without torches.','Facklor! Gå aldrig ner utan facklor.'],
   ['Something sleeps at depth twenty-five. Something with a crown.','Något sover på djup tjugofem. Något med en krona.']],
  h:[['Been down here thirty years. You are the first one I would trust with my lift.','Varit här nere i trettio år. Du är den första jag skulle lita på med min hiss.'],
   ['Here is a miner\'s secret: rocks sometimes hide the ladder. Smash them all.','Här är en gruvarbetarhemlighet: stenar gömmer ibland stegen. Krossa allihop.']],
  hg:[[['bomb',5]],[['lantern',1]],[['diamond',1]]]},
 hedda:{n:['Hedda the Hunter','Jägarinnan Hedda'],por:'🏹',x:96,y:59,shop:'hedda',pal:['#e8c8b0','#f0f0f0','#6a7a8a','#3a3a3a'],loves:['frost_tea','fur','hearty_stew','sapphire'],likes:['meat','jerky','snowberry','tea'],hates:['flower','glass','paper'],
  l:[['The north bites. Wear fur or turn back.','Norr biter. Bär päls eller vänd om.'],
   ['Frost wolves hunt in packs. Be clever.','Frostvargar jagar i flock. Var klok.'],
   ['The Frost Matron guards the northern shrine. She was not always cruel.','Frostmatronan vaktar den norra helgedomen. Hon var inte alltid grym.'],
   ['Snowberries and tea. That is how I survive up here.','Snöbär och te. Det är så jag överlever här uppe.']],
  h:[['I left the village because it reminded me of everything we lost. You make it easier to visit.','Jag lämnade byn för att den påminde om allt vi förlorat. Du gör det lättare att hälsa på.'],
   ['If you ever need a hunting partner, just whistle. I will hear it.','Om du någonsin behöver en jaktkamrat, vissla bara. Jag hör det.']],
  hg:[[['jerky',5]],[['fur_coat',1]],[['frost_band',1]]]},
 lumen:{n:['Lumen','Lumen'],por:'✨',x:146,y:96,shop:'lumen',wisp:1,pal:['#c8fff0','#7fffd0','#7fffd0','#3aa88a'],loves:['moonpetal','wisp_dust','moonstone','lost_light'],likes:['glowcap','flower','frostleaf','honey'],hates:['coal','ash','meat'],
  l:[['…you see me? Few do.','…du ser mig? Få gör det.'],
   ['The trees remember the sun. They hum about it at night.','Träden minns solen. De nynnar om den om natten.'],
   ['Light wants to be shared. That is its nature.','Ljus vill delas. Det är dess natur.'],
   ['Moonpetals open only when the moon is high. Look for them at night.','Månblad öppnar sig bara när månen står högt. Leta efter dem om natten.']],
  h:[['I was a candle once, I think. In a window. Someone waited for someone.','Jag var ett ljus en gång, tror jag. I ett fönster. Någon väntade på någon.'],
   ['You are warm. Not like fire. Like… home.','Du är varm. Inte som eld. Som… hemma.']],
  hg:[[['wisp_dust',10]],[['light_potion',3]],[['moonstone',2]]]},
};

// main
q({id:'m_welcome',g:'maren',main:1,n:['A Cold Welcome','Ett kallt välkomnande'],d:['Find Elder Maren by the Great Lantern in the heart of Hollowmere.','Hitta Äldste Maren vid Stora Lyktan i hjärtat av Hollowmere.'],req:[{t:'talk'}],
 e:['Ah… a traveler, walking out of the Dusk on their own two feet. Welcome to Hollowmere. The old cabin east of the square is yours, if you will stay. We need hands. We need hope even more.','Ah… en resenär som vandrar ut ur Skymningen på egna ben. Välkommen till Hollowmere. Den gamla stugan öster om torget är din, om du stannar. Vi behöver händer. Vi behöver hopp ännu mer.'],
 rw:{c:30,it:[['torch',4],['bread',3]],rc:['campfire']},next:'m_kindling'});
q({id:'m_kindling',g:'maren',main:1,n:['Kindling','Tändved'],d:['Gather wood and stone for Maren. Chop trees with your axe, break rocks with your pickaxe.','Samla trä och sten åt Maren. Fäll träd med yxan, krossa stenar med hackan.'],req:[{t:'have',i:'wood',n:15},{t:'have',i:'stone',n:10}],
 s:['First things first: winter in the Dusk is cruel. Gather wood and stone — trees and rocks lie all around the village — and bring them to me.','Först det viktigaste: vintern i Skymningen är grym. Samla trä och sten — träd och stenar finns runt hela byn — och ta dem till mig.'],
 e:['Good, strong hands. Here — I have written down how to build a workbench. Every home starts with one.','Bra, starka händer. Här — jag har skrivit ner hur man bygger en arbetsbänk. Varje hem börjar med en.'],
 rw:{c:60,rc:['workbench']},next:'m_hearth'});
q({id:'m_hearth',g:'maren',main:1,n:['Hearth and Home','Härd och hem'],d:['Craft and place a Campfire and a Workbench near your cabin.','Tillverka och placera en Lägereld och en Arbetsbänk nära din stuga.'],req:[{t:'stat',s:'place:campfire',n:1},{t:'stat',s:'place:workbench',n:1}],
 s:['Now make your place. Build a campfire and a workbench near your cabin. Fire keeps the cold — and the shades — away. Use the action button on a station to craft with it.','Gör nu platsen till din. Bygg en lägereld och en arbetsbänk nära stugan. Eld håller kylan — och skuggorna — borta. Använd handlingsknappen på en station för att tillverka.'],
 e:['I saw the smoke from here. It has been a long time since a new fire was lit in Hollowmere. Go see Ylva the herbalist next — west of the square.','Jag såg röken härifrån. Det var länge sedan en ny eld tändes i Hollowmere. Gå till örtkvinnan Ylva härnäst — väster om torget.'],
 rw:{c:50,rc:['chest']},next:'m_seeds'});
q({id:'m_seeds',g:'ylva',main:1,n:['Seeds of Hope','Hoppets frön'],d:['Till soil with the hoe, plant seeds, water them daily and harvest 5 crops.','Bearbeta jorden med hackan, plantera frön, vattna dagligen och skörda 5 grödor.'],req:[{t:'stat',s:'harvest',n:5}],give:[['@seasonseed',10]],
 s:['Maren sent you? Wonderful. The soil by your cabin is good. Till it with your hoe, plant these, and water them every day. Sleep, and they will grow. Come back when you have harvested five.','Maren skickade dig? Underbart. Jorden vid din stuga är bra. Bearbeta den med hackan, plantera dessa och vattna dem varje dag. Sov, så växer de. Kom tillbaka när du skördat fem.'],
 e:['Look at that! Food grown under a grey sky. You have a gift. Bram the smith asked about you, too.','Se där! Mat odlad under en grå himmel. Du har en gåva. Smeden Bram frågade efter dig också.'],
 rw:{c:80,it:[['@seasonseed',10]],rc:['scarecrow']},next:'m_smith'});
q({id:'m_smith',g:'bram',main:1,n:["The Smith's Fire",'Smedens eld'],d:['Bring 8 Copper Ore to Bram. The Deepdark Mine lies northwest of the village.','Ta 8 kopparmalm till Bram. Djupmörka gruvan ligger nordväst om byn.'],req:[{t:'have',i:'copper_ore',n:8}],
 s:['You want better tools? Then I need copper. The old Deepdark Mine lies northwest of the village — Grim the miner keeps watch there. Bring me eight copper ore.','Vill du ha bättre verktyg? Då behöver jag koppar. Den gamla Djupmörka gruvan ligger nordväst om byn — gruvarbetaren Grim håller vakt där. Ta med åtta kopparmalm.'],
 e:['Decent ore. Here is how to build a furnace. Smelt your own bars, and with a workbench you will be making copper tools in no time.','Hyfsad malm. Här är hur man bygger en smältugn. Smält egna tackor, så gör du koppar­verktyg vid arbetsbänken på nolltid.'],
 rw:{c:100,rc:['furnace']},next:'m_scholar'});
q({id:'m_scholar',g:'linnea',main:1,n:['Knowledge in the Dark','Kunskap i mörkret'],d:['Craft a Research Desk and study 5 different items at it.','Tillverka ett forskarbord och studera 5 olika föremål vid det.'],req:[{t:'stat',s:'craft:research_desk',n:1},{t:'stat',s:'study',n:5}],unlock:['research_desk'],
 s:['You are the newcomer who brings things back from the dark? Build a research desk — I will show you how — and study what you find. Five things, to start. Research unlocks new recipes.','Du är nykomlingen som tar med saker ur mörkret? Bygg ett forskarbord — jag visar hur — och studera det du hittar. Fem saker, till att börja med. Forskning låser upp nya recept.'],
 e:['Five discoveries! You see? Every object is a page in a book nobody finished writing.','Fem upptäckter! Ser du? Varje föremål är en sida i en bok som ingen skrev klart.'],
 rw:{c:100,rp:20,it:[['paper',5]]},next:'m_lantern'});
q({id:'m_lantern',g:'maren',main:1,n:['The Fading Lantern','Den falnande lyktan'],d:['Grow stronger. Reach depth 10 in the Deepdark Mine.','Bli starkare. Nå djup 10 i Djupmörka gruvan.'],req:[{t:'max',s:'depth',n:10}],
 s:['It is time you knew the truth. The Great Lantern was lit by five Ember Shards, scattered when the Dusk fell — hidden in shrines at the four corners of the land, and one deep below. Before you face such places you must grow strong. Reach depth ten of the Deepdark Mine.','Det är dags att du får veta sanningen. Den Stora Lyktan tändes av fem Glödskärvor som spreds när Skymningen föll — gömda i helgedomar i landets fyra hörn, och en djupt nere. Innan du möter sådana platser måste du bli stark. Nå djup tio i Djupmörka gruvan.'],
 e:['Depth ten! Then you are ready to hear of the shrines. Hedda the hunter keeps a camp in the frozen north. Go to her. And take this — an anvil will serve you well.','Djup tio! Då är du redo att höra om helgedomarna. Jägarinnan Hedda har ett läger i den frusna norden. Gå till henne. Och ta detta — ett städ kommer att tjäna dig väl.'],
 rw:{c:150,rc:['anvil']},next:'m_frost'});
q({id:'m_frost',g:'hedda',main:1,n:['Frozen Echo','Frusket eko'],d:['Craft a Fur Coat, then wake the seal at the northern shrine and claim the Frost Shard.','Tillverka en Pälsrock, väck sedan sigillet vid den norra helgedomen och ta Frostskärvan.'],req:[{t:'stat',s:'craft:fur_coat',n:1},{t:'have',i:'shard_frost',n:1,keep:1}],unlock:['loom','cloth','leather','fur_coat','fur_hood'],
 s:["Maren's champion, eh? The north shrine lies at the very top of the land, past the frozen lakes. Cold kills faster than claws up there. Make yourself a fur coat at a loom — I'll show you — then wake the seal. The Frost Matron guards the shard.","Marens kämpe, va? Den norra helgedomen ligger längst upp i landet, bortom de frusna sjöarna. Kylan dödar snabbare än klor där uppe. Gör dig en pälsrock vid en vävstol — jag visar hur — och väck sedan sigillet. Frostmatronan vaktar skärvan."],
 e:['You came back. With the shard! The Matron… is she at peace now? Good. Lumen, the wisp of the eastern Whisperwood, will want to see that shard.','Du kom tillbaka. Med skärvan! Matronan… har hon frid nu? Bra. Lumen, irrblosset i östra Viskskogen, kommer vilja se den skärvan.'],
 rw:{c:200,it:[['frost_tea',3],['fur',5]]},next:'m_wisp'});
q({id:'m_wisp',g:'lumen',main:1,n:['Whispers in the Wood','Viskningar i skogen'],d:['Bring Lumen 10 Wisp Dust and 3 Moonpetals (they bloom at night in the Whisperwood).','Ge Lumen 10 irrblossdamm och 3 månblad (de blommar om natten i Viskskogen).'],req:[{t:'have',i:'wisp_dust',n:10},{t:'have',i:'moonpetal',n:3}],
 s:['…you carry a shard. It sings. The eastern grove is sealed by old light. Bring me ten wisp dust and three moonpetals, and I will weave you a lantern to open it.','…du bär en skärva. Den sjunger. Den östra lunden är förseglad av gammalt ljus. Ge mig tio irrblossdamm och tre månblad, så väver jag en lykta åt dig som öppnar den.'],
 e:['Here. The Wisp Lantern. Show it to the seal in the eastern grove, at the edge of the world. The Hollow Stag waits… it was once the forest\'s heart.','Här. Irrblosslyktan. Visa den för sigillet i den östra lunden, vid världens kant. Den Ihåliga Hjorten väntar… den var en gång skogens hjärta.'],
 rw:{it:[['wisp_lantern',1]]},next:'m_grove'});
q({id:'m_grove',g:'lumen',main:1,n:['The Hollow Stag','Den ihåliga hjorten'],d:['Use the Wisp Lantern at the eastern shrine and claim the Grove Shard.','Använd Irrblosslyktan vid den östra helgedomen och ta Lundskärvan.'],req:[{t:'have',i:'shard_grove',n:1,keep:1}],
 e:['The forest hums again. Thank you. Take this ring — it keeps a little of my light with you. Sigrid by the lake knows of the drowned shrine in the south.','Skogen nynnar igen. Tack. Ta denna ring — den håller lite av mitt ljus hos dig. Sigrid vid sjön vet om den dränkta helgedomen i söder.'],
 rw:{c:250,it:[['wisp_ring',1]]},next:'m_bog'});
q({id:'m_bog',g:'sigrid',main:1,n:['The Drowned Shrine','Den dränkta helgedomen'],d:['Make a Reed Charm at an Alchemy Table, then claim the Bog Shard in the southern Murkfen.','Gör en Vassamulett vid ett alkemibord, ta sedan Myrskärvan i södra Myrkärret.'],req:[{t:'stat',s:'craft:reed_charm',n:1},{t:'have',i:'shard_bog',n:1,keep:1}],unlock:['glass','alch_table','reed_charm'],
 s:['The southern shrine sank into the Murkfen long ago. My grandmother said only a reed charm lets you walk where the Bog Mother rules. Make one at an alchemy table — marsh reeds, bog moss, a touch of wisp dust.','Den södra helgedomen sjönk ner i Myrkärret för länge sedan. Min mormor sa att bara en vassamulett låter dig gå där Myrmodern härskar. Gör en vid ett alkemibord — vass, myrmossa, en nypa irrblossdamm.'],
 e:['The fen is quieter. Even the frogs sound relieved. Bram has been asking for you — something about the west.','Kärret är tystare. Till och med grodorna låter lättade. Bram har frågat efter dig — något om väst.'],
 rw:{c:300,it:[['hp_potion',3],['rod_iron',1]]},next:'m_ash'});
q({id:'m_ash',g:'bram',main:1,n:['Ashes Remember','Askan minns'],d:['Forge an Obsidian Key at an anvil and claim the Ash Shard in the western Barrens.','Smid en Obsidiannyckel vid ett städ och ta Askskärvan i de västra Askmarkerna.'],req:[{t:'stat',s:'craft:obsidian_key',n:1},{t:'have',i:'shard_ash',n:1,keep:1}],unlock:['obsidian_key'],
 s:['The Ash Colossus. My grandfather fought in the war that burned the west. The shrine there is locked by obsidian. Forge an Obsidian Key at an anvil — obsidian from the Ashen Barrens, iron, and ash.','Askkolossen. Min farfar stred i kriget som brände väst. Helgedomen där är låst med obsidian. Smid en obsidiannyckel vid ett städ — obsidian från Askmarkerna, järn och aska.'],
 e:['You beat the Colossus. You. I… need to sit down. Take this blade. I have been saving it for someone worthy.','Du besegrade Kolossen. Du. Jag… måste sätta mig. Ta den här klingan. Jag har sparat den åt någon värdig.'],
 rw:{c:400,it:[['sword_silver',1]]},next:'m_deep'});
q({id:'m_deep',g:'grim',main:1,n:['Into the Deep','In i djupet'],d:['Descend to depth 25 of the mine, defeat the Hollow King and claim the Deep Shard.','Gå ner till djup 25 i gruvan, besegra den Ihålige Kungen och ta Djupskärvan.'],req:[{t:'have',i:'shard_deep',n:1,keep:1}],
 s:['So it is down to the last shard. Depth twenty-five. The Hollow King. Take bombs, take food, take everything.','Så det är sista skärvan kvar. Djup tjugofem. Den Ihålige Kungen. Ta bomber, ta mat, ta allt.'],
 e:['You came back up! Most do not. Not from there. Go — Maren is waiting.','Du kom upp igen! De flesta gör inte det. Inte därifrån. Gå — Maren väntar.'],
 rw:{c:500,it:[['diamond',1],['hp_potion2',3]]},next:'m_rekindle'});
q({id:'m_rekindle',g:'maren',main:1,n:['Rekindling','Återtändning'],d:['Bring all five shards to the Great Lantern and set them in its heart.','Ta alla fem skärvorna till Stora Lyktan och placera dem i dess hjärta.'],req:[{t:'stat',s:'lantern',n:1}],
 s:['Five shards. Bring them to the Great Lantern and set them in its heart. Let us see if the old stories are true.','Fem skärvor. Ta dem till Stora Lyktan och placera dem i dess hjärta. Låt oss se om de gamla berättelserna är sanna.'],
 e:['Look… LOOK. The sky is turning gold. Child, you brought back the dawn. Wear this crown. Not as a ruler — as a reminder.','Se… SE. Himlen blir gyllene. Barn, du förde tillbaka gryningen. Bär denna krona. Inte som en härskare — som en påminnelse.'],
 rw:{c:1000,it:[['ember_crown',1],['dawn_blade',1]]},next:'m_dawn'});
q({id:'m_dawn',g:'maren',main:1,n:['A New Dawn','En ny gryning'],d:['Celebrate with the villagers. Chat with people around the valley.','Fira med byborna. Prata med folk runt dalen.'],req:[{t:'stat',s:'chats',n:8}],
 s:['Go on, celebrate! Talk to everyone. They will want to thank you.','Gå och fira! Prata med alla. De vill tacka dig.'],
 e:['The village is alive again. The deep mine still holds treasures, and the land is yours to shape. Thank you, Lanternbearer.','Byn lever igen. Den djupa gruvan rymmer fortfarande skatter, och landet är ditt att forma. Tack, Lyktbärare.'],
 rw:{c:500,it:[['ember_feast',2]]}});

SQ('s_light','maren',['m_hearth'],['Light the Way','Lys upp vägen'],['Place 10 torches around the valley.','Placera 10 facklor runt dalen.'],[{t:'stat',s:'place:torch',n:10}],{c:120,it:[['lamp_post',2]]},
 ['The paths are so dark. Place ten torches — around the village, your home, wherever you walk.','Stigarna är så mörka. Placera tio facklor — runt byn, ditt hem, var du än går.'],['Better. People are walking at night again.','Bättre. Folk går ute på kvällarna igen.']);
SQ('s_watch','maren',['m_lantern'],['Night Watch','Nattvakt'],['Defeat 15 Shades.','Besegra 15 skuggor.'],[{t:'stat',s:'kill:shade',n:15}],{c:300,it:[['hp_potion',3]]},
 ['Shades drift in from the dark every night. Thin their numbers.','Skuggor driver in från mörkret varje natt. Gallra bland dem.'],['The nights are calmer. Thank you, watcher.','Nätterna är lugnare. Tack, väktare.']);
SQ('s_iron','bram',['m_lantern'],['Iron Will','Järnvilja'],['Bring Bram 10 Iron Bars.','Ge Bram 10 järntackor.'],[{t:'have',i:'iron_bar',n:10}],{c:400,it:[['sword_iron',1]]},
 ['Iron. Ten bars. I have orders from half the village and no ore.','Järn. Tio tackor. Jag har beställningar från halva byn och ingen malm.'],['Fine bars. Here, a sword from the first batch.','Fina tackor. Här, ett svärd från första omgången.']);
SQ('s_gems','bram',['m_smith'],['Glitter','Glitter'],['Bring an Amethyst and a Topaz.','Ta med en ametist och en topas.'],[{t:'have',i:'amethyst',n:1},{t:'have',i:'topaz',n:1}],{c:320,it:[['leather_cap',1]]},
 ['I want to set gems into a hilt. Amethyst and topaz. The mine has them.','Jag vill fatta ädelstenar i ett fäste. Ametist och topas. Gruvan har dem.'],['Beautiful. Do not tell anyone I said beautiful.','Vackert. Säg inte till någon att jag sa vackert.']);

/* ===================== GRAPHICS: round & smooth ===================== */
function mk(w,h,f){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));const x=c.getContext('2d');x.imageSmoothingEnabled=true;f(x,c.width,c.height);return c;}
function shade(hex,f){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const m=v=>clamp(Math.round(f>1?v+(255-v)*(f-1):v*f),0,255);return'#'+((1<<24)|(m(r)<<16)|(m(g)<<8)|m(b)).toString(16).slice(1);}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`;}
function rrp(x,X,Y,w,h,r){const R4=Array.isArray(r)?r:[r,r,r,r];const m=Math.min(w,h)/2;const [a,b,c,d]=R4.map(v=>Math.min(v,m));
 x.beginPath();x.moveTo(X+a,Y);x.lineTo(X+w-b,Y);x.arcTo(X+w,Y,X+w,Y+b,b);x.lineTo(X+w,Y+h-c);x.arcTo(X+w,Y+h,X+w-c,Y+h,c);x.lineTo(X+d,Y+h);x.arcTo(X,Y+h,X,Y+h-d,d);x.lineTo(X,Y+a);x.arcTo(X,Y,X+a,Y,a);x.closePath();}
function circ(x,X,Y,r,c){x.fillStyle=c;x.beginPath();x.arc(X,Y,Math.max(.1,r),0,Math.PI*2);x.fill();}
function ell(x,X,Y,rx,ry,c,rot){x.fillStyle=c;x.beginPath();x.ellipse(X,Y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,Math.PI*2);x.fill();}
function rg(x,X,Y,r,c0,c1,ox,oy){const g=x.createRadialGradient(X+r*(ox??-.35),Y+r*(oy??-.4),r*.08,X,Y,r);g.addColorStop(0,c0);g.addColorStop(1,c1);return g;}
function ball(x,X,Y,r,col,hi){x.fillStyle=rg(x,X,Y,r,shade(col,hi||1.3),shade(col,.72));x.beginPath();x.arc(X,Y,Math.max(.1,r),0,Math.PI*2);x.fill();}
function lg(x,y0,y1,c0,c1){const g=x.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c0);g.addColorStop(1,c1);return g;}
function shadowE(x,X,Y,rx,ry,a){ell(x,X,Y,rx,ry,`rgba(0,0,0,${a??.32})`);}
function blobPath(x,X,Y,rx,ry,rr,n){n=n||9;const pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,k=.84+rr()*.24;pts.push([X+Math.cos(a)*rx*k,Y+Math.sin(a)*ry*k]);}
 x.beginPath();const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];let m0=mid(pts[n-1],pts[0]);x.moveTo(m0[0],m0[1]);for(let i=0;i<n;i++){const p=pts[i],m=mid(p,pts[(i+1)%n]);x.quadraticCurveTo(p[0],p[1],m[0],m[1]);}x.closePath();}
let SPR={};
function spr(key,w,h,f){const k=key+'@'+TSZ;if(SPR[k])return SPR[k];return SPR[k]=mk(w*TSZ,h*TSZ,(x)=>f(x,TSZ));}
function emo(ch,sz=32){const k='e'+ch+sz;if(SPR[k])return SPR[k];return SPR[k]=mk(sz,sz,x=>{x.font=Math.floor(sz*.8)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(ch,sz/2,sz/2+sz*.06);});}

const TILES=[ // base color, deco
 ['#06080b','none'],['#2f4429','grass'],['#213129','moss'],['#47382b','pebble'],['#3b2b1f','furrow'],['#261a12','furrow'],['#1e3d54','water'],['#13293c','water'],['#6a5f47','sand'],
 ['#b3becc','snow'],['#7e9db5','ice'],['#30311f','mud'],['#3e3735','ash'],['#56493a','pebble'],['#50505a','flag'],['#5f432a','plank'],['#2f2a26','cave'],['#1a1612','wall'],['#5f432a','plank'],['#46413c','cobble']];
const SOLIDT=new Set([0,6,7,17]);const WATERT=new Set([6,7]);

const grp=t=>t===5?4:t;
let TS=[],TSM={},tilesFor=0;
function buildTiles(){tilesFor=TSZ;TSM={};const S=TSZ;
 TS=TILES.map((d,id)=>{const arr=[];for(let v=0;v<4;v++){const rr=mulberry(id*100+v+7);arr.push(mk(S,S,(x)=>{const base=d[0];
  x.fillStyle=base;x.fillRect(0,0,S,S);
  if(id===0)return;
  // soft mottling (tileable: wrapped)
  for(let i=0;i<7;i++){const r=S*(.12+rr()*.2),px=rr()*S,py=rr()*S,c=rgba(shade(base,rr()<.5?1.1:.9),.45);for(const ox of [-S,0,S])for(const oy of [-S,0,S])circ(x,px+ox,py+oy,r,c);}
  const dk=d[1];x.lineCap='round';x.lineJoin='round';
  if(dk==='grass'||dk==='moss'){const bl=dk==='grass'?['#45603a','#3a5232','#557245']:['#2e4436','#284034','#3a5444'];for(let i=0;i<4;i++){const gx=S*(.15+rr()*.7),gy=S*(.3+rr()*.6);x.lineWidth=S*.035;for(let b=-1;b<=1;b++){x.strokeStyle=bl[(b+1)%3];x.beginPath();x.moveTo(gx+b*S*.03,gy);x.quadraticCurveTo(gx+b*S*.07,gy-S*.08,gx+b*S*.1,gy-S*.12-rr()*S*.04);x.stroke();}}
   if(dk==='grass'&&rr()<.35){const c=pick(['#c8a8e8','#e8d890','#e89aa8']);circ(x,S*(.2+rr()*.6),S*(.2+rr()*.6),S*.035,c);}
   if(dk==='moss'){for(let i=0;i<2;i++)circ(x,S*(.2+rr()*.6),S*(.2+rr()*.6),S*.06,'#2a4a3c');}}
  else if(dk==='pebble'||dk==='cave'){for(let i=0;i<4;i++){const px=S*(.15+rr()*.7),py=S*(.15+rr()*.7),r=S*(.03+rr()*.035);ell(x,px,py+r*.4,r*1.2,r*.8,rgba(shade(base,.6),.8));ell(x,px,py,r*1.2,r*.8,shade(base,1.25));}}
  else if(dk==='furrow'){for(let r=0;r<3;r++){const y=S*(.12+r*.33);x.fillStyle=shade(base,.72);rrp(x,S*.04,y+S*.06,S*.92,S*.16,S*.08);x.fill();x.fillStyle=shade(base,1.18);rrp(x,S*.04,y,S*.92,S*.12,S*.06);x.fill();}}
  else if(dk==='water'){x.strokeStyle=rgba('#7fb8d8',.18);x.lineWidth=S*.03;for(let i=0;i<2;i++){const wy=S*(.25+rr()*.5),wx=S*(.1+rr()*.5);x.beginPath();x.moveTo(wx,wy);x.quadraticCurveTo(wx+S*.12,wy-S*.06,wx+S*.24,wy);x.stroke();}}
  else if(dk==='sand'){for(let i=0;i<10;i++)circ(x,rr()*S,rr()*S,S*.015,rgba(shade(base,rr()<.5?1.3:.75),.8));}
  else if(dk==='snow'){for(let i=0;i<3;i++)circ(x,S*(.15+rr()*.7),S*(.15+rr()*.7),S*.09,rgba('#dfe7f0',.5));for(let i=0;i<3;i++)circ(x,rr()*S,rr()*S,S*.018,'#ffffffcc');}
  else if(dk==='ice'){x.strokeStyle=rgba('#d8ecff',.35);x.lineWidth=S*.03;x.beginPath();x.moveTo(S*.2,S*.7);x.lineTo(S*.45,S*.45);x.moveTo(S*.55,S*.85);x.lineTo(S*.75,S*.65);x.stroke();}
  else if(dk==='mud'){for(let i=0;i<2;i++)ell(x,S*(.25+rr()*.5),S*(.25+rr()*.5),S*.14,S*.07,rgba('#1c1d12',.7));circ(x,S*(.2+rr()*.6),S*(.2+rr()*.6),S*.03,'#4a4a2a');}
  else if(dk==='ash'){for(let i=0;i<6;i++)circ(x,rr()*S,rr()*S,S*.02,rgba('#6a605a',.8));if(rr()<.35)circ(x,S*(.2+rr()*.6),S*(.2+rr()*.6),S*.022,'#ff6a20');}
  else if(dk==='flag'){for(let i=0;i<2;i++)for(let j=0;j<2;j++){x.fillStyle=shade(base,.8);rrp(x,S*(.04+i*.5),S*(.06+j*.5),S*.44,S*.42,S*.1);x.fill();x.fillStyle=shade(base,1.08+rr()*.08);rrp(x,S*(.04+i*.5),S*(.04+j*.5),S*.44,S*.4,S*.1);x.fill();}}
  else if(dk==='plank'){for(let i=0;i<3;i++){const y=S*(i/3);x.fillStyle=shade(base,.7);rrp(x,S*.02,y+S*.03,S*.96,S*.3,S*.07);x.fill();x.fillStyle=shade(base,1+rr()*.12);rrp(x,S*.02,y+S*.02,S*.96,S*.27,S*.07);x.fill();circ(x,S*(.1+((v+i)%2)*.78),y+S*.15,S*.022,shade(base,.55));}}
  else if(dk==='cobble'){for(let i=0;i<3;i++)for(let j=0;j<3;j++){const px=S*(i/3)+S*.02+(j%2)*S*.08,py=S*(j/3)+S*.02;x.fillStyle=shade(base,.7);rrp(x,px,py+S*.025,S*.29,S*.29,S*.11);x.fill();x.fillStyle=shade(base,1+rr()*.15);rrp(x,px,py,S*.29,S*.28,S*.11);x.fill();}}
  else if(dk==='wall'){for(let i=0;i<5;i++){const px=S*(.1+rr()*.8),py=S*(.1+rr()*.75),r=S*(.12+rr()*.12);ball(x,px,py,r,'#2a2420',1.25);}}
 }));}return arr;});}
function maskedTile(t,v,mask){const k=t*64+v*16+mask;if(TSM[k])return TSM[k];const S=TSZ,r=S*.46;return TSM[k]=mk(S,S,x=>{rrp(x,0,0,S,S,[mask&1?r:0,mask&2?r:0,mask&4?r:0,mask&8?r:0]);x.clip();x.drawImage(TS[t][v],0,0);});}

function canopy(x,pts,cols,rr){// pts: [cx,cy,r]
 for(const [X,Y,r] of pts)circ(x,X,Y+r*.08,r*1.04,cols[0]);
 for(const [X,Y,r] of pts){x.fillStyle=rg(x,X,Y,r,cols[2],cols[1],-.4,-.5);x.beginPath();x.arc(X,Y,r,0,7);x.fill();}
 for(const [X,Y,r] of pts)if(rr()<.8)circ(x,X-r*.3,Y-r*.35,r*.28,rgba(cols[3]||shade(cols[2],1.25),.35));}
function treeSpr(kind,v){return spr('t'+kind+v,1.6,2.4,(x,S)=>{const rr=mulberry(kind.length*31+v*7+1);const ox=.3*S,oy=1.4*S,cx0=ox+.5*S,base=oy+.86*S;x.lineCap='round';

 if(kind==='deadtree'||kind==='charred'){x.strokeStyle=trunk;x.lineWidth=.2*S;x.beginPath();x.moveTo(cx0,base);x.quadraticCurveTo(cx0+.06*S,base-.6*S,cx0-.04*S,base-1.25*S);x.stroke();
  x.lineWidth=.09*S;const br=[[-.4,-.95,-.55,-1.35],[.35,-.7,.55,-1.05],[-.25,-.55,-.45,-.6],[.15,-1.05,.3,-1.5]];for(const [a,b,c,d] of br){x.beginPath();x.moveTo(cx0,base+b*S*.8);x.quadraticCurveTo(cx0+a*S*.6,base+b*S,cx0+c*S,base+d*S);x.stroke();}
  x.lineWidth=.05*S;x.strokeStyle=shade(trunk,1.3);x.beginPath();x.moveTo(cx0-.04*S,base-.1*S);x.quadraticCurveTo(cx0,base-.6*S,cx0-.08*S,base-1.1*S);x.stroke();
  if(kind==='deadtree'){for(let i=0;i<3;i++)ball(x,cx0+(rr()-.5)*.6*S,base-(.4+rr()*.8)*S,.08*S,'#4a5a2a');}
  else{for(let i=0;i<3;i++){const ex=cx0+(rr()-.5)*.2*S,ey=base-(.2+rr()*.9)*S;circ(x,ex,ey,.06*S,'rgba(255,90,20,.35)');circ(x,ex,ey,.025*S,'#ff8a3a');}}return;}
 // trunk
 x.fillStyle=lg(x,base-.7*S,base,shade(trunk,1.25),shade(trunk,.8));rrp(x,cx0-.11*S,base-.75*S,.22*S,.78*S,.1*S);x.fill();ell(x,cx0,base-.02*S,.17*S,.06*S,shade(trunk,.9));
 if(kind==='pine'){const tiers=4;for(let i=0;i<tiers;i++){const w=(.36+i*.13)*S,ty=oy-.95*S+i*.33*S,h=.55*S;const c=['#1b3830','#28503f','#3e6c55'];
   x.fillStyle=lg(x,ty-h*.2,ty+h*.6,c[2],c[0]);x.beginPath();x.moveTo(cx0-w,ty+h*.55);x.quadraticCurveTo(cx0-w*.3,ty+h*.1,cx0,ty-h*.45);x.quadraticCurveTo(cx0+w*.3,ty+h*.1,cx0+w,ty+h*.55);x.quadraticCurveTo(cx0,ty+h*.78,cx0-w,ty+h*.55);x.fill();
   x.fillStyle='rgba(226,236,246,.9)';x.beginPath();x.moveTo(cx0-w*.55,ty+h*.1);x.quadraticCurveTo(cx0-w*.2,ty-h*.25,cx0,ty-h*.42);x.quadraticCurveTo(cx0+w*.2,ty-h*.25,cx0+w*.55,ty+h*.1);x.quadraticCurveTo(cx0,ty-h*.02,cx0-w*.55,ty+h*.1);x.fill();}return;}
 const dark=kind==='darktree';const cols=dark?['#0f1c20','#1c3236','#2f5254','#4a7a76']:['#172a1b','#284a2c','#467640','#6a9a56'];const cy=oy-.3*S+(v%2)*.05*S,k=dark?1.12:1;
 const pts=[[cx0,cy,.5*S*k],[cx0-.33*S*k,cy+.16*S,.36*S*k],[cx0+.34*S*k,cy+.14*S,.37*S*k],[cx0+(v%3-1)*.06*S,cy-.36*S*k,.34*S*k]];canopy(x,pts,cols,rr);
 if(dark){for(let i=0;i<5;i++){const fx=cx0+(rr()-.5)*.8*S,fy=cy+(rr()-.5)*.7*S;circ(x,fx,fy,.05*S,'rgba(120,255,230,.18)');circ(x,fx,fy,.018*S,'#9effe6');}}

function rockSpr(kind,v,oc){return spr('r'+kind+v+(oc||''),1,1,(x,S)=>{const rr=mulberry(kind.length*13+v*5+3);
 const pal={rock:'#5a5a62',frost_rock:'#7d98b2',ash_rock:'#3a2f2c',clay_pile:'#7a5233',sand_pile:'#8a7b58',stump:'#5a3c26'}[kind]||'#3c3631';

 blobPath(x,S*.5,S*.56,S*.4,S*.32,rr,9);x.fillStyle=rg(x,S*.5,S*.56,S*.42,shade(pal,1.45),shade(pal,.7),-.35,-.55);x.fill();x.strokeStyle=rgba(shade(pal,.45),.7);x.lineWidth=S*.03;x.stroke();

   if(i%2===0){x.fillStyle='#6a4524';rrp(x,bx+lean-S*.04,S*.88-h-S*.04,S*.08,S*.2,S*.04);x.fill();}}return;}
 shadowE(x,S*.5,S*.82,S*.4,S*.12);const snow=kind==='snowbush';const cols=snow?['#1a3030','#2b4a44','#4a6e62']:['#152816','#24422a','#3f6a3e'];

function cropSpr(c,stage){return spr('c'+c+stage,1,1,(x,S)=>{const cd=CROPS[c];const rr=mulberry(c.length*17+stage);x.lineCap='round';const gy=S*.86;

 const got=n-left;if(got>0){if(!G.seen[id]){G.seen[id]=1;}stat('got:'+id,got);if(id==='old_page'&&!silent&&!noLore)readPage(got);if(!silent)pickupToast(id,got);}

 q.req.forEach(r=>{if(r.t==='stat')base[r.s]=gs(r.s);});G.quests[id]={base,seen:0};
 if(q.give)q.give.forEach(([i,n])=>giveSpecial(i,n));if(q.unlock)q.unlock.forEach(r=>learn(r,true));
 if(!silent)toast(t('questNew',L(q.n)),'📜');sfx('quest');updTrack();}
function giveSpecial(i,n){if(i==='@seasonseed'){const ss=Object.keys(CROPS).filter(c=>CROPS[c].seasons.includes(seasonOf(G.day))&&c!=='glowshroom');const a=pick(ss),b=pick(ss);giveOrDrop(a+'_seed',Math.ceil(n/2));giveOrDrop(b+'_seed',Math.floor(n/2));}else giveOrDrop(i,n);}

 const b=st&&!r.s.startsWith('place:')?(st.base[r.s]||0):0;return[Math.min(gs(r.s)-b,r.n),r.n];}
function reqLabel(r){const [c,n]=reqProg(curQ,r);let s='';const nm=(k)=>k.includes(':')?k.split(':')[1]:null;
 if(r.t==='talk')s=L(['Talk to ','Prata med '])+L(NPC[curQ.g].n);

 else if(r.t==='max')s=t('depth',r.n);
 else{const k=r.s.split(':')[0],x=nm(r.s);const xn=x?(IT[x]?itemName(x):MOB[x]?L(MOB[x].n):x):'';
  s={kill:L(['Defeat ','Besegra ']),craft:L(['Craft ','Tillverka ']),place:L(['Place ','Placera ']),harvest:L(['Harvest ','Skörda ']),catch:L(['Catch ','Fånga ']),study:L(['Study items','Studera föremål']),sold:L(['Coins earned from sales','Mynt från försäljning']),lantern:L(['Light the Great Lantern','Tänd Stora Lyktan']),cat:L(['Feed the cat','Mata katten']),chats:L(['Chat with villagers','Prata med bybor'])}[k]||k;

 h+=`<div class="info">`;if(UI.sel!=null&&G.inv[UI.sel]){const s=G.inv[UI.sel],it=IT[s.id];h+=`<div class="nm" style="font-size:15px">${it.ic} ${L(it.n)} ${s.n>1?'×'+s.n:''}</div><div class="ds" style="margin:4px 0">${itemDesc(s.id)}</div><div style="display:flex;gap:6px;flex-wrap:wrap">`;

  if(it.cat!=='key')h+=btn('drop',UI.sel,t('drop'))+btn('trash',UI.sel,'🗑️ '+t('trash'));h+='</div>';}else h+=`<span class="ds">${t('selectHint')}</span>`;return h+'</div>';}
function invAct(a,v){const i=+v;const s=G.inv[i];
 if(a==='slot'){if(UI.sel===null){if(s)UI.sel=i;}else if(UI.sel===i)UI.sel=null;else{const A=G.inv[UI.sel];if(s&&A&&s.id===A.id&&IT[s.id].st>1){const mv=Math.min(IT[s.id].st-s.n,A.n);s.n+=mv;A.n-=mv;if(A.n<=0)G.inv[UI.sel]=null;}else{G.inv[i]=A;G.inv[UI.sel]=s;}UI.sel=null;}renderMenu();return;}

 let list=RC.filter(r=>knows(r)&&(UI.craftSt==='all'||r.st===UI.craftSt));

function doCraft(id,mult){const r=RCI[id];if(!nearStation(r.st)){toast(t('nearStation',L(STN[r.st])),'⚠️');return;}let made=0;

/* ===================== SAVE ===================== */
const SKEY='emberhollow_save_v1';
function rle(a){const out=[];let p=a[0],c=1;for(let i=1;i<=a.length;i++){if(i<a.length&&a[i]===p)c++;else{out.push(p.toString(36)+(c>1?'*'+c.toString(36):''));p=a[i];c=1;}}return out.join(',');}
function unrle(s,n){const a=new Uint8Array(n);let i=0;for(const part of s.split(',')){const [v,c]=part.split('*');const cnt=c?parseInt(c,36):1;a.fill(parseInt(v,36),i,i+cnt);i+=cnt;}return a;}
function hasSave(){try{return!!localStorage.getItem(SKEY);}catch(e){return false;}}
function saveGame(){if(!G||!OVER||!playing)return;try{G.x=P.x;G.y=P.y;G.dir=P.dir;const objs=[];OVER.o.forEach((o,k)=>objs.push([k,o]));
 const g=Object.assign({},G,{bossActive:null,dead:0});if(Z!==OVER){g.zone='over';g.x=G.surfX||79.5;g.y=G.surfY||80.5;g.depth=0;g.x=79.5;g.y=80.5;}
 const data={G:g,t:rle(OVER.t),o:objs,e:rle(EXP),dr:OVER.drops.filter(d=>d.id!=='$').slice(0,150).map(d=>({id:d.id,n:d.n,x:d.x,y:d.y,t:0,vz:0,z:0}))};
 localStorage.setItem(SKEY,JSON.stringify(data));flashSaved();}catch(e){console.warn('save failed',e);}}
function loadGame(){let d;try{d=JSON.parse(localStorage.getItem(SKEY));}catch(e){return false;}if(!d)return false;
 G=Object.assign(newState(d.G.seed),d.G);G.opts=Object.assign({sound:1,touch:-1},d.G.opts||{});OVER=genWorld(G.seed);R=Math.random;OVER.t=unrle(d.t,W*H);OVER.o=new Map(d.o);EXP=unrle(d.e,W*H);OVER.drops=d.dr||[];
 while(G.inv.length<G.invSize)G.inv.push(null);Z=OVER;G.zone='over';G.depth=0;P.x=G.x;P.y=G.y;P.dir=G.dir||0;G.bossActive=null;G.dead=0;initNPCs();
 if(!G.board)genBoard();return true;}
setInterval(()=>{if(playing&&G&&!G.dead)saveGame();},30000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame();});addEventListener('pagehide',()=>saveGame());

 pine(cx-44,cy+14,30,'#5a9c6a');pine(cx+48,cy+12,34,'#4e9262');tree(cx+22,cy+16,11,'#8fd06a',0.8);
 hill(cy+24,5,2.6,'#8fd070','#69b356');
 tree(cx-20,cy+30,13,'#74c05c',1.2);pine(cx+6,cy+30,36,'#3f8455');tree(cx+36,cy+34,9,'#a2da7c',0.7);pine(cx-48,cy+36,24,'#4a8c5c');
 g.fillStyle=VG(cy+30,cy+R,'#7cc463','#5aa64e');g.beginPath();g.moveTo(cx-R,cy+R);g.lineTo(cx-R,cy+44);g.quadraticCurveTo(cx,cy+34,cx+R,cy+44);g.lineTo(cx+R,cy+R);g.fill();
 const mx=cx-6,my=cy+50;g.fillStyle='#fbf3e4';g.beginPath();g.roundRect(mx-3,my-7,6,8,2.5);g.fill();g.fillStyle='#ee5a50';g.beginPath();g.arc(mx,my-6,8,Math.PI,T2);g.quadraticCurveTo(mx,my-4,mx-8,my-6);g.fill();C(mx-3,my-10,1.4,'#fff');C(mx+3,my-9,1.1,'#fff');C(mx+0.5,my-12.5,1,'#fff');
 C(mx+13,my-1,2.2,'#ffd84a');C(mx+13,my-1,0.9,'#f08a3a');C(mx-16,my,2,'#ff8fb2');C(mx-16,my,0.8,'#ffe08a');
 for(let i=0;i<7;i++){const fx=cx-50+((i*37+t*6)%100),fy=cy-6+Math.sin(t*1.3+i*2)*12+i*3;const a=0.4+0.6*Math.max(0,Math.sin(t*2.4+i*1.7));const fg=g.createRadialGradient(fx,fy,0,fx,fy,4);fg.addColorStop(0,`rgba(255,250,200,${a})`);fg.addColorStop(1,'rgba(255,250,200,0)');g.fillStyle=fg;g.fillRect(fx-4,fy-4,8,8);}

function showSplash(done){const el=$('splash'),cv2=$('splashCv');const g2=cv2.getContext('2d');splashing=true;const t0=performance.now();
 const loop=(now)=>{if(!splashing)return;drawSplashLogo(g2,(now-t0)/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);
 requestAnimationFrame(()=>el.classList.add('on'));
 setTimeout(()=>el.classList.add('out'),9400);
 setTimeout(()=>{splashing=false;el.remove();done&&done();},10000);}
let playing=false,last=0,hudT=0,featT=0;
function newGame(){const seed=(Math.random()*1e9)|0;G=newState(seed);OVER=genWorld(seed);R=Math.random;Z=OVER;EXP=new Uint8Array(W*H);
 [['axe_wood',1],['pick_wood',1],['hoe_wood',1],['can_basic',1],['club',1],['berries',6],['salve',2]].forEach(([i,n])=>addItem(i,n,true));
 G.x=OVER.spawn[0];G.y=OVER.spawn[1];P.x=G.x;P.y=G.y;P.dir=3;initNPCs();genBoard();startQuest('m_welcome',true);
 playStory(INTRO,()=>{startPlaying();toast(t('tutorialMove'),'🏮');});}
function startPlaying(){$('title').classList.add('hidden');$('hud').classList.remove('hidden');playing=true;applyTouch();updHotbar();updTrack();updHud();setFocus(null);}
function showTitle(){$('title').classList.remove('hidden');$('hud').classList.add('hidden');$('touch').classList.add('hidden');buildTitle();}
function buildTitle(){$('tSub').textContent=t('subtitle');$('tHint').textContent=t('titleHint');const hs=hasSave();
 $('tBtns').innerHTML=(hs?`<button class="btn pri f" id="bCont">▶ ${t('cont')}</button>`:'')+`<button class="btn ${hs?'':'pri'} f" id="bNew">✦ ${t('newGame')}</button><button class="btn f" id="bLang">🌐 ${t('language')}</button><button class="btn f" id="bFs">⛶ ${t('fullscreen')}</button>`;
 if(hs)$('bCont').onclick=()=>{requestFS();unlockAudio();if(loadGame())startPlaying();};
 $('bNew').onclick=()=>{requestFS();unlockAudio();if(hs)confirmBox(t('newConfirm'),()=>{$('title').classList.add('hidden');newGame();});else{$('title').classList.add('hidden');newGame();}};
 $('bLang').onclick=()=>{lang=lang==='en'?'sv':'en';try{localStorage.setItem('eh_lang',lang);}catch(e){}document.documentElement.lang=lang;buildTitle();};
 $('bFs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else requestFS();};
 setFocus($('tBtns').querySelector('.f'));}
function update(dt){G.time+=dt*MIN_PER_SEC;if(G.time>=1440){G.time-=1440;newDay();}updPlayer(dt);updNPCs(dt);updPet(dt);updMobs(dt);updProj(dt);updDrops(dt);updFx(dt);updSurvival(dt);G.hp=Math.min(G.hp,maxHp());}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;gtime+=dt;try{pollPad(dt);
 if(playing&&G){holdUse=kHold||tHold||mHold||pHold;const paused=menuOpen()||dlgOpen()||modalOpen()||storyOpen()||G.dead;
  if(FISH)updFish(dt);else if(!paused)update(dt);render();hudT-=dt;if(hudT<=0){hudT=.15;updHud();}featT-=dt;if(featT<=0){featT=3;checkFeats();updTrack();}}music();}catch(e){console.error(e);}
 requestAnimationFrame(loop);}
(function boot(){try{const l=localStorage.getItem('eh_lang');if(l)lang=l;else if((navigator.language||'').startsWith('sv'))lang='sv';}catch(e){}document.documentElement.lang=lang;
 resize();buildTiles();const emb=$('emb');for(let i=0;i<40;i++){const s=document.createElement('div');s.className='spark';s.style.left=Math.random()*100+'%';s.style.bottom=-Math.random()*20+'%';s.style.animationDuration=rnd(6,14)+'s';s.style.animationDelay=-rnd(0,14)+'s';emb.appendChild(s);}
 showTitle();requestAnimationFrame(loop);showSplash(()=>{setFocus(focusEl);});})();
