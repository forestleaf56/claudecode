<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#3d6a86" />
<meta name="description" content="Plunder Seas — a one-thumb pirate naval combat roguelite. Sail, fight, loot, upgrade." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Plunder Seas</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #3d6a86;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: none;
  }
  #game {
    display: block; width: 100vw; height: 100vh;
    touch-action: none;
  }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: #22323e; color: #f5ecd6;
    align-items: center; justify-content: center; text-align: center;
    font-size: 18px; padding: 24px;
  }
  /* Encourage portrait but never block landscape */
  #noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #f5ecd6; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <noscript><div id="noscript">This game needs JavaScript enabled.</div></noscript>
  <script type="module" src="src/main.js"></script>
  <script>
    // Register service worker for offline / installable PWA (only over http(s)).
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
