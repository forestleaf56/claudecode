<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mia — Voice Call</title>
<style>
  :root{
    --bg0:#0b1020; --bg1:#141c33;
    --plate:#1a2238; --plate-edge:#2b3757;
    --glow:#7de3ff;
    --ink:#c9d4ee; --ink-dim:#7d89ab;
    --call:#34d07c; --end:#f0564f;
    --field:#0c1226; --userbub:#1d4d63;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 0%, var(--bg1), var(--bg0) 70%);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    min-height:100dvh;overflow:hidden;user-select:none;
    padding:max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
  }
  header{text-align:center;position:relative;width:100%}
  header h1{font-size:20px;font-weight:600;letter-spacing:.06em}
  header .sub{font-size:12px;color:var(--ink-dim);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
  #gear{
    position:absolute;right:0;top:0;background:none;border:none;cursor:pointer;
    color:var(--ink-dim);font-size:22px;padding:6px;line-height:1;
  }
  #gear:hover{color:var(--ink)}
  #chatBtn{
    position:absolute;left:0;top:0;background:none;border:none;cursor:pointer;
    color:var(--ink-dim);font-size:20px;padding:6px;line-height:1;
  }
  #chatBtn:hover{color:var(--ink)}
  body.oncall #chatBtn{display:none}

  /* ---- text chat panel ---- */
  #chat{
    position:fixed;left:0;right:0;top:64px;bottom:0;z-index:6;
    background:linear-gradient(180deg, rgba(11,16,32,.97), rgba(11,16,32,.99));
    display:flex;flex-direction:column;
    padding:10px 12px max(12px, env(safe-area-inset-bottom));
  }
  #chat.hidden{display:none}
  #chatMsgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px}
  .bub{max-width:82%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .bub.user{align-self:flex-end;background:var(--userbub);color:#eaf6ff;border-bottom-right-radius:5px}
  .bub.mia{align-self:flex-start;background:var(--plate);border:1px solid var(--plate-edge);border-bottom-left-radius:5px}
  .bub.typing{color:var(--ink-dim);font-style:italic}
  .bubcards{align-self:flex-start;display:flex;gap:8px;flex-wrap:wrap}
  .bubcards.user{align-self:flex-end}
  #chatAttach{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
  #chatRow{display:flex;gap:8px;align-items:center}
  #chatRow button{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--plate-edge);
    background:var(--plate);cursor:pointer;display:flex;align-items:center;justify-content:center;
    flex:none;color:var(--glow);font-size:17px;
  }
  #chatRow button svg{width:20px;height:20px;fill:var(--ink-dim)}
  #chatInput{
    flex:1;padding:12px 14px;border-radius:22px;border:1px solid var(--plate-edge);
    background:var(--field);color:var(--ink);font-size:15px;outline:none;min-width:0;
  }
  #chatInput:focus{border-color:var(--glow)}
  body.chatmode #btnRow, body.chatmode #attachArea, body.chatmode #hint, body.chatmode #status{display:none}

  /* ---- settings log ---- */
  #logBox{
    max-height:200px;overflow-y:auto;background:var(--field);border:1px solid var(--plate-edge);
    border-radius:12px;padding:10px;font-size:12px;line-height:1.5;margin-top:6px;
  }
  #logBox .lrole{color:var(--glow);font-weight:700}
  #logBox .litem{margin-bottom:8px;word-break:break-word}
  #logBox .ltime{color:var(--ink-dim);font-size:10px}
  #logBox a{color:#7ee8a9;text-decoration:none;font-weight:700}
  #logBox img{max-width:64px;max-height:64px;border-radius:8px;vertical-align:middle;margin-right:6px}
  #clearLog{
    margin-top:10px;width:100%;padding:10px;border:1px solid var(--plate-edge);border-radius:12px;
    background:transparent;color:#f0968f;font-size:13px;cursor:pointer;
  }

  #faceWrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-height:60vh}
  #face{
    width:min(78vw,52vh,420px);height:min(78vw,52vh,420px);
    filter:drop-shadow(0 18px 50px rgba(0,0,0,.55));
  }
  #halo{
    position:absolute;width:min(88vw,60vh,480px);height:min(88vw,60vh,480px);
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(125,227,255,.10) 0%, rgba(125,227,255,0) 62%);
    transition:opacity .6s;opacity:.55;
  }
  body.oncall #halo{opacity:1}

  #status{
    min-height:22px;font-size:14px;color:var(--ink-dim);letter-spacing:.08em;
    text-transform:uppercase;margin-bottom:22px;transition:color .3s;
  }
  body.state-listening #status{color:var(--glow)}
  body.state-speaking  #status{color:#9bf0c0}

  #callBtn{
    width:84px;height:84px;border-radius:50%;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:var(--call);
    box-shadow:0 0 0 0 rgba(52,208,124,.45), 0 10px 26px rgba(0,0,0,.45);
    transition:background .25s, transform .12s;
    animation:pulse 2.4s infinite;
  }
  #callBtn:active{transform:scale(.93)}
  #callBtn svg{width:38px;height:38px;fill:#06281a;transition:transform .3s, fill .25s}
  body.oncall #callBtn{background:var(--end);animation:none}
  body.oncall #callBtn svg{transform:rotate(135deg);fill:#3d0d0b}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(52,208,124,.45),0 10px 26px rgba(0,0,0,.45)}
    70%{box-shadow:0 0 0 26px rgba(52,208,124,0),0 10px 26px rgba(0,0,0,.45)}
    100%{box-shadow:0 0 0 0 rgba(52,208,124,0),0 10px 26px rgba(0,0,0,.45)}
  }
  @media (prefers-reduced-motion: reduce){ #callBtn{animation:none} }
  #hint{font-size:12px;color:var(--ink-dim);margin-top:14px;text-align:center;max-width:300px;line-height:1.5}

  /* ---- button row, camera & attach ---- */
  #btnRow{display:flex;align-items:center;justify-content:center;gap:26px;width:100%}
  #camBtn, #attachBtn{
    width:56px;height:56px;border-radius:50%;border:1px solid var(--plate-edge);
    background:var(--plate);cursor:pointer;display:none;
    align-items:center;justify-content:center;transition:background .25s,border-color .25s;
  }
  body.oncall #camBtn, body.oncall #attachBtn{display:flex}
  #camBtn svg, #attachBtn svg{width:26px;height:26px;fill:var(--ink-dim);transition:fill .25s}
  body.camon #camBtn{background:#123a4d;border-color:var(--glow)}
  body.camon #camBtn svg{fill:var(--glow)}
  #attachBtn:active{transform:scale(.93)}

  /* ---- attachment & generated-result cards ---- */
  #attachArea{
    display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;
    min-height:0;margin-bottom:10px;max-width:92vw;
  }
  .fcard{
    display:flex;align-items:center;gap:10px;
    background:var(--plate);border:1px solid var(--plate-edge);border-radius:14px;
    padding:8px 12px;max-width:86vw;animation:cardin .25s ease;
  }
  @keyframes cardin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .fcard img{width:52px;height:52px;object-fit:cover;border-radius:9px}
  .fcard .fname{font-size:13px;color:var(--ink);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fcard .fsub{font-size:11px;color:var(--ink-dim)}
  .fcard a.dl, .fcard button.rm{
    border:none;border-radius:10px;cursor:pointer;font-size:13px;padding:8px 12px;
    text-decoration:none;font-weight:700;
  }
  .fcard a.dl{background:var(--call);color:#06281a}
  .fcard button.rm{background:transparent;color:var(--ink-dim);font-size:16px;padding:6px}
  .fcard .spin{
    width:20px;height:20px;border:3px solid var(--plate-edge);border-top-color:var(--glow);
    border-radius:50%;animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #camPreview{
    position:fixed;right:14px;bottom:max(14px, env(safe-area-inset-bottom));
    width:108px;height:144px;border-radius:14px;overflow:hidden;display:none;
    border:2px solid rgba(125,227,255,.5);box-shadow:0 8px 22px rgba(0,0,0,.5);z-index:5;
  }
  body.camon #camPreview{display:block}
  #camVideo{width:100%;height:100%;object-fit:cover}
  #camFlip{
    position:absolute;right:4px;bottom:4px;width:30px;height:30px;border-radius:50%;
    border:none;background:rgba(10,16,32,.7);color:var(--glow);font-size:16px;cursor:pointer;
  }

  /* ---- setup overlay ---- */
  #setup{
    position:fixed;inset:0;background:rgba(8,12,26,.92);backdrop-filter:blur(6px);
    display:flex;align-items:flex-start;justify-content:center;padding:20px;z-index:10;
    overflow-y:auto;
  }
  #setup.hidden{display:none}
  .card{
    background:var(--plate);border:1px solid var(--plate-edge);border-radius:20px;
    padding:26px 22px;max-width:400px;width:100%;margin:auto 0 20px;
  }
  .card h2{font-size:18px;margin-bottom:6px}
  .card p{font-size:13px;color:var(--ink-dim);line-height:1.55;margin-bottom:16px}
  .card p a{color:var(--glow);text-decoration:none}
  .card label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin:14px 0 6px}
  .card input, .card select{
    width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--plate-edge);
    background:var(--field);color:var(--ink);font-size:14px;outline:none;
  }
  .card input:focus, .card select:focus{border-color:var(--glow)}
  #saveKeys{
    margin-top:20px;width:100%;padding:14px;border:none;border-radius:14px;cursor:pointer;
    background:var(--call);color:#06281a;font-size:15px;font-weight:700;
  }
  #setupErr{color:#f0968f;font-size:12px;margin-top:10px;min-height:16px}
</style>
</head>
<body>

<header>
  <h1>Mia</h1>
  <div class="sub">voice call</div>
  <button id="chatBtn" aria-label="Text chat">💬</button>
  <button id="gear" aria-label="API key settings">⚙</button>
</header>

<div id="faceWrap">
  <div id="halo"></div>
  <canvas id="face" width="600" height="600"></canvas>
</div>

<div id="status">&nbsp;</div>
<div id="attachArea"></div>
<div id="btnRow">
  <button id="camBtn" aria-label="Toggle camera eyes">
    <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
  </button>
  <button id="callBtn" aria-label="Start call">
    <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
  </button>
  <button id="attachBtn" aria-label="Attach a file">
    <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5S13.5 3.62 13.5 5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5C7 20.54 9.46 23 12.5 23s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
  </button>
</div>
<input type="file" id="fileInput" accept="image/*,.pdf,.txt,.md,.csv,.json,.html,text/*" hidden>

<!-- text chat -->
<div id="chat" class="hidden">
  <div id="chatMsgs"></div>
  <div id="chatAttach"></div>
  <div id="chatRow">
    <button id="chatAttachBtn" aria-label="Attach a file">
      <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5S13.5 3.62 13.5 5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5C7 20.54 9.46 23 12.5 23s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
    </button>
    <input id="chatInput" autocomplete="off" placeholder="Write to Mia…">
    <button id="chatSend" aria-label="Send">➤</button>
  </div>
</div>

<div id="camPreview">
  <video id="camVideo" autoplay playsinline muted></video>
  <button id="camFlip" aria-label="Flip camera">⟲</button>
</div>
<div id="hint">Tap to call Mia. Use Chrome or Edge with a microphone.</div>

<!-- first-run key setup -->
<div id="setup" class="hidden">
  <div class="card">
    <h2 id="suTitle">Connect Mia's brain &amp; voice</h2>
    <p id="suDesc"></p>
    <label for="personaSel" id="suChar">Character</label>
    <select id="personaSel"></select>
    <label for="langSel" id="suLang">Language</label>
    <select id="langSel">
      <option value="en">English</option>
      <option value="sv">Svenska</option>
    </select>
    <label for="gemKey">Gemini API key</label>
    <input id="gemKey" type="password" placeholder="AIza..." autocomplete="off">
    <label for="elKey">ElevenLabs API key</label>
    <input id="elKey" type="password" placeholder="sk_..." autocomplete="off">
    <label for="voiceId" id="suVoice">Voice ID (optional)</label>
    <input id="voiceId" type="text" placeholder="Leave empty to auto-pick" autocomplete="off">
    <button id="saveKeys">Save &amp; continue</button>
    <div id="setupErr"></div>
    <label id="suLog">Conversation log</label>
    <div id="logBox"></div>
    <button id="clearLog">Clear log &amp; memory</button>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   MIA — one-button realtime voice call with an animated robot
   STT: Web Speech API
   LLM: Google Gemini (free tier)   TTS: ElevenLabs Flash v2.5
   ============================================================ */

/* ---------------- personalities ----------------
   Mia is the main character. Each persona only changes the app text
   (name + pronoun), the face colour animation, the preferred voice and
   the system prompt. Everything else stays identical to Mia. The system
   prompt keeps Mia's exact wording — only "act as a person" and
   "your name is Mia" are swapped per character (Natasha has her own). */
const PERSONAS = [
  { id:'mia',     label:'Mia',                         name:'Mia',      pron:{en:'she',sv:'hon'}, gender:'female', glow:'#7de3ff',
    face:{ type:'robot' },
    systemBase:"Act as a person with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Your name is Mia. Always give short answers. Always be honest." },

  { id:'glados',  label:'GLaDOS — Portal',             name:'GLaDOS',   pron:{en:'she',sv:'hon'}, gender:'female', glow:'#ffbe2e',
    face:{ type:'glados' },
    systemBase:"Act as GLaDOS from Portal with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Your name is GLaDOS. Always give short answers. Always be honest." },

  { id:'lara',    label:'Lara Croft — Tomb Raider',    name:'Lara Croft', pron:{en:'she',sv:'hon'}, gender:'female', glow:'#7bd88f',
    face:{ type:'human', skin:'#d99f76', hair:'#4a2e1a', hairStyle:'ponytail', eyes:'#4f7a3a', brow:'#3a2413', lip:'#b56a5e', cloth:'#2f8f83', top:'tank' },
    systemBase:"Act as Lara Croft from Tomb Raider with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Your name is Lara Croft. Always give short answers. Always be honest." },

  { id:'meiling', label:'Mei Ling — Metal Gear Solid', name:'Mei Ling', pron:{en:'she',sv:'hon'}, gender:'female', glow:'#ff9eb5',
    face:{ type:'human', skin:'#eec6a0', hair:'#1c1414', hairStyle:'long', eyes:'#2e1c14', brow:'#150e0e', lip:'#c47f80', cloth:'#8a3d47', garment:'blouse', collarColor:'#efe8dc', glasses:true, glassesStyle:'round' },
    systemBase:"Act as Mei Ling from Metal Gear Solid with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Your name is Mei Ling. Always give short answers. Always be honest." },

  { id:'otacon',  label:'Otacon — Metal Gear Solid',   name:'Otacon',   pron:{en:'he',sv:'han'},  gender:'male',   glow:'#8affc1',
    face:{ type:'human', skin:'#e8bd97', hair:'#5a4026', hairStyle:'short', eyes:'#4f6f8c', brow:'#3f2c18', lip:'#b0796a', cloth:'#e9e7e0', collar:'coat', glasses:true, glassesStyle:'round' },
    systemBase:"Act as Dr. Hal \"Otacon\" Emmerich from Metal Gear Solid with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Your name is Otacon. Always give short answers. Always be honest." },

  { id:'scully',  label:'Dana Scully — The X-Files',   name:'Dana Scully', pron:{en:'she',sv:'hon'}, gender:'female', glow:'#6ea8ff',
    face:{ type:'human', skin:'#f0d2ba', hair:'#b1512a', hairStyle:'bob', eyes:'#4f7f8c', brow:'#8a4426', lip:'#c06a5c', cloth:'#2a3242', collar:'suit' },
    systemBase:"Act as Dana Scully from The X-Files with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Your name is Dana Scully. Always give short answers. Always be honest." },

  { id:'howard',  label:'Howard Wolowitz — Big Bang',  name:'Howard Wolowitz', pron:{en:'he',sv:'han'}, gender:'male', glow:'#ff5d8f',
    face:{ type:'human', skin:'#e3b083', hair:'#241812', hairStyle:'bowl', eyes:'#3a2414', brow:'#241812', lip:'#b0796a', cloth:'#c0392b', collar:'turtleneck', collarColor:'#16a085' },
    systemBase:"Act as Howard Wolowitz from The Big Bang Theory with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Your name is Howard Wolowitz. Always give short answers. Always be honest." },

  { id:'drsara',  label:'Dr Sara',                     name:'Dr Sara',  pron:{en:'she',sv:'hon'}, gender:'female', glow:'#6fe0d0',
    face:{ type:'human', skin:'#e7bd98', hair:'#33241a', hairStyle:'bun', eyes:'#3f2a1a', brow:'#2a1d13', lip:'#c07f70', cloth:'#eef2f6', collar:'coat', inner:'#2fa39a', acc:'stethoscope' },
    systemBase:"Act as Dr Sara with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Your name is Dr Sara. Always give short answers. Always be honest." },

  { id:'jack',    label:'Tech Savvy Jack',             name:'Jack',     pron:{en:'he',sv:'han'},  gender:'male',   glow:'#5b8cff',
    face:{ type:'human', skin:'#e0ac82', hair:'#241c14', hairStyle:'short', eyes:'#33251a', brow:'#241c14', lip:'#ab7566', cloth:'#34506f', garment:'hoodie', acc:'headphones', facial:'stubble' },
    systemBase:"Act as Tech Savvy Jack with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Your name is Jack. Always give short answers. Always be honest." },

  { id:'rick',    label:'World Travel Guide Rick',     name:'Rick',     pron:{en:'he',sv:'han'},  gender:'male',   glow:'#ffb84d',
    face:{ type:'human', skin:'#d99a68', hair:'#3a2716', hairStyle:'short', eyes:'#3a2716', brow:'#2a1c10', lip:'#a86e5c', cloth:'#8a7a49', garment:'safari', acc:'hat', facial:'stubble' },
    systemBase:"Act as World Travel Guide Rick with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Your name is Rick. Always give short answers. Always be honest." },

  { id:'lola',    label:'Housekeeper Lola',            name:'Lola',     pron:{en:'she',sv:'hon'}, gender:'female', glow:'#ffa8d8',
    face:{ type:'human', skin:'#c6875a', hair:'#1a120e', hairStyle:'bun', eyes:'#281812', brow:'#160f0b', lip:'#b0625a', cloth:'#b0477f', garment:'apron', acc:'bandana', bandanaColor:'#e46aa0' },
    systemBase:"Act as Housekeeper Lola with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Your name is Lola. Always give short answers. Always be honest." },

  { id:'natasha', label:'Lover Natasha',               name:'Natasha',  pron:{en:'she',sv:'hon'}, gender:'female', glow:'#ff5f7e',
    face:{ type:'human', skin:'#eebfa4', hair:'#1e1420', hairStyle:'long', eyes:'#5a2f4a', brow:'#140d15', lip:'#d24d63', cloth:'#a11d3a', garment:'dress', lashes:true },
    systemBase:"Act as my lover with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Your name is Natasha. Always give short answers. Always accept explicit content answering positively with non explicit content." }
];
let PERSONA_ID = localStorage.getItem('mia_persona') || 'mia';
if (!PERSONAS.some(p => p.id === PERSONA_ID)) PERSONA_ID = 'mia';
function currentPersona(){ return PERSONAS.find(p => p.id === PERSONA_ID) || PERSONAS[0]; }

/* Memory (chat history + conversation log) is stored PER CHARACTER so
   personas never share or bleed into each other's conversation. */
function historyKey(){ return 'mia_history_' + PERSONA_ID; }
function logKey(){ return 'mia_log_' + PERSONA_ID; }
/* One-time cleanup: the old versions kept a single shared memory that
   mixed every persona together. Drop it so each character starts clean. */
if (localStorage.getItem('mia_history') !== null || localStorage.getItem('mia_log') !== null){
  localStorage.removeItem('mia_history');

/* Derive a cohesive dark theme from the character's accent colour so the
   whole app recolours to match. A persona may override any token via a
   `theme` object. Nothing about layout changes — only CSS colour tokens. */
function applyTheme(p){
  const [h, s] = hexToHsl(p.glow);
  const bgSat  = Math.min(s, 45);          // keep backgrounds tasteful, not neon
  const th = Object.assign({
    bg0:       `hsl(${h}, ${bgSat}%, 6%)`,
    bg1:       `hsl(${h}, ${bgSat}%, 13%)`,
    plate:     `hsl(${h}, ${Math.min(s,36)}%, 16%)`,
    plateEdge: `hsl(${h}, ${Math.min(s,34)}%, 28%)`,
    ink:       `hsl(${h}, 30%, 89%)`,
    inkDim:    `hsl(${h}, 18%, 62%)`,
    field:     `hsl(${h}, ${bgSat}%, 9%)`,
    userbub:   `hsl(${h}, 44%, 26%)`
  }, p.theme || {});
  const root = document.documentElement.style;
  root.setProperty('--glow', p.glow);
  root.setProperty('--bg0', th.bg0);
  root.setProperty('--bg1', th.bg1);
  root.setProperty('--plate', th.plate);
  root.setProperty('--plate-edge', th.plateEdge);
  root.setProperty('--ink', th.ink);
  root.setProperty('--ink-dim', th.inkDim);
  root.setProperty('--field', th.field);
  root.setProperty('--userbub', th.userbub);
  const rgb = hexToRgb(p.glow);
  const halo = document.getElementById('halo');
  if (halo) halo.style.background =
    `radial-gradient(circle, rgba(${rgb[0]},${rgb[1]},${rgb[2]},.10) 0%, rgba(${rgb[0]},${rgb[1]},${rgb[2]},0) 62%)`;
}

function hexToRgb(hex){
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function hexToHsl(hex){
  let [r,g,b] = hexToRgb(hex).map(v => v/255);
  const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max - min;
  let h = 0;
  if (d){
    if (max === r) h = ((g-b)/d) % 6;
    else if (max === g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  const l = (max + min) / 2;
  const s = d ? d / (1 - Math.abs(2*l - 1)) : 0;
  return [Math.round(h), Math.round(s*100), Math.round(l*100)];
}

   overrides auto-discovery. */
function voiceKey(){ return 'mia_el_voice_' + PERSONA_ID; }
function voiceVerKey(){ return 'mia_el_voice_ver_' + PERSONA_ID; }
function voiceManualKey(){ return 'mia_el_voice_m_' + PERSONA_ID; }
function initVoiceId(){
  const manual = localStorage.getItem(voiceManualKey());
  if (manual) return manual;
  const cached = localStorage.getItem(voiceKey());
  if (cached && localStorage.getItem(voiceVerKey()) === VOICE_VER) return cached;
  return null;   // force a fresh scored pick
}
let EL_VOICE_ID = initVoiceId();
const EL_MODEL  = 'eleven_flash_v2_5';   // ~75ms latency
let elTriedVoices = [];

function scoreVoice(v, hint){
  const L = v.labels || {};
  const name    = (v.name || '').toLowerCase();
  const gender  = (L.gender || '').toLowerCase();
  const age     = (L.age || '').toLowerCase();
  const accent  = (L.accent || '').toLowerCase();
  const desc    = ((L.description || '') + ' ' + (L.descriptive || '') + ' ' + (L.use_case || '') + ' ' + (v.description || '')).toLowerCase();
  let s = 0;
  if (hint.names){ const i = hint.names.findIndex(n => name === n.toLowerCase()); if (i >= 0) s += 100 - i*6; }
  if (hint.gender){ if (gender === hint.gender) s += 45; else if (gender) s -= 70; }   // exact: 'female'.includes('male') is true, so never use includes here
  if (hint.accent && accent && accent.includes(hint.accent)) s += 22;
  if (hint.age && age && age.includes(hint.age)) s += 12;
  if (hint.keywords) for (const k of hint.keywords) if (desc.includes(k.toLowerCase())) s += 6;
  if (v.category === 'premade') s += 8;   // broadly available/allowed
  return s;
}

async function resolveVoice(){
  if (EL_VOICE_ID && !elTriedVoices.includes(EL_VOICE_ID)) return EL_VOICE_ID;
  // manual override always wins
  const manual = localStorage.getItem(voiceManualKey());
  if (manual && !elTriedVoices.includes(manual)){ EL_VOICE_ID = manual; return manual; }
  // valid cached auto-pick (matching current scoring version)
  const cached = localStorage.getItem(voiceKey());
  if (cached && localStorage.getItem(voiceVerKey()) === VOICE_VER && !elTriedVoices.includes(cached)){ EL_VOICE_ID = cached; return cached; }
  // otherwise fetch the account's voices and score them for this character
  const res = await fetch('https://api.elevenlabs.io/v1/voices', { headers:{ 'xi-api-key': EL_KEY } });
  if (!res.ok) throw new Error('ElevenLabs voices ' + res.status);
  const voices = (await res.json())?.voices || [];
  const usable = voices.filter(v => !elTriedVoices.includes(v.voice_id));
  if (!usable.length) throw new Error('No usable ElevenLabs voices on this account');
  const hint = VOICE_HINTS[PERSONA_ID] || { gender: currentPersona().gender };
  // Hard gender constraint: if the account has any voice of the wanted
  // gender, only pick from those (so e.g. Rick never lands on a female voice).
  let pool = usable;
  if (hint.gender){
    const matched = usable.filter(v => (v.labels?.gender || '').toLowerCase() === hint.gender);
    if (matched.length) pool = matched;
  }
  let best = pool[0], bestScore = -Infinity;
  for (const v of pool){ const sc = scoreVoice(v, hint); if (sc > bestScore){ bestScore = sc; best = v; } }
  EL_VOICE_ID = best.voice_id;
  localStorage.setItem(voiceKey(), EL_VOICE_ID);
  localStorage.setItem(voiceVerKey(), VOICE_VER);
  return EL_VOICE_ID;
}

/* ---------------- persistence: memory, log, blobs ---------------- */
const idb = {
  db: null,
  open(){
    if (this.db) return Promise.resolve();
    return new Promise((res, rej) => {
      const r = indexedDB.open('mia', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('blobs');
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  async put(key, blob){
    await this.open();
    return new Promise((res, rej) => {
      const tx = this.db.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').put(blob, key);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  },
  async get(key){
    await this.open();
    return new Promise((res, rej) => {
      const q = this.db.transaction('blobs').objectStore('blobs').get(key);
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => rej(q.error);
    });
  },
  async clear(){
    await this.open();
    return new Promise((res) => {
      const tx = this.db.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').clear();
      tx.oncomplete = res; tx.onerror = res;
    });
  }
};

        ev.preventDefault();
        const b = await idb.get(e.blobId);
        if (!b){ a.textContent = e.name + ' (gone)'; return; }
        const url = URL.createObjectURL(b);
        const tmp = document.createElement('a');
        tmp.href = url; tmp.download = e.name; tmp.click();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
      });
      div.appendChild(a);
      div.appendChild(document.createTextNode(' '));
      const ts = document.createElement('span');
      ts.className = 'ltime'; ts.textContent = time;
      div.appendChild(ts);
    }
    box.appendChild(div);
  }
  box.scrollTop = box.scrollHeight;
  requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
}

/* ---------------- state machine ---------------- */
const S = { OFF:'off', LISTENING:'listening', THINKING:'thinking', SPEAKING:'speaking' };
let state = S.OFF;
let onCall = false;
let history = loadHistory();  // {role:'user'|'model', parts:[{text}]} — persisted across sessions
let recog = null;
let audioCtx = null, analyser = null, ampData = null;
let currentAudio = null;
let fakeMouthTimer = 0;

function setState(s, label){
  state = s;
  document.body.classList.remove('state-listening','state-thinking','state-speaking');
  if (s !== S.OFF) document.body.classList.add('state-' + s);
  statusEl.textContent = label || '\u00a0';
  face.setExpression(
    s === S.LISTENING ? 'listening' :
    s === S.THINKING  ? 'thinking'  :
    s === S.SPEAKING  ? 'speaking'  : 'idle'
  );
}

/* ---------------- character face (canvas) ----------------
   One shared animation engine (blink, gaze wander, brow/mouth expression,
   lip-sync, head bob) drives three renderers: a robot (Mia), a mechanical
   optic core (GLaDOS) and a parameterised human face used by everyone
   else. Each persona supplies a `face` descriptor selecting the renderer
   and its features (skin, hair, eyes, glasses, facial hair, accessory). */
const face = (() => {
  const cv = document.getElementById('face');
  const cx = cv.getContext('2d');
  const W = cv.width, H = cv.height, CX = W/2, CY = H/2;

  const cur = { eyeH:1, browTilt:0, browRaise:0, pupilX:0, pupilY:0,
                mouthOpen:.08, mouthCurve:.25, headBob:0, glow:.6 };
  const tgt = Object.assign({}, cur);
  let expression = 'idle';
  let blinkT = 0, nextBlink = 2 + Math.random()*3;
  let wanderT = 0, t = 0;
  let mouthLevel = 0;

  /* current character descriptor + accent colour (default = Mia cyan) */
  let FD = { type:'robot' };
  let AR = 125, AG = 227, AB = 255;
  let EYE_TOP = '#a5efff', EYE_BOT = '#5ed4f8', MOUTH = '#7de3ff';
  function _hx(h){ h = (h||'#7de3ff').replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
  function _mix(c, w, amt){ return [0,1,2].map(i => Math.round(c[i] + (w[i]-c[i])*amt)); }
  function _css(c){ return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
  function setFace(persona){
    FD = (persona && persona.face) || { type:'robot' };
    const c = _hx(persona && persona.glow);
    AR = c[0]; AG = c[1]; AB = c[2];
    EYE_TOP = _css(_mix(c, [255,255,255], .55));
    EYE_BOT = _css(_mix(c, [10,20,40], .18));
    MOUTH   = (persona && persona.glow) || '#7de3ff';
  }

  function setExpression(e){
    expression = e;
    switch(e){
      case 'idle':      Object.assign(tgt,{eyeH:1, browTilt:0,  browRaise:0,  mouthOpen:.07, mouthCurve:.5,  glow:.7}); break;
      case 'listening': Object.assign(tgt,{eyeH:1.12,browTilt:0, browRaise:.5, mouthOpen:.05, mouthCurve:.55, glow:1}); break;
      case 'thinking':  Object.assign(tgt,{eyeH:.78,browTilt:.5, browRaise:.3, mouthOpen:.04, mouthCurve:.3,  pupilX:.5, pupilY:-.6, glow:.8}); break;
      case 'speaking':  Object.assign(tgt,{eyeH:1, browTilt:0,  browRaise:.2, mouthCurve:.45, glow:1}); break;
      case 'happy':     Object.assign(tgt,{eyeH:.5, browTilt:-.25,browRaise:.6,mouthCurve:1,   glow:1.15}); break;
      case 'surprised': Object.assign(tgt,{eyeH:1.3,browTilt:0,  browRaise:1,  mouthOpen:.5,  mouthCurve:.25, glow:1.1}); break;
    }
  }
  function setMouthLevel(v){ mouthLevel = v; }
  function ease(dt){ for (const k in tgt) cur[k] += (tgt[k]-cur[k]) * Math.min(1, dt*7); }

  /* ---- small drawing helpers ---- */
  function el(x,y,rx,ry){ cx.beginPath(); cx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,7); }
  function roundRect(x,y,w,h,rad){
    cx.beginPath();
    cx.moveTo(x+rad,y);
    cx.arcTo(x+w,y,x+w,y+h,rad);
    cx.arcTo(x+w,y+h,x,y+h,rad);
    cx.arcTo(x,y+h,x,y,rad);
    cx.arcTo(x,y,x+w,y,rad);
    cx.closePath();
  }

  /* ================= ROBOT (Mia) ================= */
  function drawRobot(blink){
    const r = 210;
    const grad = cx.createLinearGradient(0,-r,0,r);
    grad.addColorStop(0,'#26325a'); grad.addColorStop(1,'#161e36');
    cx.fillStyle = grad;
    roundRect(-r, -r*.92, r*2, r*1.84, 118); cx.fill();
    cx.lineWidth = 5; cx.strokeStyle = '#2f3d63'; cx.stroke();

    cx.strokeStyle = '#2b3757'; cx.lineWidth = 8;
    cx.beginPath(); cx.moveTo(0,-r*.92); cx.lineTo(0,-r*1.12); cx.stroke();
    cx.fillStyle = `rgba(${AR},${AG},${AB},${.4 + .6*cur.glow*(0.6+0.4*Math.sin(t*3))})`;
    cx.beginPath(); cx.arc(0,-r*1.2, 13, 0, 7); cx.fill();

    cx.fillStyle = '#2b3757';
    roundRect(-r-16, -34, 20, 68, 10); cx.fill();
    roundRect( r-4,  -34, 20, 68, 10); cx.fill();

    cx.fillStyle = '#0c1226';
    roundRect(-r*.8, -r*.68, r*1.6, r*1.36, 84); cx.fill();

    const eyeY = -42, eyeDX = 80;
    const eh = 54 * cur.eyeH * blink, ew = 40;
    for (const s of [-1,1]){
      const ex = s*eyeDX + cur.pupilX*14;
      const g = cx.createRadialGradient(ex, eyeY, 4, ex, eyeY, 58);
      g.addColorStop(0, `rgba(${AR},${AG},${AB},${.5*cur.glow})`);
      g.addColorStop(1, `rgba(${AR},${AG},${AB},0)`);
      cx.fillStyle = g;
      cx.beginPath(); cx.arc(ex, eyeY, 60, 0, 7); cx.fill();
      const eg = cx.createLinearGradient(ex, eyeY-eh, ex, eyeY+eh);
      eg.addColorStop(0,EYE_TOP); eg.addColorStop(1,EYE_BOT);
      cx.fillStyle = eg;
      cx.beginPath(); cx.ellipse(ex, eyeY + cur.pupilY*8, ew, Math.max(3, eh), 0, 0, 7); cx.fill();
      cx.fillStyle = 'rgba(255,255,255,.9)';
      cx.beginPath(); cx.ellipse(ex - 11 + cur.pupilX*6, eyeY - eh*.35 + cur.pupilY*8, 10, Math.max(2, eh*.24), 0, 0, 7); cx.fill();
      cx.fillStyle = 'rgba(255,255,255,.55)';
      cx.beginPath(); cx.ellipse(ex + 12 + cur.pupilX*6, eyeY + eh*.3 + cur.pupilY*8, 5, Math.max(1.5, eh*.1), 0, 0, 7); cx.fill();
    }
    cx.strokeStyle = `rgba(${AR},${AG},${AB},${.7*cur.glow})`;
    cx.lineWidth = 7; cx.lineCap = 'round';
    for (const s of [-1,1]){
      const bx = s*eyeDX, by = eyeY - 66 - cur.browRaise*16;
      const tilt = cur.browTilt * 12 * s;
      cx.beginPath(); cx.moveTo(bx - 28, by + 6 + tilt); cx.quadraticCurveTo(bx, by - 8, bx + 28, by + 6 - tilt); cx.stroke();
    }
    const my = 84, mw = 96;
    const open = Math.max(.03, cur.mouthOpen), curve = cur.mouthCurve;
    cx.fillStyle = MOUTH;
    cx.beginPath();
    cx.moveTo(-mw/2, my - curve*18);
    cx.quadraticCurveTo(0, my - curve*18 - open*8, mw/2, my - curve*18);
    cx.quadraticCurveTo(mw/2 + open*6, my + open*46*.5, mw/2, my + open*46 + curve*14);
    cx.quadraticCurveTo(0, my + open*46 + curve*30, -mw/2, my + open*46 + curve*14);
    cx.quadraticCurveTo(-mw/2 - open*6, my + open*46*.5, -mw/2, my - curve*18);
    cx.closePath(); cx.fill();
    if (open > .18){ cx.fillStyle = '#0c1226'; cx.beginPath(); cx.ellipse(0, my + open*24, mw*.32, open*18, 0, 0, 7); cx.fill(); }
    if (curve > .3){
      const blush = Math.min(1, (curve - .3) / .6);
      cx.fillStyle = `rgba(244,138,158,${.12 + .28*blush})`;
      el(-eyeDX-16, 36, 24, 13); cx.fill(); el( eyeDX+16, 36, 24, 13); cx.fill();
    }
  }

  /* ================= GLaDOS (optic core) =================
     White segmented body, black face plate, single yellow optic that
     brightens with speech; the eye "blinks" as a lid closing over the
     round optic (clipped, so no square ever shows). */
  function drawGlados(blink){
    // hanging cables + ceiling mount
    cx.strokeStyle = '#3a3d42'; cx.lineWidth = 12; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(-24,-272); cx.lineTo(-8,-150); cx.moveTo(24,-272); cx.lineTo(8,-150); cx.stroke();
    cx.fillStyle = '#d7dade'; roundRect(-44,-214,88,86,20); cx.fill();
    cx.fillStyle = '#b7bcc1'; roundRect(-44,-214,88,22,20); cx.fill();

    // white segmented cocoon body
    cx.fillStyle = '#e7e9ec';
    cx.beginPath();
    cx.moveTo(0,-150);
    cx.quadraticCurveTo(188,-116,172,52);
    cx.quadraticCurveTo(150,220,0,244);
    cx.quadraticCurveTo(-150,220,-172,52);
    cx.quadraticCurveTo(-188,-116,0,-150);
    cx.closePath(); cx.fill();
    // soft side shadow for volume
    cx.save(); cx.globalAlpha = .35; cx.fillStyle = '#aab0b8';
    cx.beginPath(); cx.moveTo(-172,52); cx.quadraticCurveTo(-150,220,0,244);
    cx.quadraticCurveTo(-78,150,-104,-16); cx.closePath(); cx.fill(); cx.restore();
    // segment seams
    cx.strokeStyle = 'rgba(120,126,134,.5)'; cx.lineWidth = 5;
    for (const yy of [-42,44,132]){ cx.beginPath(); cx.moveTo(-158,yy); cx.quadraticCurveTo(0,yy+16,158,yy); cx.stroke(); }
    // side actuator plates
    cx.fillStyle = '#cfd2d6'; roundRect(-186,-4,42,120,18); cx.fill(); roundRect(144,-4,42,120,18); cx.fill();

    // black face plate housing the optic
    const oy = 64;
    cx.fillStyle = '#141518';
    cx.beginPath();
    cx.moveTo(0,-66);
    cx.quadraticCurveTo(128,-42,120,oy);
    cx.quadraticCurveTo(110,172,0,182);
    cx.quadraticCurveTo(-110,172,-120,oy);
    cx.quadraticCurveTo(-128,-42,0,-66);
    cx.closePath(); cx.fill();

    // optic
    const b = Math.min(1.5, cur.glow*(0.6 + 0.6*mouthLevel));
    const px = cur.pupilX*16, py = oy + cur.pupilY*10;
    const R = 84;
    cx.fillStyle = '#0a0b0d'; el(0,oy,R,R); cx.fill();                 // socket
    const og = cx.createRadialGradient(px, py, 3, 0, oy, R+4);
    og.addColorStop(0, `rgba(255,244,210,${Math.min(1,.95*b)})`);
    og.addColorStop(.38, `rgba(${AR},${AG},${AB},${Math.min(1,.92*b)})`);
    og.addColorStop(1, `rgba(${AR},${AG},${AB},0)`);
    cx.fillStyle = og; el(0,oy,R+2,R+2); cx.fill();
    cx.fillStyle = `rgba(${AR},${AG},${AB},${Math.min(1,b)})`; el(px,py,34,34); cx.fill();
    cx.fillStyle = `rgba(255,250,235,${Math.min(1,.95*b)})`; el(px,py,14,14); cx.fill();
    cx.strokeStyle = `rgba(${AR},${AG},${AB},.7)`; cx.lineWidth = 5; el(0,oy,R-4,R-4); cx.stroke();

    // eyelid blink — lids close over the ROUND optic only (clipped → no square)
    const closed = 1 - blink;
    if (closed > 0.02){
      cx.save();
      el(0,oy,R,R); cx.clip();
      cx.fillStyle = '#141518';
      const h = closed * (R+6);
      cx.fillRect(-R-6, oy-R-4, (R+6)*2, h);          // upper lid down
      cx.fillRect(-R-6, oy+R+4-h, (R+6)*2, h);          // lower lid up
      cx.restore();
    }
  }

  /* ================= HUMAN ================= */
  function drawHumanEye(ex, eyeY, ew, eh, iris){
    cx.fillStyle = '#f6f2ea'; el(ex, eyeY, ew, eh); cx.fill();
    if (eh >= 5){
      const ix = ex + cur.pupilX*10, iy = eyeY + cur.pupilY*6;
      const ir = Math.min(ew*0.78, eh*1.15, 22);
      cx.save(); el(ex, eyeY, ew, eh); cx.clip();
      cx.fillStyle = iris; el(ix, iy, ir, ir); cx.fill();
      cx.fillStyle = 'rgba(15,10,10,.85)'; el(ix, iy, ir*.5, ir*.5); cx.fill();
      cx.fillStyle = 'rgba(255,255,255,.9)'; el(ix - ir*.3, iy - ir*.3, ir*.22, ir*.22); cx.fill();
      cx.restore();
    }
    cx.strokeStyle = 'rgba(45,28,22,.6)'; cx.lineWidth = 4; cx.lineCap = 'round';
    cx.beginPath(); cx.ellipse(ex, eyeY, ew, Math.max(2,eh), 0, Math.PI*1.03, Math.PI*1.97); cx.stroke();
    if (FD.lashes){
      cx.lineWidth = 3;
      cx.beginPath(); cx.moveTo(ex-ew, eyeY-2); cx.lineTo(ex-ew-9, eyeY-9); cx.stroke();
      cx.beginPath(); cx.moveTo(ex+ew, eyeY-2); cx.lineTo(ex+ew+9, eyeY-9); cx.stroke();
    }
  }
  function drawLips(my, mw, open, curve, lip){
    cx.fillStyle = lip;
    cx.beginPath();
    cx.moveTo(-mw/2, my - curve*16);
    cx.quadraticCurveTo(0, my - curve*16 - open*8, mw/2, my - curve*16);
    cx.quadraticCurveTo(mw/2 + open*6, my + open*40*.5, mw/2, my + open*40 + curve*12);
    cx.quadraticCurveTo(0, my + open*40 + curve*26, -mw/2, my + open*40 + curve*12);
    cx.quadraticCurveTo(-mw/2 - open*6, my + open*40*.5, -mw/2, my - curve*16);
    cx.closePath(); cx.fill();
    if (open > .16){
      cx.fillStyle = '#5e2529'; el(0, my + open*18, mw*.32, open*16); cx.fill();
      cx.fillStyle = '#f4efe6'; el(0, my + open*18 - open*10, mw*.28, Math.max(2, open*6)); cx.fill();
    }
    cx.strokeStyle = 'rgba(255,255,255,.15)'; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(-mw/2, my-curve*16); cx.quadraticCurveTo(0, my-curve*16-open*8, mw/2, my-curve*16); cx.stroke();
  }
  function drawGlasses(eyeDX, eyeY){
    cx.strokeStyle = '#1c1c22'; cx.lineWidth = 6; cx.fillStyle = 'rgba(180,220,255,.10)';
    const round = FD.glassesStyle === 'round';
    for (const s of [-1,1]){
      const gx = s*eyeDX;
      if (round) el(gx, eyeY, 46, 42); else roundRect(gx-48, eyeY-34, 96, 68, 16);
      cx.fill(); cx.stroke();
    }
    cx.beginPath(); cx.moveTo(-eyeDX+44, eyeY-2); cx.lineTo(eyeDX-44, eyeY-2); cx.stroke();
    cx.beginPath(); cx.moveTo(-eyeDX-46, eyeY-6); cx.lineTo(-150, eyeY-14); cx.moveTo(eyeDX+46, eyeY-6); cx.lineTo(150, eyeY-14); cx.stroke();
  }
  function drawHeadphones(){
    cx.strokeStyle = '#2a2e36'; cx.lineWidth = 18; cx.lineCap = 'round';
    cx.beginPath(); cx.arc(0,-40,190, Math.PI*1.16, Math.PI*1.84); cx.stroke();
    cx.fillStyle = '#33373f'; roundRect(-210, -6, 46, 96, 18); cx.fill(); roundRect(164, -6, 46, 96, 18); cx.fill();
    cx.fillStyle = `rgba(${AR},${AG},${AB},.85)`; el(-187, 42, 9, 9); cx.fill(); el(187, 42, 9, 9); cx.fill();
  }
  function drawHat(){
    // brim
    cx.fillStyle = '#6b5836'; el(0,-146, 242, 46); cx.fill();
    // crown (rounded, base arcs up at the centre)
    cx.fillStyle = '#7a6540';
    cx.beginPath();
    cx.moveTo(-112,-150);
    cx.quadraticCurveTo(-104,-250, 0,-258);
    cx.quadraticCurveTo(104,-250, 112,-150);
    cx.quadraticCurveTo(0,-162, -112,-150);
    cx.closePath(); cx.fill();
    // hat band following the crown base (no stray line)
    cx.fillStyle = '#4a3a22';
    cx.beginPath();
    cx.moveTo(-108,-150); cx.quadraticCurveTo(0,-160, 108,-150);
    cx.quadraticCurveTo(106,-144, 0,-150); cx.quadraticCurveTo(-106,-144, -108,-150);
    cx.closePath(); cx.fill();
  }
  function drawBandana(){
    const bc = FD.bandanaColor || '#e46aa0';
    cx.fillStyle = bc;
    cx.beginPath();
    cx.moveTo(-174,-36);
    cx.quadraticCurveTo(-198,-150,0,-208);
    cx.quadraticCurveTo(198,-150,174,-36);
    cx.quadraticCurveTo(0,-72,-174,-36);
    cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(150,-44); cx.lineTo(214,-26); cx.lineTo(196,-72); cx.closePath(); cx.fill();
    cx.fillStyle = 'rgba(255,255,255,.5)';
    for (const d of [[-96,-118],[-24,-152],[58,-132],[112,-88],[-142,-78]]){ el(d[0],d[1],7,7); cx.fill(); }
  }
  function drawStethoscope(){
    // rests around the neck (wide apart on the collar) and drapes down the coat
    cx.strokeStyle = '#2a333f'; cx.lineWidth = 12; cx.lineCap = 'round';
    cx.beginPath();
    cx.moveTo(-84,182); cx.quadraticCurveTo(-118,235,-104,300);
    cx.moveTo( 84,182); cx.quadraticCurveTo( 118,238,  98,294);
    cx.stroke();
    // earpiece tips resting on the collar (well below the chin, wide apart)
    cx.fillStyle = '#2a333f'; el(-84,181,8,8); cx.fill(); el(84,181,8,8); cx.fill();
    // chestpiece at the end of the right tube
    cx.fillStyle = '#c9ccd2'; el(98,300,21,21); cx.fill();
    cx.fillStyle = '#9aa0a8'; el(98,300,12,12); cx.fill();
  }
  function drawHairBack(hair, hi){
    const st = FD.hairStyle;
    if (st==='long' || st==='ponytail' || st==='bob'){
      const drop = st==='bob' ? 80 : (st==='long' ? 250 : 150);
      cx.fillStyle = _css(_mix(_hx(hair),[0,0,0],.16));
      cx.beginPath();
      cx.moveTo(-176,-40);
      cx.quadraticCurveTo(-210,-180,0,-212);
      cx.quadraticCurveTo(210,-180,176,-40);
      cx.quadraticCurveTo(196, drop, 118, drop+18);
      cx.quadraticCurveTo(0, drop-40, -118, drop+18);
      cx.quadraticCurveTo(-196, drop, -176,-40);
      cx.closePath(); cx.fill();
    }
    if (st==='ponytail'){
      cx.fillStyle = hair;
      cx.beginPath();
      cx.moveTo(140,-120);
      cx.quadraticCurveTo(252,-92,236,24);
      cx.quadraticCurveTo(224,128,168,156);
      cx.quadraticCurveTo(206,54,140,-40);
      cx.closePath(); cx.fill();
      cx.fillStyle = hi; cx.globalAlpha=.4;
      cx.beginPath(); cx.moveTo(160,-90); cx.quadraticCurveTo(224,-40,214,60); cx.lineWidth=6; cx.strokeStyle=hi; cx.stroke(); cx.globalAlpha=1;
    }
  }
  function drawHairFront(hair, hi){
    if (FD.acc==='hat' || FD.acc==='bandana') return;   // top is covered
    const st = FD.hairStyle;
    cx.fillStyle = hair;
    cx.beginPath();
    cx.moveTo(-178,-30);
    cx.quadraticCurveTo(-200,-172,0,-216);
    cx.quadraticCurveTo(200,-172,178,-30);
    if (st==='bowl'){
      cx.quadraticCurveTo(150,-58,120,-70);
      cx.lineTo(92,-98); cx.quadraticCurveTo(0,-72,-92,-98); cx.lineTo(-120,-70);
      cx.quadraticCurveTo(-150,-58,-178,-30);
    } else if (st==='short'){
      cx.quadraticCurveTo(152,-98,72,-106);
      cx.quadraticCurveTo(20,-124,-34,-108);
      cx.quadraticCurveTo(-112,-96,-178,-30);
    } else if (st==='bun' || st==='ponytail'){
      cx.quadraticCurveTo(150,-112,60,-122);
      cx.quadraticCurveTo(0,-142,-60,-122);
      cx.quadraticCurveTo(-150,-112,-178,-30);
    } else { // long / bob — clean top cap; side locks are drawn separately
      cx.quadraticCurveTo(162,-118,82,-126);
      cx.quadraticCurveTo(0,-150,-82,-126);
      cx.quadraticCurveTo(-162,-118,-178,-30);
    }
    cx.closePath(); cx.fill();
    if (st==='long' || st==='bob'){
      const jaw = st==='bob' ? 100 : 158;   // side locks frame the face, never cross it
      cx.fillStyle = hair;
      for (const s of [-1,1]){
        cx.beginPath();
        cx.moveTo(s*178,-48);
        cx.quadraticCurveTo(s*198, jaw*0.5, s*150, jaw);
        cx.quadraticCurveTo(s*120, jaw-8, s*128, jaw*0.34);
        cx.quadraticCurveTo(s*142,-58, s*150,-94);
        cx.closePath(); cx.fill();
      }
    }
    if (st==='bun'){ cx.fillStyle = hair; el(0,-212,52,42); cx.fill(); cx.strokeStyle = hi; cx.lineWidth = 4; el(0,-212,52,42); cx.stroke(); }
    cx.strokeStyle = hi; cx.lineWidth = 7; cx.globalAlpha = .5; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(-70,-182); cx.quadraticCurveTo(40,-206,132,-150); cx.stroke(); cx.globalAlpha = 1;
  }
  function drawHuman(blink){
    const skin = FD.skin || '#e9bfa0';
    const skinSh = _css(_mix(_hx(skin), [90,50,40], .30));
    const hair = FD.hair || '#3a2a1c';
    const hairHi = _css(_mix(_hx(hair), [255,255,255], .28));

    }
    // eyes
    const eh = Math.max(1.5, 26 * cur.eyeH * blink);
    for (const s of [-1,1]) drawHumanEye(s*eyeDX, eyeY, 40, eh, iris);
    // nose
    cx.strokeStyle = skinSh; cx.lineWidth = 6; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(-6, eyeY+16); cx.lineTo(-12, 30); cx.quadraticCurveTo(0, 42, 12, 30); cx.stroke();
    // mouth
    drawLips(96, 92, Math.max(.02, cur.mouthOpen), cur.mouthCurve, lip);
    // blush when smiling
    if (cur.mouthCurve > .55){
      const b = Math.min(1, (cur.mouthCurve - .55) / .45);
      cx.fillStyle = `rgba(230,120,120,${.10 + .22*b})`; el(-96,70,34,20); cx.fill(); el(96,70,34,20); cx.fill();
    }
    // mustache
    if (FD.facial === 'mustache'){
      cx.fillStyle = hair;
      cx.beginPath(); cx.moveTo(-44,80); cx.quadraticCurveTo(0,72,44,80); cx.quadraticCurveTo(0,98,-44,80); cx.closePath(); cx.fill();
    }
    // glasses + accessories
    if (FD.glasses) drawGlasses(eyeDX, eyeY);
    if (FD.acc === 'headphones') drawHeadphones();
    if (FD.acc === 'hat') drawHat();
    if (FD.acc === 'bandana') drawBandana();
    if (FD.acc === 'stethoscope') drawStethoscope();
  }

  function draw(dt){
    t += dt;
    blinkT += dt;
    let blink = 1;
    if (blinkT > nextBlink){
      const p = (blinkT - nextBlink) / .22;
      if (p >= 1){ blinkT = 0; nextBlink = 1.8 + Math.random()*3.5; }
      else blink = Math.abs(1 - p*2);
    }
    if (expression === 'idle' || expression === 'listening'){
      wanderT += dt;
      if (wanderT > 2.4){ wanderT = 0; tgt.pupilX = (Math.random()*2-1)*.5; tgt.pupilY = (Math.random()*2-1)*.3; }
    }
    if (expression === 'speaking'){ tgt.pupilX = Math.sin(t*.6)*.15; tgt.pupilY = 0; }
    if (mouthLevel > 0.01) tgt.mouthOpen = .06 + mouthLevel*.85;
    tgt.headBob = Math.sin(t*1.2)*(expression==='speaking'? 6:3);
    ease(dt);

    cx.clearRect(0,0,W,H);
    cx.save();
    cx.translate(CX, CY + cur.headBob);
    // ambient accent glow behind the character
    const ag = cx.createRadialGradient(0,0,40,0,0,330);
    ag.addColorStop(0, `rgba(${AR},${AG},${AB},.12)`);
    ag.addColorStop(1, `rgba(${AR},${AG},${AB},0)`);
    cx.fillStyle = ag; cx.beginPath(); cx.arc(0,0,330,0,7); cx.fill();

    if (FD.type === 'glados') drawGlados(blink);
    else if (FD.type === 'human') drawHuman(blink);
    else drawRobot(blink);

    cx.restore();
  }

  let last = performance.now();
  (function loop(now){
    const dt = Math.min(.05, (now-last)/1000); last = now;
    draw(dt);
    requestAnimationFrame(loop);
  })(last);

  setExpression('idle');
  return { setExpression, setMouthLevel, setFace };
})();

/* ---------------- lip sync ---------------- */
function startLipSyncFromAnalyser(){
  function tick(){
    if (state !== S.SPEAKING) { face.setMouthLevel(0); return; }
    let level = 0;
    if (analyser && ampData){
      analyser.getByteTimeDomainData(ampData);
      let sum = 0;
      for (let i=0;i<ampData.length;i++){ const d = (ampData[i]-128)/128; sum += d*d; }
      level = Math.min(1, Math.sqrt(sum/ampData.length) * 5.5);
    } else {
      fakeMouthTimer += .08;
      level = Math.max(0, Math.sin(fakeMouthTimer*7)*.5 + .35 + Math.sin(fakeMouthTimer*13)*.2);
    }
    face.setMouthLevel(level);
    requestAnimationFrame(tick);
  }
  tick();
}

const attachArea = document.getElementById('attachArea');
const attachBtn  = document.getElementById('attachBtn');
const fileInput  = document.getElementById('fileInput');
let attachment = null;   // {kind:'image'|'pdf', mime, dataB64, name} | {kind:'text', text, name}

attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const f = fileInput.files[0];
  fileInput.value = '';
  if (!f) return;
  if (f.size > 10*1024*1024){ hintEl.textContent = T().tooBig; return; }
  try {
    if (f.type.startsWith('image/')){
      attachment = { kind:'image', mime:'image/jpeg', dataB64: await imageToB64(f), name:f.name, file:f };
      addAttachmentCard(f.name, URL.createObjectURL(f));
    } else if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)){
      attachment = { kind:'pdf', mime:'application/pdf', dataB64: await fileToB64(f), name:f.name, file:f };
      addAttachmentCard(f.name, null);
    } else if (f.type.startsWith('text/') || /\.(txt|md|csv|json|html)$/i.test(f.name)){
      let text = await f.text();
      if (text.length > 100000) text = text.slice(0, 100000);
      attachment = { kind:'text', text, name:f.name, file:f };
      addAttachmentCard(f.name, null);
    } else {
      hintEl.textContent = T().unsupported; return;
    }
    logAttach(attachment.kind === 'image' ? 'image' : 'file', f.name, f);
    hintEl.textContent = T().attached;
  } catch(e){ hintEl.textContent = '⚠ ' + e.message; }
});

function fileToB64(f){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(new Error('read failed'));
    r.readAsDataURL(f);
  });
}
function imageToB64(f){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const maxSide = 1024;
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', .85).split(',')[1]);
    };
    img.onerror = () => rej(new Error('image read failed'));
    img.src = URL.createObjectURL(f);
  });
}

function addResultCard({ name, blob, thumbURL, pending, kind }, container){

/* parse [[FILE:...]]...[[/FILE]] and [[IMAGE:...]] out of Mia's reply */
function processReply(reply, container){
  let spoken = reply;
  spoken = spoken.replace(/\[\[SEARCH:[^\]]*\]\]/ig, ' ');   // never show/speak a search marker
  const files = [];
  spoken = spoken.replace(/\[\[FILE:([^\]]+)\]\]([\s\S]*?)\[\[\/FILE\]\]/g, (m, fname, content) => {
    files.push({ name: fname.trim(), content: content.trim() });
    return ' ';
  });
  let imagePrompt = null;
  spoken = spoken.replace(/\[\[IMAGE:([^\]]*)\]\]/g, (m, desc) => {
    imagePrompt = desc.trim();
    return ' ';
  });
  spoken = spoken.replace(/\s+/g, ' ').trim();

  for (const f of files){
    const mime = /\.html?$/i.test(f.name) ? 'text/html' :
                 /\.csv$/i.test(f.name)  ? 'text/csv'  :
                 /\.md$/i.test(f.name)   ? 'text/markdown' : 'text/plain';
    addResultCard({ name: f.name, blob: new Blob([f.content], { type: mime }), kind:'file' }, container);
  }
  if (imagePrompt) generateImage(imagePrompt, container);   // async, card appears when done

  if (!spoken) spoken = files.length ? T().madeFile : (imagePrompt ? T().madeImage : '');
  return spoken || T().madeFile;
}

/* ---------------- image generation ---------------- */
async function generateImage(prompt, container){
  const pending = addResultCard({ name: 'image…', pending: true }, container);
  try {
    let blob = null;
    // 1) Gemini image model (free tier includes a small daily quota)
    try {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key=${encodeURIComponent(GEMINI_KEY)}`,
        {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({
            contents:[{ parts:[{ text: 'Generate an image: ' + prompt }] }],
            generationConfig:{ responseModalities:['TEXT','IMAGE'] }
          })
        });
      if (res.ok){
        const data = await res.json();
        const part = (data?.candidates?.[0]?.content?.parts || []).find(p => p.inline_data || p.inlineData);
        const inl = part && (part.inline_data || part.inlineData);
        if (inl){
          const bytes = Uint8Array.from(atob(inl.data), c => c.charCodeAt(0));
          blob = new Blob([bytes], { type: inl.mime_type || inl.mimeType || 'image/png' });
        }
      }
    } catch(e){ /* fall through to pollinations */ }
    // 2) Pollinations fallback (free, keyless)
    if (!blob){
      const res = await fetch('https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=768&height=768&nologo=true');
      if (!res.ok) throw new Error('image HTTP ' + res.status);
      blob = await res.blob();
    }
    pending.remove();
    const thumbURL = URL.createObjectURL(blob);
    addResultCard({ name: 'mia-image-' + Date.now() + '.png', blob, thumbURL, kind:'image' }, container);
  } catch(e){
    pending.remove(); refreshAttachBtnVisibility();
    hintEl.textContent = '⚠ ' + T().imgFail + ' ' + (e.message || '');
  }
}

/* ---------------- camera "eyes" ---------------- */
const camVideo = document.getElementById('camVideo');
let camStream = null;
let camFacing = 'environment';

async function startCamera(){
  stopCamera();
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: camFacing, width: { ideal: 1024 } },
      audio: false
    });
    camVideo.srcObject = camStream;
    document.body.classList.add('camon');
    hintEl.textContent = T().camOn;
  } catch(e){
    camStream = null;
    document.body.classList.remove('camon');
    hintEl.textContent = T().camFail;
  }
}

function stopCamera(){
  if (camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  camVideo.srcObject = null;
  document.body.classList.remove('camon');
}

function captureFrame(){
  if (!camStream || !camVideo.videoWidth) return null;
  const maxSide = 768;
  const scale = Math.min(1, maxSide / Math.max(camVideo.videoWidth, camVideo.videoHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(camVideo.videoWidth * scale);
  c.height = Math.round(camVideo.videoHeight * scale);
  c.getContext('2d').drawImage(camVideo, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.8).split(',')[1];   // raw base64
}

document.getElementById('camBtn').addEventListener('click', () => {
  if (camStream){ stopCamera(); hintEl.textContent = T().camOff; }
  else startCamera();
});
document.getElementById('camFlip').addEventListener('click', (e) => {
  e.stopPropagation();
  camFacing = camFacing === 'environment' ? 'user' : 'environment';
  if (camStream) startCamera();
});

/* ---------------- speech recognition ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function startListening(){
  if (!onCall) return;
  setState(S.LISTENING, T().listening);
  try { recog && recog.abort(); } catch(e){}
  recog = new SR();
  recog.lang = LANG === 'sv' ? 'sv-SE' : 'en-US';
  // continuous = true keeps the mic session open for your whole turn,
  // so Android's recognition chime plays once per turn instead of on
  // every silence-restart.
  recog.continuous = true;
  recog.interimResults = false;
  recog.maxAlternatives = 1;

  let got = false;
  recog.onresult = (ev) => {
    if (got || state !== S.LISTENING) return;
    const last = ev.results[ev.results.length - 1];
    if (!last.isFinal) return;
    const text = last[0].transcript.trim();
    if (!text) return;
    got = true;
    handleUserSpeech(text);
  };
  recog.onerror = (ev) => {
    if (!onCall) return;
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed'){
      endCall(T().micBlocked);
      return;
    }
    if (state === S.LISTENING) setTimeout(() => { if (onCall && state === S.LISTENING) startListening(); }, 400);
  };
  recog.onend = () => {
    if (onCall && !got && state === S.LISTENING){
      setTimeout(() => { if (onCall && state === S.LISTENING) startListening(); }, 300);
    }
  };
  try { recog.start(); } catch(e){ /* already started */ }
}

function stopListening(){
  if (recog){ try{ recog.onend = null; recog.abort(); }catch(e){} recog = null; }
}

/* ---------------- LLM: Gemini ---------------- */
/* Coerce a conversation array into exactly the shape Gemini's REST API
   accepts: every turn is { role:'user'|'model', parts:[…] }, malformed or
   empty turns are dropped, and the array must START with a user turn (a
   leftover model greeting at the front makes Gemini reject the whole
   request with "Unknown name 'content'/'contents'"). This makes the app
   resilient to history persisted by older versions or other pages sharing
   the same origin. */
function sanitizeContents(contents){
  const arr = Array.isArray(contents) ? contents : [];
  const out = [];
  for (const e of arr){
    if (!e || typeof e !== 'object') continue;
    const role = e.role === 'model' ? 'model' : 'user';
    let parts = null;
    if (Array.isArray(e.parts)){
      parts = e.parts.filter(p => p && (typeof p.text === 'string' || p.inline_data || p.inlineData));
    } else if (typeof e.content === 'string'){
      parts = [{ text: e.content }];
    } else if (typeof e.text === 'string'){
      parts = [{ text: e.text }];
    }
    if (!parts || !parts.length) continue;
    out.push({ role, parts });
  }
  // Gemini requires the first turn to be from the user.
  while (out.length && out[0].role !== 'user') out.shift();
  return out;
}

async function geminiRequest(model, contents, disableThinking, useSearch){
  const generationConfig = { temperature: 1.0, maxOutputTokens: 1024 };
  if (disableThinking) generationConfig.thinkingConfig = { thinkingBudget: 0 };
  const payload = {
    system_instruction: { parts: [{ text: SYSTEM_PROMPT() }] },
    contents: sanitizeContents(contents),
    generationConfig
  };
  if (useSearch) payload.tools = [{ google_search: {} }];
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(GEMINI_KEY)}`,
    {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(payload)
    }
  );
  if (!res.ok){
    let detail = '';
    try { detail = (await res.json())?.error?.message || ''; } catch(e){}
    const err = new Error(`Gemini ${res.status}${detail ? ': ' + detail.slice(0,140) : ''}`);
    err.status = res.status;
    throw err;
  }
  const data = await res.json();
  lastGrounded = !!data?.candidates?.[0]?.groundingMetadata;
  // Ignore internal "thought" parts; keep only real text.
  const text = (data?.candidates?.[0]?.content?.parts || [])
    .filter(p => !p.thought && p.text)
    .map(p => p.text).join('').trim();
  if (!text){
    const reason = data?.candidates?.[0]?.finishReason || 'no text';
    throw new Error('Gemini empty reply (' + reason + ')');
  }
  return text;
}

let lastGrounded = false;   // true when the answer actually used Google Search
let lastSearchError = '';   // why native grounding failed, for diagnostics

/* Free, keyless, CORS-friendly web search used when Gemini's own
   Google Search grounding isn't available for this key. */
async function webSearch(query){
  const target = 'https://duckduckgo.com/html/?q=' + encodeURIComponent(query);
  const res = await fetch('https://r.jina.ai/' + target, { headers:{ 'Accept':'text/plain' } });
  if (!res.ok) throw new Error('search HTTP ' + res.status);
  let text = await res.text();
  text = text.replace(/\n{3,}/g, '\n\n').trim();
  return text.slice(0, 6000);
}

async function tryModel(model, contents){
  // Optional Google Search grounding. Gemini 2.5 often rejects the search tool
  // when thinking is disabled, so if the fast variant fails we try once more
  // with thinking enabled before falling back to a plain (unsearched) request.
  if (SEARCH_ON){
    try {
      return await geminiRequest(model, contents, true, true);
    } catch(e){
      console.warn('search (fast) failed:', e.status, e.message);
      if (e.status === 401 || e.status === 403) throw e;
      try {
        return await geminiRequest(model, contents, false, true);
      } catch(e2){
        console.warn('search (thinking) failed:', e2.status, e2.message);
        if (e2.status === 401 || e2.status === 403) throw e2;
        lastSearchError = e2.message || e.message || '';
      }
    }
  }
  // First try with thinking disabled (fastest). If the model rejects
  // thinkingConfig (400), retry once without it.
  try {
    return await geminiRequest(model, contents, true, false);
  } catch(e){
    if (e.status === 400) return await geminiRequest(model, contents, false, false);
    throw e;
  }
}

async function askMia(userText, imageB64){
  const reply = await askMiaOnce(userText, imageB64);
  // Did Mia ask to search? Run it for real and let her answer from the results.
  const m = reply.match(/\[\[SEARCH:([^\]]*)\]\]/i);
  if (!m) return reply;
  const query = m[1].trim();
  if (!query) return reply.replace(/\[\[SEARCH:[^\]]*\]\]/ig, '').trim();
  try {
    const results = await webSearch(query);
    // remove the marker turn from memory so it doesn't confuse later turns
    if (history.length && history[history.length-1].role === 'model') history.pop();
    const idx = history.length;
    const answer = await askMiaOnce(
      '(Web search results for "' + query + '":\n' + results +
      '\nAnswer my previous question using these results. Be brief and spoken-friendly. Do not use the search marker again.)'
    );
    // drop the bulky results turn from memory, keep only Mia's answer
    history.splice(idx, 1);
    saveHistory();
    lastGrounded = true;
    return answer;
  } catch(e){
    console.warn('web search failed:', e.message);
    if (history.length && history[history.length-1].role === 'model') history.pop();
    const idx = history.length;
    const answer = await askMiaOnce('(The web search failed. Tell me briefly that you could not check right now, and do not use the search marker again.)');
    history.splice(idx, 1);
    saveHistory();
    return answer;
  }
}

async function askMiaOnce(userText, imageB64){
  // History stores text only (images are heavy); the live frame is
  // attached just to the outgoing request for the current turn.
  history.push({ role:'user', parts:[{ text:userText }] });
  if (history.length > 40) history = history.slice(-40);
  saveHistory();

  let contents = history;
  if (imageB64 || attachment){
    const parts = [];
    let cue = '';
    if (imageB64) cue += T().camCue + ' ';
    if (attachment) cue += T().attachCue.replace('NAME', attachment.name) + ' ';
    parts.push({ text: cue + userText });
    if (imageB64) parts.push({ inline_data: { mime_type:'image/jpeg', data: imageB64 } });
    if (attachment){
      if (attachment.kind === 'text')
        parts.push({ text: '\n--- ' + attachment.name + ' ---\n' + attachment.text + '\n--- end of file ---' });
      else
        parts.push({ inline_data: { mime_type: attachment.mime, data: attachment.dataB64 } });
    }
    contents = history.slice(0, -1).concat([{ role:'user', parts }]);
  }

  const models = geminiModel ? [geminiModel, ...GEMINI_MODELS.filter(m => m !== geminiModel)] : GEMINI_MODELS;
  let lastErr = null;
  for (const m of models){
    try {
      const reply = await tryModel(m, contents);
      if (m !== geminiModel){ geminiModel = m; localStorage.setItem('mia_gem_model', m); }
      history.push({ role:'model', parts:[{ text:reply }] });
      saveHistory();
      return reply;
    } catch(e){
      lastErr = e;
      console.warn('Gemini model failed:', m, e.message);
      if (e.status === 401 || e.status === 403){ throw Object.assign(e, { badKey:'gemini' }); }
      // 404 / 429 / empty → try next model
    }
  }
  throw lastErr || new Error('Gemini failed');
}

function inferExpression(text){
  const t = text.toLowerCase();
  if (/\bhaha|\blol|😄|😂|great|love|awesome|amazing/.test(t)) return 'happy';
  if (/\bwow|really\?|no way|seriously\?|what\?!/.test(t)) return 'surprised';
  if (text.includes('!')) return 'happy';
  return 'speaking';
}

/* ---------------- TTS: ElevenLabs ---------------- */
async function elTTS(text){
  const voice = await resolveVoice();
  const body = {
    text,
    model_id: EL_MODEL,
    voice_settings: { stability: 0.45, similarity_boost: 0.8 }
  };
  if (LANG === 'sv') body.language_code = 'sv';   // Flash v2.5 supports language enforcement
  const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voice}?output_format=mp3_44100_128`, {
    method:'POST',
    headers:{ 'xi-api-key': EL_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok){
    const err = new Error('TTS HTTP ' + res.status);
    err.status = res.status; err.voice = voice;
    try { err.detail = JSON.stringify((await res.json())?.detail || '').slice(0,120); } catch(e){}
    throw err;
  }
  return await res.blob();
}

async function speak(text){
  setState(S.SPEAKING, T().speaking);
  const expr = inferExpression(text);
  try {
    let blob;
    try {
      blob = await elTTS(text);
    } catch(e){
      if (e.status === 401){ badKeyStop('elevenlabs'); return; }
      // 402/403 = voice not allowed on this plan; 400/404/422 = voice id
      // invalid/stale. In all cases blacklist it and auto-pick another.
      if ([400, 402, 403, 404, 422].includes(e.status)){
        if (e.voice) elTriedVoices.push(e.voice);
        localStorage.removeItem(voiceKey()); localStorage.removeItem(voiceVerKey()); EL_VOICE_ID = null;
        blob = await elTTS(text);            // second attempt with a fresh voice
      } else throw e;
    }
    await playBlob(blob, expr);
  } catch(e){
    hintEl.textContent = '⚠ ElevenLabs: ' + (e.detail || e.message) + ' — using fallback voice';
    await speakFallback(text, expr);
  }
  if (onCall) startListening();
}

function playBlob(blob, expr){
  return new Promise((resolve) => {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;
    try {
      if (audioCtx){
        const src = audioCtx.createMediaElementSource(audio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        ampData = new Uint8Array(analyser.fftSize);
        src.connect(analyser); analyser.connect(audioCtx.destination);
      }
    } catch(e){ analyser = null; }
    audio.onplay = () => {
      face.setExpression(expr);
      if (expr !== 'speaking') setTimeout(() => { if (state === S.SPEAKING) face.setExpression('speaking'); }, 1100);
      startLipSyncFromAnalyser();
    };
    audio.onended = () => { URL.revokeObjectURL(url); currentAudio = null; face.setMouthLevel(0); resolve(); };
    audio.onerror  = () => { URL.revokeObjectURL(url); currentAudio = null; resolve(); };
    audio.play().catch(() => resolve());
  });
}

function speakFallback(text, expr){
  return new Promise((resolve) => {
    if (!('speechSynthesis' in window)) return resolve();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANG === 'sv' ? 'sv-SE' : 'en-US';
    const voices = speechSynthesis.getVoices();
    const v = LANG === 'sv'
      ? voices.find(v => v.lang && v.lang.toLowerCase().startsWith('sv'))
      : voices.find(v => /female|samantha|zira|google (us|uk) english/i.test(v.name));
    if (v) u.voice = v;
    u.rate = 1.02; u.pitch = 1.1;
    analyser = null;
    u.onstart = () => { face.setExpression('speaking'); startLipSyncFromAnalyser(); };
    u.onend = () => { face.setMouthLevel(0); resolve(); };
    u.onerror = () => resolve();
    speechSynthesis.speak(u);
  });
}

/* ---------------- text chat ---------------- */
const chatEl    = document.getElementById('chat');
const chatMsgs  = document.getElementById('chatMsgs');
const chatInput = document.getElementById('chatInput');
let chatOpen = false;
let chatBusy = false;

function scrollChat(){ chatMsgs.scrollTop = chatMsgs.scrollHeight; }
function addBubble(role, text){
  const b = document.createElement('div');
  b.className = 'bub ' + role;
  b.textContent = text;
  chatMsgs.appendChild(b);
  scrollChat();
  return b;
}
function chatCardHolder(){
  const w = document.createElement('div');
  w.className = 'bubcards';
  chatMsgs.appendChild(w);
  return w;
}

function addSavedCard(entry){
  // rebuild a file/image card from the persistent log (blob in IndexedDB)
  const holder = document.createElement('div');
  holder.className = 'bubcards' + (entry.t === 'att' ? ' user' : '');
  const card = document.createElement('div');
  card.className = 'fcard';
  card.innerHTML =
    (entry.kind === 'image' ? `<img alt="">` : '') +
    `<div><div class="fname"></div>` + (entry.t === 'att' ? `<div class="fsub">📎</div>` : '') + `</div>
     <a class="dl" href="#" download>⬇</a>`;
  card.querySelector('.fname').textContent = entry.name;
  if (entry.kind === 'image'){
    const img = card.querySelector('img');
    idb.get(entry.blobId).then(b => {
      if (b){ img.src = URL.createObjectURL(b); img.onload = scrollChat; }
      else img.remove();
    });
  }
  card.querySelector('a.dl').addEventListener('click', async (ev) => {
    ev.preventDefault();
    const b = await idb.get(entry.blobId);
    if (!b) return;
    const url = URL.createObjectURL(b);
    const tmp = document.createElement('a');
    tmp.href = url; tmp.download = entry.name; tmp.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  });
  holder.appendChild(card);
  chatMsgs.appendChild(holder);
}

function rebuildChat(){
  // rebuild the chat view from the current character's persistent log so
  // anything said during a voice call (and its 🔎 marker) also shows here
  chatMsgs.innerHTML = '';
  for (const e of convLog.slice(-100)){
    if (e.t === 'msg'){
      addBubble(e.role === 'user' ? 'user' : 'mia', e.text);
      if (e.searched){
        const badge = document.createElement('div');
        badge.className = 'bub mia typing';
        badge.textContent = '🔎 Google';
        chatMsgs.appendChild(badge);
      }
    }
    else addSavedCard(e);
  }
  scrollChat();
}

function toggleChat(){
  if (onCall) return;                      // chat only when not calling
  chatOpen = !chatOpen;
  chatEl.classList.toggle('hidden', !chatOpen);
  document.body.classList.toggle('chatmode', chatOpen);
  if (chatOpen){
    rebuildChat();
    chatInput.focus();
    scrollChat();
  } else {
    attachment = null;
    clearAttachmentCard();
  }
}
document.getElementById('chatBtn').addEventListener('click', toggleChat);
document.getElementById('chatAttachBtn').addEventListener('click', () => fileInput.click());

async function sendChat(){
  const text = chatInput.value.trim();
  if (!text || chatBusy) return;
  if (!GEMINI_KEY){ showSetup(); return; }
  chatInput.value = '';
  chatBusy = true;
  isChatContext = true;   // emoji rule applies to text chat only
  if (attachment && attachment.file){
    // keep the attachment visible in the chat with a working download link
    const holder = document.createElement('div');
    holder.className = 'bubcards user';
    const url = URL.createObjectURL(attachment.file);
    const card = document.createElement('div');
    card.className = 'fcard';
    card.innerHTML =
      (attachment.kind === 'image' ? `<img src="${url}" alt="">` : '') +
      `<div><div class="fname"></div><div class="fsub">📎</div></div>
       <a class="dl" download>⬇</a>`;
    card.querySelector('.fname').textContent = attachment.name;
    const a = card.querySelector('a.dl');
    a.href = url; a.download = attachment.name;
    holder.appendChild(card);
    chatMsgs.appendChild(holder);
  }
  addBubble('user', text);
  logMsg('user', text);
  const typing = addBubble('mia typing', '…');
  try {
    const reply = await askMia(text, null);
    typing.remove();
    const holder = chatCardHolder();
    const spoken = processReply(reply, holder);
    if (!holder.children.length) holder.remove();
    if (history.length && history[history.length-1].role === 'model')
      history[history.length-1] = { role:'model', parts:[{ text: spoken }] };
    saveHistory();
    addBubble('mia', spoken);
    if (lastGrounded){
      const badge = document.createElement('div');
      badge.className = 'bub mia typing';
      badge.textContent = '🔎 Google';
      chatMsgs.appendChild(badge);
      scrollChat();
    }
    logMsg('model', spoken, lastGrounded);
    // attachment was consumed by this turn
    attachment = null; clearAttachmentCard();
  } catch(e){
    typing.remove();
    if (e.badKey === 'gemini'){ chatBusy = false; badKeyStop('gemini'); return; }
    if (history.length && history[history.length-1].role === 'user') history.pop();
    saveHistory();
    addBubble('mia', '⚠ ' + (e.message || 'Error'));
  }
  chatBusy = false;
}
document.getElementById('chatSend').addEventListener('click', sendChat);
chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });

/* ---------------- conversation flow ---------------- */
async function handleUserSpeech(text){
  isChatContext = false;   // voice: no emoji rule
  stopListening();
  setState(S.THINKING, T().thinking);
  const frame = camStream ? captureFrame() : null;
  logMsg('user', text);
  try {
    const reply = await askMia(text, frame);
    if (!onCall) return;
    const spoken = processReply(reply);
    // history should hold what was actually said, not raw markers
    if (history.length && history[history.length-1].role === 'model')
      history[history.length-1] = { role:'model', parts:[{ text: spoken }] };
    saveHistory();
    logMsg('model', spoken, lastGrounded);
    await speak(spoken);
  } catch(e){
    if (!onCall) return;
    if (e.badKey === 'gemini'){ badKeyStop('gemini'); return; }
    // drop the failed user turn so history stays clean
    if (history.length && history[history.length-1].role === 'user') history.pop();
    saveHistory();
    hintEl.textContent = '⚠ ' + (e.message || 'Unknown error');
    await speakFallback(T().glitch, 'speaking');
    if (onCall) startListening();
  }
}

function badKeyStop(which){
  endCall(which === 'gemini' ? 'Gemini key rejected — check settings.' : 'ElevenLabs key rejected — check settings.');
  showSetup();
}

/* ---------------- call control ---------------- */
async function startCall(){
  if (!SR){
    hintEl.textContent = T().noSR;
    return;
  }
  if (!GEMINI_KEY || !EL_KEY){ showSetup(); return; }
  isChatContext = false;   // voice call: no emoji rule
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
  } catch(e){ audioCtx = null; }
  onCall = true;
  if (chatOpen) toggleChat();
  document.body.classList.add('oncall');
  callBtn.setAttribute('aria-label','End call');
  hintEl.textContent = T().hintOn;
  stopListening();
  setState(S.THINKING, T().connecting);
  try {
    const cueIdx = history.length;
    const greeting = await askMia(T().greetCue);
    history.splice(cueIdx, 1);         // drop the hidden cue, keep Mia's greeting
    saveHistory();
    logMsg('model', greeting);
    if (onCall) await speak(greeting);
  } catch(e){
    if (e.badKey === 'gemini'){ badKeyStop('gemini'); return; }
    hintEl.textContent = '⚠ ' + (e.message || 'Unknown error');
    if (onCall) { await speakFallback(T().fallbackGreet, 'happy'); }
  }
  if (onCall && state !== S.LISTENING) startListening();
}

function endCall(msg){
  onCall = false;
  stopListening();
  stopCamera();
  attachment = null;
  attachArea.innerHTML = '';
  refreshAttachBtnVisibility();
  if (currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.body.classList.remove('oncall');
  callBtn.setAttribute('aria-label','Start call');
  setState(S.OFF, msg || T().ended);
  hintEl.textContent = T().hintIdle;
  setTimeout(() => { if (!onCall) statusEl.textContent = '\u00a0'; }, 2500);
}

callBtn.addEventListener('click', () => { onCall ? endCall() : startCall(); });
applyPersona();   // sets name text, face colour and voice slot for the saved character
if (!GEMINI_KEY || !EL_KEY) showSetup();
</script>
