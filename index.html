<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>Orbit Weaver</title>
<style>
  :root { --neon:#37f2c3; --neon2:#7a5cff; --hot:#ff5c8a; --bg:#05060f; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color:#eaf2ff; user-select:none; -webkit-user-select:none; touch-action:none;
  }
  #game { position:fixed; inset:0; display:block; }
  .hud {
    position:fixed; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top) + 14px) 18px 0;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; font-variant-numeric:tabular-nums; z-index:2;
  }
  .hud .score { font-size:34px; font-weight:800; letter-spacing:1px; text-shadow:0 0 18px rgba(55,242,195,.6); }
  .hud .best { font-size:13px; opacity:.7; margin-top:2px; }
  .hud .combo { text-align:right; font-size:20px; font-weight:700; color:var(--neon2);
                text-shadow:0 0 16px rgba(122,92,255,.7); min-height:24px; transition:transform .1s; }
  .overlay {
    position:fixed; inset:0; z-index:3; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    background:radial-gradient(circle at 50% 40%, rgba(10,12,30,.55), rgba(5,6,15,.9));
    backdrop-filter:blur(2px);
  }
  .overlay.hidden { display:none; }
  .title { font-size:clamp(40px,13vw,84px); font-weight:900; letter-spacing:2px; line-height:.95;
    background:linear-gradient(120deg,var(--neon),var(--neon2)); -webkit-background-clip:text;
    background-clip:text; color:transparent; text-shadow:0 0 40px rgba(55,242,195,.25); }
  .sub { margin-top:14px; font-size:16px; opacity:.85; max-width:340px; line-height:1.5; }
  .big { font-size:clamp(30px,9vw,52px); font-weight:900; margin-bottom:4px; }
  .cta {
    margin-top:30px; padding:16px 34px; border:1.5px solid var(--neon); border-radius:40px;
    font-size:18px; font-weight:800; letter-spacing:1px; color:var(--neon);
    background:rgba(55,242,195,.08); box-shadow:0 0 30px rgba(55,242,195,.3); pointer-events:none;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:.85} 50%{transform:scale(1.06);opacity:1} }
  .stat { margin-top:18px; font-size:15px; opacity:.7; }
  .stat b { color:var(--neon); opacity:1; }
  @media (prefers-reduced-motion: reduce){ .cta{animation:none} }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div><div class="score" id="score">0</div><div class="best" id="best">BEST 0</div></div>
  <div class="combo" id="combo"></div>
</div>

<div class="overlay" id="startScreen">
  <div class="title">ORBIT<br>WEAVER</div>
  <div class="sub">You're locked in a planet's gravity. <b>Tap anywhere</b> to slingshot off — time it so you fall into the next planet's pull. Grab energy orbs, chain combos, don't drift into the void.</div>
  <div class="cta">TAP TO PLAY</div>
</div>

<div class="overlay hidden" id="overScreen">
  <div class="big">DRIFTED AWAY</div>
  <div class="title" id="finalScore" style="font-size:clamp(48px,18vw,120px)">0</div>
  <div class="stat" id="newBest" style="display:none;color:var(--neon);letter-spacing:3px;font-weight:800">★ NEW BEST ★</div>
  <div class="stat">Best <b id="finalBest">0</b> · Orbs <b id="finalOrbs">0</b></div>
  <div class="cta">TAP TO RETRY</div>
</div>

<script>
(() => {
  "use strict";
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const scoreEl=$('score'), bestEl=$('best'), comboEl=$('combo');
  const startScreen=$('startScreen'), overScreen=$('overScreen');

  let W=0, H=0, dpr=1;
  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.floor(W*dpr); cv.height = Math.floor(H*dpr);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const rand=(a,b)=>a+Math.random()*(b-a);
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};

  let best = +(localStorage.getItem('orbitweaver_best')||0);
  bestEl.textContent = 'BEST '+best;

  // ---- game state ----
  let state='start';
  let planets=[], orbs=[], asteroids=[], stars=[], particles=[];
  let camX=0, ship, score, orbsCollected, combo, elapsed, lastPlanetX, shake;

  // ---- sound (WebAudio; created lazily on first user gesture) ----
  let actx=null;
  function sfx(freq, dur=0.12, type='sine', vol=0.14){
    try{
      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended') actx.resume();
      const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.setValueAtTime(freq,t);
      o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*0.55), t+dur);
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur);
    }catch(e){}
  }
  function haptic(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

  function makeStars(){
    stars=[];
    for(let i=0;i<90;i++) stars.push({x:rand(0,W), y:rand(0,H), z:rand(0.2,1), s:rand(0.6,1.8)});
  }
  makeStars();

  function difficulty(){ return Math.min(elapsed/45, 1); } // 0..1 over 45s
  function gapFor(){ return rand(210,260) + difficulty()*140; }
  function planetRadius(){ return rand(26,46) - difficulty()*8; }

  function addPlanet(x){
    const r = planetRadius();
    const p = { x, y: rand(H*0.24, H*0.76), r, gravR: r+rand(78,104), captured:false,
                hue: Math.random()<0.5 ? '55,242,195' : '122,92,255' };
    planets.push(p);
    // orb in the gap before this planet
    if(planets.length>1){
      const prev = planets[planets.length-2];
      const mid=(prev.x+x)/2;
      orbs.push({ x:mid + rand(-30,30), y:rand(H*0.25,H*0.75), r:11, taken:false, t:Math.random()*6 });
      // hazards: appear once past the early planets, more likely as difficulty climbs
      if(planets.length>3 && Math.random() < 0.32 + difficulty()*0.45){
        asteroids.push({ x:mid + rand(-40,40), y:rand(H*0.14, H*0.86), r:rand(13,21),
                         vy:rand(-42,42)*(0.5+difficulty()), seed:Math.random()*6.28 });
      }
    }
    lastPlanetX = x;
  }

  function start(){
    planets=[]; orbs=[]; asteroids=[]; particles=[]; camX=0;
    score=0; orbsCollected=0; combo=0; elapsed=0; shake=0; lastPlanetX=0;
    addPlanet(W*0.4);
    for(let i=0;i<4;i++) addPlanet(lastPlanetX+gapFor());
    const p0=planets[0];
    ship={ x:p0.x, y:p0.y-p0.r-26, vx:0, vy:0, orbiting:p0, dir:1,
           angle:-Math.PI/2, orbitR:p0.r+26, angVel:2.15, trail:[] };
    p0.captured=true;
    state='playing';
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    comboEl.textContent='';
  }

  function gameOver(){
    state='over';
    sfx(150,0.5,'sawtooth',0.22);
    haptic([30,40,30]);
    for(let i=0;i<26;i++) particles.push({x:ship.x-camX, y:ship.y, vx:rand(-220,220), vy:rand(-220,220),
      life:1, col:'55,242,195'});
    shake=16;
    const isBest = score>best;
    if(isBest){ best=score; localStorage.setItem('orbitweaver_best', best); }
    $('finalScore').textContent=score;
    $('finalBest').textContent=best;
    $('finalOrbs').textContent=orbsCollected;
    $('newBest').style.display = (isBest && score>0) ? 'block' : 'none';
    bestEl.textContent='BEST '+best;
    setTimeout(()=>overScreen.classList.remove('hidden'), 480);
  }

  function tap(){
    if(state==='start'){ start(); return; }
    if(state==='over'){ if(overScreen.classList.contains('hidden')) return; start(); return; }
    if(state==='playing' && ship.orbiting){
      // release along the tangent
      const p=ship.orbiting;
      const rx=Math.cos(ship.angle), ry=Math.sin(ship.angle);
      const tx=-ry*ship.dir, ty=rx*ship.dir;
      const speed = 250 + difficulty()*140;
      ship.vx=tx*speed; ship.vy=ty*speed;
      ship.orbiting=null;
      burst(ship.x-camX, ship.y, p.hue, 8);
      sfx(520,0.1,'triangle',0.12);
    }
  }
  function burst(sx,sy,col,n){
    for(let i=0;i<n;i++) particles.push({x:sx,y:sy,vx:rand(-120,120),vy:rand(-120,120),life:1,col});
  }

  window.addEventListener('pointerdown', e=>{ e.preventDefault(); tap(); }, {passive:false});
  window.addEventListener('keydown', e=>{ if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();tap();} });

  function update(dt){
    if(state!=='playing') return;
    elapsed+=dt;
    const s=ship;

    if(s.orbiting){
      const p=s.orbiting;
      s.angle += s.dir*s.angVel*dt;
      s.x = p.x + Math.cos(s.angle)*s.orbitR;
      s.y = p.y + Math.sin(s.angle)*s.orbitR;
    } else {
      s.x += s.vx*dt; s.y += s.vy*dt;
      // capture into the next uncaptured planet
      for(const p of planets){
        if(p.captured) continue;
        if(dist2(s.x,s.y,p.x,p.y) < p.gravR*p.gravR){
          const d=Math.hypot(s.x-p.x, s.y-p.y);
          s.orbiting=p; p.captured=true;
          s.orbitR=clamp(d, p.r+16, p.gravR);
          s.angle=Math.atan2(s.y-p.y, s.x-p.x);
          // keep spinning the way we arrived
          const cross=(s.x-p.x)*s.vy-(s.y-p.y)*s.vx;
          s.dir = cross>0?1:-1;
          s.angVel = 1.9 + difficulty()*1.1;
          combo++;
          score += 5 + combo;
          shake=Math.min(shake+3,10);
          burst(s.x-camX, s.y, p.hue, 10);
          bumpCombo();
          sfx(680+combo*30, 0.14, 'sine', 0.13);
          haptic(12);
          break;
        }
      }
      // died: drifted off the top/bottom, or fell behind the world
      if(s.y< -60 || s.y> H+60 || s.x < camX-40){ gameOver(); return; }
    }

    // hazards: drift vertically, bounce at edges, deadly on contact (either state)
    for(const a of asteroids){
      a.y += a.vy*dt;
      if(a.y < a.r || a.y > H-a.r){ a.vy*=-1; a.y=clamp(a.y, a.r, H-a.r); }
      if(dist2(s.x,s.y,a.x,a.y) < (a.r+7)*(a.r+7)){ gameOver(); return; }
    }

    // trail
    s.trail.push({x:s.x, y:s.y}); if(s.trail.length>16) s.trail.shift();

    // camera only moves forward
    const target = s.x - W*0.4;
    camX = Math.max(camX, target);
    score = Math.max(score, Math.floor(camX/40) + orbsCollected*3);

    // orbs
    for(const o of orbs){
      if(o.taken) continue; o.t+=dt;
      if(dist2(s.x,s.y,o.x,o.y) < (o.r+16)*(o.r+16)){
        o.taken=true; orbsCollected++; score+=10+combo*2;
        burst(o.x-camX, o.y, '55,242,195', 12);
        sfx(880,0.09,'square',0.1);
      }
    }

    // generate ahead, cull behind
    while(lastPlanetX < camX + W*1.6) addPlanet(lastPlanetX+gapFor());
    planets   = planets.filter(p=>p.x > camX-120);
    orbs      = orbs.filter(o=>o.x > camX-120);
    asteroids = asteroids.filter(a=>a.x > camX-120);

    // particles
    for(const pt of particles){ pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vx*=0.94; pt.vy*=0.94; pt.life-=dt*1.6; }
    particles = particles.filter(p=>p.life>0);
    if(shake>0) shake=Math.max(0, shake-dt*40);

    scoreEl.textContent=score;
  }

  let comboTimer=null;
  function bumpCombo(){
    if(combo<2){ comboEl.textContent=''; return; }
    comboEl.textContent='×'+combo;
    comboEl.style.transform='scale(1.4)';
    clearTimeout(comboTimer);
    comboTimer=setTimeout(()=>comboEl.style.transform='scale(1)', 90);
  }

  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    // bg
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#080a1a'); g.addColorStop(1,'#04050d');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    const sx = shake>0 ? rand(-shake,shake):0, sy = shake>0 ? rand(-shake,shake):0;
    ctx.save(); ctx.translate(sx,sy);

    // parallax stars
    for(const st of stars){
      const x=((st.x - camX*st.z*0.25)%W+W)%W;
      ctx.globalAlpha=0.35+st.z*0.5; ctx.fillStyle='#9fb4ff';
      ctx.fillRect(x, st.y, st.s, st.s);
    }
    ctx.globalAlpha=1;

    // planets
    for(const p of planets){
      const x=p.x-camX;
      if(x<-140||x>W+140) continue;
      // gravity ring
      ctx.beginPath(); ctx.arc(x,p.y,p.gravR,0,7);
      ctx.strokeStyle='rgba('+p.hue+',0.12)'; ctx.lineWidth=1.5; ctx.stroke();
      // glow
      const rg=ctx.createRadialGradient(x,p.y,p.r*0.3,x,p.y,p.r*1.8);
      rg.addColorStop(0,'rgba('+p.hue+',0.9)'); rg.addColorStop(0.5,'rgba('+p.hue+',0.35)');
      rg.addColorStop(1,'rgba('+p.hue+',0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(x,p.y,p.r*1.8,0,7); ctx.fill();
      ctx.fillStyle='#0b0e22'; ctx.beginPath(); ctx.arc(x,p.y,p.r,0,7); ctx.fill();
      ctx.strokeStyle='rgba('+p.hue+',0.9)'; ctx.lineWidth=2.5; ctx.stroke();
    }

    // asteroids
    for(const a of asteroids){
      const ax=a.x-camX; if(ax<-60||ax>W+60) continue;
      ctx.save(); ctx.translate(ax,a.y); ctx.rotate(a.seed + elapsed*0.4);
      ctx.shadowColor='rgba(255,92,138,0.6)'; ctx.shadowBlur=12;
      ctx.fillStyle='#241019'; ctx.strokeStyle='rgba(255,92,138,0.95)'; ctx.lineWidth=2;
      ctx.beginPath();
      const n=8;
      for(let i=0;i<n;i++){
        const ang=i/n*Math.PI*2, rr=a.r*(0.72+ (Math.sin(a.seed+i*2.3)*0.5+0.5)*0.28);
        const px=Math.cos(ang)*rr, py=Math.sin(ang)*rr;
        i? ctx.lineTo(px,py) : ctx.moveTo(px,py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore(); ctx.shadowBlur=0;
    }

    // orbs
    for(const o of orbs){
      if(o.taken) continue; const x=o.x-camX; if(x<-40||x>W+40) continue;
      const pulse=1+Math.sin(o.t*4)*0.18;
      const rg=ctx.createRadialGradient(x,o.y,0,x,o.y,o.r*2.4*pulse);
      rg.addColorStop(0,'rgba(180,255,235,1)'); rg.addColorStop(0.4,'rgba(55,242,195,0.8)');
      rg.addColorStop(1,'rgba(55,242,195,0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(x,o.y,o.r*2.4*pulse,0,7); ctx.fill();
    }

    // ship + trail
    if(state==='playing'||state==='over'){
      const s=ship;
      for(let i=0;i<s.trail.length;i++){
        const t=s.trail[i], a=i/s.trail.length;
        ctx.globalAlpha=a*0.5; ctx.fillStyle='#37f2c3';
        ctx.beginPath(); ctx.arc(t.x-camX, t.y, a*5, 0, 7); ctx.fill();
      }
      ctx.globalAlpha=1;
      if(state==='playing'){
        let ang;
        if(s.orbiting) ang=s.angle + s.dir*Math.PI/2; else ang=Math.atan2(s.vy,s.vx);
        const x=s.x-camX;
        ctx.save(); ctx.translate(x,s.y); ctx.rotate(ang);
        ctx.shadowColor='#37f2c3'; ctx.shadowBlur=18; ctx.fillStyle='#eafff8';
        ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(-8,7); ctx.lineTo(-4,0); ctx.lineTo(-8,-7); ctx.closePath(); ctx.fill();
        ctx.restore(); ctx.shadowBlur=0;
      }
    }

    // particles
    for(const pt of particles){
      ctx.globalAlpha=Math.max(0,pt.life); ctx.fillStyle='rgba('+pt.col+',1)';
      ctx.beginPath(); ctx.arc(pt.x,pt.y,3*pt.life+0.5,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.restore();
  }

  let last=performance.now();
  function loop(now){
    const dt=Math.min((now-last)/1000, 0.05); last=now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
