<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12161b">
<title>Fives</title>
<style>
  :root{
    --bg:#12161b; --panel:#1b2129; --line:#2b333d; --tile:#212a33;
    --green:#3ec46d; --amber:#e5a63b; --slate:#3a4550; --ink:#eef3f7; --muted:#8b98a6;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
    display:flex; flex-direction:column; align-items:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  header{ width:100%; max-width:460px; display:flex; align-items:center; justify-content:center;
    gap:8px; padding:18px 16px 10px; border-bottom:1px solid var(--line); }
  .logo{ font-size:30px; font-weight:900; letter-spacing:8px; padding-left:8px;
    background:linear-gradient(120deg,var(--green),#bfe8cf); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag{ position:absolute; right:18px; top:24px; font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }

  main{ flex:1 1 auto; width:100%; max-width:460px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:18px; }
  .board{ display:grid; grid-template-rows:repeat(6,1fr); gap:6px; }
  .brow{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .tile{ width:52px; height:52px; border:2px solid var(--line); border-radius:8px; background:var(--tile);
    display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; text-transform:uppercase; }
  .note{ font-size:13px; color:var(--muted); text-align:center; line-height:1.5; max-width:280px; }
  @media (max-height:680px){ .tile{ width:46px; height:46px; } }
</style>
</head>
<body>
  <header>
    <span class="logo">FIVES</span>
    <span class="tag">guess the word</span>
  </header>

  <main>
    <div class="board" id="board"></div>
    <div class="note">Guess the five-letter word in six tries. Board, keyboard, and
      scoring are built across this week.</div>
  </main>

  <script>
  "use strict";
  (function(){
    function vh(){ document.body.style.height = window.innerHeight + 'px'; }
    window.addEventListener('resize', vh); vh();

    // Skeleton only — keyboard input, word list, guess evaluation, and the title
    // screen + menu land Tue–Thu per PLAN.md. For now just render the empty 6x5
    // board so the layout is visible and responsive on mobile.
    const board = document.getElementById('board');
    for(let r=0;r<6;r++){
      const row=document.createElement('div'); row.className='brow';
      for(let c=0;c<5;c++){ const t=document.createElement('div'); t.className='tile'; row.appendChild(t); }
      board.appendChild(row);
    }
  })();
  </script>
</body>
</html>
