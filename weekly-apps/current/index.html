<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e24">
<title>Skyline</title>
<style>
  :root { --bg:#0a0e24; --cyan:#38e8ff; --magenta:#ff5cc8; --ink:#eaf2ff; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--bg); }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         color:var(--ink); user-select:none; -webkit-user-select:none; touch-action:none; }
  #game { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  "use strict";
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  let W=0, H=0, dpr=1;
  const rand=(a,b)=>a+Math.random()*(b-a);
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const now=()=>performance.now();

  let BH=36, targetScreenY=0;
  function metrics(){ BH=Math.max(28,Math.round(H*0.045)); targetScreenY=H*0.66; }
  const screenY = (wy) => targetScreenY - (wy - camY);

  let state='play';                       // 'play' | 'over'
  let tower=[], slab=null, camY=0, camTarget=0, falling=[], debris=[];
  let score=0, combo=0, perfectFlash=null, overlayAt=0;
  let bestH = +(localStorage.getItem('skyline_best_h')||0);
  let bestScore = +(localStorage.getItem('skyline_best_score')||0);

  function reset(){
    metrics();
    const w=Math.min(W*0.52,260);
    tower=[{ x:(W-w)/2, w, seed:0 }];
    camY=camTarget=tower.length*BH;
    falling=[]; debris=[]; score=0; combo=0; perfectFlash=null;
    spawnSlab(); state='play';
  }
  function spawnSlab(){
    const top=tower[tower.length-1], level=tower.length, fromLeft=Math.random()<0.5;
    slab={ x: fromLeft?W*0.06:W*0.94-top.w, w:top.w, level, dir:fromLeft?1:-1,
           speed: clamp(W*0.55,190,430)+level*3 };
  }

  const PERFECT = () => Math.max(6, W*0.02);
  function drop(){
    const top=tower[tower.length-1];
    // perfect drop: near-exact alignment keeps full width and builds a combo
    if(Math.abs(slab.x-top.x) <= PERFECT()){
      tower.push({ x:top.x, w:top.w, seed:tower.length });
      combo++; score += 1 + combo;
      perfectFlash={ x:top.x+top.w/2, y:screenY(slab.level*BH+BH/2), t:1 };
    } else {
      const l=Math.max(top.x,slab.x), r=Math.min(top.x+top.w,slab.x+slab.w), overlap=r-l;
      if(overlap<=2){ gameOver(); return; }
      if(slab.x<l) addFalling(slab.x,l-slab.x,slab.level);
      if(slab.x+slab.w>r) addFalling(r,(slab.x+slab.w)-r,slab.level);
      tower.push({ x:l, w:overlap, seed:tower.length });
      combo=0; score += 1;
    }
    camTarget=tower.length*BH;
    spawnSlab();
  }
  function addFalling(x,w,level){ falling.push({ x,w,wy:level*BH,vy:-20,vx:rand(-30,30)*(x<W/2?-1:1),life:1,seed:level }); }

  function gameOver(){
    state='over';
    // collapse: turn every visible floor into tumbling debris (screen space)
    for(let i=0;i<tower.length;i++){
      const b=tower[i], yTop=screenY(i*BH+BH);
      if(yTop>H+BH||yTop<-BH*2) continue;
      debris.push({ x:b.x, y:yTop, w:b.w, h:BH, vx:rand(-140,140), vy:rand(-260,-40),
                    rot:0, vrot:rand(-5,5), col:floorColor(i) });
    }
    const h=tower.length-1;
    if(h>bestH){ bestH=h; localStorage.setItem('skyline_best_h',bestH); }
    if(score>bestScore){ bestScore=score; localStorage.setItem('skyline_best_score',bestScore); }
    overlayAt=now()+750;
  }

  cv.addEventListener('pointerdown', e=>{ e.preventDefault();
    if(state==='play') drop(); else if(now()>overlayAt) reset();
  }, {passive:false});

  function floorColor(i){
    const t=(i*23%100)/100, c1=[56,232,255], c2=[255,92,200];
    return 'rgb('+Math.round(c1[0]+(c2[0]-c1[0])*t)+','+Math.round(c1[1]+(c2[1]-c1[1])*t)+','+Math.round(c1[2]+(c2[2]-c1[2])*t)+')';
  }
  // block with lit windows
  function block(x,wy,w,col,seed){
    const yTop=screenY(wy+BH);
    if(yTop>H+BH||yTop<-BH*2) return;
    paintBlock(x,yTop,w,col,seed);
  }
  function paintBlock(x,yTop,w,col,seed){
    ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=14;
    ctx.fillRect(x,yTop,w,BH); ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(x,yTop,w,3);   // top edge
    // lit windows
    const cols=Math.max(2,Math.floor(w/16)), cw=w/cols;
    for(let c=0;c<cols;c++){
      const lit=((seed*7+c*13)%5)!==0;
      ctx.fillStyle = lit?'rgba(255,224,140,0.8)':'rgba(0,0,0,0.22)';
      ctx.fillRect(x+c*cw+cw*0.30, yTop+BH*0.34, cw*0.40, BH*0.34);
    }
  }

  let last=performance.now();
  function frame(t){
    const dt=Math.min((t-last)/1000,0.05); last=t;
    if(state==='play'){
      slab.x += slab.dir*slab.speed*dt;
      const minX=W*0.04, maxX=W*0.96-slab.w;
      if(slab.x<minX){ slab.x=minX; slab.dir=1; }
      if(slab.x>maxX){ slab.x=maxX; slab.dir=-1; }
    }
    camY += (camTarget-camY)*Math.min(1,dt*9);
    for(const f of falling){ f.vy-=900*dt; f.wy+=f.vy*dt; f.x+=f.vx*dt; f.life-=dt*0.8; }
    falling=falling.filter(f=>f.life>0 && screenY(f.wy)<H+80);
    for(const d of debris){ d.vy+=1400*dt; d.x+=d.vx*dt; d.y+=d.vy*dt; d.rot+=d.vrot*dt; }
    debris=debris.filter(d=>d.y<H+120);
    if(perfectFlash){ perfectFlash.t-=dt*2.2; if(perfectFlash.t<=0) perfectFlash=null; }
    draw();
    requestAnimationFrame(frame);
  }

  function draw(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0c1130'); g.addColorStop(1,'#070915');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    if(state==='play'){
      for(let i=0;i<tower.length;i++) block(tower[i].x,i*BH,tower[i].w,floorColor(i),tower[i].seed);
      for(const f of falling){ ctx.globalAlpha=Math.max(0,f.life);
        block(f.x,f.wy,f.w,floorColor(f.seed),f.seed); ctx.globalAlpha=1; }
      if(slab) block(slab.x,slab.level*BH,slab.w,floorColor(slab.level),slab.level);
      if(perfectFlash){
        ctx.globalAlpha=Math.max(0,perfectFlash.t); ctx.strokeStyle='#fff';
        ctx.lineWidth=2; ctx.beginPath();
        ctx.arc(perfectFlash.x,perfectFlash.y,(1-perfectFlash.t)*46+8,0,7); ctx.stroke();
        ctx.globalAlpha=1;
      }
    } else {
      // collapse debris (screen space, rotating)
      for(const d of debris){
        ctx.save(); ctx.translate(d.x+d.w/2,d.y+d.h/2); ctx.rotate(d.rot);
        paintBlock(-d.w/2,-d.h/2,d.w,d.col,0); ctx.restore();
      }
    }

    // HUD
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillStyle='rgba(234,242,255,0.9)'; ctx.font='800 30px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText((tower.length-1)+'', 22, 24);
    ctx.fillStyle='rgba(56,232,255,0.85)'; ctx.font='700 15px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText('score '+score, 24, 60);
    if(combo>1){ ctx.fillStyle='rgba(255,92,200,0.95)'; ctx.textAlign='right';
      ctx.fillText('combo x'+combo, W-24, 26); }
    ctx.textAlign='right'; ctx.fillStyle='rgba(234,242,255,0.45)'; ctx.font='600 13px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText('best '+bestH, W-24, combo>1?48:26);

    if(state==='over' && now()>overlayAt){
      ctx.fillStyle='rgba(6,9,20,0.72)'; ctx.fillRect(0,0,W,H);
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#ff5cc8'; ctx.font='800 '+Math.min(W*0.12,54)+'px -apple-system,Segoe UI,Roboto,sans-serif';
      ctx.fillText('TOPPLED', W/2, H*0.40);
      ctx.fillStyle='rgba(234,242,255,0.9)'; ctx.font='600 20px -apple-system,Segoe UI,Roboto,sans-serif';
      ctx.fillText('height '+(tower.length-1)+'  ·  score '+score, W/2, H*0.48);
      ctx.fillStyle='rgba(234,242,255,0.5)'; ctx.font='600 15px -apple-system,Segoe UI,Roboto,sans-serif';
      ctx.fillText('best height '+bestH+'  ·  best score '+bestScore, W/2, H*0.535);
      ctx.fillStyle='rgba(56,232,255,0.9)'; ctx.font='700 18px -apple-system,Segoe UI,Roboto,sans-serif';
      ctx.fillText('tap to rebuild', W/2, H*0.61);
    }
  }

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2.5);
    W=window.innerWidth; H=window.innerHeight;
    cv.width=Math.floor(W*dpr); cv.height=Math.floor(H*dpr);
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0); metrics();
  }
  window.addEventListener('resize', resize);

  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
