<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0710">
<title>Untangle</title>
<style>
  :root { --bg:#0b0710; --amber:#ffb347; --violet:#a06bff; --ink:#f4ecff; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--bg); }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         color:var(--ink); user-select:none; -webkit-user-select:none; touch-action:none; }
  #game { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  "use strict";
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  let W=0, H=0, dpr=1;

  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W*dpr); cv.height = Math.floor(H*dpr);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }
  window.addEventListener('resize', resize);

  // Skeleton only — gameplay (nodes, edges, dragging, crossing detection) lands
  // across Tue–Thu per PLAN.md. For now just confirm the canvas boots and is
  // mobile-sized/responsive.
  function draw(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#120a1a'); g.addColorStop(1,'#080510');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#ffb347';
    ctx.font='800 '+Math.min(W*0.13,72)+'px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText('UNTANGLE', W/2, H*0.42);
    ctx.fillStyle='rgba(244,236,255,0.55)';
    ctx.font='500 '+Math.min(W*0.045,18)+'px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText('drag the nodes so no lines cross', W/2, H*0.52);
    ctx.fillStyle='rgba(160,107,255,0.6)';
    ctx.font='600 14px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText('· coming this week ·', W/2, H*0.58);
  }

  resize();
})();
</script>
</body>
</html>
