<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0710">
<title>Untangle</title>
<style>
  :root { --bg:#0b0710; --amber:#ffb347; --violet:#a06bff; --ink:#f4ecff; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--bg); }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         color:var(--ink); user-select:none; -webkit-user-select:none; touch-action:none; }
  #game { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  "use strict";
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  let W=0, H=0, dpr=1;
  const rand=(a,b)=>a+Math.random()*(b-a);

  // ---- layout margins (top leaves room for a future HUD) ----
  const M = { top:96, side:44, bottom:64 };

  // ---- level model ------------------------------------------------------
  // Line-arrangement generator: N random lines; their pairwise intersections
  // are the nodes; consecutive intersections along each line are edges. A line
  // arrangement is always planar, so the intersection points themselves are a
  // guaranteed crossing-free solution. We keep those as solved coords, then
  // scramble node positions for the puzzle.
  let nodes=[], edges=[];

  function genLevel(numLines){
    const lines=[];
    for(let i=0;i<numLines;i++){
      const ang = rand(0, Math.PI);
      lines.push({ a:Math.cos(ang), b:Math.sin(ang), c:rand(-1,1), pts:[] });
    }
    const N=[];
    for(let i=0;i<numLines;i++) for(let j=i+1;j<numLines;j++){
      const L1=lines[i], L2=lines[j];
      const det = L1.a*L2.b - L2.a*L1.b;
      if(Math.abs(det) < 1e-6) continue;              // parallel — skip
      const x = (L1.c*L2.b - L2.c*L1.b)/det;
      const y = (L1.a*L2.c - L2.a*L1.c)/det;
      const idx = N.length;
      N.push({ solX:x, solY:y, x:0, y:0 });
      L1.pts.push({ idx, t: x*(-L1.b) + y*L1.a });    // param along line dir (-b,a)
      L2.pts.push({ idx, t: x*(-L2.b) + y*L2.a });
    }
    const seen=new Set(), E=[];
    for(const L of lines){
      L.pts.sort((p,q)=>p.t-q.t);
      for(let k=0;k+1<L.pts.length;k++){
        const a=L.pts[k].idx, b=L.pts[k+1].idx;
        const key = a<b ? a+'-'+b : b+'-'+a;
        if(!seen.has(key)){ seen.add(key); E.push([a,b]); }
      }
    }
    nodes=N; edges=E;
    scramble();
  }

  // Scatter node positions randomly within the play area (the puzzle start).
  function scramble(){
    const x0=M.side, x1=W-M.side, y0=M.top, y1=H-M.bottom;
    for(const n of nodes){ n.x = rand(x0,x1); n.y = rand(y0,y1); }
  }

  // ---- render -----------------------------------------------------------
  function draw(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#120a1a'); g.addColorStop(1,'#080510');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // edges
    ctx.lineCap='round';
    for(const [i,j] of edges){
      const a=nodes[i], b=nodes[j];
      ctx.strokeStyle='rgba(160,107,255,0.5)'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    // nodes
    for(const n of nodes){
      const rg=ctx.createRadialGradient(n.x,n.y,1,n.x,n.y,18);
      rg.addColorStop(0,'rgba(255,179,71,1)'); rg.addColorStop(0.5,'rgba(255,179,71,0.35)');
      rg.addColorStop(1,'rgba(255,179,71,0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(n.x,n.y,18,0,7); ctx.fill();
      ctx.fillStyle='#2a1c0a'; ctx.beginPath(); ctx.arc(n.x,n.y,9,0,7); ctx.fill();
      ctx.strokeStyle='#ffb347'; ctx.lineWidth=2.5; ctx.stroke();
    }
  }

  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W*dpr); cv.height = Math.floor(H*dpr);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(nodes.length) scramble();   // re-scatter to fit new bounds
    draw();
  }
  window.addEventListener('resize', resize);

  // Boot: generate the first level and render it. (Dragging + crossing
  // detection + solve/advance land Wednesday; polish Thursday.)
  genLevel(4);
  resize();
})();
</script>
</body>
</html>
