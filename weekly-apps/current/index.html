<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0710">
<title>Untangle</title>
<style>
  :root { --bg:#0b0710; --amber:#ffb347; --violet:#a06bff; --ink:#f4ecff; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--bg); }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         color:var(--ink); user-select:none; -webkit-user-select:none; touch-action:none; }
  #game { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  "use strict";
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  let W=0, H=0, dpr=1;
  const rand=(a,b)=>a+Math.random()*(b-a);
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;

  const M = { top:96, side:44, bottom:64 };

  let nodes=[], edges=[];
  let level=1, moves=0, solved=false, flash=0;

  // ---- level model (line-arrangement → guaranteed planar / solvable) ----
  function genLevel(numLines){
    for(let attempt=0; attempt<24; attempt++){
      buildArrangement(numLines);
      scramble();
      if(crossings().count > 0) break;   // want a genuinely tangled start
    }
  }
  function buildArrangement(numLines){
    const lines=[];
    for(let i=0;i<numLines;i++){
      const ang = rand(0, Math.PI);
      lines.push({ a:Math.cos(ang), b:Math.sin(ang), c:rand(-1,1), pts:[] });
    }
    const N=[];
    for(let i=0;i<numLines;i++) for(let j=i+1;j<numLines;j++){
      const L1=lines[i], L2=lines[j];
      const det = L1.a*L2.b - L2.a*L1.b;
      if(Math.abs(det) < 1e-6) continue;
      const x = (L1.c*L2.b - L2.c*L1.b)/det;
      const y = (L1.a*L2.c - L2.a*L1.c)/det;
      const idx = N.length;
      N.push({ x:0, y:0 });
      L1.pts.push({ idx, t: x*(-L1.b) + y*L1.a });
      L2.pts.push({ idx, t: x*(-L2.b) + y*L2.a });
    }
    const seen=new Set(), E=[];
    for(const L of lines){
      L.pts.sort((p,q)=>p.t-q.t);
      for(let k=0;k+1<L.pts.length;k++){
        const a=L.pts[k].idx, b=L.pts[k+1].idx;
        const key = a<b ? a+'-'+b : b+'-'+a;
        if(!seen.has(key)){ seen.add(key); E.push([a,b]); }
      }
    }
    nodes=N; edges=E;
  }
  function scramble(){
    const x0=M.side, x1=W-M.side, y0=M.top, y1=H-M.bottom;
    for(const n of nodes){ n.x = rand(x0,x1); n.y = rand(y0,y1); }
  }

  // ---- crossing detection ----
  function ccw(ax,ay,bx,by,cx,cy){ return (cy-ay)*(bx-ax) > (by-ay)*(cx-ax); }
  function segInt(a,b,c,d){
    return ccw(a.x,a.y,c.x,c.y,d.x,d.y)!==ccw(b.x,b.y,c.x,c.y,d.x,d.y) &&
           ccw(a.x,a.y,b.x,b.y,c.x,c.y)!==ccw(a.x,a.y,b.x,b.y,d.x,d.y);
  }
  function crossings(){
    const bad=new Set(); let count=0;
    for(let i=0;i<edges.length;i++) for(let j=i+1;j<edges.length;j++){
      const [a,b]=edges[i], [c,d]=edges[j];
      if(a===c||a===d||b===c||b===d) continue;   // share a node — not a crossing
      if(segInt(nodes[a],nodes[b],nodes[c],nodes[d])){ bad.add(i); bad.add(j); count++; }
    }
    return { bad, count };
  }

  // ---- input (drag a node) ----
  let drag=-1, dragMoved=false;
  function pick(x,y){
    let best=-1, bd=28*28;
    for(let i=0;i<nodes.length;i++){
      const dx=nodes[i].x-x, dy=nodes[i].y-y, d=dx*dx+dy*dy;
      if(d<bd){ bd=d; best=i; }
    }
    return best;
  }
  cv.addEventListener('pointerdown', e=>{
    e.preventDefault();
    drag=pick(e.clientX,e.clientY); dragMoved=false;
    if(drag>=0 && cv.setPointerCapture){ try{ cv.setPointerCapture(e.pointerId); }catch(_){} }
  }, {passive:false});
  cv.addEventListener('pointermove', e=>{
    if(drag<0) return; e.preventDefault();
    nodes[drag].x = clamp(e.clientX, M.side, W-M.side);
    nodes[drag].y = clamp(e.clientY, M.top,  H-M.bottom);
    dragMoved=true;
  }, {passive:false});
  function endDrag(){ if(drag>=0 && dragMoved) moves++; drag=-1; }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  // ---- level advance ----
  function nextLevel(){ level++; moves=0; genLevel(Math.min(4+(level-1),7)); }

  // ---- render loop ----
  function draw(){
    const cr = crossings();

    // solved → brief flash, then advance
    if(!solved && drag<0 && cr.count===0){
      solved=true; flash=1;
      setTimeout(()=>{ nextLevel(); solved=false; }, 850);
    }
    if(flash>0) flash=Math.max(0, flash-0.03);

    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#120a1a'); g.addColorStop(1,'#080510');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // edges — red if crossing something, violet if clean; green wash on solve
    ctx.lineCap='round';
    for(let i=0;i<edges.length;i++){
      const [a,b]=edges[i];
      const bad = cr.bad.has(i);
      ctx.strokeStyle = flash>0 ? 'rgba(120,255,180,'+(0.5+flash*0.4)+')'
                        : bad ? 'rgba(255,90,110,0.85)' : 'rgba(160,107,255,0.5)';
      ctx.lineWidth = bad ? 3 : 2.5;
      ctx.beginPath(); ctx.moveTo(nodes[a].x,nodes[a].y); ctx.lineTo(nodes[b].x,nodes[b].y); ctx.stroke();
    }
    // nodes
    for(let i=0;i<nodes.length;i++){
      const n=nodes[i], big = i===drag;
      const R = big?22:18;
      const rg=ctx.createRadialGradient(n.x,n.y,1,n.x,n.y,R);
      rg.addColorStop(0,'rgba(255,179,71,1)'); rg.addColorStop(0.5,'rgba(255,179,71,0.35)');
      rg.addColorStop(1,'rgba(255,179,71,0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(n.x,n.y,R,0,7); ctx.fill();
      ctx.fillStyle='#2a1c0a'; ctx.beginPath(); ctx.arc(n.x,n.y,big?11:9,0,7); ctx.fill();
      ctx.strokeStyle='#ffb347'; ctx.lineWidth=2.5; ctx.stroke();
    }
    // minimal status (full HUD is Thursday)
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(244,236,255,0.8)';
    ctx.font='700 18px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText('Level '+level, M.side, M.top*0.5);
    ctx.textAlign='right'; ctx.fillStyle='rgba(244,236,255,0.5)';
    ctx.font='600 14px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText(cr.count===0?'untangled!':cr.count+' crossing'+(cr.count>1?'s':''), W-M.side, M.top*0.5);

    requestAnimationFrame(draw);
  }

  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W*dpr); cv.height = Math.floor(H*dpr);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);

  resize();
  genLevel(4);
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
