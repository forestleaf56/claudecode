<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12161b">
<title>Fives</title>
<style>
  :root{
    --bg:#12161b; --panel:#1b2129; --line:#2b333d; --tile:#212a33;
    --green:#3ec46d; --amber:#e5a63b; --slate:#3a4550; --ink:#eef3f7; --muted:#8b98a6;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
    display:flex; flex-direction:column; align-items:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  header{ position:relative; width:100%; max-width:460px; display:flex; align-items:center; justify-content:center;
    padding:16px; border-bottom:1px solid var(--line); }
  .logo{ font-size:28px; font-weight:900; letter-spacing:8px; padding-left:8px;
    background:linear-gradient(120deg,var(--green),#bfe8cf); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag{ position:absolute; right:16px; font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }

  main{ flex:1 1 auto; width:100%; max-width:460px; display:flex; flex-direction:column;
    align-items:center; justify-content:space-between; gap:10px; padding:14px 12px 12px; }

  .toast{ position:fixed; top:70px; left:50%; transform:translateX(-50%);
    background:#eef3f7; color:#12161b; font-weight:700; font-size:13px; padding:8px 14px; border-radius:8px;
    opacity:0; pointer-events:none; transition:opacity .15s; z-index:5; }
  .toast.show{ opacity:1; }

  .board{ display:grid; grid-template-rows:repeat(6,1fr); gap:6px; }
  .brow{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .brow.shake{ animation:shake .4s; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
  .tile{ width:52px; height:52px; border:2px solid var(--line); border-radius:8px; background:var(--tile);
    display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; text-transform:uppercase; }
  .tile.filled{ border-color:#4a5765; animation:pop .1s; }
  @keyframes pop{ 0%{transform:scale(.9)} 100%{transform:scale(1)} }
  @media (max-height:700px){ .tile{ width:46px; height:46px; font-size:23px; } }

  .kb{ width:100%; max-width:460px; display:flex; flex-direction:column; gap:6px; }
  .krow{ display:flex; gap:5px; justify-content:center; }
  .key{ flex:1 1 auto; max-width:38px; height:50px; border-radius:6px; background:var(--slate); color:var(--ink);
    font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; text-transform:uppercase; cursor:pointer; }
  .key:active{ filter:brightness(1.25); }
  .key.wide{ max-width:60px; font-size:12px; flex:1.5 1 auto; }

  .tile.green{ background:var(--green); border-color:var(--green); color:#0b120d; }
  .tile.amber{ background:var(--amber); border-color:var(--amber); color:#1a1305; }
  .tile.slate{ background:var(--slate); border-color:var(--slate); color:var(--ink); }
  .key.green{ background:var(--green); color:#0b120d; }
  .key.amber{ background:var(--amber); color:#1a1305; }
  .key.slate{ background:#232a31; color:#6b7683; }
</style>
</head>
<body>
  <header>
    <span class="logo">FIVES</span>
    <span class="tag">guess the word</span>
  </header>

  <div class="toast" id="toast"></div>

  <main>
    <div class="board" id="board"></div>
    <div class="kb" id="kb"></div>
  </main>

  <script>
  "use strict";
  (function(){
    function vh(){ document.body.style.height = window.innerHeight + 'px'; }
    window.addEventListener('resize', vh); vh();

    // ---- word list (common 5-letter words; answers + allowed guesses) ----
    const WORDS = ("about above abuse actor acute admit adopt adult after again agent agree ahead alarm album "+
    "alert alike alive allow alone along alter among anger angle angry apart apple apply arena argue arise array "+
    "aside asset audio audit avoid award aware badly baker basic basis beach began begin begun being below bench "+
    "birth black blame blank blast blind block blood board boost booth bound brain brand brass brave bread break "+
    "breed brief bring broad broke brown build built buyer cable carry catch cause chain chair chaos charm chart "+
    "chase cheap check chest chief child chose civil claim class clean clear click climb clock close cloud coach "+
    "coast could count court cover craft crash crazy cream crime cross crowd crown crude curve cycle daily dance "+
    "dated death debut delay depth doing doubt dozen draft drama drawn dream dress drill drink drive drove dying "+
    "eager early earth eight elite empty enemy enjoy enter entry equal error event every exact exist extra faith "+
    "false fault fiber field fifth fifty fight final first fixed flash fleet floor fluid focus force forth forty "+
    "forum found frame frank fraud fresh front fruit fully funny giant given glass globe going grace grade grand "+
    "grant grass great green gross group grown guard guess guest guide happy heart heavy hence horse hotel house "+
    "human ideal image index inner input issue joint judge known label large laser later laugh layer learn lease "+
    "least leave legal level light limit links lives local logic loose lower lucky lunch lying magic major maker "+
    "march match maybe mayor meant media metal might minor minus mixed model money month moral motor mount mouse "+
    "mouth movie music needs never newly night noise north noted novel nurse occur ocean offer often order other "+
    "ought paint panel paper party peace phase phone photo piece pilot pitch place plain plane plant plate point "+
    "pound power press price pride prime print prior prize proof proud prove queen quick quiet quite radio raise "+
    "range rapid ratio reach ready refer right rival river rough round route royal rural scale scene scope score "+
    "sense serve seven shall shape share sharp sheet shelf shell shift shirt shock shoot short shown sight since "+
    "sixth sixty sized skill sleep slide small smart smile smoke solid solve sorry sound south space spare speak "+
    "speed spend spent split spoke sport staff stage stake stand start state steam steel stick still stock stone "+
    "stood store storm story strip stuck study stuff style sugar suite super sweet table taken taste taxes teach "+
    "teeth thank theft their theme there these thick thing think third those three threw throw tight times tired "+
    "title today topic total touch tough tower track trade train treat trend trial tribe trick tried tries truck "+
    "truly trust truth twice under undue union unity until upper upset urban usage usual valid value video virus "+
    "visit vital voice waste watch water wheel where which while white whole whose woman women world worry worse "+
    "worst worth would wound write wrong wrote young youth").split(/\s+/);
    const ALLOWED = new Set(WORDS);

    const ROWS=6, COLS=5;
    let answer = WORDS[Math.floor(Math.random()*WORDS.length)];
    let row=0, col=0;

    // ---- board ----
    const board=document.getElementById('board'); const tiles=[];
    for(let r=0;r<ROWS;r++){ const rowEl=document.createElement('div'); rowEl.className='brow'; const rt=[];
      for(let c=0;c<COLS;c++){ const t=document.createElement('div'); t.className='tile'; rowEl.appendChild(t); rt.push(t); }
      board.appendChild(rowEl); tiles.push(rt); }

    // ---- keyboard ----
    const KB=[ "QWERTYUIOP", "ASDFGHJKL", "↵ZXCVBNM⌫" ];  // Enter, Backspace glyphs
    const kb=document.getElementById('kb'); const keyEls={};
    KB.forEach((line,i)=>{ const rowEl=document.createElement('div'); rowEl.className='krow';
      for(const ch of line){ const k=document.createElement('div');
        const isEnter=ch==='↵', isBack=ch==='⌫';
        k.className='key'+(isEnter||isBack?' wide':'');
        k.textContent = isEnter?'Enter' : isBack?'⌫' : ch;
        k.dataset.k = isEnter?'enter' : isBack?'back' : ch.toLowerCase();
        if(!isEnter && !isBack) keyEls[k.dataset.k]=k;
        rowEl.appendChild(k); }
      kb.appendChild(rowEl); });
    kb.addEventListener('click', e=>{ const k=e.target.closest('.key'); if(!k) return; handle(k.dataset.k); });

    // ---- toast ----
    let toastT=null; const toastEl=document.getElementById('toast');
    function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show');
      clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),1100); }

    // ---- input handling (no scoring yet — evaluation lands Wed) ----
    function addLetter(ch){ if(col>=COLS||row>=ROWS) return;
      tiles[row][col].textContent=ch; tiles[row][col].classList.add('filled'); col++; }
    function delLetter(){ if(col<=0) return; col--; tiles[row][col].textContent=''; tiles[row][col].classList.remove('filled'); }
    let gameOver=false;
    // proper duplicate-letter handling: greens first, then ambers from remaining counts
    function evaluate(guess){
      const res=Array(COLS).fill('slate'), counts={};
      for(const ch of answer) counts[ch]=(counts[ch]||0)+1;
      for(let i=0;i<COLS;i++){ if(guess[i]===answer[i]){ res[i]='green'; counts[guess[i]]--; } }
      for(let i=0;i<COLS;i++){ if(res[i]==='green') continue;
        if(counts[guess[i]]>0){ res[i]='amber'; counts[guess[i]]--; } }
      return res;
    }
    const RANK={slate:0,amber:1,green:2};
    function colorKey(ch,state){ const el=keyEls[ch]; if(!el) return;
      const cur=el.dataset.state||''; if(RANK[state] >= (RANK[cur]||0)){
        el.dataset.state=state; el.classList.remove('green','amber','slate'); el.classList.add(state); } }
    function submit(){
      if(col<COLS){ toast('Not enough letters'); shake(); return; }
      const guess = tiles[row].map(t=>t.textContent.toLowerCase()).join('');
      // guesses: accept any 5 letters (the curated list is small, so we don't gate
      // on it — it still supplies the answers). Letters only ever come from the keys.
      const res=evaluate(guess);
      for(let i=0;i<COLS;i++){ tiles[row][i].classList.add(res[i]); colorKey(guess[i],res[i]); }
      if(guess===answer){ gameOver=true; setTimeout(()=>toast(['Genius!','Magnificent','Impressive','Splendid','Great','Phew!'][row]||'Solved!'),150); return; }
      row++; col=0;
      if(row>=ROWS){ gameOver=true; setTimeout(()=>toast('Answer: '+answer.toUpperCase()),150); }
    }
    function shake(){ const el=board.children[row]; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    function handle(k){ if(gameOver) return;
      if(k==='enter') submit(); else if(k==='back') delLetter();
      else if(/^[a-z]$/.test(k)) addLetter(k.toUpperCase()); }

    window.addEventListener('keydown', e=>{
      if(e.key==='Enter') handle('enter');
      else if(e.key==='Backspace') handle('back');
      else if(/^[a-zA-Z]$/.test(e.key)) handle(e.key.toLowerCase());
    });

    // answer kept for Wed's evaluation (not revealed)
    window.__answer = answer;
  })();
  </script>
</body>
</html>
