<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04121f">
<title>Fathom</title>
<style>
  :root{
    --ink:#eaf6ff; --muted:#8fb2c6; --gold:#f2c66d; --gold-2:#e3a94a;
    --teal:#4fd0d6; --deep:#04121f;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ background:var(--deep); color:var(--ink); overflow:hidden;
    font-family:Georgia,"Times New Roman",serif; user-select:none; -webkit-user-select:none; touch-action:none; }
  #bg{ position:fixed; inset:0; display:block; z-index:0; }

  .screen{ position:fixed; inset:0; z-index:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:28px;
    padding-top:calc(28px + env(safe-area-inset-top)); }
  .screen.hidden{ display:none; }

  /* title */
  .kicker{ font-size:12px; letter-spacing:6px; text-transform:uppercase; color:var(--teal);
    opacity:.85; margin-bottom:10px; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  .logo{ font-size:clamp(48px,15vw,104px); font-weight:700; letter-spacing:9px; padding-left:9px;
    line-height:.9; color:#dff6ff; text-shadow:0 2px 30px rgba(79,208,214,.45), 0 1px 0 rgba(0,0,0,.4); }
  .tagline{ font-style:italic; font-size:clamp(15px,4.5vw,20px); color:var(--muted); margin-top:14px; letter-spacing:1px; }
  .menu{ margin-top:44px; display:flex; flex-direction:column; gap:14px; width:min(78vw,300px); }
  .btn{ padding:16px 22px; border-radius:14px; font-size:17px; font-weight:700; letter-spacing:2px;
    text-transform:uppercase; cursor:pointer; font-family:-apple-system,Segoe UI,Roboto,sans-serif;
    border:1px solid rgba(120,200,215,.35); color:var(--ink); background:rgba(11,40,58,.55);
    backdrop-filter:blur(3px); transition:transform .08s, filter .15s; }
  .btn:active{ transform:scale(.97); }
  .btn.primary{ border:none; color:#20160a;
    background:linear-gradient(160deg,#ffdc8a,var(--gold-2));
    box-shadow:0 8px 26px rgba(226,169,74,.4), inset 0 1px 0 rgba(255,255,255,.5); }

  /* tank (placeholder for now) */
  .topbar{ position:fixed; top:0; left:0; right:0; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
    font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  .topbar.hidden{ display:none; }
  .pearls{ font-weight:800; letter-spacing:1px; color:var(--gold); font-size:16px; }
  .pearls span{ color:var(--muted); font-weight:600; margin-left:4px; }
  .iconbtn{ width:40px; height:40px; border-radius:12px; border:1px solid rgba(120,200,215,.35);
    background:rgba(11,40,58,.55); color:var(--ink); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .tanknote{ background:rgba(6,22,34,.72); border:1px solid rgba(120,200,215,.3); border-radius:16px;
    padding:22px 24px; max-width:300px; backdrop-filter:blur(3px); }
  .tanknote h2{ font-size:20px; margin-bottom:8px; color:#dff6ff; letter-spacing:1px; }
  .tanknote p{ font-size:14px; color:var(--muted); line-height:1.6; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }

  /* modal */
  .modal{ position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center;
    padding:26px; background:rgba(3,12,20,.72); backdrop-filter:blur(4px); }
  .modal.hidden{ display:none; }
  .panel{ background:linear-gradient(180deg,#0c2836,#08202e); border:1px solid rgba(120,200,215,.3);
    border-radius:18px; padding:26px; max-width:340px; width:100%; }
  .panel h3{ font-size:22px; letter-spacing:2px; color:var(--gold); margin-bottom:12px; }
  .panel p{ font-size:14.5px; line-height:1.65; color:#cfe6f2; margin-bottom:10px;
    font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  .panel .btn{ margin-top:12px; width:100%; }
  .shophd{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .shophd .p{ color:var(--gold); font-weight:800; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  .shoplist{ max-height:52vh; overflow-y:auto; margin:4px 0 6px; }
  .shoprow{ display:flex; align-items:center; gap:12px; padding:10px 2px; border-bottom:1px solid rgba(120,200,215,.14);
    font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  .swatch{ width:26px; height:26px; border-radius:50%; flex:0 0 auto; }
  .sinfo{ flex:1; text-align:left; }
  .sname{ font-size:15px; color:#eaf6ff; font-weight:600; }
  .sprice{ font-size:12px; color:var(--muted); }
  .buy{ padding:8px 15px; border-radius:10px; border:none; font-weight:800; cursor:pointer; font-size:13px;
    background:linear-gradient(160deg,#ffdc8a,#e3a94a); color:#20160a; }
  .buy:disabled{ background:#26333d; color:#5c6b76; cursor:default; }
</style>
</head>
<body>
  <canvas id="bg"></canvas>

  <!-- title screen -->
  <div class="screen" id="titleScreen">
    <div class="kicker">a pocket ocean</div>
    <div class="logo">FATHOM</div>
    <div class="tagline">keep a living tank in your pocket</div>
    <div class="menu">
      <button class="btn primary" id="playBtn">Dive In</button>
      <button class="btn" id="howBtn">How to Play</button>
      <button class="btn" id="colBtn">Collection</button>
    </div>
  </div>

  <!-- in-tank top bar -->
  <div class="topbar hidden" id="topbar">
    <div class="pearls">◍ <b id="pearlN">0</b> <span>pearls</span></div>
    <button class="iconbtn" id="backBtn">☰</button>
  </div>

  <!-- menu -->
  <div class="modal hidden" id="menu">
    <div class="panel">
      <h3>Menu</h3>
      <button class="btn primary" id="shopOpen">Shop</button>
      <button class="btn" id="menuResume">Resume</button>
      <button class="btn" id="menuTitle">Back to Title</button>
    </div>
  </div>

  <!-- shop -->
  <div class="modal hidden" id="shop">
    <div class="panel">
      <div class="shophd"><h3 style="margin:0">Shop</h3><div class="p">◍ <span id="shopPearls">0</span></div></div>
      <div class="shoplist" id="shopList"></div>
      <button class="btn" id="shopClose">Close</button>
    </div>
  </div>

  <!-- info modal -->
  <div class="modal hidden" id="modal">
    <div class="panel">
      <h3 id="mTitle">How to Play</h3>
      <div id="mBody"></div>
      <button class="btn primary" id="mClose">Close</button>
    </div>
  </div>

  <script>
  "use strict";
  (function(){
    const cv=document.getElementById('bg'), ctx=cv.getContext('2d');
    let W=0,H=0,dpr=1;
    const rand=(a,b)=>a+Math.random()*(b-a);

    let state='title';
    let bubbles=[], rays=[], fish=[], tank=[], motes=[], food=[];
    let pearls=20, ownedFish=[], saveT=0;
    const byKey = k => SPECIES.find(s=>s.key===k);
    const PRICE = { neon:8, ember:14, sunny:18, angel:40, lumen:60 };
    const SPECIES=[
      { key:'neon',  name:'Neon Tetra',  body:'#4fd0d6', fin:'#bfeff2', size:12, glow:true  },
      { key:'ember', name:'Ember Molly', body:'#ff8a5c', fin:'#ffd7b0', size:17, glow:false },
      { key:'sunny', name:'Sunfish',     body:'#f2c66d', fin:'#fff0c4', size:20, glow:false },
      { key:'angel', name:'Angelfish',   body:'#c9d6e6', fin:'#eef4ff', size:22, glow:false },
      { key:'lumen', name:'Lanternfish', body:'#b06cff', fin:'#e2c7ff', size:14, glow:true  },
    ];
    function seed(){
      bubbles=[]; for(let i=0;i<38;i++) bubbles.push(mkBubble(true));
      rays=[]; for(let i=0;i<5;i++) rays.push({ x:rand(0,W), w:rand(60,150), a:rand(0.04,0.10), ph:rand(0,6.28), sp:rand(0.15,0.35) });
      fish=[]; for(let i=0;i<7;i++) fish.push(mkFish());
      motes=[]; for(let i=0;i<34;i++) motes.push(mkMote());
      seedTank();
    }
    function mkMote(){ return { x:rand(0,W), y:rand(0,H), vx:rand(-4,4), vy:rand(4,14), r:rand(0.5,1.8), a:rand(0.04,0.14) }; }
    function seedTank(){ tank=[]; for(const k of ownedFish){ const sp=byKey(k); if(sp) tank.push(mkPet(sp)); } }
    function load(){ try{ const s=JSON.parse(localStorage.getItem('fathom_save'));
        if(s && Array.isArray(s.fish) && s.fish.length){ pearls=+s.pearls||0; ownedFish=s.fish.filter(byKey); return; } }catch(e){}
      pearls=20; ownedFish=['neon','neon','neon','ember','sunny']; }
    function save(){ try{ localStorage.setItem('fathom_save', JSON.stringify({v:1, pearls:Math.floor(pearls), fish:ownedFish})); }catch(e){} }
    function mkPet(sp){ return { spec:sp, size:sp.size, x:rand(60,Math.max(80,W-60)),
      y:rand(120,Math.max(160,H-90)), ang:rand(0,6.28), spd:rand(24,44), tail:rand(0,6.28) }; }
    function mkBubble(any){ return { x:rand(0,W), y:any?rand(0,H):H+10, r:rand(1.5,4.5), sp:rand(18,46), wob:rand(0,6.28), ws:rand(0.6,1.6) }; }
    function mkFish(){ const dir=Math.random()<0.5?1:-1;
      return { x:rand(0,W), y:rand(H*0.2,H*0.9), len:rand(16,42), dir, sp:rand(10,26)*dir,
               tail:rand(0,6.28), depth:rand(0.25,0.7) }; }

    function resize(){ dpr=Math.min(window.devicePixelRatio||1,2.5); W=window.innerWidth; H=window.innerHeight;
      cv.width=Math.floor(W*dpr); cv.height=Math.floor(H*dpr); cv.style.width=W+'px'; cv.style.height=H+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0); seed(); }
    window.addEventListener('resize', resize);

    let last=performance.now(), t=0;
    function frame(now){ const dt=Math.min((now-last)/1000,0.05); last=now; t+=dt; draw(dt); requestAnimationFrame(frame); }

    function draw(dt){
      // depth gradient (surface light -> deep)
      const g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#0e3f57'); g.addColorStop(0.35,'#0a2c40'); g.addColorStop(1,'#04121f');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

      // god rays from the surface
      for(const r of rays){ r.ph+=dt*r.sp; const x=r.x + Math.sin(r.ph)*30;
        const grd=ctx.createLinearGradient(x,0,x+r.w*0.4,H);
        grd.addColorStop(0,'rgba(120,220,230,'+r.a+')'); grd.addColorStop(1,'rgba(120,220,230,0)');
        ctx.fillStyle=grd; ctx.beginPath();
        ctx.moveTo(x,0); ctx.lineTo(x+r.w,0); ctx.lineTo(x+r.w*0.5+40,H); ctx.lineTo(x-40,H); ctx.closePath(); ctx.fill(); }

      if(state==='tank'){
        drawCaustics();
        drawSubstrate();
        for(const f of tank){ updatePet(f,dt); drawPet(f); }
        // food pellets sink; fish eat them (see updatePet)
        for(const p of food){ if(p.y<H-30) p.y+=p.vy*dt; else p.rest=(p.rest||0)+dt;
          ctx.fillStyle='#ffd98a'; ctx.shadowColor='#ffcf6b'; ctx.shadowBlur=6;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.shadowBlur=0; }
        food=food.filter(p=>!p.eaten && (p.rest||0)<6);
        // pearls accrue with the size of the tank
        pearls += tank.length*0.12*dt; pearlN.textContent=Math.floor(pearls);
        saveT+=dt; if(saveT>4){ saveT=0; save(); }
      } else {
        // silhouette fish drifting (title atmosphere)
        for(const f of fish){ f.x+=f.sp*dt; f.tail+=dt*6;
          if(f.dir>0 && f.x>W+60) { f.x=-60; f.y=rand(H*0.2,H*0.9); }
          if(f.dir<0 && f.x<-60) { f.x=W+60; f.y=rand(H*0.2,H*0.9); }
          drawFish(f); }
      }

      // rising bubbles
      for(const b of bubbles){ b.y-=b.sp*dt; b.wob+=dt*b.ws; const x=b.x+Math.sin(b.wob)*6;
        if(b.y<-10){ Object.assign(b, mkBubble(false)); }
        ctx.beginPath(); ctx.arc(x,b.y,b.r,0,7);
        ctx.strokeStyle='rgba(180,230,240,0.35)'; ctx.lineWidth=1; ctx.stroke();
        ctx.fillStyle='rgba(180,230,240,0.08)'; ctx.fill(); }

      // drifting marine snow (atmosphere)
      for(const m of motes){ m.x+=m.vx*dt; m.y+=m.vy*dt;
        if(m.y>H+4){ m.y=-4; m.x=rand(0,W); } if(m.x<-4)m.x=W+4; if(m.x>W+4)m.x=-4;
        ctx.fillStyle='rgba(205,232,242,'+m.a+')'; ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,7); ctx.fill(); }

      // vignette for depth
      const v=ctx.createRadialGradient(W/2,H*0.42,H*0.26,W/2,H*0.5,H*0.82);
      v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.42)');
      ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
    }
    function drawCaustics(){
      ctx.save(); ctx.globalCompositeOperation='screen';
      for(let i=0;i<3;i++){ const y=H*0.48+i*H*0.15;
        ctx.strokeStyle='rgba(130,225,235,0.05)'; ctx.lineWidth=12; ctx.beginPath();
        for(let x=0;x<=W;x+=16){ const yy=y+Math.sin(x*0.028+t*0.8+i*1.3)*10; x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy); }
        ctx.stroke(); }
      ctx.restore();
    }
    function drawFish(f){
      const a=0.10+f.depth*0.16, len=f.len, dir=f.dir;
      ctx.save(); ctx.translate(f.x,f.y); ctx.scale(dir,1);
      ctx.fillStyle='rgba(3,14,22,'+a+')';
      ctx.beginPath(); ctx.ellipse(0,0,len,len*0.42,0,0,7); ctx.fill();
      const tw=Math.sin(f.tail)*len*0.18;
      ctx.beginPath(); ctx.moveTo(-len*0.9,0); ctx.lineTo(-len*1.5,-len*0.35+tw); ctx.lineTo(-len*1.5,len*0.35+tw); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // ---- tank (foreground pets) ----
    function updatePet(f,dt){
      f.ang += rand(-1,1)*1.3*dt;                       // gentle wander
      let dx=Math.cos(f.ang), dy=Math.sin(f.ang)*0.6;   // flatten vertical for natural swim
      // seek the nearest food pellet
      let fed=null, fd=1e9;
      for(const p of food){ if(p.eaten) continue; const d=(p.x-f.x)**2+(p.y-f.y)**2; if(d<fd){ fd=d; fed=p; } }
      if(fed && fd < 150*150){ const d=Math.sqrt(fd)||1;
        dx += (fed.x-f.x)/d*2.4; dy += (fed.y-f.y)/d*2.4;
        if(d<12){ fed.eaten=true; pearls+=2; f.spd=Math.min(f.spd+1.5,58);
          for(let i=0;i<4;i++) bubbles.push(Object.assign(mkBubble(false),{x:fed.x+rand(-4,4),y:fed.y})); } }
      // light schooling among the same species (cohesion + alignment + separation)
      let cx=0,cy=0,ax=0,ay=0,sx=0,sy=0,n=0;
      for(const o of tank){ if(o===f) continue; const ox=o.x-f.x, oy=o.y-f.y, d=Math.hypot(ox,oy);
        if(d<92 && o.spec===f.spec){ cx+=o.x; cy+=o.y; ax+=Math.cos(o.ang); ay+=Math.sin(o.ang); n++;
          if(d<32){ sx-=ox/(d||1); sy-=oy/(d||1); } } }
      if(n>0){ const clx=cx/n-f.x, cly=cy/n-f.y, cl=Math.hypot(clx,cly)||1;
        dx += (clx/cl)*0.45 + (ax/n)*0.55 + sx*1.1;
        dy += (cly/cl)*0.45 + (ay/n)*0.55 + sy*1.1; }
      const pad=54, topPad=96, botPad=56;               // steer away from edges
      if(f.x<pad) dx+=(pad-f.x)/pad;
      if(f.x>W-pad) dx-=(f.x-(W-pad))/pad;
      if(f.y<topPad) dy+=(topPad-f.y)/topPad;
      if(f.y>H-botPad) dy-=(f.y-(H-botPad))/botPad;
      const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
      f.ang=Math.atan2(dy,dx);
      f.x+=dx*f.spd*dt; f.y+=dy*f.spd*dt; f.tail+=dt*9;
    }
    function drawPet(f){
      const dir=Math.cos(f.ang)>=0?1:-1, s=f.size, sp=f.spec;
      ctx.save(); ctx.translate(f.x,f.y); ctx.scale(dir,1);
      if(sp.glow){ ctx.shadowColor=sp.body; ctx.shadowBlur=14; }
      const tw=Math.sin(f.tail)*s*0.55;
      ctx.fillStyle=sp.fin;
      ctx.beginPath(); ctx.moveTo(-s*0.75,0); ctx.lineTo(-s*1.5,-s*0.5+tw); ctx.lineTo(-s*1.5,s*0.5+tw); ctx.closePath(); ctx.fill();
      ctx.fillStyle=sp.body; ctx.beginPath(); ctx.ellipse(0,0,s,s*0.56,0,0,7); ctx.fill();
      ctx.fillStyle=sp.fin; ctx.beginPath(); ctx.moveTo(-s*0.1,-s*0.5); ctx.lineTo(s*0.5,-s*0.95); ctx.lineTo(s*0.35,-s*0.35); ctx.closePath(); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s*0.55,-s*0.1,s*0.16,0,7); ctx.fill();
      ctx.fillStyle='#04121f'; ctx.beginPath(); ctx.arc(s*0.6,-s*0.1,s*0.08,0,7); ctx.fill();
      ctx.restore();
    }
    function drawSubstrate(){
      ctx.fillStyle='#b3894e';                           // sand mound
      ctx.beginPath(); ctx.moveTo(0,H);
      for(let x=0;x<=W;x+=24) ctx.lineTo(x, H-26 - Math.sin(x*0.02+1)*7);
      ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(255,240,200,0.10)';            // top sheen
      ctx.beginPath(); ctx.moveTo(0,H-26);
      for(let x=0;x<=W;x+=24) ctx.lineTo(x, H-26 - Math.sin(x*0.02+1)*7);
      ctx.lineTo(W,H-26); ctx.closePath(); ctx.fill();
      drawWeed(W*0.16,'#2f7d5b'); drawWeed(W*0.84,'#3a8f66');
    }
    function drawWeed(x,col){ ctx.strokeStyle=col; ctx.lineWidth=6; ctx.lineCap='round';
      for(let k=-1;k<=1;k++){ const bx=x+k*10; ctx.beginPath(); ctx.moveTo(bx,H-24);
        for(let i=1;i<=5;i++){ const yy=H-24-i*16, sway=Math.sin(t*1.2+i*0.6+k)*8; ctx.lineTo(bx+sway,yy); }
        ctx.stroke(); } }

    // ---- screens / UI ----
    const titleScreen=document.getElementById('titleScreen'), topbar=document.getElementById('topbar'),
          modal=document.getElementById('modal'), menu=document.getElementById('menu'), shop=document.getElementById('shop'),
          pearlN=document.getElementById('pearlN');
    function show(el,on){ el.classList.toggle('hidden', !on); }
    function anyOverlay(){ return [modal,menu,shop].some(o=>!o.classList.contains('hidden')); }

    document.getElementById('playBtn').addEventListener('click', ()=>{ state='tank'; pearlN.textContent=Math.floor(pearls); show(titleScreen,false); show(topbar,true); });
    document.getElementById('backBtn').addEventListener('click', ()=>show(menu,true));
    document.getElementById('menuResume').addEventListener('click', ()=>show(menu,false));
    document.getElementById('menuTitle').addEventListener('click', ()=>{ save(); state='title'; show(menu,false); show(topbar,false); show(titleScreen,true); });
    document.getElementById('shopOpen').addEventListener('click', ()=>{ show(menu,false); renderShop(); show(shop,true); });
    document.getElementById('shopClose').addEventListener('click', ()=>show(shop,false));

    // info modal (how to / collection)
    const mTitle=document.getElementById('mTitle'), mBody=document.getElementById('mBody');
    function openModal(title,html){ mTitle.textContent=title; mBody.innerHTML=html; show(modal,true); }
    document.getElementById('howBtn').addEventListener('click', ()=>openModal('How to Play',
      '<p>Tap the water to sprinkle food — your fish dart over to eat, and each bite earns pearls.</p>'+
      '<p>Pearls also trickle in over time as your tank grows. Open the ☰ menu → <b>Shop</b> to spend them on new fish. Your tank saves automatically.</p>'));
    document.getElementById('colBtn').addEventListener('click', ()=>openModal('Collection',
      '<p>Every species you keep is catalogued here.</p><p>Dive in and open the Shop to grow your collection.</p>'));
    document.getElementById('mClose').addEventListener('click', ()=>show(modal,false));

    // shop
    const shopList=document.getElementById('shopList'), shopPearls=document.getElementById('shopPearls');
    function renderShop(){ shopPearls.textContent=Math.floor(pearls); shopList.innerHTML='';
      for(const sp of SPECIES){ const price=PRICE[sp.key], can=Math.floor(pearls)>=price;
        const row=document.createElement('div'); row.className='shoprow';
        row.innerHTML='<div class="swatch" style="background:'+sp.body+'"></div>'+
          '<div class="sinfo"><div class="sname">'+sp.name+'</div><div class="sprice">◍ '+price+
          ' · own '+ownedFish.filter(k=>k===sp.key).length+'</div></div>';
        const b=document.createElement('button'); b.className='buy'; b.textContent='Buy'; b.disabled=!can;
        b.addEventListener('click', ()=>buy(sp.key)); row.appendChild(b); shopList.appendChild(row); } }
    function buy(key){ const price=PRICE[key]; if(Math.floor(pearls)<price) return;
      pearls-=price; ownedFish.push(key); const sp=byKey(key); const p=mkPet(sp);
      p.x=rand(60,Math.max(80,W-60)); p.y=rand(120,Math.max(160,H-90)); tank.push(p);
      save(); pearlN.textContent=Math.floor(pearls); renderShop(); }

    // feeding: tap the tank water to drop food
    cv.addEventListener('pointerdown', e=>{ if(state!=='tank'||anyOverlay()) return;
      const x=e.clientX, y=Math.max(70, e.clientY-30);
      for(let i=0;i<4;i++) food.push({ x:x+rand(-16,16), y:y+rand(-8,8), vy:rand(26,40), r:rand(2.2,3.4) }); }, {passive:true});

    load();
    resize(); requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
