<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>20 More Styles Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Bangers&family=Fredoka:wght@500;600&family=IBM+Plex+Mono:wght@500;600;700&family=IM+Fell+English+SC&family=Josefin+Sans:wght@700&family=Kaushan+Script&family=Lobster&family=Marcellus&family=MedievalSharp&family=Permanent+Marker&family=Pixelify+Sans:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Poiret+One&family=Quicksand:wght@500;700&family=Russo+One&family=Share+Tech+Mono&family=Silkscreen&family=Space+Grotesk:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#101014;--fg:#ececf1;--mut:#9b9ba8;--card:#1a1a21;--line:#2b2b35;--acc:#8fd3ff}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f3ef;--fg:#18181c;--mut:#5d5d68;--card:#fff;--line:#dcdad3;--acc:#1b6fb0}}
:root[data-theme="light"]{--bg:#f4f3ef;--fg:#18181c;--mut:#5d5d68;--card:#fff;--line:#dcdad3;--acc:#1b6fb0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#menu{max-width:1120px;margin:0 auto;padding:28px 16px 56px}
#menu h1{font-size:30px;margin:0 0 6px;letter-spacing:.01em}
#menu .sub{color:var(--mut);margin:0 0 22px;max-width:70ch;line-height:1.5}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .15s,border-color .15s}
.card:hover,.card:focus-visible,.card.padsel{transform:translateY(-2px);border-color:var(--acc)}
.card.padsel{box-shadow:0 0 0 3px var(--acc);outline:none}
.card .sw{height:84px;position:relative}
.card .sw b{position:absolute;left:10px;top:8px;font:700 13px/1 ui-monospace,monospace;color:#fff;background:rgba(0,0,0,.45);padding:4px 7px;border-radius:6px}
.card .tx{padding:11px 13px 14px}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0;font-size:13px;color:var(--mut);line-height:1.4}
.card .best{margin-top:6px;color:var(--fg);font-weight:600;font-size:12.5px;min-height:1em}
#game{display:none;position:fixed;inset:0;background:#000;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#c{display:block;touch-action:none;background:#000;cursor:crosshair;width:100vw;height:100vh;height:100dvh}
#pz{position:fixed;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.45);font:700 13px/1 system-ui,sans-serif;padding:0;cursor:pointer;opacity:.45;z-index:6;transition:opacity .3s}
#pz:hover,#pz:focus-visible{opacity:1}
body.pad #pz{display:none}
#pm{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
#pm .box{background:#17171d;color:#f1f1f4;border:1px solid #33333d;border-radius:16px;padding:18px 18px 14px;width:min(340px,92vw);max-height:92vh;overflow:auto;text-align:center}
#pm h2{margin:0 0 2px;font-size:20px}#pm p{margin:0 0 12px;color:#a3a3b0;font-size:13px}
#pm button{display:block;width:100%;margin:7px 0;padding:11px;border-radius:10px;border:1px solid #3a3a46;background:#23232b;color:#f1f1f4;font:600 15px system-ui,sans-serif;cursor:pointer}
#pm button.padsel{border-color:#8fd3ff;background:#2b2b35;box-shadow:0 0 0 2px #8fd3ff}
#pm button:hover,#pm button:focus-visible{border-color:#8fd3ff;outline:none;background:#2b2b35}
#pm .ph{margin:8px 0 0;font-size:12px}
@media (max-height:420px){#pm .box{padding:12px}#pm button{padding:8px;margin:5px 0}}
#splash{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:20;display:block;cursor:pointer;transition:none;touch-action:none}
#hint{position:fixed;left:50%;top:calc(max(6px,env(safe-area-inset-top)) + 46px);transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:7px 14px;border-radius:10px;font-size:13px;line-height:1.45;max-width:min(90vw,640px);text-align:center;transition:opacity .8s;pointer-events:none;z-index:6;white-space:pre-line}
#hint.hide{opacity:0}
.tc{position:fixed;z-index:5;display:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;bottom:max(14px,env(safe-area-inset-bottom))}
#tcL{left:max(14px,env(safe-area-inset-left));width:170px;height:170px;transform-origin:bottom left}
#tcR{right:max(14px,env(safe-area-inset-right));width:110px;height:110px;transform-origin:bottom right}
.vb{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.5);color:#fff;font:700 24px/1 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.35);touch-action:none}
.vb.on{background:rgba(255,255,255,.5)}
.joy{position:absolute;inset:5px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.45);touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:rgba(255,255,255,.45);border:2px solid #fff;pointer-events:none}
@media (max-height:430px){#tcL,#tcR{transform:scale(.8)}#hint{font-size:11px;padding:5px 10px;max-width:60vw}}
#rot{position:fixed;inset:0;z-index:10;background:#111;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;font:600 18px system-ui,sans-serif;text-align:center;gap:14px;padding:20px}
@media (max-height:500px){#menu{padding:14px 12px 30px}#menu h1{font-size:22px}#menu .sub{margin-bottom:14px;font-size:14px}.card .sw{height:54px}#grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.card .tx{padding:8px 11px 10px}}
</style>
</head>

// ================= AUDIO =================

 const tiles=[['#c8742a','#6cbf5a'],['#ffd93a','#e8303a'],['#1f4f8f','#eaf4ff'],['#050805','#7aff7a'],['#e6cf98','#2a6fa0'],['#efe8d8','#d8322a'],['#ff9ad8','#7ae8ff'],['#4a8ad8','#ffd86a'],['#efe4cc','#1a1410'],['#ff3a8a','#ffd23a'],['#140828','#ff6020'],['#f4eedd','#d8304a'],['#f4e6c0','#c8962a'],['#1a3478','#f4d23a'],['#e6d8b8','#8a9a6a'],['#f6f1e7','#ff48b0'],['#ff8a4a','#2a1a5a'],['#b8c4a0','#1a1e14'],['#cfe2c8','#e86a5a'],['#9a4a3a','#3ae0c8']];
