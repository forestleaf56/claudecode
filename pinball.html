function ensureDaily(){
  const d=todayStr();
  if(P.daily&&P.daily.date===d)return;
  const r=seeded(hashStr(d)+7);const ids=[...DT.keys()];const tasks=[];
  const tiers=[0,1,2];
  for(let k=0;k<3;k++){const j=Math.floor(r()*ids.length);const ti=ids.splice(j,1)[0];tasks.push({i:ti,tier:tiers[k],p:0,done:false});}

}
const dailyReward=tier=>[40,60,90][tier];
function dailyEv(ev,amt){
  if(!P.daily)return;
  for(const tk of P.daily.tasks){
    const d=DT[tk.i];if(tk.done||d.ev!==ev)continue;
    if(d.max)tk.p=Math.max(tk.p,amt);else tk.p+=amt;
    const n=d.b[tk.tier];
    if(tk.p>=n){tk.p=n;tk.done=true;P.coins+=dailyReward(tk.tier);toast(t('dailyGot',dailyReward(tk.tier)),3000);sfx.coin();}
  }
  if(!P.daily.all&&P.daily.tasks.every(x=>x.done)){
    P.daily.all=true;const y=new Date();y.setDate(y.getDate()-1);
    const yd=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
    P.daily.streak=P.daily.lastAll===yd?P.daily.streak+1:1;P.daily.lastAll=P.daily.date;
    const bonus=100+Math.min(10,P.daily.streak)*10;P.coins+=bonus;st('dailyAll');

  }
}

function osc(type,f0,f1,dur,vol,t0=0,dest=sfxG,vib=0){
  if(!AC||!dest)return;if(dest===sfxG&&(P.set.sfx<=0||sndCount>14))return;if(dest===sfxG)sndCount++;
  const t=AC.currentTime+t0;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=vib;lg.gain.value=f0*0.06;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+0.05);}
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.05);
}
function nz(dur,vol,freq=2000,t0=0,dest=sfxG){
  if(!AC||!dest||!noiseBuf)return;if(dest===sfxG&&(P.set.sfx<=0||sndCount>14))return;if(dest===sfxG)sndCount++;
  const t=AC.currentTime+t0;const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=1.2;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);
}

const mus={def:null,step:0,next:0,mel:null,prog:null};
function setMusic(def){
  mus.def=def;if(!def)return;
  const r=seeded(def.seed);const mel=[];let deg=4;
  for(let i=0;i<64;i++){if(i%8===0||r()<0.5){deg=clamp(deg+Math.floor(r()*5)-2,0,10);mel.push(deg);}else mel.push(null);}
  for(let i=32;i<48;i++)mel[i]=mel[i-32];
  mus.mel=mel;mus.prog=[0,Math.floor(r()*2)+2,Math.floor(r()*2)+3,1];mus.step=0;mus.next=AC?AC.currentTime+0.1:0;
}
function nf(def,deg,oct){const sc=def.scale,n=sc.length,o=Math.floor(deg/n),i=((deg%n)+n)%n;return 440*Math.pow(2,(def.root+12*(o+oct)+sc[i]-69)/12);}
function musicTick(){
  if(!AC||!mus.def||P.set.music<=0||AC.state!=='running')return;
  const d=mus.def;const fast=G&&G.active&&(G.mode.stamp>0||G.mode.party>0)?1.25:1;
  const spb=60/(d.bpm*fast)/4;
  if(mus.next<AC.currentTime-0.3)mus.next=AC.currentTime+0.05;
  while(mus.next<AC.currentTime+0.2){
    const s=mus.step%64,t0=Math.max(0,mus.next-AC.currentTime);const m=mus.mel[s];
    if(m!=null)osc('triangle',nf(d,m,0),0,spb*1.7,0.11,t0,musG);
    if(s%4===0){const ch=mus.prog[Math.floor(s/16)%4];osc('sine',nf(d,ch,-2),0,spb*3.2,0.32,t0,musG);if(s%8===0)osc('triangle',nf(d,ch+2,-1),0,spb*2,0.08,t0,musG);}
    if(s%2===0)nz(0.025,0.035,8000,t0,musG);
    if(s%8===4)nz(0.09,0.09,1500,t0,musG);
    if(s%8===0)osc('sine',120,45,0.12,0.25,t0,musG);
    mus.step++;mus.next+=spb;
  }
}

const CN={x:0,y:0};
function colSeg(b,s){
  const dx=s.bx-s.ax,dy=s.by-s.ay,l2=dx*dx+dy*dy;
  let tt=((b.x-s.ax)*dx+(b.y-s.ay)*dy)/l2;tt=tt<0?0:tt>1?1:tt;
  const px=s.ax+dx*tt,py=s.ay+dy*tt;let nx=b.x-px,ny=b.y-py;const d2=nx*nx+ny*ny,R=b.r+s.r;
  if(d2>=R*R)return 0;
  const d=Math.sqrt(d2)||1e-4;nx/=d;ny/=d;b.x=px+nx*R;b.y=py+ny*R;CN.x=nx;CN.y=ny;
  const vn=b.vx*nx+b.vy*ny;
  if(vn<0){const e=s.e;b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;
    // slight tangential friction
    if(-vn>60){const tx=-ny,ty=nx,vt=b.vx*tx+b.vy*ty;b.vx-=vt*0.04*tx;b.vy-=vt*0.04*ty;}return -vn;}
  return 0.001;
}
function colCirc(b,c,svx=0,svy=0){
  let nx=b.x-c.x,ny=b.y-c.y;const d2=nx*nx+ny*ny,R=b.r+c.r;
  if(d2>=R*R)return 0;
  const d=Math.sqrt(d2)||1e-4;nx/=d;ny/=d;b.x=c.x+nx*R;b.y=c.y+ny*R;CN.x=nx;CN.y=ny;
  const rvx=b.vx-svx,rvy=b.vy-svy,vn=rvx*nx+rvy*ny;
  if(vn<0){b.vx=svx+rvx-(1+c.e)*vn*nx;b.vy=svy+rvy-(1+c.e)*vn*ny;return -vn;}
  return 0.001;
}
function colFlip(b,f){
  const ex=Math.cos(f.a)*f.len,ey=Math.sin(f.a)*f.len;
  let tt=((b.x-f.x)*ex+(b.y-f.y)*ey)/(f.len*f.len);tt=tt<0?0:tt>1?1:tt;
  const px=f.x+ex*tt,py=f.y+ey*tt,rad=lerp(f.r0,f.r1,tt);
  let nx=b.x-px,ny=b.y-py;const d2=nx*nx+ny*ny,R=b.r+rad;
  if(d2>=R*R)return false;
  const d=Math.sqrt(d2)||1e-4;nx/=d;ny/=d;b.x=px+nx*R;b.y=py+ny*R;
  const cx=px+nx*rad-f.x,cy=py+ny*rad-f.y;const svx=-f.w*cy,svy=f.w*cx;
  const rvx=b.vx-svx,rvy=b.vy-svy,vn=rvx*nx+rvy*ny;
  if(vn<0){const e=0.3;b.vx=svx+rvx-(1+e)*vn*nx;b.vy=svy+rvy-(1+e)*vn*ny;}
  return true;
}
function updateFlipper(f,h){
  const tgt=f.on?f.up:f.rest;const sp=f.on?26:15;const d=tgt-f.a;
  const step=Math.sign(d)*Math.min(Math.abs(d),sp*h);f.a+=step;f.w=step/h;
}
let ballUid=1;
function newBall(x,y){return{x,y,vx:0,vy:0,r:11,inLane:true,held:false,ins:new Set(),spin:0,id:ballUid++,idle:0,saucerCD:0,spinCD:0,loopT:0,loopFrom:null,launchT:0,trail:[]};}
function ballRadius(){return G.pw.big>0?16:G.pw.tiny>0?7.5:11;}
function stepBall(b,h){
  if(b.held)return;
  const def=G.def,T=G.T;
  const g=G.grav*(G.pw.balloon>0?0.45:1);
  b.vy+=g*h;
  if(def.current&&!b.inLane)b.vx+=Math.sin(G.time*0.6)*110*h;
  if(def.well&&!b.inLane){const dx=def.well[0]-b.x,dy=def.well[1]-b.y,d=Math.hypot(dx,dy);if(d<def.well[2]&&d>4){const f=900*(1-d/def.well[2]);b.vx+=dx/d*f*h;b.vy+=dy/d*f*h;}}
  if(G.pw.magnet>0&&!b.inLane&&G.crit.daze<=0){const dx=G.crit.x-b.x,dy=G.crit.y-b.y,d=Math.hypot(dx,dy);if(d<260&&d>5){b.vx+=dx/d*1500*h;b.vy+=dy/d*1500*h;}}
  const sp=Math.hypot(b.vx,b.vy),mx=G.pw.chili>0?3000:2600;if(sp>mx){b.vx*=mx/sp;b.vy*=mx/sp;}
  const py0=b.y;
  b.x+=b.vx*h;b.y+=b.vy*h;
  if(b.inLane&&(b.y<340||b.x<496))b.inLane=false;
  for(const s of T.segs){
    if(!s.on)continue;if(s.kind==='gate'&&b.inLane)continue;if(s.kind==='oneway'&&(b.vy<0||b.x>88))continue;
    const imp=colSeg(b,s);if(imp)onSegHit(b,s,imp);
  }
  for(const c of T.circles){const imp=colCirc(b,c);if(imp)onCircHit(b,c,imp);}
  if(G.pw.post>0){const imp=colCirc(b,{x:T.post.x,y:T.post.y,r:T.post.r,e:0.5});if(imp>200&&Math.random()<0.5)sfx.post();}
  const C=G.crit;
  {const imp=colCirc(b,{x:C.x,y:C.y,r:C.r,e:0.55},C.vx,C.vy);if(imp)onCritterHit(b,imp);}
  for(const f of T.flippers)colFlip(b,f);
  // spinner (left orbit lane)
  if(b.x>20&&b.x<70&&(py0-T.spinner.y)*(b.y-T.spinner.y)<=0&&b.spinCD<=0){b.spinCD=0.15;onSpinner(b);}
  // sensors
  sensor(b,'l0',T.lanes[0],()=>onLane(0));sensor(b,'l1',T.lanes[1],()=>onLane(1));sensor(b,'l2',T.lanes[2],()=>onLane(2));
  sensor(b,'lpL',{x:45,y:330,r:22},()=>onLoopSensor(b,'L'));
  sensor(b,'lpR',{x:515,y:320,r:15},()=>onLoopSensor(b,'R'));
  if(G.ch.kick>0){sensor(b,'kL',{x:39,y:905,r:16},()=>kickback(b,1));sensor(b,'kR',{x:481,y:905,r:16},()=>kickback(b,-1));}
  // saucer capture
  const S=T.saucer;if(b.saucerCD<=0&&!b.inLane){const dx=b.x-S.x,dy=b.y-S.y;if(dx*dx+dy*dy<15*15)captureSaucer(b);}
  // kangaroo bounce
  if(G.ch.roo>0&&b.y>935&&b.vy>0&&b.x>185&&b.x<335&&!G.tilted){G.ch.roo--;b.vy=-1750;b.vx=rand(-220,220);floatText(b.x,900,'🦘 BOING!','#ffe36a',26);VOICE.bloop();burst(b.x,960,'#ffe36a',14);}
  b.spin+=b.vx*h/b.r;
}
function sensor(b,id,s,fn){
  const dx=b.x-s.x,dy=b.y-s.y,inside=dx*dx+dy*dy<s.r*s.r;
  if(inside){if(!b.ins.has(id)){b.ins.add(id);fn();}}else b.ins.delete(id);
}
function ballBall(){
  const B=G.balls;
  for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){
    const a=B[i],c=B[j];if(a.held||c.held)continue;
    let nx=c.x-a.x,ny=c.y-a.y;const d=Math.hypot(nx,ny),R=a.r+c.r;
    if(d>=R||d===0)continue;nx/=d;ny/=d;const o=(R-d)/2;a.x-=nx*o;a.y-=ny*o;c.x+=nx*o;c.y+=ny*o;
    const vn=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny;if(vn<0){const j2=-vn*0.95;a.vx-=j2*nx;a.vy-=j2*ny;c.vx+=j2*nx;c.vy+=j2*ny;}
  }
}

function scoreMult(){
  let m=1;if(G.pw.x2>0)m*=2;if(G.pw.x3>0)m*=3;if(G.pw.tiny>0)m*=2;if(G.mode.stamp>0)m*=3;if(G.mode.party>0)m*=5;
  return Math.min(m,10)*(1+0.05*upg('pts'));
}
function addScore(base,x,y,show=true,col){
  if(G.tilted)return 0;
  const pts=Math.round(base*scoreMult()/10)*10;G.score+=pts;
  if(show&&x!=null)floatText(x,y,fmt(pts),col||'#fff',pts>=10000?24:pts>=2000?20:16);
  if(G.mission&&G.mission.ev==='points')missionProg(pts);
  if(G.score>=G.nextReplay){G.nextReplay=Math.round(G.nextReplay*2.5);awardExtraBall(t('replay'));}
  return pts;
}

  G.combo++;G.comboT=1.8;if(G.skillOn&&G.skillArmed)G.skillOn=false;

}

    case 'drop':{s.on=false;s.flash=1;sfx.drop();const m=G.pw.chili>0?3:1;addScore(300*m,b.x,b.y-20);ev('target');hitCombo();burst(b.x,b.y,'#ffd34d',8,s.icon);
      if(G.T.drops.every(d=>!d.on)){G.banks++;addScore(3000*Math.min(G.banks,5),260,500,true,'#ffd34d');msg(t('drops'),'#ffd34d');ev('drops');litLock();G.dropReset=1.3;}break;}
    case 'herd':{s.flash=1;const m=G.pw.chili>0?3:1;
      if(!s.lit){s.lit=true;addScore(400*m,b.x,b.y-20);animalSound(s.icon);bubble(b.x,b.y-30,L(AN[s.icon].s));albumHit(s.icon);}else{addScore(100*m,b.x,b.y-20);sfx.target();}

function applyPU(id,silent){
  const p=PUM[id];const durM=1+0.15*upg('dur');

    case 'multi':startMultiball(false);break;

    case 'feed':for(let i=0;i<8;i++)G.foods.push({x:rand(100,420),y:rand(170,560),e:pick(G.def.snacks),t:0,life:14,ph:rand(0,6)});break;
    case 'treats':G.coinsGame+=15;sfx.coin();break;
    case 'mystery':{const q=randPU('mystery');later(0.7,()=>applyPU(q.id));break;}
    case 'lock':G.lockLit=true;break;

/* Missions */
function missionTpl(m){return MT.find(x=>x.id===m.id);}
function newMission(){
  const rk=G.rank;let tpl;do{tpl=pick(MT);}while(G.mission&&tpl.id===G.mission.id);
  const sc=1+rk*0.12;let n=Math.max(1,Math.round(tpl.b*sc));
  if(tpl.ev==='points')n=Math.round(tpl.b*sc*(1+rk*0.08)/1000)*1000;
  if(tpl.ev==='combo')n=Math.min(40,Math.round(tpl.b+rk*0.6));
  let time=0;if(tpl.time){n=Math.max(1,Math.round(tpl.b*(1+rk*0.05)));time=tpl.time+Math.min(15,rk*0.4);}
  G.mission={id:tpl.id,ev:tpl.ev,n,p:0,time,tl:time,flash:1};
}
function missionText(m){if(!m)return'';const tpl=missionTpl(m);return L(tpl.s).replace('{n}',fmt(m.n)).replace('{t}',Math.round(m.time));}
function missionProg(a,isMax){
  const m=G.mission;if(!m||G.tilted)return;
  if(isMax)m.p=Math.max(m.p,a);else m.p+=a;
  if(m.p>=m.n)completeMission();
}
function completeMission(){
  const rk=G.rank;G.rank++;P.tb[G.def.id].rank=G.rank;G.missionsGame++;
  const mm=1+0.2*upg('mission');
  const pts=Math.round((8000+2500*rk)*mm);const coins=Math.round((4+rk*0.5)*mm);G.coinsGame+=coins;
  G.mission=null;addScore(pts,260,470,true,'#7fff7f');msg(t('mDone'),'#7fff7f','+'+fmt(Math.round(pts*scoreMult()))+'  +'+coins+'🍬');sfx.mission();ev('mission');
  G.shake=6;burst(260,470,'#7fff7f',30,'📜');
  const r=G.rank;
  later(1.3,()=>{
    if(r%10===0)startParty();else if(r%5===0)startStampede();else if(r%3===0)applyPU(randPU().id);
    if(r%7===0)awardExtraBall();
    if(r%3===0)msg(t('rank')+': '+rankName(r),'#9fe3ff',String(r));
  });
  later(2.2,()=>{if(!G.mission)newMission();});
}

/* Balls & flow */
function spawnLaneBall(){const b=newBall(515,925);G.balls.push(b);return b;}
function laneBusy(){return G.balls.some(b=>b.inLane&&b.y>820);}
function launch(b,power){
  b.vy=-(1600+320*power)*Math.sqrt(G.grav/1450);b.vx=0;b.launchT=1.2;sfx.launch();vib(20);
  if(G.saveArm>0){G.saveT=G.saveArm;G.saveArm=0;}
  if(G.firstLaunch){G.firstLaunch=false;G.skillArmed=true;later(4.5,()=>{G.skillOn=false;});}
}
function startBall(){
  G.tilted=false;G.tiltM=0;G.state='play';G.bonusX=Math.max(G.bonusX||1,1+upg('bonusx'));
  G.cnt={bumper:0,target:0,lane:0,critter:0,loop:0,mission:0,sling:0,spin:0};
  G.pw={};G.mode={stamp:0,party:0};G.hurry=null;G.mb=false;G.loopStreak=0;
  G.saveArm=8+3*upg('save');G.saveT=0;G.skillLane=rint(0,2);G.skillOn=true;G.skillArmed=false;G.firstLaunch=true;
  G.plunge=0;spawnLaneBall();
  msg(t('ballN',G.ballNum,G.ballsTotal),'#fff',quip('start'));
  const sc=[0,0.33,0.66,1][upg('start')];if(Math.random()<sc)later(1.5,()=>applyPU(randPU('xball').id));
}
function drainBall(b){
  G.balls.splice(G.balls.indexOf(b),1);
  if(G.saveT>0&&!G.tilted){G.launchQ++;msg(t('saveMsg'),'#9fe3ff','🦫');ev('save');sfx.save();return;}
  if(G.balls.length+G.launchQ===0){
    ev('drain');sfx.drain();vib([40,60,80]);G.shake=8;
    endBall();
  }else if(G.balls.length+G.launchQ===1&&G.mb){G.mb=false;}
}
function endBall(){
  G.state='bonus';G.mb=false;G.saucerQ.length=0;
  const c=G.cnt;
  const lines=[[t('bumpN'),c.bumper,50],[t('targN'),c.target,250],[t('lanesN'),c.lane,300],[t('critN'),c.critter,1500],[t('loopN'),c.loop,1000],[t('missN'),c.mission,5000]];
  let sum=0;lines.forEach(l=>sum+=l[1]*l[2]);
  const total=G.tilted?0:Math.round(sum*G.bonusX*(1+0.05*upg('pts')));
  G.bonus={lines,sum,total,t:0,quip:G.tilted?t('tilt'):quip('drain')};
  G.pw={};G.mode={stamp:0,party:0};G.hurry=null;G.foods=[];
}
function finishBonus(){
  if(!G.bonus)return;G.score+=G.bonus.total;G.bonus=null;G.bonusX=1;
  if(G.score>=G.nextReplay){G.nextReplay=Math.round(G.nextReplay*2.5);G.ballsTotal++;ev('xball');}
  G.ballNum++;
  if(G.ballNum>G.ballsTotal)gameOver();else startBall();
  saveP();
}
function nudge(){
  if(!G||G.tilted||G.state!=='play')return;
  for(const b of G.balls)if(!b.held&&!b.inLane){b.vx+=rand(-1,1)*170;b.vy-=230;}
  G.tiltM+=1;G.shake=9;vib(30);nz(0.15,0.2,300);
  if(G.tiltM>3.3){G.tilted=true;msg(t('tilt'),'#ff4040');sfx.tilt();ev('tilt');G.T.flippers.forEach(f=>f.on=false);}
  else if(G.tiltM>2.2)msg(t('tiltW'),'#ff8040');
}

/* ===================== UPDATE ===================== */
function updateCritter(dt){
  const C=G.crit,p=G.def.cpath;
  if(C.daze>0){C.daze-=dt;C.vx=C.vy=0;return;}
  C.t+=dt;const ox=C.x,oy=C.y;let x,y;
  if(p.type==='line'||p.type==='sine'){const span=p.x2-p.x1,per=span*2/p.sp,ph=(C.t%per)/per;const u=ph<0.5?ph*2:2-ph*2;x=p.x1+span*u;y=p.y+(p.type==='sine'?Math.sin(C.t*2.2)*p.amp:Math.abs(Math.sin(C.t*6))*-4);C.dir=ph<0.5?1:-1;}
  else if(p.type==='circle'){x=p.cx+Math.cos(C.t*p.sp)*p.r;y=p.cy+Math.sin(C.t*p.sp)*p.r*0.55;C.dir=Math.sin(C.t*p.sp)>0?-1:1;}
  else{x=p.cx+Math.sin(C.t*p.sp)*p.rx;y=p.cy+Math.sin(C.t*p.sp*2)*p.ry;C.dir=Math.cos(C.t*p.sp)>0?1:-1;}
  C.x=x;C.y=y;if(dt>0){C.vx=(x-ox)/dt;C.vy=(y-oy)/dt;}
}
function spawnPickup(){
  const T=G.T;let x,y,ok=false;
  for(let k=0;k<20&&!ok;k++){x=rand(100,420);y=rand(190,570);ok=T.circles.every(c=>Math.hypot(c.x-x,c.y-y)>c.r+34)&&Math.hypot(T.saucer.x-x,T.saucer.y-y)>50;}
  const p=randPU();G.pickups.push({x,y,id:p.id,e:p.e,t:0,life:16,ph:rand(0,6)});
}
function update(dt){
  const T=G.T;G.time+=dt;
  if(G.state==='bonus'){
    if(!G.bonus)return;G.bonus.t+=dt;if(G.bonus.t>4.2)finishBonus();
    updateFx(dt);return;
  }
  const slow=G.pw.slow>0?0.5:1,gdt=dt*slow;
  // inputs -> flippers
  const Lp=!G.tilted&&inp.L(),Rp=!G.tilted&&inp.R();
  const f0=T.flippers[0],f1=T.flippers[1];
  if(Lp&&!f0.on){sfx.flip();if(!G.skillOn){G.laneLit.push(G.laneLit.shift());}}
  if(Rp&&!f1.on){sfx.flip();if(!G.skillOn){G.laneLit.unshift(G.laneLit.pop());}}
  f0.on=Lp;f1.on=Rp;
  const fl=G.pw.giraffe>0?84:68;f0.len=f1.len=fl;
  // plunger
  const ready=G.balls.find(b=>b.inLane&&b.y>880&&Math.abs(b.vy)<60);
  if(ready&&inp.launch()){G.plunge=Math.min(1,G.plunge+dt*1.1);}
  else if(G.plunge>0){if(ready)launch(ready,G.plunge);G.plunge=0;}
  T.plFloor.ay=T.plFloor.by=945+G.plunge*26;
  // radius
  const br=ballRadius();for(const b of G.balls)b.r=b.inLane?11:br;
  // physics
  const SUB=10,h=gdt/SUB;
  for(let s=0;s<SUB;s++){
    updateFlipper(f0,h);updateFlipper(f1,h);
    for(let i=G.balls.length-1;i>=0;i--)stepBall(G.balls[i],h);
    if(G.balls.length>1)ballBall();
  }
  updateCritter(gdt);
  // ball bookkeeping
  for(let i=G.balls.length-1;i>=0;i--){
    const b=G.balls[i];
    b.saucerCD-=dt;b.spinCD-=dt;b.loopT-=dt;b.launchT-=dt;
    if(b.loopT<=0)b.loopFrom=null;
    b.trail.push(b.x,b.y);if(b.trail.length>16)b.trail.splice(0,2);
    if(!b.held&&!b.inLane&&b.y<800&&Math.hypot(b.vx,b.vy)<12){b.idle+=dt;if(b.idle>2.5){b.vy=-700;b.vx=rand(-200,200);b.idle=0;}}else b.idle=0;
    if(b.y>1012||b.x<0||b.x>W){drainBall(b);if(G.state!=='play')return;}
  }
  // saucer queue
  for(let i=G.saucerQ.length-1;i>=0;i--){const q=G.saucerQ[i];q.t-=dt;if(q.t<=0){const S=T.saucer;const b=q.b;b.held=false;const n=Math.hypot(S.ex,S.ey);b.vx=S.ex/n*780+rand(-60,60);b.vy=S.ey/n*780;b.x=S.x+S.ex/n*4;b.y=S.y+S.ey/n*4;b.saucerCD=0.7;sfx.eject();G.saucerQ.splice(i,1);}}
  // auto-launch queue
  if(G.launchQ>0){G.launchCD-=dt;if(G.launchCD<=0&&!laneBusy()){G.launchQ--;G.launchCD=0.8;const b=spawnLaneBall();b.y=920;launch(b,rand(0.15,0.9));}}
  if(G.mb&&G.balls.length+G.launchQ<=1)G.mb=false;
  // timers
  for(const k in G.pw)if(G.pw[k]>0)G.pw[k]-=dt;
  if(G.saveT>0&&!G.balls.every(b=>b.inLane))G.saveT-=dt;
  if(G.mode.stamp>0)G.mode.stamp-=dt;if(G.mode.party>0){G.mode.party-=dt;if(Math.random()<dt*6)burst(rand(60,460),rand(120,700),`hsl(${rand(0,360)},90%,60%)`,4);}
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0){if(G.combo>=5){addScore(Math.min(G.combo,60)*150,260,600,true,'#7dfcff');}G.combo=0;}}
  if(G.loopStreakT>0){G.loopStreakT-=dt;if(G.loopStreakT<=0)G.loopStreak=0;}
  if(G.hurry){G.hurry.t-=dt;G.hurry.v=Math.round(G.hurry.v0*(0.25+0.75*Math.max(0,G.hurry.t)/15)/10)*10;if(G.hurry.t<=0)G.hurry=null;}
  G.tiltM=Math.max(0,G.tiltM-dt*0.6);
  if(G.laneFlash>0){G.laneFlash-=dt;if(G.laneFlash<=0)G.laneLit=[0,0,0];}
  if(G.dropReset>0){G.dropReset-=dt;if(G.dropReset<=0)T.drops.forEach(d=>d.on=true);}
  if(G.herdReset>0){G.herdReset-=dt;if(G.herdReset<=0)T.herd.forEach(d=>d.lit=false);}
  if(G.mission&&G.mission.tl>0&&G.balls.some(b=>!b.inLane)){G.mission.tl-=dt;if(G.mission.tl<=0){msg(t('mFail'),'#ff8080');G.mission=null;later(1.5,()=>{if(!G.mission)newMission();});}}
  if(G.mission&&G.mission.flash>0)G.mission.flash-=dt;
  if(G.mission&&!G.mission.tl&&G.balls.some(b=>!b.inLane)){G.mission.age=(G.mission.age||0)+dt;if(G.mission.age>150){msg(t('mNew'),'#9fe3ff');newMission();}}
  T.spinner.ang+=T.spinner.spd*dt;T.spinner.spd*=Math.pow(0.25,dt);
  for(const c of T.circles)c.pulse=Math.max(0,c.pulse-dt*5);
  for(const s of T.slings)s.flash=Math.max(0,s.flash-dt*5);
  for(const s of T.drops.concat(T.herd))s.flash=Math.max(0,s.flash-dt*3);
  // pickups
  G.puT-=dt;if(G.puT<=0){G.puT=rand(13,21)/(1+0.15*upg('luck'));if(G.pickups.length<2&&G.balls.some(b=>!b.inLane))spawnPickup();}
  for(let i=G.pickups.length-1;i>=0;i--){const p=G.pickups[i];p.t+=dt;const py=p.y+Math.sin(p.t*2+p.ph)*6;
    if(p.t>p.life){G.pickups.splice(i,1);continue;}
    for(const b of G.balls)if(!b.held&&Math.hypot(b.x-p.x,b.y-py)<b.r+18){G.pickups.splice(i,1);addScore(500,p.x,py-20);burst(p.x,py,'#bff',16,p.e);ev('pickup');hitCombo();applyPU(p.id);break;}}
  for(let i=G.foods.length-1;i>=0;i--){const p=G.foods[i];p.t+=dt;if(p.t>p.life){G.foods.splice(i,1);continue;}
    for(const b of G.balls)if(!b.held&&Math.hypot(b.x-p.x,b.y-p.y)<b.r+15){G.foods.splice(i,1);addScore(1000,p.x,p.y-20,true,'#ffe36a');VOICE.chomp();burst(p.x,p.y,'#ffe36a',8);ev('food');hitCombo();break;}}
  for(let i=G.timers.length-1;i>=0;i--){const tm=G.timers[i];tm.t-=dt;if(tm.t<=0){G.timers.splice(i,1);tm.fn();}}
  updateFx(dt);
  // play time & achievements
  st('playSec',dt);G.achT+=dt;if(G.achT>1.5){G.achT=0;checkAch();}
}
function updateFx(dt){
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;if(p.t>p.d)G.parts.splice(i,1);}
  for(let i=G.texts.length-1;i>=0;i--){const p=G.texts[i];p.t+=dt;p.y-=40*dt;if(p.t>1)G.texts.splice(i,1);}
  for(let i=G.bubbles.length-1;i>=0;i--){const p=G.bubbles[i];p.t+=dt;if(p.t>1.1)G.bubbles.splice(i,1);}
  if(G.msgs.length){G.msgs[0].t+=dt;if(G.msgs[0].t>G.msgs[0].d)G.msgs.shift();}
  G.shake=Math.max(0,G.shake-dt*30);G.slingEye=Math.max(0,G.slingEye-dt*3);
  if(G.def.current||G.def.id==='ocean'){if(Math.random()<dt*4)G.ambient.push({x:rand(30,490),y:990,v:rand(30,80),r:rand(2,6)});}
  if(G.def.id==='arctic'||G.def.id==='space'){if(Math.random()<dt*5)G.ambient.push({x:rand(30,490),y:-5,v:-rand(20,60),r:rand(1,3)});}
  for(let i=G.ambient.length-1;i>=0;i--){const a=G.ambient[i];a.y-=a.v*dt;a.x+=Math.sin(G.time+i)*10*dt;if(a.y<-10||a.y>1000)G.ambient.splice(i,1);}
}

/* ===================== RENDERING ===================== */
const cv=$('#cv'),ctx=cv.getContext('2d');

function rrect(x,y,w,h,r,c2=ctx){c2.beginPath();c2.moveTo(x+r,y);c2.arcTo(x+w,y,x+w,y+h,r);c2.arcTo(x+w,y+h,x,y+h,r);c2.arcTo(x,y+h,x,y,r);c2.arcTo(x,y,x+w,y,r);c2.closePath();}

function resize(){

function tablePath(x){x.beginPath();x.moveTo(20,290);x.arc(275,290,255,Math.PI,Math.PI*2);x.lineTo(530,1000);x.lineTo(20,1000);x.closePath();}

  x.globalAlpha=0.13;x.textAlign='center';x.textBaseline='middle';fitText(L(def.n).toUpperCase(),260,700,300,44,700,0,'#fff',x);

const KEYL=['ArrowLeft','KeyZ','ShiftLeft','KeyA'],KEYR=['ArrowRight','KeyM','ShiftRight','Slash','KeyL'],KEYLA=['Space','ArrowDown','Enter'],KEYN=['ArrowUp','KeyN','KeyX'];
addEventListener('keydown',e=>{
  lastInput='kb';initAudio();
  if(uiShown()){
    const map={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'LF',ArrowRight:'RT2',KeyW:'U',KeyS:'D',KeyA:'LF',KeyD:'RT2'};
    if(map[e.code]){navMove(map[e.code]);e.preventDefault();}
    else if(e.code==='Enter'||e.code==='Space'){navActivate();e.preventDefault();}
    else if(e.code==='Escape'||e.code==='Backspace'){navBack();e.preventDefault();}
    return;
  }
  if(!G||!G.active)return;
  if(e.repeat&&!KEYL.includes(e.code)&&!KEYR.includes(e.code))return;
  if(KEYL.includes(e.code)){kb.L=true;e.preventDefault();}
  if(KEYR.includes(e.code)){kb.R=true;e.preventDefault();}
  if(KEYLA.includes(e.code)){kb.launch=true;e.preventDefault();if(G.state==='bonus'&&G.bonus&&G.bonus.t>0.8)finishBonus();}
  if(KEYN.includes(e.code)&&!e.repeat){nudge();e.preventDefault();}
  if(e.code==='Escape'||e.code==='KeyP')pauseGame();
});
addEventListener('keyup',e=>{
  if(KEYL.includes(e.code))kb.L=false;if(KEYR.includes(e.code))kb.R=false;if(KEYLA.includes(e.code))kb.launch=false;

// gamepad
const padPrev={},padRep={};
function pollPad(dt){
  const pads=navigator.getGamepads?navigator.getGamepads():[];let p=null;
  for(const x of pads)if(x&&x.connected){p=x;break;}
  if(!p){gpI.L=gpI.R=gpI.launch=false;return;}
  const b=i=>!!(p.buttons[i]&&(p.buttons[i].pressed||p.buttons[i].value>0.35));
  const ax=p.axes[0]||0,ay=p.axes[1]||0;
  const s={A:b(0),B:b(1),X:b(2),Y:b(3),LB:b(4),RB:b(5),LT:b(6),RT:b(7),SEL:b(8),ST:b(9),DU:b(12),DD:b(13),U:b(12)||ay<-0.55,D:b(13)||ay>0.55,LF:b(14)||ax<-0.55,RT2:b(15)||ax>0.55};
  const pr=k=>s[k]&&!padPrev[k];
  if(Object.values(s).some(v=>v))lastInput='pad';
  if(uiShown()){
    gpI.L=gpI.R=gpI.launch=false;
    for(const d of ['U','D','LF','RT2']){
      if(s[d]){padRep[d]=(padRep[d]||0)-dt;if(pr(d)){navMove(d);padRep[d]=0.4;}else if(padRep[d]<=0){navMove(d);padRep[d]=0.13;}}
    }
    if(pr('A'))navActivate();
    if(pr('B'))navBack();
    if(pr('ST')){if(curScreen&&curScreen.name==='pause')resumeGame();else if(curScreen&&curScreen.name==='splash')navActivate();}
  }else if(G&&G.active&&!G.paused){
    gpI.L=s.LB||s.LT||s.X||s.LF;gpI.R=s.RB||s.RT||s.B||s.RT2;gpI.launch=s.A||s.DD;
    if(pr('Y')||pr('DU'))nudge();
    if(pr('ST')||pr('SEL'))pauseGame();
    if(G.state==='bonus'&&G.bonus&&G.bonus.t>0.8&&(pr('A')||pr('LB')||pr('RB')))finishBonus();
  }
  Object.assign(padPrev,s);
}

}

const UI=$('#ui');let curScreen=null,focusEl=null,resetArm=0;
function toast(txt,ms=2000){const el=$('#toast');el.textContent=txt;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),ms);}
function show(name,arg){curScreen={name,arg};UI.innerHTML=SCREENS[name](arg);UI.classList.add('show');focusEl=null;
  if(lastInput!=='touch'){const els=navEls();if(els.length)setFocus(els[0]);}}
function rerender(){if(!curScreen)return;const els=navEls();const idx=focusEl?els.indexOf(focusEl):-1;const pn=UI.querySelector('.panel');const sc=pn?pn.scrollTop:0;
  UI.innerHTML=SCREENS[curScreen.name](curScreen.arg);const pn2=UI.querySelector('.panel');if(pn2)pn2.scrollTop=sc;focusEl=null;const e2=navEls();if(idx>=0&&e2[idx])setFocus(e2[idx],true);}
function hideUI(){UI.classList.remove('show');UI.innerHTML='';curScreen=null;focusEl=null;}
function navEls(){return[...UI.querySelectorAll('[data-a]')];}
function setFocus(el,noScroll){if(focusEl)focusEl.classList.remove('focus');focusEl=el;if(el){el.classList.add('focus');if(!noScroll)el.scrollIntoView({block:'nearest',inline:'nearest'});}}
function navMove(dir){
  const els=navEls();if(!els.length)return;
  if(!focusEl||!UI.contains(focusEl)){setFocus(els[0]);return;}
  const r=focusEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
  for(const e of els){if(e===focusEl)continue;const q=e.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy;let pr,se;
    if(dir==='U'){if(dy>-4)continue;pr=-dy;se=Math.abs(dx);}else if(dir==='D'){if(dy<4)continue;pr=dy;se=Math.abs(dx);}
    else if(dir==='LF'){if(dx>-4)continue;pr=-dx;se=Math.abs(dy);}else{if(dx<4)continue;pr=dx;se=Math.abs(dy);}
    const sc=pr+se*2.5;if(sc<bs){bs=sc;best=e;}}
  if(best){setFocus(best);sfx.ui();}
  else if(dir==='D'||dir==='U'){setFocus(dir==='D'?els[0]:els[els.length-1]);sfx.ui();}
}
function navActivate(){if(curScreen&&curScreen.name==='splash')return ACT.start();if(focusEl&&UI.contains(focusEl))focusEl.click();else{const els=navEls();if(els.length)setFocus(els[0]);}}
function navBack(){
  if(!curScreen)return;const n=curScreen.name;sfx.ui();
  if(n==='pause')return resumeGame();
  if(n==='splash')return navActivate();
  if(n==='title')return;
  if(n==='settings'||n==='howto'){if(curScreen.arg==='pause')return show('pause');}
  if(n==='over')return show('title');
  show('title');
}

  ${D.tasks.map(tk=>{const d=DT[tk.i],n=d.b[tk.tier];return`<div class="card" data-a="noop" style="text-align:left;margin:8px 0"><b>${tk.done?'✅':'📌'} ${L(d.s).replace('{n}',fmt(n))}</b>
  <div class="bar"><i style="width:${Math.min(100,tk.p/n*100)}%"></i></div><small>${fmt(tk.p)}/${fmt(n)} · ${t('reward')}: 🍬 ${dailyReward(tk.tier)}</small></div>`;}).join('')}
  <p class="sub">${D.all?'🎉 '+t('newDay'):'🎁 +100 🍬 '+(LANG==='sv'?'när alla är klara':'when all are done')}</p>
  <button class="btn gray" data-a="go" data-v="title">${t('back')}</button></div>`;},
settings:(from)=>{const vol=v=>v===0?t('off'):Math.round(v*100)+'%';const back=from==='pause'?'pause':'title';
  return`<div class="panel"><h2>${t('settings')}</h2>
  <div class="set"><span>🌐 ${t('lang')}</span><button class="btn alt" data-a="lang">${LANG==='sv'?'🇸🇪 Svenska':'🇬🇧 English'}</button></div>
  <div class="set"><span>🔊 ${t('sfx')}</span><button class="btn alt" data-a="set" data-v="sfx">${vol(P.set.sfx)}</button></div>
  <div class="set"><span>🎵 ${t('music')}</span><button class="btn alt" data-a="set" data-v="music">${vol(P.set.music)}</button></div>
  <div class="set"><span>📳 ${t('vib')}</span><button class="btn alt" data-a="set" data-v="vib">${P.set.vib?t('on'):t('off')}</button></div>
  <div class="set"><span>⛶ ${t('fs')}</span><button class="btn alt" data-a="set" data-v="fs">${P.set.fs?t('on'):t('off')}</button></div>
  <p class="sub" style="font-size:14px">${t('gpHint')}<br>${t('kbHint')}</p>
  ${from==='pause'?'':`<button class="btn gray small" data-a="reset">🗑️ ${t('reset')}</button>`}
  <button class="btn gray" data-a="go" data-v="${back}">${t('back')}</button></div>`;},
howto:(from)=>`<div class="panel"><h2>${t('howto')}</h2><div class="howto">${t('howtoTxt')}</div>
  <h3>🫧 ${t('powerups')}</h3><div class="grid">${PU.map(p=>`<div class="card" data-a="noop"><div class="big">${p.e}</div><b>${L(p.n)}</b><small>${L(p.d)}</small></div>`).join('')}</div>
  <button class="btn gray" data-a="go" data-v="${from==='pause'?'pause':'title'}">${t('back')}</button></div>`,
pause:()=>`<div class="panel"><h2>⏸ ${t('paused')}</h2><p class="sub">${G.def.e} ${L(G.def.n)} · ${t('score')}: ${fmt(G.score)}</p>
  ${G.mission?`<div class="card" style="text-align:left"><b>📜 ${missionText(G.mission)}</b><div class="bar"><i style="width:${Math.min(100,G.mission.p/G.mission.n*100)}%"></i></div><small>${t('rank')}: ${G.rank} · ${rankName(G.rank)}</small></div>`:''}
  <button class="btn green" data-a="resume">${t('resume')}</button>
  <div class="row"><button class="btn alt" data-a="go" data-v="settings">${t('settings')}</button><button class="btn alt" data-a="go" data-v="howto">${t('howto')}</button></div>
  <button class="btn gray" data-a="restart">${t('restart')}</button><button class="btn gray" data-a="quit">${t('quit')}</button></div>`,
over:(r)=>{const d=TABLES[r.ti];return`<div class="panel"><h2>${t('over')}</h2><p class="sub">${d.e} ${L(d.n)}</p>
  ${r.newBest?`<div class="blink" style="color:#ffd84a;font-size:24px;font-weight:700">🏆 ${t('newBest')}</div>`:''}
  <div style="font-size:48px;font-weight:700;margin:4px 0">${fmt(r.score)}</div>
  <div style="color:#ffd84a;font-size:30px">${stars(r.stars)}${r.newStars>0?' <span class="blink" style="font-size:18px">+'+r.newStars+'★</span>':''}</div>
  <div class="topbar" style="justify-content:center"><span class="pill">${t('best')}: ${fmt(r.best)}</span><span class="pill">📜 ${r.missions}</span></div>
  <div class="topbar" style="justify-content:center"><span class="pill">+${fmt(r.coins)} 🍬</span><span class="pill">+${fmt(r.xp)} XP</span>${r.ups?`<span class="pill">🎓 ${t('levelUp',P.level)}</span>`:''}</div>
  ${r.newTable?`<p style="color:#7fff7f;font-size:20px;font-weight:700">🔓 ${t('unlockedT',r.newTable.e+' '+L(r.newTable.n))}</p>`:''}
  <button class="btn green" data-a="again" data-v="${r.ti}">${t('again')}</button>
  <div class="row"><button class="btn alt" data-a="go" data-v="tables">${t('tables')}</button><button class="btn gray" data-a="go" data-v="title">${t('menu')}</button></div></div>`;},
};

/* ===================== MAIN LOOP ===================== */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  sndCount=0;pollPad(dt);musicTick();
  if(inGame())update(dt);
  render(dt);
}
function autosave(){if(saveP()&&G&&G.active)toast(t('saved'),1200);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveP();if(G&&G.active)pauseGame();if(AC&&AC.state==='running')AC.suspend();}else if(AC)AC.resume();});
addEventListener('pagehide',()=>saveP());
addEventListener('resize',()=>setTimeout(resize,60));
document.addEventListener('fullscreenchange',()=>setTimeout(resize,100));
loadP();ensureDaily();document.documentElement.lang=LANG;resize();setMusic(TABLES[0].music);show('splash');
setInterval(autosave,30000);
requestAnimationFrame(frame);
</script>
</body>
</html>
