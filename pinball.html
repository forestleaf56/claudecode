/* Daily challenges */
function ensureDaily(){
  const d=todayStr();
  if(P.daily&&P.daily.date===d)return;
  const r=seeded(hashStr(d)+7);const ids=[...DT.keys()];const tasks=[];
  const tiers=[0,1,2];
  for(let k=0;k<3;k++){const j=Math.floor(r()*ids.length);const ti=ids.splice(j,1)[0];tasks.push({i:ti,tier:tiers[k],p:0,done:false});}
  P.daily={date:d,tasks,all:false,streak:(P.daily&&P.daily.streak)||0,lastAll:(P.daily&&P.daily.lastAll)||null};
}
const dailyReward=tier=>[40,60,90][tier];
function dailyEv(ev,amt){
  if(!P.daily)return;
  for(const tk of P.daily.tasks){
    const d=DT[tk.i];if(tk.done||d.ev!==ev)continue;
    if(d.max)tk.p=Math.max(tk.p,amt);else tk.p+=amt;
    const n=d.b[tk.tier];
    if(tk.p>=n){tk.p=n;tk.done=true;P.coins+=dailyReward(tk.tier);toast(t('dailyGot',dailyReward(tk.tier)),3000);sfx.coin();}
  }
  if(!P.daily.all&&P.daily.tasks.every(x=>x.done)){
    P.daily.all=true;const y=new Date();y.setDate(y.getDate()-1);
    const yd=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
    P.daily.streak=P.daily.lastAll===yd?P.daily.streak+1:1;P.daily.lastAll=P.daily.date;
    const bonus=100+Math.min(10,P.daily.streak)*10;P.coins+=bonus;st('dailyAll');
    setTimeout(()=>toast(t('allDaily',bonus)+' · '+t('streak',P.daily.streak),3500),3200);
  }
}

let AC=null,sfxG=null,musG=null,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    const m=AC.createGain();m.connect(AC.destination);

    musIn=AC.createGain();const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;musIn.connect(lp);lp.connect(musG);
    try{const len=Math.floor(AC.sampleRate*2.2),ir=AC.createBuffer(2,len,AC.sampleRate);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
      const cv2=AC.createConvolver();cv2.buffer=ir;const wet=AC.createGain();wet.gain.value=0.28;musIn.connect(cv2);cv2.connect(wet);wet.connect(musG);}catch(e){}
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    applyVol();

let sndCount=0;
function osc(type,f0,f1,dur,vol,t0=0,dest=sfxG,vib=0){
  if(!AC||!dest)return;if(dest===sfxG&&(P.set.sfx<=0||sndCount>14))return;if(dest===sfxG)sndCount++;
  const t=AC.currentTime+t0;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=vib;lg.gain.value=f0*0.06;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+0.05);}
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.05);
}
function nz(dur,vol,freq=2000,t0=0,dest=sfxG){
  if(!AC||!dest||!noiseBuf)return;if(dest===sfxG&&(P.set.sfx<=0||sndCount>14))return;if(dest===sfxG)sndCount++;
  const t=AC.currentTime+t0;const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=1.2;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);
}

// one musical voice with smooth envelope, optional glide, vibrato and low-pass
function mo(type,f,t,dur,vol,o={}){
  if(!AC||!musIn)return;
  const os=AC.createOscillator(),g=AC.createGain();os.type=type;
  os.frequency.setValueAtTime(o.from||f,t);if(o.from)os.frequency.exponentialRampToValueAtTime(f,t+(o.glide||0.06));
  const rel=o.rel||0.12,a=o.a||0.006;
  if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.vib;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*(o.vibD||0.012),t+0.18);l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+rel+0.05);}
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+a);
  if(o.hold){g.gain.setValueAtTime(vol,t+Math.max(a+0.01,dur-0.05));g.gain.exponentialRampToValueAtTime(0.0001,t+dur+rel);}
  else g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(a+0.02,dur));
  let out=g;if(o.lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(o.lp,t);if(o.lpTo)fl.frequency.exponentialRampToValueAtTime(o.lpTo,t+dur);fl.Q.value=o.q||0.7;g.connect(fl);out=fl;}
  os.connect(g);out.connect(musIn);os.start(t);os.stop(t+dur+rel+0.08);
}
function mnoise(t,dur,vol,freq,type='bandpass'){
  if(!AC||!musIn||!noiseBuf)return;const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=0.8;

}

function colCirc(b,c,svx=0,svy=0){

  const map={bumper:'bumpers',sling:'slings',critter:'critters',target:'targets',mission:'missions',pickup:'powerups',mole:'moles',portal:'portals',mill:'mills',mover:'movers',mini:'minis',quake:'quakes',multiball:'multiballs',jackpot:'jackpots',loop:'loops',spin:'spins',skill:'skillShots',save:'saves',drain:'drains',tilt:'tilts',stampede:'stampedes',party:'parties',xball:'xballs',saucer:'dens',lanes:'lanesDone',drops:'dropBanks',herd:'herds',food:'foods'};
  if(map[name])st(map[name],amt);
  if(G.mission&&G.mission.ev===name&&G.mission.ev!=='combo')missionProg(amt);
  dailyEv(name,amt);
}
function msg(txt,col='#ffe14a',sub=''){G.msgs.push({txt,col,sub,t:0,d:1.9});if(G.msgs.length>4)G.msgs.splice(1,1);}
function floatText(x,y,txt,col='#fff',size=16){G.texts.push({x,y,txt,col,size,t:0});if(G.texts.length>40)G.texts.shift();}
function bubble(x,y,txt){G.bubbles.push({x,y,txt,t:0});if(G.bubbles.length>5)G.bubbles.shift();}
function burst(x,y,col,n=10,emoji){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(80,340);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,t:0,d:rand(0.4,0.9),col,size:rand(2,5),e:emoji});}if(G.parts.length>260)G.parts.splice(0,G.parts.length-260);}

function onSegHit(b,s,imp){
  if((s.kind==='drop'||s.kind==='herd')&&imp<40)return;
  switch(s.kind){
    case 'sling':if(imp>50){b.vx+=CN.x*640;b.vy+=CN.y*640;s.flash=1;sfx.sling();addScore(30,b.x,b.y-20,false);ev('sling');hitCombo();G.slingEye=1;}break;
    case 'drop':{s.on=false;s.flash=1;sfx.drop();const m=G.pw.chili>0?3:1;addScore(300*m,b.x,b.y-20);ev('target');hitCombo();burst(b.x,b.y,'#ffd34d',8,s.icon);
      if(G.T.drops.every(d=>!d.on)){G.banks++;addScore(3000*Math.min(G.banks,5),260,500,true,'#ffd34d');msg(t('drops'),'#ffd34d');ev('drops');litLock();G.dropReset=1.3;}break;}
    case 'herd':{s.flash=1;const m=G.pw.chili>0?3:1;
      if(!s.lit){s.lit=true;addScore(400*m,b.x,b.y-20);animalSound(s.icon);bubble(b.x,b.y-30,L(AN[s.icon].s));albumHit(s.icon);}else{addScore(100*m,b.x,b.y-20);sfx.target();}
      ev('target');hitCombo();
      if(G.herdReset<=0&&G.T.herd.every(d=>d.lit)){G.herds++;addScore(4000,260,500,true,'#9fffa0');msg(t('herd'),'#9fffa0');ev('herd');litLock();G.herdReset=1.6;if(G.herds%2===0)startHurry();}break;}
    case 'arc':case 'wall':if(imp>700)sfx.wall();break;
  }
}
function onCircHit(b,c,imp){
  if(c.kind==='bumper'){
    const kick=c.kick*(G.pw.chili>0?1.2:1);b.vx+=CN.x*kick;b.vy+=CN.y*kick;c.pulse=1;
    const m=(G.pw.gold>0?5:1)*(G.pw.big>0?3:1);addScore(100*m,c.x,c.y-c.r-8,true,G.pw.gold>0?'#ffd700':'#fff');
    if(c.mover)ev('mover');animalSound(c.e2);if(Math.random()<0.45)bubble(c.x,c.y-c.r-18,L(AN[c.e2].s));
    burst(c.x+CN.x*c.r,c.y+CN.y*c.r,G.def.col.acc,6);G.shake=Math.max(G.shake,2);
    ev('bumper');hitCombo();albumHit(c.e2);if(G.mb)G.jpVal+=250;vib(8);
  }else if(c.kind==='post'){b.vx+=CN.x*c.kick;b.vy+=CN.y*c.kick;c.pulse=1;sfx.post();addScore(50,c.x,c.y-20,false);hitCombo();}
}
function onCritterHit(b,imp){

function onMole(b,m){m.up=0;m.cd=rand(2,5);m.hitT=0.6;addScore(1500,m.x,m.y-34,true,'#ffd27a');animalSound(m.em);bubble(m.x,m.y-46,t('ouch'));albumHit(m.em);ev('mole');hitCombo();burst(m.x,m.y,'#c9a06a',10);vib(15);}
function onPortal(a,o){addScore(750,o.x,o.y-28,true,'#9ff');ev('portal');hitCombo();osc('sine',300,1500,0.25,0.14);burst(a.x,a.y,'#4ac8ff',10);burst(o.x,o.y,'#ff9a3c',10);floatText(o.x,o.y+28,'WHOOSH!','#ffd',14);}

function onSpinner(b){

}
function later(d,fn){G.timers.push({t:d,fn});}
function startHurry(){if(G.hurry)return;G.hurry={v0:40000+4000*Math.min(G.rank,25),v:0,t:15};G.hurry.v=G.hurry.v0;msg(t('hurry',L(AN[G.def.critter].n)),'#ff6');}
function awardExtraBall(label){G.ballsTotal++;msg(label||t('xb'),'#ff6b6b','❤️');ev('xball');sfx.jackpot();}
function randPU(excl){
  const pool=PU.filter(p=>p.id!==excl&&!(p.id==='multi'&&G.balls.length>1)&&!(p.id==='xball'&&G.ballsTotal-G.ballNum>3));
  let tot=pool.reduce((a,p)=>a+p.w,0),r=Math.random()*tot;for(const p of pool){r-=p.w;if(r<=0)return p;}return pool[0];
}
function applyPU(id,silent){
  const p=PUM[id];const durM=1+0.15*upg('dur');
  if(!silent){msg(p.e+' '+L(p.n),'#9fffa0',L(p.d));sfx.power();}
  switch(id){
    case 'multi':startMultiball(false);break;
    case 'roo':G.ch.roo+=3;break;
    case 'kick':G.ch.kick+=2;break;
    case 'xball':awardExtraBall();break;
    case 'bonusx':G.bonusX=Math.min(10,G.bonusX+1);break;
    case 'feed':for(let i=0;i<8;i++)G.foods.push({x:rand(100,420),y:rand(170,560),e:pick(G.def.snacks),t:0,life:14,ph:rand(0,6)});break;
    case 'treats':G.coinsGame+=15;sfx.coin();break;
    case 'mystery':{const q=randPU('mystery');later(0.7,()=>applyPU(q.id));break;}
    case 'lock':G.lockLit=true;break;
    case 'hurry':startHurry();break;
    case 'save':G.saveT=Math.max(G.saveT,p.dur*durM);break;
    case 'big':G.pw.tiny=0;G.pw.big=p.dur*durM;break;
    case 'tiny':G.pw.big=0;G.pw.tiny=p.dur*durM;break;
    default:if(p.dur)G.pw[id]=(G.pw[id]>0?G.pw[id]:0)+p.dur*durM;
  }
}
function startStampede(){G.mode.stamp=20;msg(t('stamp'),'#ff9a3c','x3');ev('stampede');G.shake=10;for(let i=0;i<5;i++)later(i*0.2,()=>VOICE.roar());}
function startParty(){G.mode.party=30;msg(t('party'),'#ff5af0','x5 🎉');ev('party');G.launchQ+=2;G.saveT=Math.max(G.saveT,12);sfx.jackpot();}

/* Missions */
function missionTpl(m){return MT.find(x=>x.id===m.id);}
function newMission(){
  const rk=G.rank;const pool=MT.filter(m=>!m.need||G.def[m.need]);let tpl;do{tpl=pick(pool);}while(G.mission&&tpl.id===G.mission.id);
  const sc=1+rk*0.12;let n=Math.max(1,Math.round(tpl.b*sc));
  if(tpl.ev==='points')n=Math.round(tpl.b*sc*(1+rk*0.08)/1000)*1000;
  if(tpl.ev==='combo')n=Math.min(40,Math.round(tpl.b+rk*0.6));
  let time=0;if(tpl.time){n=Math.max(1,Math.round(tpl.b*(1+rk*0.05)));time=tpl.time+Math.min(15,rk*0.4);}
  G.mission={id:tpl.id,ev:tpl.ev,n,p:0,time,tl:time,flash:1};
}
function missionText(m){if(!m)return'';const tpl=missionTpl(m);return L(tpl.s).replace('{n}',fmt(m.n)).replace('{t}',Math.round(m.time));}
function missionProg(a,isMax){
  const m=G.mission;if(!m||G.tilted)return;
  if(isMax)m.p=Math.max(m.p,a);else m.p+=a;
  if(m.p>=m.n)completeMission();
}
function completeMission(){
  const rk=G.rank;G.rank++;P.tb[G.def.id].rank=G.rank;G.missionsGame++;
  const mm=1+0.2*upg('mission');
  const pts=Math.round((8000+2500*rk)*mm);const coins=Math.round((4+rk*0.5)*mm);G.coinsGame+=coins;
  G.mission=null;addScore(pts,260,470,true,'#7fff7f');msg(t('mDone'),'#7fff7f','+'+fmt(Math.round(pts*scoreMult()))+'  +'+coins+'🍬');sfx.mission();ev('mission');
  G.shake=6;burst(260,470,'#7fff7f',30,'📜');
  const r=G.rank;
  later(1.3,()=>{
    if(r%10===0)startParty();else if(r%5===0)startStampede();else if(r%3===0)applyPU(randPU().id);
    if(r%7===0)awardExtraBall();
    if(r%3===0)msg(t('rank')+': '+rankName(r),'#9fe3ff',String(r));
  });
  later(2.2,()=>{if(!G.mission)newMission();});
}

/* Balls & flow */
function spawnLaneBall(){const b=newBall(515,925);G.balls.push(b);return b;}
function laneBusy(){return G.balls.some(b=>b.inLane&&b.y>820);}
function launch(b,power){
  b.vy=-(1600+320*power)*Math.sqrt(G.grav/1450);b.vx=0;b.launchT=1.2;sfx.launch();vib(20);
  if(G.saveArm>0){G.saveT=G.saveArm;G.saveArm=0;}
  if(G.firstLaunch){G.firstLaunch=false;G.skillArmed=true;later(4.5,()=>{G.skillOn=false;});}
}
function startBall(){
  G.tilted=false;G.tiltM=0;G.state='play';G.bonusX=Math.max(G.bonusX||1,1+upg('bonusx'));
  G.cnt={bumper:0,target:0,lane:0,critter:0,loop:0,mission:0,sling:0,spin:0};
  G.pw={};G.mode={stamp:0,party:0};G.hurry=null;G.mb=false;G.loopStreak=0;
  G.saveArm=8+3*upg('save');if(G.def.startRoo)G.ch.roo=Math.max(G.ch.roo,G.def.startRoo);G.saveT=0;G.skillLane=rint(0,2);G.skillOn=true;G.skillArmed=false;G.firstLaunch=true;
  G.plunge=0;spawnLaneBall();
  msg(t('ballN',G.ballNum,G.ballsTotal),'#fff',quip('start'));
  const sc=[0,0.33,0.66,1][upg('start')];if(Math.random()<sc)later(1.5,()=>applyPU(randPU('xball').id));
}
function drainBall(b){
  G.balls.splice(G.balls.indexOf(b),1);
  if(G.saveT>0&&!G.tilted){G.launchQ++;msg(t('saveMsg'),'#9fe3ff','🦫');ev('save');sfx.save();return;}
  if(G.balls.length+G.launchQ===0){
    ev('drain');sfx.drain();vib([40,60,80]);G.shake=8;
    endBall();
  }else if(G.balls.length+G.launchQ===1&&G.mb){G.mb=false;}
}
function endBall(){
  G.state='bonus';G.mb=false;G.saucerQ.length=0;
  const c=G.cnt;
  const lines=[[t('bumpN'),c.bumper,50],[t('targN'),c.target,250],[t('lanesN'),c.lane,300],[t('critN'),c.critter,1500],[t('loopN'),c.loop,1000],[t('missN'),c.mission,5000]];
  let sum=0;lines.forEach(l=>sum+=l[1]*l[2]);
  const total=G.tilted?0:Math.round(sum*G.bonusX*(1+0.05*upg('pts')));
  G.bonus={lines,sum,total,t:0,quip:G.tilted?t('tilt'):quip('drain')};
  G.pw={};G.mode={stamp:0,party:0};G.hurry=null;G.foods=[];
}
function finishBonus(){
  if(!G.bonus)return;G.score+=G.bonus.total;G.bonus=null;G.bonusX=1;
  if(G.score>=G.nextReplay){G.nextReplay=Math.round(G.nextReplay*2.5);G.ballsTotal++;ev('xball');}
  G.ballNum++;
  if(G.ballNum>G.ballsTotal)gameOver();else startBall();
  saveP();
}
function nudge(){
  if(!G||G.tilted||G.state!=='play')return;
  for(const b of G.balls)if(!b.held&&!b.inLane){b.vx+=rand(-1,1)*170;b.vy-=230;}
  G.tiltM+=1;G.shake=9;vib(30);nz(0.15,0.2,300);
  if(G.tiltM>3.3){G.tilted=true;msg(t('tilt'),'#ff4040');sfx.tilt();ev('tilt');G.T.flippers.forEach(f=>f.on=false);}
  else if(G.tiltM>2.2)msg(t('tiltW'),'#ff8040');
}

/* ===================== GAME START / SNAPSHOT ===================== */

function startGame(ti,snap){
  const def=TABLES[ti];P.lastTable=ti;
  G={active:true,over:false,ti,def,T:buildTable(def),balls:[],score:0,ballNum:1,ballsTotal:3+upg('xball'),bonusX:1,

    laneLit:[0,0,0],laneFlash:0,cnt:{},locks:0,lockLit:false,mb:false,jpCount:0,jpVal:0,banks:0,herds:0,

    combo:0,comboT:0,tiltM:0,tilted:false,saveT:0,saveArm:0,launchQ:0,launchCD:0.5,saucerQ:[],dropReset:0,herdReset:0,
    crit:{x:260,y:600,vx:0,vy:0,r:20,t:0,daze:0,hits:0,dir:1},puT:9,shake:0,time:0,nextReplay:def.stars[1],

  VIEW.camY=H-VIEW.LH;setMusic(def.id);makeStatic();hideUI();showHudBtns(true);

function gameOver(){
  G.over=true;G.active=false;G.state='over';showHudBtns(false);
  const def=G.def,tb=P.tb[def.id];const wasUnlocked=unlockedCount();const oldStars=starsFor(G.ti);

  const coins=Math.round((G.score/10000+G.coinsGame+G.missionsGame*3)*(1+0.1*upg('coin')));P.coins+=coins;
  const xp=Math.round(G.score/2500+G.missionsGame*25+10);const ups=addXP(xp);

  const res={score:G.score,newBest,best:tb.best,coins,xp,ups,stars:starsFor(G.ti),newStars:starsFor(G.ti)-oldStars,ti:G.ti,
    newTable:unlockedCount()>wasUnlocked?TABLES[unlockedCount()-1]:null,missions:G.missionsGame};
  saveP();
  setMusic('menu');
  show('over',res);
}
function quitGame(){
  if(G&&G.active){P.save=snapshot();}
  if(G)G.active=false;showHudBtns(false);saveP();setMusic('menu');show('title');
}

/* ===================== UPDATE ===================== */
function updateCritter(dt){
  const C=G.crit,p=G.def.cpath;
  if(C.daze>0){C.daze-=dt;C.vx=C.vy=0;return;}
  C.t+=dt;const ox=C.x,oy=C.y;let x,y;
  if(p.type==='line'||p.type==='sine'){const span=p.x2-p.x1,per=span*2/p.sp,ph=(C.t%per)/per;const u=ph<0.5?ph*2:2-ph*2;x=p.x1+span*u;y=p.y+(p.type==='sine'?Math.sin(C.t*2.2)*p.amp:Math.abs(Math.sin(C.t*6))*-4);C.dir=ph<0.5?1:-1;}
  else if(p.type==='circle'){x=p.cx+Math.cos(C.t*p.sp)*p.r;y=p.cy+Math.sin(C.t*p.sp)*p.r*0.55;C.dir=Math.sin(C.t*p.sp)>0?-1:1;}

      if(s[d]){padRep[d]=(padRep[d]||0)-dt;if(pr(d)){navMove(d);padRep[d]=0.4;}else if(padRep[d]<=0){navMove(d);padRep[d]=0.13;}}
    }
    if(pr('A'))navActivate();
    if(pr('B'))navBack();
    if(pr('ST')){if(curScreen&&curScreen.name==='pause')resumeGame();else if(curScreen&&curScreen.name==='splash')navActivate();}
  }else if(G&&G.active&&!G.paused){
    gpI.L=s.LB||s.LT||s.X||s.LF;gpI.R=s.RB||s.RT||s.B||s.RT2;gpI.launch=s.A||s.DD;
    if(pr('Y')||pr('DU'))nudge();
    if(pr('ST')||pr('SEL'))pauseGame();
    if(G.state==='bonus'&&G.bonus&&G.bonus.t>0.8&&(pr('A')||pr('LB')||pr('RB')))finishBonus();
  }
  Object.assign(padPrev,s);
}

const UI=$('#ui');let curScreen=null,focusEl=null,resetArm=0;
function toast(txt,ms=2000){const el=$('#toast');el.textContent=txt;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),ms);}
function show(name,arg){curScreen={name,arg};UI.innerHTML=SCREENS[name](arg);UI.classList.add('show');focusEl=null;
  if(lastInput!=='touch'){const els=navEls();if(els.length)setFocus(els[0]);}}
function rerender(){if(!curScreen)return;const els=navEls();const idx=focusEl?els.indexOf(focusEl):-1;const pn=UI.querySelector('.panel');const sc=pn?pn.scrollTop:0;
  UI.innerHTML=SCREENS[curScreen.name](curScreen.arg);const pn2=UI.querySelector('.panel');if(pn2)pn2.scrollTop=sc;focusEl=null;const e2=navEls();if(idx>=0&&e2[idx])setFocus(e2[idx],true);}
function hideUI(){UI.classList.remove('show');UI.innerHTML='';curScreen=null;focusEl=null;}
function navEls(){return[...UI.querySelectorAll('[data-a]')];}
function setFocus(el,noScroll){if(focusEl)focusEl.classList.remove('focus');focusEl=el;if(el){el.classList.add('focus');if(!noScroll)el.scrollIntoView({block:'nearest',inline:'nearest'});}}
function navMove(dir){
  const els=navEls();if(!els.length)return;
  if(!focusEl||!UI.contains(focusEl)){setFocus(els[0]);return;}
  const r=focusEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
  for(const e of els){if(e===focusEl)continue;const q=e.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy;let pr,se;
    if(dir==='U'){if(dy>-4)continue;pr=-dy;se=Math.abs(dx);}else if(dir==='D'){if(dy<4)continue;pr=dy;se=Math.abs(dx);}
    else if(dir==='LF'){if(dx>-4)continue;pr=-dx;se=Math.abs(dy);}else{if(dx<4)continue;pr=dx;se=Math.abs(dy);}
    const sc=pr+se*2.5;if(sc<bs){bs=sc;best=e;}}
  if(best){setFocus(best);sfx.ui();}
  else if(dir==='D'||dir==='U'){setFocus(dir==='D'?els[0]:els[els.length-1]);sfx.ui();}
}
function navActivate(){if(curScreen&&curScreen.name==='splash')return ACT.start();if(focusEl&&UI.contains(focusEl))focusEl.click();else{const els=navEls();if(els.length)setFocus(els[0]);}}
function navBack(){
  if(!curScreen)return;const n=curScreen.name;sfx.ui();
  if(n==='pause')return resumeGame();
  if(n==='splash')return navActivate();
  if(n==='title')return;
  if(n==='settings'||n==='howto'){if(curScreen.arg==='pause')return show('pause');}
  if(n==='over')return show('title');
  show('title');
}

});

 const C=(x,y,r,c)=>{g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,T2);g.fill();};const E=(x,y,rx,ry,c)=>{g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,T2);g.fill();};
 const VG=(y0,y1,a,b)=>{const gr=g.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,a);gr.addColorStop(1,b);return gr;};

 const sg=g.createRadialGradient(cx+28,cy-30,0,cx+28,cy-30,30);sg.addColorStop(0,'rgba(255,240,190,.9)');sg.addColorStop(1,'rgba(255,240,190,0)');g.fillStyle=sg;g.fillRect(0,0,200,200);C(cx+28,cy-30,10,'#fff3c4');
 for(const [x0,y,s] of [[40,46,1],[118,38,0.8]]){const x=((x0+t*4)%170)+15;g.fillStyle='rgba(255,255,255,.92)';for(const [dx,dy,r] of [[-9,2,6],[-2,-2,8],[7,1,6.5],[13,3,4.5]]){C(x+dx*s,y+dy*s,r*s,'#fff');}E(x+2*s,y+4*s,15*s,4*s,'#fff');}
 const hill=(base,amp,ph,c1,c2)=>{g.fillStyle=VG(base-amp,base+40,c1,c2);g.beginPath();g.moveTo(cx-R,200);for(let x=cx-R;x<=cx+R;x+=4)g.lineTo(x,base+Math.sin(x*0.045+ph)*amp);g.lineTo(cx+R,200);g.fill();};
 hill(cy+8,6,1,'#b9e29e','#93cc78');
 const pine=(x,y,h,c)=>{g.fillStyle=c;g.beginPath();g.moveTo(x-h*0.34,y);g.quadraticCurveTo(x-h*0.18,y-h*0.55,x-1.2,y-h+1.4);g.quadraticCurveTo(x,y-h-0.6,x+1.2,y-h+1.4);g.quadraticCurveTo(x+h*0.18,y-h*0.55,x+h*0.34,y);g.quadraticCurveTo(x,y+h*0.1,x-h*0.34,y);g.fill();};

 pine(cx-44,cy+14,30,'#5a9c6a');pine(cx+48,cy+12,34,'#4e9262');tree(cx+22,cy+16,11,'#8fd06a',0.8);
 hill(cy+24,5,2.6,'#8fd070','#69b356');
 tree(cx-20,cy+30,13,'#74c05c',1.2);pine(cx+6,cy+30,36,'#3f8455');tree(cx+36,cy+34,9,'#a2da7c',0.7);pine(cx-48,cy+36,24,'#4a8c5c');
 g.fillStyle=VG(cy+30,cy+R,'#7cc463','#5aa64e');g.beginPath();g.moveTo(cx-R,cy+R);g.lineTo(cx-R,cy+44);g.quadraticCurveTo(cx,cy+34,cx+R,cy+44);g.lineTo(cx+R,cy+R);g.fill();
 const mx=cx-6,my=cy+50;g.fillStyle='#fbf3e4';g.beginPath();g.roundRect(mx-3,my-7,6,8,2.5);g.fill();g.fillStyle='#ee5a50';g.beginPath();g.arc(mx,my-6,8,Math.PI,T2);g.quadraticCurveTo(mx,my-4,mx-8,my-6);g.fill();C(mx-3,my-10,1.4,'#fff');C(mx+3,my-9,1.1,'#fff');C(mx+0.5,my-12.5,1,'#fff');
 C(mx+13,my-1,2.2,'#ffd84a');C(mx+13,my-1,0.9,'#f08a3a');C(mx-16,my,2,'#ff8fb2');C(mx-16,my,0.8,'#ffe08a');
 for(let i=0;i<7;i++){const fx=cx-50+((i*37+t*6)%100),fy=cy-6+Math.sin(t*1.3+i*2)*12+i*3;const a=0.4+0.6*Math.max(0,Math.sin(t*2.4+i*1.7));const fg=g.createRadialGradient(fx,fy,0,fx,fy,4);fg.addColorStop(0,`rgba(255,250,200,${a})`);fg.addColorStop(1,'rgba(255,250,200,0)');g.fillStyle=fg;g.fillRect(fx-4,fy-4,8,8);}
 g.restore();
 g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=2;g.beginPath();g.arc(cx,cy,R-4,Math.PI*1.1,Math.PI*1.45);g.stroke();
 const leaf=(x,y,rot,c)=>{g.save();g.translate(x,y);g.rotate(rot);g.fillStyle=c;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(6,-7,14,0);g.quadraticCurveTo(6,7,0,0);g.fill();g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=0.8;g.beginPath();g.moveTo(1,0);g.lineTo(12,0);g.stroke();g.restore();};
 leaf(cx-R+2,cy+R-18+bob,2.4+Math.sin(t*2)*0.08,'#74c05c');leaf(cx+R-2,cy+R-18+bob,0.74-Math.sin(t*2)*0.08,'#8fd06a');
 g.font='900 27px Nunito, "Trebuchet MS", sans-serif';g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
 const ty=178;g.fillStyle='rgba(120,70,30,.18)';g.fillText('Cozy Forest',100,ty+2.5);g.strokeStyle='#fffaf0';g.lineWidth=7;g.strokeText('Cozy Forest',100,ty);
 const tg=g.createLinearGradient(0,ty-12,0,ty+12);tg.addColorStop(0,'#7a5236');tg.addColorStop(1,'#4e3324');g.fillStyle=tg;g.fillText('Cozy Forest',100,ty);
 C(100-80,ty,2.4,'#8fd06a');C(100+80,ty,2.4,'#8fd06a');}
function showSplash(done){const el=$('#splash'),cv2=$('#splashCv');const g2=cv2.getContext('2d');splashing=true;const t0=performance.now();
 const loop=(now)=>{if(!splashing)return;drawSplashLogo(g2,(now-t0)/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);
 requestAnimationFrame(()=>el.classList.add('on'));
 setTimeout(()=>el.classList.add('out'),9400);
 setTimeout(()=>{splashing=false;el.remove();done&&done();},10000);}
/* ===================== MAIN LOOP ===================== */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  sndCount=0;pollPad(dt);musicTick();
  if(inGame())update(dt);
  render(dt);
}
function autosave(){if(saveP()&&G&&G.active)toast(t('saved'),1200);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveP();if(G&&G.active)pauseGame();if(AC&&AC.state==='running')AC.suspend();}else if(AC)AC.resume();});
addEventListener('pagehide',()=>saveP());
addEventListener('resize',()=>setTimeout(resize,60));
document.addEventListener('fullscreenchange',()=>setTimeout(resize,100));
loadP();ensureDaily();document.documentElement.lang=LANG;resize();setMusic('menu');show('splash');showSplash();
setInterval(autosave,30000);
requestAnimationFrame(frame);
</script>
