<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Todo app</title>
<style>
  body { font-family: system-ui; background: linear-gradient(135deg, #6c8cff, #b06cff); min-height: 100vh; margin: 0; display: grid; place-items: start center; }
  .card { background: #fff; width: min(420px, 92vw); margin-top: 8vh; border-radius: 18px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
  h1 { margin: 0 0 12px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #ccd; font-size: 15px; }
  button { padding: 10px 14px; border: 0; border-radius: 10px; background: #6c8cff; color: #fff; font-weight: 600; cursor: pointer; }
  li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; list-style: none; }
  li.done span { text-decoration: line-through; color: #999; }
  li span { flex: 1; }
  li .x { background: none; color: #c33; padding: 4px 8px; }
  ul { padding: 0; }
  small { color: #888; }
</style>
</head>
<body>
<div class="card">
  <h1>📝 Todo</h1>
  <form id="f"><input id="t" placeholder="What needs doing?" autocomplete="off"><button>Add</button></form>
  <ul id="list"></ul>
  <small id="left"></small>
</div>
<script>
let todos = [{ text: 'Try Nimbus Code', done: true }, { text: 'Edit this file and watch the preview', done: false }];
const list = document.getElementById('list');
function render() {
  list.innerHTML = '';
  todos.forEach((t, i) => {
    const li = document.createElement('li');
    li.className = t.done ? 'done' : '';
    li.innerHTML = `<input type="checkbox" ${t.done ? 'checked' : ''}><span></span><button class="x">✕</button>`;
    li.querySelector('span').textContent = t.text;
    li.querySelector('input').onchange = () => { t.done = !t.done; render(); };
    li.querySelector('.x').onclick = () => { todos.splice(i, 1); render(); };
    list.appendChild(li);
  });
  document.getElementById('left').textContent = `${todos.filter((t) => !t.done).length} left`;
}
document.getElementById('f').onsubmit = (e) => {
  e.preventDefault();
  const input = document.getElementById('t');
  if (input.value.trim()) todos.push({ text: input.value.trim(), done: false });
  input.value = ''; render();
};
render();
</script>
</body>
</html>
