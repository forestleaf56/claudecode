<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Calculator</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #1d2030; font-family: system-ui; }
  .calc { width: 260px; background: #2a2e42; padding: 16px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
  .screen { background: #12141f; color: #fff; font-size: 34px; text-align: right; padding: 14px; border-radius: 12px; margin-bottom: 12px; overflow: hidden; min-height: 42px; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  button { height: 52px; border: 0; border-radius: 12px; font-size: 20px; background: #3a3f5c; color: #fff; cursor: pointer; }
  button.op { background: #6c8cff; }
  button.eq { background: #3fdc77; grid-column: span 2; }
</style>
</head>
<body>
<div class="calc">
  <div class="screen" id="screen">0</div>
  <div class="keys" id="keys"></div>
</div>
<script>
const keys = ['C', '(', ')', '/', '7', '8', '9', '*', '4', '5', '6', '-', '1', '2', '3', '+', '0', '.', '='];
let expr = '';
const screen = document.getElementById('screen');
keys.forEach((k) => {
  const b = document.createElement('button');
  b.textContent = k;
  if ('/*-+'.includes(k)) b.className = 'op';
  if (k === '=') b.className = 'eq';
  b.onclick = () => press(k);
  document.getElementById('keys').appendChild(b);
});
function press(k) {
  if (k === 'C') expr = '';
  else if (k === '=') {
    try { expr = String(Function('"use strict";return (' + expr + ')')()); } catch (e) { expr = 'Error'; }
  } else expr = (expr === 'Error' ? '' : expr) + k;
  screen.textContent = expr || '0';
}
addEventListener('keydown', (e) => { if ('0123456789+-*/().'.includes(e.key)) press(e.key); if (e.key === 'Enter') press('='); if (e.key === 'Escape') press('C'); });
</script>
</body>
</html>
