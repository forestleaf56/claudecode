<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CSS animations</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-wrap: wrap; gap: 40px; align-items: center; justify-content: center; background: #f2f4fb; font-family: system-ui; }
  .box { width: 80px; height: 80px; border-radius: 16px; background: linear-gradient(135deg, #6c8cff, #b06cff); }
  .spin { animation: spin 2s linear infinite; }
  .bounce { animation: bounce 1s ease-in-out infinite alternate; border-radius: 50%; background: #ff6b6b; }
  .pulse { animation: pulse 1.4s ease-in-out infinite; background: #3fdc77; }
  .morph { animation: morph 3s ease-in-out infinite; background: #f7c948; }
  .button { padding: 14px 26px; border-radius: 999px; background: #222; color: #fff; font-weight: 700; transition: transform .2s, box-shadow .2s; cursor: pointer; }
  .button:hover { transform: translateY(-4px) scale(1.05); box-shadow: 0 12px 24px rgba(0,0,0,.25); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-60px); } }
  @keyframes pulse { 50% { transform: scale(1.3); opacity: .6; } }
  @keyframes morph { 0%, 100% { border-radius: 16px; } 50% { border-radius: 50% 10% 50% 10%; transform: rotate(45deg); } }
</style>
</head>
<body>
  <div class="box spin"></div>
  <div class="box bounce"></div>
  <div class="box pulse"></div>
  <div class="box morph"></div>
  <div class="button">Hover me</div>
</body>
</html>
