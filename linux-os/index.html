<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#14161b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Cirrus Linux — a complete desktop operating system that runs in your browser.">
<title>Cirrus Linux</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%237a8cff'/%3E%3Cpath d='M19 42a9 9 0 0 1-.6-18A12 12 0 0 1 41.6 21 10 10 0 0 1 44 42z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot"></div>
<script src="js/core.js"></script>
<script src="js/fs.js"></script>
<script src="js/pkg.js"></script>
<script src="js/wm.js"></script>
<script src="js/desktop.js"></script>
<script src="js/terminal.js"></script>
<script src="js/apps-core.js"></script>
<script src="js/apps-extra.js"></script>
<script src="js/games.js"></script>
<script>
  (function () {
    OS.fs.load();
    OS.desktop.init();
    OS.desktop.boot();
    // unlock WebAudio on first interaction (mobile browsers require a gesture)
    const unlock = () => { OS.audio(); document.removeEventListener('pointerdown', unlock, true); };
    document.addEventListener('pointerdown', unlock, true);
    // prevent pinch-zoom on iOS so the desktop behaves like an OS (double-tap zoom is disabled via CSS touch-action)
    document.addEventListener('gesturestart', (e) => e.preventDefault());
  })();
</script>
</body>
</html>
