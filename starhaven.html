.wh{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 18px;font-size:18px;font-weight:900}

.wb{overflow-y:auto;padding:4px 14px 16px;flex:1;-webkit-overflow-scrolling:touch;touch-action:pan-y}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}

.sl .n{position:absolute;right:6px;bottom:3px;font-size:12px;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.6)}

.sl.dn{opacity:.3;filter:grayscale(1)}
.sl.don::after{content:"✓";position:absolute;left:7px;top:3px;font-size:11px;color:var(--ok)}
.ic{position:relative;display:inline-block;line-height:1}
.ic small{position:absolute;right:-.3em;bottom:-.2em;font-size:.5em}

.row .rt{font-weight:900}

.btn.g{background:linear-gradient(180deg,#8ee8b4,#4fbf86);color:#11382a}
.btn.w{background:linear-gradient(180deg,#ffe3a6,#ffbd5a);color:#4a3410}
.btn.r{background:linear-gradient(180deg,#ffb8c4,#e8788e);color:#4a1420}

.chip.ok{color:var(--ok)}.chip.no{color:var(--no)}

#fade{position:fixed;inset:0;background:#0c0c28;opacity:0;pointer-events:none;z-index:40;transition:opacity .35s ease}
#credits{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse,rgba(40,36,100,.95),rgba(12,12,40,.97));flex-direction:column;gap:12px;padding:20px}

   ["Shh... the books are sleeping.","Shh... böckerna sover."],
   ["Old artifacts from Earth are hidden around the ship. Look up high!","Gamla artefakter från jorden är gömda runt skeppet. Titta högt upp!"],
   ["Tea, a good book, and the hum of the engines. Perfect.","Te, en god bok och motorernas surr. Perfekt."]],
  hi:[["I've started a new chapter in the ship's chronicle. It's mostly about you.","Jag har börjat ett nytt kapitel i skeppets krönika. Det handlar mest om dig."],
   ["Thank you for treating old things so gently.","Tack för att du behandlar gamla saker så varsamt."]]},
 kai:{n:['Kai','Kai'],role:['Young explorer','Ung upptäckare'],look:{sk:'#f0c090',hr:'#f0a030',hs:4,su:'#3a8ad0',ac:'#ffdd55'},shop:1,kid:1,
  loves:['yoyo','cookie','donut','rocket'],likes:['popcorn','icecream','juice','strawberry','shard','dice'],hates:['broccoli','onion','garlic'],
  hr:{3:{it:{yoyo:1}},6:{it:{teddy:1}},9:{it:{console:1}}},
  ln:[["I found a star shard behind a pipe! There are more, I just know it!","Jag hittade en stjärnskärva bakom ett rör! Det finns fler, jag bara vet det!"],
   ["I'll trade cool stuff for star shards. Deal?","Jag byter häftiga grejer mot stjärnskärvor. Affär?"],
   ["Shards love high places. Try jumping off the edges!","Skärvor gillar höga ställen. Testa att hoppa från kanterna!"],
   ["When I grow up I'm gonna be a space explorer. Oh wait. I already am!","När jag blir stor ska jag bli rymdutforskare. Åh vänta. Det är jag ju redan!"],
   ["Broccoli is a tiny tree and I refuse to eat trees.","Broccoli är ett litet träd och jag vägrar äta träd."]],
  hi:[["You're my best friend. Like, officially. I wrote it down.","Du är min bästa vän. Typ officiellt. Jag har skrivit upp det."],
   ["On Verdance I'm gonna climb EVERY tree. Wanna race?","På Verdance ska jag klättra i VARJE träd. Ska vi tävla?"]]},
 sven:{n:['Old Sven','Gamle Sven'],role:['Fisher','Fiskare'],look:{sk:'#e8b890',hr:'#d8d8d8',hs:5,su:'#2a5a7a',ac:'#ffd37a'},shop:1,
  loves:['lobster','sushi','coffee_cup','whale'],likes:['carp','guppy','bait','bread','riceball','turtle'],hates:['lettuce','salad'],
  hr:{3:{it:{bait:10}},6:{rod:1},9:{it:{trophy:1}}},
  ln:[["Patience, kid. The fish come to those who wait.","Tålamod, grabben. Fisken kommer till den som väntar."],
   ["Bait helps you hook the rarer ones. Old trick.","Bete hjälper dig att få de ovanligare. Gammalt knep."],
   ["Press when the marker's in the green. Don't rush it.","Tryck när markören är i det gröna. Stressa inte."],
   ["There's a whale in the deep tank. I've seen it. Nobody believes me.","Det finns en val i djuptanken. Jag har sett den. Ingen tror mig."],
   ["Back on Earth my grandfather fished in a lake called Siljan.","På jorden fiskade min farfar i en sjö som hette Siljan."]],
  hi:[["You've got the hands of a real fisher. I'm proud of you, kid.","Du har händerna hos en riktig fiskare. Jag är stolt över dig, grabben."],
   ["Sit with me a while. No need to talk.","Sitt med mig en stund. Vi behöver inte prata."]]},
 juno:{n:['Juno','Juno'],role:['Rancher','Ranchägare'],look:{sk:'#b87a50',hr:'#3a2a1a',hs:1,su:'#7a9a3a',ac:'#d08a4a'},shop:1,
  loves:['honey','apple','pancake','hay'],likes:['egg','milk','carrot','wheat','cheese'],hates:['meteorite','boot'],
  hr:{3:{it:{hay:10}},6:{it:{bouquet:1}},9:{it:{bed2:1}}},
  ln:[["Every animal here has a name and a favorite song.","Varje djur här har ett namn och en favoritlåt."],
   ["Feed your animals hay each day and they'll reward you in the morning.","Ge dina djur hö varje dag så belönar de dig på morgonen."],
   ["The trough feeds every animal at once. Very handy!","Krubban matar alla djur på en gång. Väldigt smidigt!"],
   ["Mooooo. Sorry, I'm practicing.","Muuuu. Förlåt, jag övar."],
   ["Hay comes from wheat. Two wheat makes three bales at a workbench.","Hö kommer från vete. Två vete blir tre höbalar vid en arbetsbänk."]],
  hi:[["The chickens follow you around now. That's the highest honor.","Hönsen följer efter dig nu. Det är den största äran."],
   ["I'll teach you to milk a cow with your eyes closed. It's a gift.","Jag ska lära dig mjölka en ko med slutna ögon. Det är en gåva."]]},
};

const QUESTS=[
 {id:'m1',g:'moss',to:'captain',main:1,n:['Wake Up','Vakna'],
  i:['',''],d:["Ah, our caretaker is awake! Welcome aboard the Starhaven. I'm Captain Vale. We're in rough shape, but we're alive — and now we have you. Our first worry is food. Rosa in Hydroponics could use your help. Take these seeds.","Ah, vår vårdare är vaken! Välkommen ombord på Starhaven. Jag är kapten Vale. Vi är i dåligt skick, men vi lever – och nu har vi dig. Vår första oro är mat. Rosa i hydroponiken behöver din hjälp. Ta de här fröna."],
  o:[{t:'talk',npc:'captain'}],rw:{m:200,it:{s_carrot:6,s_lettuce:4}}},
 {id:'m2',g:'rosa',main:1,n:['Green Fingers','Gröna fingrar'],rq:['m1'],
  i:["Oh! A new pair of hands! Plant seeds in the planters, water them each day, and they grow while you sleep. Harvest five crops and show me!","Åh! Ett nytt par händer! Plantera frön i lådorna, vattna dem varje dag, så växer de medan du sover. Skörda fem grödor och visa mig!"],
  d:["Look at that! Real, living food. The crew will cry happy tears. Take these seeds too — bamboo is very useful.","Titta! Riktig, levande mat. Besättningen kommer att gråta glädjetårar. Ta de här fröna också – bambu är väldigt användbart."],
  o:[{t:'stat',k:'harvest',n:5}],rw:{m:150,it:{s_potato:5,s_wheat:5,s_bamboo:4},fr:{rosa:50}}},
 {id:'m3',g:'pip',main:1,n:['Scrap and Sparks','Skrot och gnistor'],rq:['m1'],
  i:["Hey, you're the caretaker? I'm Pip, I keep this bucket of bolts flying. The Promenade has been dark for decades. Gather scrap and stone with your drill, then build 'Promenade Power' at a Build Terminal!","Hej, du är vårdaren? Jag är Pip, jag håller den här skrothögen flygande. Promenaden har varit mörk i årtionden. Samla skrot och sten med din borr och bygg sedan 'Promenadens kraft' vid en byggterminal!"],
  d:["The Promenade lights are back! Listen... is that music? Go see who's opening shop!","Promenadens ljus är tillbaka! Lyssna... är det musik? Gå och se vem som öppnar butik!"],
  o:[{t:'build',p:'promenade'}],rw:{m:300}},
 {id:'m4',g:'captain',main:1,n:['Market Day','Marknadsdag'],rq:['m3'],
  i:["With the Promenade lit, the crew can trade again. Go and greet our shopkeepers — Mira, Chef Bao, Tove and Nova.","Nu när Promenaden är tänd kan besättningen handla igen. Gå och hälsa på våra handlare – Mira, kocken Bao, Tove och Nova."],
  d:["A ship is only as strong as its friendships. Well done, caretaker.","Ett skepp är bara så starkt som sina vänskaper. Bra gjort, vårdare."],
  o:[{t:'talk',npc:'mira'},{t:'talk',npc:'bao'},{t:'talk',npc:'tove'},{t:'talk',npc:'nova'}],rw:{m:400}},
 {id:'m5',g:'bao',main:1,n:['A Warm Meal','Ett varmt mål'],rq:['m4'],
  i:["You look hungry! Cooking turns crops into meals that restore lots of energy. Use a stove — there's one in your cabin and one in my café. Cook three dishes!","Du ser hungrig ut! Matlagning gör grödor till måltider som ger mycket energi. Använd en spis – det finns en i din hytt och en i mitt kafé. Laga tre rätter!"],
  d:["Mmm! You have the touch. Here, take two of my recipes.","Mmm! Du har handlaget. Här, ta två av mina recept."],
  o:[{t:'stat',k:'cook',n:3}],rw:{m:200,rec:['soup','fries','oil'],fr:{bao:60}}},
 {id:'m6',g:'pip',main:1,n:['Fire in the Forge','Eld i smedjan'],rq:['m3'],
  i:["The smelter in Engineering is cold. Fix the forge and we can smelt ore into metal bars. Bring scrap, stone and bamboo to a Build Terminal.","Smältugnen i maskinrummet är kall. Laga smedjan så kan vi smälta malm till metalltackor. Ta med skrot, sten och bambu till en byggterminal."],
  d:["She's roaring! Here's some copper ore and carbon to get you started. There's lots more ore down in Cargo.","Hon dånar! Här är lite kopparmalm och kol att börja med. Det finns mycket mer malm nere i lastrummet."],
  o:[{t:'build',p:'forge'}],rw:{m:300,it:{copper_ore:12,coal:6}}},
 {id:'m7',g:'pip',main:1,n:['Down to Cargo','Ner till lastrummet'],rq:['m6'],
  i:["The cargo lift needs copper bars and bamboo planks. Smelt copper ore with carbon at the smelter, and craft planks at a workbench.","Lastlyften behöver kopparstänger och bambuplankor. Smält kopparmalm med kol i smältugnen och tillverka plankor vid en arbetsbänk."],
  d:["The cargo hold is open! It's full of ore, and... I think Kai's been sneaking down there.","Lastrummet är öppet! Det är fullt av malm, och... jag tror att Kai har smugit sig ner dit."],
  o:[{t:'build',p:'cargo'}],rw:{m:400}},
 {id:'m8',g:'captain',main:1,n:['Eyes on the Stars','Ögon mot stjärnorna'],rq:['m7'],
  i:["Our navigation charts are centuries old. We need the Observatory. Build its dome — glass, copper and iron.","Våra navigationskartor är århundraden gamla. Vi behöver observatoriet. Bygg dess kupol – glas, koppar och järn."],
  d:["The dome is open. Dr. Ottar has waited decades for this moment.","Kupolen är öppen. Dr. Ottar har väntat i årtionden på det här ögonblicket."],
  o:[{t:'build',p:'observatory'}],rw:{m:500,rp:20}},
 {id:'m9',g:'ottar',main:1,n:['First Discoveries','Första upptäckterna'],rq:['m8'],
  i:["Splendid! Research points come from donating new things to Elias's archive, stargazing at night and uploading data chips. Complete two research projects from the menu!","Utmärkt! Forskningspoäng får du genom att skänka nya saker till Elias arkiv, skåda stjärnor på natten och ladda upp datachip. Slutför två forskningsprojekt från menyn!"],
  d:["Science! Glorious, cozy science.","Vetenskap! Härlig, mysig vetenskap."],
  o:[{t:'stat',k:'research',n:2}],rw:{rp:30,m:300}},
 {id:'m10',g:'captain',main:1,n:['Water of Life','Livets vatten'],rq:['m9'],
  i:["The Aquarium deck recycles our water — and it holds old Sven's fish. Its filters need iron, gears and ice.","Akvariedäcket renar vårt vatten – och där bor gamle Svens fiskar. Filtren behöver järn, kugghjul och is."],
  d:["Fresh water flows again. Sven will be overjoyed.","Färskt vatten flödar igen. Sven kommer att bli överlycklig."],
  o:[{t:'build',p:'aquarium'}],rw:{m:600}},
 {id:'m11',g:'sven',main:1,n:['Gone Fishing','Ut och fiska'],rq:['m10'],give:'rod',
  i:["Heh. Another landlubber. Here, take my old rod. Cast at a pool and press when the marker is in the green. Catch me five fish!","Heh. Ännu en landkrabba. Här, ta mitt gamla spö. Kasta vid en damm och tryck när markören är i det gröna. Fånga fem fiskar åt mig!"],
  d:["Not bad, kid. Not bad at all. Have some bait.","Inte illa, grabben. Inte illa alls. Ta lite bete."],
  o:[{t:'stat',k:'fish',n:5}],rw:{m:300,it:{bait:10}}},
 {id:'m12',g:'captain',main:1,n:['Home on the Range','Hem på prärien'],rq:['m11'],
  i:["We kept animals once — the Ranch sleeps behind sealed doors. Build it, and our rancher Juno can come home.","Vi hade djur en gång – ranchen sover bakom förseglade dörrar. Bygg den, så kan vår ranchägare Juno komma hem."],
  d:["Juno is already there, singing to the hay bales.","Juno är redan där och sjunger för höbalarna."],
  o:[{t:'build',p:'ranch'}],rw:{m:700}},
 {id:'m13',g:'juno',main:1,n:["Juno's Flock","Junos flock"],rq:['m12'],
  i:["Welcome to my ranch! Animals need hay and love. Buy two animals from me, feed them, and they'll give you gifts every morning!","Välkommen till min ranch! Djur behöver hö och kärlek. Köp två djur av mig, mata dem, så ger de dig gåvor varje morgon!"],
  d:["Look at them! They adore you already.","Titta på dem! De älskar dig redan."],
  o:[{t:'own',k:'animals',n:2}],rw:{m:400,it:{hay:10}}},
 {id:'m14',g:'rosa',main:1,n:['Glass Garden','Glasträdgården'],rq:['m13'],
  i:["There's a greenhouse dome at the top of the ship where exotic fruit once grew. It needs glass, solar panels and gold. Please?","Högst upp på skeppet finns en växthuskupol där exotisk frukt en gång växte. Den behöver glas, solpaneler och guld. Snälla?"],
  d:["The dome! Light from the reactor lamps! I can sell you exotic seeds now.","Kupolen! Ljus från reaktorlamporna! Nu kan jag sälja exotiska frön till dig."],
  o:[{t:'build',p:'dome'}],rw:{m:800,it:{s_lemon:3,s_apple:3}}},
 {id:'m15',g:'rosa',main:1,n:['Exotic Harvest','Exotisk skörd'],rq:['m14'],
  i:["Dome crops only grow under the dome glass. Harvest three of them!","Kupolgrödor växer bara under kupolens glas. Skörda tre av dem!"],
  d:["Fruit! In space! Here's my lemonade recipe.","Frukt! I rymden! Här är mitt lemonadrecept."],
  o:[{t:'stat',k:'domeharvest',n:3}],rw:{m:600,rec:['lemonade','sugar','juice']}},
 {id:'m16',g:'captain',main:1,n:['Breath of Space','Rymdens andetag'],rq:['m15'],
  i:["To reach home we'll need materials only found outside: stardust and meteorites drifting by the hull. Build the Hangar Airlock.","För att nå hem behöver vi material som bara finns utanför: stjärnstoft och meteoriter som driver förbi skrovet. Bygg hangarslussen."],
  d:["Suit up, caretaker. The gravity outside is light — mind your step.","Klä på dig rymddräkten, vårdare. Gravitationen där ute är svag – se dig för."],
  o:[{t:'build',p:'hangar'}],rw:{m:900}},
 {id:'m17',g:'ottar',main:1,n:['Spacewalk','Rymdpromenad'],rq:['m16'],
  i:["Bring me meteorites and stardust from the hull — I must study them for the warp equations!","Ta med meteoriter och stjärnstoft från skrovet – jag måste studera dem för varpekvationerna!"],
  d:["Marvelous! These hold the secret of our final jump.","Fantastiskt! De bär på hemligheten bakom vårt sista hopp."],
  o:[{t:'have',it:'meteorite',n:3},{t:'have',it:'stardust',n:10}],rw:{rp:60,m:500}},
 {id:'m18',g:'pip',main:1,n:['Heart of the Ship','Skeppets hjärta'],rq:['m17'],
  i:["The reactor is unstable — we can't make the final jump without stabilizing it. Nano paste, crystals and engine parts!","Reaktorn är instabil – vi kan inte göra det sista hoppet utan att stabilisera den. Nanopasta, kristaller och motordelar!"],
  d:["Listen to her hum... she's healthy again.","Lyssna på henne surra... hon är frisk igen."],
  o:[{t:'build',p:'reactor'}],rw:{m:1200}},
 {id:'m19',g:'ottar',main:1,n:['Warp Theory','Varpteori'],rq:['m18'],
  i:["One last piece of science: Warp Theory. Research it, and we can calculate the route home.","En sista bit vetenskap: varpteori. Forska fram den, så kan vi beräkna vägen hem."],
  d:["Eureka! The equations sing!","Heureka! Ekvationerna sjunger!"],
  o:[{t:'res',r:'warp'}],rw:{m:800}},
 {id:'m20',g:'captain',main:1,n:['Course for Home','Kurs mot hemmet'],rq:['m19'],
  i:["This is it. Build the Navigation Array and we set course for Verdance — a green world, our new home.","Nu är det dags. Bygg navigationssystemet så sätter vi kurs mot Verdance – en grön värld, vårt nya hem."],
  d:["Caretaker... thank you. All hands, prepare for the jump!","Vårdare... tack. Alla man, förbered er för hoppet!"],
  o:[{t:'build',p:'nav'}],rw:{m:3000}},
 {id:'m21',g:'captain',main:1,n:['First Feast','Första festen'],rq:['m20'],
  i:["We've arrived! Let's celebrate our first night on Verdance with a feast. Bring a stew, a pie, a cake and a pizza!","Vi är framme! Låt oss fira vår första natt på Verdance med en fest. Ta med en gryta, en paj, en tårta och en pizza!"],
  d:["To the caretaker! To friends! To home!","För vårdaren! För vänner! För hemmet!"],
  o:[{t:'have',it:'stew',n:1},{t:'have',it:'pie',n:1},{t:'have',it:'cake',n:1},{t:'have',it:'pizza',n:1}],rw:{m:5000,it:{trophy:1}}},
 // ---- side quests
 {id:'s_cat',g:'captain',n:['A Stray in the Vents','En fripassagerare i ventilerna'],rq:['m11'],
  i:["I keep hearing meowing in the vents... Could you bring three guppies? Maybe our little stowaway will come out.","Jag hör hela tiden jamande i ventilerna... Kan du ta med tre guppyer? Kanske kommer vår lilla fripassagerare fram."],
  d:["There she is! She's chosen you. Take her home to your cabin.","Där är hon! Hon har valt dig. Ta med henne hem till din hytt."],o:[{t:'have',it:'guppy',n:3}],rw:{it:{cat:1},fr:{captain:80}}},
 {id:'s_capt2',g:'captain',n:["Captain's Coffee","Kaptenens kaffe"],rq:['m9'],
  i:["I've dreamed of real coffee for decades. Could you brew me three cups?","Jag har drömt om riktigt kaffe i årtionden. Kan du brygga tre koppar åt mig?"],
  d:["Oh... oh, that's the stuff. Thank you.","Åh... åh, det är rätta grejen. Tack."],o:[{t:'have',it:'coffee_cup',n:3}],rw:{m:800,fr:{captain:100}}},
 {id:'s_capt3',g:'captain',n:['Shipshape','Skeppsskick'],rq:['m20'],
  i:["Let's leave the old girl in perfect shape. Complete every ship project, optional ones too.","Låt oss lämna den gamla damen i perfekt skick. Slutför alla skeppsprojekt, även de valfria."],
  d:["Every system shining. The Starhaven has never looked better.","Varje system skiner. Starhaven har aldrig sett bättre ut."],o:[{t:'own',k:'projects',n:15}],rw:{m:10000,it:{fountain_f:1}}},
 {id:'s_rosa1',g:'rosa',n:['Tulips for Rosa','Tulpaner till Rosa'],rq:['m10'],
  i:["My mother grew tulips back on Earth. Could you grow three for me?","Min mamma odlade tulpaner på jorden. Kan du odla tre åt mig?"],
  d:["They're perfect... just like hers. Thank you.","De är perfekta... precis som hennes. Tack."],o:[{t:'have',it:'tulip',n:3}],rw:{m:300,fr:{rosa:100},it:{s_sunflower:5}}},
 {id:'s_rosa2',g:'rosa',n:['Giant Pumpkins','Jättepumpor'],rq:['s_rosa1'],
  i:["I want to carve pumpkin lanterns for the crew! Bring me two pumpkins.","Jag vill skära pumpalyktor åt besättningen! Ta med två pumpor."],
  d:["Ooh, they're huge! Here's fertilizer for your troubles.","Åh, vad stora! Här är gödsel för besväret."],o:[{t:'have',it:'pumpkin',n:2}],rw:{m:600,it:{fertilizer:10}}},
 {id:'s_pip1',g:'pip',n:['Gear Head','Kuggskalle'],rq:['m6'],
  i:["I'm building a clockwork cat. Don't ask. I need eight gears.","Jag bygger en urverkskatt. Fråga inte. Jag behöver åtta kugghjul."],
  d:["Tick tock, perfect! The cat will be glorious.","Tick tack, perfekt! Katten blir magnifik."],o:[{t:'have',it:'gear',n:8}],rw:{m:400,fr:{pip:100}}},
 {id:'s_pip2',g:'pip',n:['Power Bank','Kraftbank'],rq:['s_pip1','m9'],
  i:["The backup lights need batteries. Three should do it!","Reservljuset behöver batterier. Tre borde räcka!"],
  d:["Let there be light! Again!","Varde ljus! Igen!"],o:[{t:'have',it:'battery',n:3}],rw:{m:900,fr:{pip:80}}},
 {id:'s_bao1',g:'bao',n:['Signature Soup','Signatursoppa'],rq:['m5'],
  i:["I'm judging a soup contest with myself. Bring me two veggie soups!","Jag håller en soppävling med mig själv. Ta med två grönsakssoppor!"],
  d:["Delicious! You win. I mean, I win. We both win!","Utsökt! Du vinner. Jag menar, jag vinner. Vi vinner båda!"],o:[{t:'have',it:'soup',n:2}],rw:{m:350,fr:{bao:80}}},
 {id:'s_bao2',g:'bao',n:['Spice of Life','Livets krydda'],rq:['s_bao1','m9'],

const stat=(k,n=1)=>{S.stats[k]=(S.stats[k]||0)+n;};
const cnt=id=>S.inv[id]||0;
const has=(id,n=1)=>cnt(id)>=n;
function add(id,n=1,quiet){if(!ITEMS[id]||n<=0)return;S.inv[id]=cnt(id)+n;const first=!S.seen[id];S.seen[id]=1;if(!quiet)toast(`+${n} ${ITEMS[id].ic} ${iname(id)}${first?' ✨':''}`);questPing();}
function take(id,n=1){if(!has(id,n))return false;S.inv[id]-=n;if(S.inv[id]<=0)delete S.inv[id];return true;}
const hasAll=c=>Object.entries(c).every(([k,v])=>has(k,v));
const takeAll=c=>Object.entries(c).forEach(([k,v])=>take(k,v));
function addMoney(m){S.money+=m;}
function maxE(){return 100+(S.res.vitality?30:0)+(S.proj.cabin_ext?20:0)+(S.permE||0)+Math.min(40,Math.floor(comfort()/2));}
function comfort(){return S.furn.filter(f=>f.d==='cabin').reduce((a,f)=>a+(ITEMS[f.id].c||0),0);}
function useE(n){n=S.res.ergonomics?n*0.7:n;if(S.energy<n){toast('😴 '+T('tired'));sfx('err');return false;}S.energy-=n;return true;}
function eat(id){const it=ITEMS[id];if(!it||!it.e||!take(id))return;S.energy=Math.min(maxE(),S.energy+it.e);if(it.perm){S.permE=(S.permE||0)+it.perm;toast('✨ +'+it.perm+' '+T('maxe'));}sfx('eat');toast(`${it.ic} +${it.e} ⚡`);}
const deckOpen=id=>!DECK_REQ[id]||!!S.proj[DECK_REQ[id]];
const seedTier=()=>(S.proj.promenade?1:0)+(S.proj.cargo?1:0)+(S.proj.aquarium?1:0)+(S.proj.dome?1:0)+(S.proj.reactor?1:0);
const fr=id=>S.fr[id]||(S.fr[id]={p:0,t:0,g:0,ev:{},met:0,kn:{}});
const hearts=id=>Math.min(10,Math.floor(fr(id).p/100));
function addFr(id,n){const f=fr(id);f.p=clamp(f.p+n,0,1000);}
const fmtTime=()=>{const h=Math.floor(S.time/60)%24,m=S.time%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');};

/* ---------- recipes / research / projects ---------- */
const known=r=>!r.un?true:(S.known[r.out]||(RES[r.un]&&S.res[r.un]));
function canCraft(r,n=1){return Object.entries(r.ins).every(([k,v])=>has(k,v*n));}
function craft(r,n=1){if(!canCraft(r,n)){sfx('err');toast(T('nomats'));return;}Object.entries(r.ins).forEach(([k,v])=>take(k,v*n));add(r.out,r.n*n);stat(r.st==='cook'?'cook':'craft',n);sfx('craft');}
const resAvail=r=>!S.res[r.id]&&r.r.every(x=>S.res[x]);
function doResearch(id){const r=RES[id];if(!resAvail(r)||S.rp<r.c){sfx('err');return;}S.rp-=r.c;S.res[id]=1;stat('research');sfx('fanfare');toast('🧬 '+T('resdone')+': '+tr(r.n));if(id==='botany1'||id==='botany2'||id==='domegrowth'||id==='husbandry')rebuildObjs();questPing();}
const projAvail=p=>!S.proj[p.id]&&p.r.every(x=>S.proj[x]);
const projCan=p=>hasAll(p.c)&&S.money>=p.m&&(!p.rr||S.res[p.rr]);
function doProject(id){const p=PRJ[id];if(!projAvail(p)||!projCan(p)){sfx('err');toast(T('nomats'));return;}takeAll(p.c);S.money-=p.m;S.proj[id]=S.day;sfx('fanfare');toast(p.ic+' '+T('projdone')+': '+tr(p.n));
 if(p.deck)setTimeout(()=>toast('🛗 '+T('unlocked')+': '+tr(DECKS[p.deck].n)),700);
 if(id==='beehives')Object.keys(S.hives).forEach(k=>S.hives[k].d=S.day);
 rebuildObjs();questPing();}

/* ---------- quests ---------- */
const qst=id=>S.quests[id];
function qAvail(q){if(qst(q.id))return false;return (q.rq||[]).every(x=>qst(x)&&qst(x).s===2);}
function ownCount(k){switch(k){case'animals':return Object.values(S.pens).filter(p=>p&&p.a).length;case'furn':return S.furn.filter(f=>f.d==='cabin').length;case'shards':return S.stats.shards||0;case'arts':return ARTS.filter(a=>S.seen[a]).length;case'donated':return Object.keys(S.don).length;case'visited':return Object.keys(S.visited).length;case'projects':return Object.keys(S.proj).length;}return 0;}
function objProg(q,o){const st=qst(q.id)||{b:{},tk:{}};switch(o.t){
 case'have':return[Math.min(cnt(o.it),o.n),o.n];case'talk':return[(st.tk&&st.tk[o.npc])||(S.fr[o.npc]&&S.fr[o.npc].met)?1:0,1];case'build':return[S.proj[o.p]?1:0,1];
 case'res':return[S.res[o.r]?1:0,1];case'stat':return[clamp(S.stats[o.k]||0,0,o.n),o.n];case'own':return[Math.min(ownCount(o.k),o.n),o.n];}return[0,1];}
function objText(o){switch(o.t){case'have':return icon(o.it)+' '+iname(o.it);case'talk':return T('talkto')+' '+nname(o.npc);case'build':return T('buildp')+': '+PRJ[o.p].ic+' '+tr(PRJ[o.p].n);case'res':return T('researchp')+': '+tr(RES[o.r].n);case'stat':return tr(STATN[o.k]);case'own':return tr(OWNN[o.k]);}return'';}
const qComplete=q=>q.o.every(o=>{const[a,b]=objProg(q,o);return a>=b;});
function acceptQ(q){const b={};q.o.forEach(o=>{if(o.t==='stat')b[o.k]=S.stats[o.k]||0;});S.quests[q.id]={s:1,b,tk:{}};if(q.give==='rod'&&S.tools.rod<1){S.tools.rod=1;toast('🎣 '+tr(TOOLS.rod.n));}toast('📜 '+T('newq')+': '+tr(q.n));sfx('quest');updTracker();}
function giveRw(rw){if(!rw)return;if(rw.m){addMoney(rw.m);toast('💰 +'+fmt(rw.m)+' ¢');}if(rw.rp){S.rp+=rw.rp;toast('🧬 +'+rw.rp+' RP');}
 if(rw.it)Object.entries(rw.it).forEach(([k,v])=>add(k,v));if(rw.rec)rw.rec.forEach(r=>{S.known[r]=1;toast('📖 '+T('recipe')+': '+iname(r));});
 if(rw.fr)Object.entries(rw.fr).forEach(([k,v])=>addFr(k,v));if(rw.rod&&S.tools.rod<4){S.tools.rod++;toast('🎣 '+tr(TOOLS.rod.n)+' '+T('level')+S.tools.rod);}}
function turnIn(q,then){q.o.forEach(o=>{if(o.t==='have')take(o.it,o.n);});S.quests[q.id].s=2;sayNpc(q.to||q.g,tr(q.d),()=>{giveRw(q.rw);sfx('fanfare');toast('✅ '+T('qdone')+': '+tr(q.n));updTracker();onQuestDone(q.id);if(q.id!=='m20')then&&then();});}
let qpT=0;function questPing(){qpT=1;}
function updTracker(){const el=$('trk');if(!S){return;}const act=QUESTS.filter(q=>qst(q.id)&&qst(q.id).s===1);const q=act.find(q=>q.main)||act[0];
 if(!q){const av=QUESTS.find(q=>q.main&&qAvail(q));if(av){el.innerHTML=`<b>📜 ${tr(av.n)}</b><br>❗ ${T('talkto')} ${nname(av.g)}`;el.classList.remove('hid');}else el.classList.add('hid');return;}
 const c=qComplete(q);el.innerHTML=`<b>📜 ${tr(q.n)}</b>`+(c?`<br>✅ ${T('talkto')} ${nname(q.to||q.g)}`:q.o.map(o=>{const[a,b]=objProg(q,o);return`<br>${a>=b?'✔️':'•'} ${objText(o)} ${b>1?a+'/'+b:''}`;}).join(''));el.classList.remove('hid');}
function npcMark(id){for(const q of QUESTS){const s=qst(q.id);if(s&&s.s===1&&(q.to||q.g)===id&&qComplete(q))return'?';}for(const q of QUESTS){if(q.g===id&&qAvail(q)&&!q.auto)return'!';}return'';}
function onQuestDone(id){if(id==='m20')setTimeout(ending,600);if(id==='m21')setTimeout(credits,800);}

/* ---------- board ---------- */
function genBoard(){const pool=[];const tier=seedTier();Object.values(CROPS).forEach(c=>{if(c.t<=tier&&(!c.dome||S.proj.dome))pool.push(c.id);});
 ['stone','scrap','coal'].forEach(x=>pool.push(x));if(S.proj.cargo)pool.push('copper_ore','iron_ore','ice','quartz','copper_bar','iron_bar','gear','plank','glass');
 if(S.proj.aquarium)FISH.slice(0,10).forEach(f=>pool.push(f[0]));if(S.proj.ranch)pool.push('egg','milk','wool','feather');
 Object.values(RECIPES).forEach(r=>{if(r.st==='cook'&&known(r)&&ITEMS[r.out].cat==='food')pool.push(r.out);});
 const npcs=Object.keys(NPCS).filter(k=>fr(k).met);if(!npcs.length)npcs.push('captain');
 S.board=[0,1,2].map(()=>{const it=pick(pool);const p=ITEMS[it].p;const n=clamp(Math.round(240/p),1,12);return{it,n,npc:pick(npcs),done:0};});S.boardDay=S.day;}
function deliverBoard(i){const b=S.board[i];if(!b||b.done||!take(b.it,b.n)){sfx('err');return;}b.done=1;const m=Math.round(ITEMS[b.it].p*b.n*1.8+40);addMoney(m);addFr(b.npc,40);S.rp+=S.proj.observatory?3:0;stat('board');sfx('coin');toast('💰 +'+fmt(m)+' ¢ · 💗 '+nname(b.npc));}

/* ---------- time & days ---------- */
function tickMinute(){S.time++;if(S.time%15===0)S.energy=Math.min(maxE(),S.energy+1);if(S.time>=1560)sleep(true);}
function sleep(passed){if(G.sleeping)return;G.sleeping=1;fadeTo(()=>{newDay(passed);if(passed){enterDeck('cabin',5*TS+8);save(true);}G.sleeping=0;});}
function newDay(passed){
 const prevDay=S.day;S.day++;S.time=360;
 // crops
 Object.entries(S.plots).forEach(([k,p])=>{if(!p||!p.c)return;const c=CROPS[p.c];if(p.w){p.g+=1;if(p.f&&Math.random()<0.5)p.g+=1;}p.w=0;if(p.g>c.d)p.g=c.d;});
 if(S.res.sprinklers)Object.values(S.plots).forEach(p=>{if(p&&p.c)p.w=1;});
 // animals
 Object.values(S.pens).forEach(p=>{if(p&&p.a&&p.fed===prevDay){p.prod=1;}});
 const me=maxE();S.energy=passed?Math.round(me*0.6):me;
 genBoard();
 save(true);
 setTimeout(()=>{toast('☀️ '+T('morning')+' '+S.day);if(passed)toast('😵 '+T('passout'));if(S.day===2)toast('💡 '+T('tip1'));},400);
 rebuildObjs();}

/* ================= AUDIO (soft, warm, generative) ================= */
const AU={c:null};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function impulse(C,sec,dec){const len=Math.floor(C.sampleRate*sec),b=C.createBuffer(2,len,C.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec);}return b;}
function auInit(){if(AU.c)return;try{const C=new(window.AudioContext||window.webkitAudioContext)();AU.c=C;
 AU.m=C.createGain();AU.m.gain.value=0.9;const comp=C.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=20;comp.ratio.value=3;AU.m.connect(comp);comp.connect(C.destination);
 AU.rv=C.createConvolver();AU.rv.buffer=impulse(C,3.4,2.4);const wet=C.createGain();wet.gain.value=0.5;AU.rv.connect(wet);wet.connect(AU.m);
 AU.mus=C.createGain();AU.mus.gain.value=SET.music*0.6;const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3800;lp.Q.value=0.2;AU.mus.connect(lp);lp.connect(AU.m);const ms=C.createGain();ms.gain.value=0.85;lp.connect(ms);ms.connect(AU.rv);
 AU.fx=C.createGain();AU.fx.gain.value=SET.sfx*0.7;AU.fx.connect(AU.m);const fs=C.createGain();fs.gain.value=0.35;AU.fx.connect(fs);fs.connect(AU.rv);
 const nb=C.createBuffer(1,C.sampleRate,C.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;AU.nb=nb;
 AU.next=C.currentTime+0.3;AU.step=0;AU.mel=74;setInterval(musicTick,90);}catch(e){}}
function auVol(){if(!AU.c)return;AU.mus.gain.value=SET.music*0.6;AU.fx.gain.value=SET.sfx*0.7;}
function voice(t,dest,vol,a,dec){const g=AU.c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);g.connect(dest);return g;}
function osc(type,f,t,stop,dest,det){const o=AU.c.createOscillator();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;o.connect(dest);o.start(t);o.stop(stop);return o;}
function pad(m,t,dur,vol){const C=AU.c;const f=C.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(500,t);f.frequency.linearRampToValueAtTime(1300,t+dur*0.5);f.frequency.linearRampToValueAtTime(700,t+dur+2);f.Q.value=0.4;
 const g=C.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+1.8);g.gain.setValueAtTime(vol,t+dur);g.gain.exponentialRampToValueAtTime(0.0001,t+dur+3.2);f.connect(g);g.connect(AU.mus);
 const end=t+dur+3.4;osc('triangle',mtof(m),t,end,f,-6);osc('triangle',mtof(m),t,end,f,6);osc('sine',mtof(m)/2,t,end,f);}
function ep(m,t,vol,dec,dest){const C=AU.c;const fq=mtof(m);const g=voice(t,dest||AU.mus,vol,0.006,dec);const car=osc('sine',fq,t,t+dec+0.2,g);const mod=C.createOscillator();mod.frequency.value=fq;const mg=C.createGain();mg.gain.setValueAtTime(fq*0.9,t);mg.gain.exponentialRampToValueAtTime(fq*0.02,t+0.7);mod.connect(mg);mg.connect(car.frequency);mod.start(t);mod.stop(t+dec+0.2);
 osc('sine',fq*2,t,t+0.5,voice(t,dest||AU.mus,vol*0.12,0.004,0.4));}
function bell(m,t,vol,dec,dest){[[1,1],[2.01,0.22],[3.98,0.07]].forEach(([r,a])=>{osc('sine',mtof(m)*r,t,t+dec+0.1,voice(t,dest||AU.mus,vol*a,0.004,dec/(r>1?2.6:1)));});}
function bass(m,t,dur,vol){const C=AU.c;const f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=380;const g=voice(t,AU.mus,vol,0.05,dur);f.connect(g);osc('triangle',mtof(m),t,t+dur+0.2,f);osc('sine',mtof(m),t,t+dur+0.2,f);}
function noiseHit(t,vol,freq,q,dec,dest){const C=AU.c;const s=C.createBufferSource();s.buffer=AU.nb;const f=C.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=voice(t,dest||AU.mus,vol,0.004,dec);s.connect(f);f.connect(g);s.start(t,Math.random()*0.5);s.stop(t+dec+0.1);}
const PROGS={
 day:[[53,57,60,64,67],[52,55,59,62],[50,53,57,60,64],[48,52,55,59,62]],

const DECK_MOOD={cabin:'home',bridge:'home',hydro:'farm',eng:'work',cargo:'work',prom:'market',obs:'dream',aqua:'dream',ranch:'farm',dome:'farm',hull:'space',reactor:'core',verdance:'farm'};
function musicMood(){if(!S||G.mode!=='play'||!G.D)return'title';const m=DECK_MOOD[G.D.id]||'home';if((S.time>=1200||S.time<390)&&m!=='core'&&m!=='space')return'night';return m;}
function musicTick(){const C=AU.c;if(!C||SET.music<=0.001)return;if(AU.next<C.currentTime)AU.next=C.currentTime+0.05;
 while(AU.next<C.currentTime+0.5){const t=AU.next,s=AU.step,mood=musicMood(),M=MOODS[mood],soft=mood==='night'||mood==='space'||mood==='core'||mood==='dream';const st=60/M.bpm/2;
  const bar=Math.floor(s/8),pos=s%8,sect=Math.floor(bar/8)%2;let prog=PROGS[mood];if(mood==='home'&&Math.floor(bar/16)%2)prog=PROGS.day2;const ch=prog[bar%4];const lead=M.lead==='ep'?ep:bell;
  if(pos===0){ch.slice(1).forEach(m=>pad(m,t,st*8,soft?0.016:0.02));bass(ch[0]-12,t,st*5,soft?0.07:0.09);if(bar%2===0){AU.rh=pick(RHY);AU.rest=Math.random()<0.3;}}
  if(pos===4)bass(ch[0]-5,t,st*3,0.05);
  if(mood==='work'&&(pos===2||pos===6))ep(ch[0]+12,t,0.02,0.3);

  if((sect===0||soft)&&[0,3,5,6].includes(pos)&&Math.random()<M.arp){const n=ch[pos%4%ch.length]+12;(soft?bell:ep)(n,t+Math.random()*0.02,soft?0.03:0.035,soft?2.6:2.2);}
  if((sect===1&&!soft)||(soft&&bar%4>=2)){const ps=(bar%2)*8+pos;if(AU.rh&&!AU.rest&&AU.rh.includes(ps)){let i=PENTA.indexOf(AU.mel);if(i<0)i=6;i=clamp(i+pick([-2,-1,-1,0,1,1,2]),3,PENTA.length-2);let m=PENTA[i];
    if(ps>=12){const tones=ch.map(x=>x+24).concat(ch.map(x=>x+12));m=tones.reduce((a,b)=>Math.abs(b-m)<Math.abs(a-m)?b:a);}AU.mel=m;lead(m,t,soft?0.04:0.05,soft?2.4:1.8);}}
  if(M.br&&G.mode==='play'&&(pos===2||pos===6))noiseHit(t,mood==='market'?0.009:0.006,7000,0.8,0.08);

 IN.rsy=Math.abs(ax[3]||0)>0.25?ax[3]:(bt(7)?1:bt(6)?-1:0);const p={L:bt(14)||ax[0]<-0.45,R:bt(15)||ax[0]>0.45,U:bt(12)||ax[1]<-0.5,D:bt(13)||ax[1]>0.5,A:bt(0),B:bt(1),X:bt(2),Y:bt(3),ST:bt(9)||bt(8),LB:bt(4),RB:bt(5)};

 h+=`<div class="wb">${m.body(m)}</div></div>`;
 root.innerHTML=h;root.classList.remove('hid');

 if(keep){if(fk)el=root.querySelector(`.f[data-k="${CSS.escape(fk)}"]`);if(!el)el=els[Math.min(fi,els.length-1)];const wb=root.querySelector('.wb');if(wb)wb.scrollTop=sc;}

function navMove(dx,dy){const root=navRoot();if(!root)return;const els=[...root.querySelectorAll('.f')].filter(e=>e.offsetParent!==null);if(!els.length)return;
 let cur=root.querySelector('.f.foc');if(!cur||!els.includes(cur)){setFoc(els[0]);return;}
 const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
 for(const e of els){if(e===cur)continue;const q=e.getBoundingClientRect(),ex=q.left+q.width/2,ey=q.top+q.height/2;const ddx=ex-cx,ddy=ey-cy;const main=dx?ddx*dx:ddy*dy;if(main<=3)continue;const cross=dx?Math.abs(ddy):Math.abs(ddx);const s=main+cross*(dx?3:1.6);if(s<bs){bs=s;best=e;}}
 if(best){const sc=scroller(root);if(sc&&dy){const br=best.getBoundingClientRect(),sr=sc.getBoundingClientRect();if(dy>0&&br.top>sr.bottom+40){sc.scrollBy({top:90});return;}if(dy<0&&br.bottom<sr.top-40){sc.scrollBy({top:-90});return;}}setFoc(best);sfx('move');}else if(dy){const sc=scroller(root);if(sc)sc.scrollBy({top:dy*90});}}

/* ================= WORLD ================= */
function srand(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashS(s){let h=2166136261;for(const ch of s)h=Math.imul(h^ch.charCodeAt(0),16777619);return h>>>0;}
function buildDeck(id){const sp=DECKS[id];const w=sp.w;const t=new Uint8Array(w*DH);const set=(x,y,v)=>{if(x>=0&&x<w&&y>=0&&y<DH)t[y*w+x]=v;};
 for(let x=0;x<w;x++){set(x,0,1);set(x,1,1);for(let y=LV[0];y<DH;y++)set(x,y,1);}for(let y=0;y<DH;y++){set(0,y,1);set(w-1,y,1);}
 (sp.f1||[]).forEach(([a,b])=>{for(let x=a;x<=b;x++)set(x,LV[1],1);});(sp.f2||[]).forEach(([a,b])=>{for(let x=a;x<=b;x++)set(x,LV[2],1);});
 (sp.pl||[]).forEach(([x,y,n])=>{for(let i=0;i<n;i++)set(x+i,y,2);});
 (sp.ld||[]).forEach(([x,a,b])=>{for(let y=LV[b];y<LV[a];y++)set(x,y,y===LV[b]?4:3);});
 const D={id,sp,w,t,pal:PAL[id]};buildGeo(D);return D;}
function tileAt(tx,ty){const D=G.D;if(tx<0||tx>=D.w||ty<0||ty>=DH)return 1;return D.t[ty*D.w+tx];}
function objVisible(o){if(!o.rq)return true;const[k,v]=o.rq.split(':');return k==='r'?!!S.res[v]:!!S.proj[v];}
function rebuildObjs(){if(!G.D)return;const D=G.D;G.objs=[];
 D.sp.o.forEach((a,i)=>{const[t,x,l,ex]=a;const o=Object.assign({t,i,key:D.id+'_'+i,x:x*TS+TS/2,y:LV[l]*TS,l},ex||{});o.hx=o.x;o.face=1;o.wt=0;o.tx=o.x;if(objVisible(o))G.objs.push(o);});
 S.furn.forEach((f,i)=>{if(f.d===D.id)G.objs.push({t:'furn',fi:i,id:f.id,x:f.x,y:f.y,key:'f'+i});});
 G.pick=[];D.sp.sh.forEach(([x,y],i)=>{const k=D.id+'_s'+i;if(!S.got[k])G.pick.push({k,id:'shard',x:x*TS+8,y:y*TS+8});});
 D.sp.ar.forEach(([id,x,y],i)=>{const k=D.id+'_a'+i;if(!S.got[k])G.pick.push({k,id,x:x*TS+8,y:y*TS+8});});}
function enterDeck(id,px,py){G.D=buildDeck(id);S.deck=id;const first=!S.visited[id];S.visited[id]=1;rebuildObjs();
 if(!G.P)G.P={w:10,h:24,vx:0,vy:0,face:1,fr:0,climb:false,ground:false,dj:false,jb:0,co:0,drop:0,step:0};const P=G.P;
 const el=G.objs.find(o=>o.t==='elev');P.x=px!=null?px:(el?el.x:5*TS)-P.w/2;P.y=py!=null?py:LV[0]*TS-P.h;P.vx=P.vy=0;P.climb=false;
 if(P.x<TS||P.x>(G.D.w-1)*TS-P.w)P.x=5*TS;
 G.parts=[];G.cam.snap=1;toast('📍 '+tr(DECKS[id].n));if(first)questPing();updHud();}
function travel(id){sfx('door');fadeTo(()=>enterDeck(id));}
function fadeTo(fn){G.fading=1;$('fade').style.opacity=1;setTimeout(()=>{try{fn();}catch(e){console.error(e);}$('fade').style.opacity=0;setTimeout(()=>G.fading=0,200);},330);}

/* ---------- physics ---------- */
const GRAV=0.32,JUMP=5.9,JUMP2=5.3;
function isLad(t){return t===3||t===4;}
function ladAt(x,y){return isLad(tileAt(Math.floor(x/TS),Math.floor(y/TS)));}
function canClimbUp(){const P=G.P,cx=P.x+P.w/2;return ladAt(cx,P.y+P.h-1)||ladAt(cx,P.y+P.h/2);}
function physics(){const P=G.P,D=G.D;const lg=D.sp.lowg?0.42:1;const spd=S.res.thrusters?2.2:1.55;
 const ax=(IN.cur.R?1:0)-(IN.cur.L?1:0);const cx=P.x+P.w/2,tx=Math.floor(cx/TS);
 if(P.jb>0)P.jb--;if(P.drop>0)P.drop--;
 if(!P.climb){
  if(IN.cur.U&&canClimbUp()&&!(P.jb>0&&IN.dev!=='pad'&&!IN.cur.U)){P.climb=true;P.jb=0;}
  else if(IN.cur.D&&P.ground&&ladAt(cx,P.y+P.h+2)){P.climb=true;P.y+=2;}}
 if(P.climb){P.vx=0;P.x+=((tx*TS+TS/2)-cx)*0.4;let vy=((IN.cur.D?1:0)-(IN.cur.U?1:0))*1.4;P.vy=vy;
  if(P.jb>0&&!IN.cur.U){P.climb=false;P.vy=-4.2;P.jb=0;P.ground=false;}
  else if(ax&&!vy){P.climb=false;}
  else{P.y+=vy;P.fr+=vy?0.15:0;
   if(vy>0){const b=P.y+P.h;const t=tileAt(tx,Math.floor(b/TS));if(t===1){P.y=Math.floor(b/TS)*TS-P.h;P.climb=false;P.ground=true;}}
   if(!ladAt(P.x+P.w/2,P.y+P.h-1)&&!ladAt(P.x+P.w/2,P.y+P.h/2)){P.climb=false;if(vy<0)P.vy=0;}
   return;}}
 const tv=ax*spd;P.vx+=(tv-P.vx)*(P.ground?0.3:0.15);if(ax)P.face=ax;
 if(P.ground){P.co=6;P.dj=false;}else if(P.co>0)P.co--;
 if(P.jb>0){if(P.co>0){P.vy=-JUMP*(D.sp.lowg?0.82:1);P.co=0;P.jb=0;P.ground=false;sfx('jump');}
  else if(S.res.jetboots&&!P.dj){P.vy=-JUMP2*(D.sp.lowg?0.8:1);P.dj=true;P.jb=0;sfx('jump');for(let i=0;i<8;i++)G.parts.push({x:P.x+P.w/2,y:P.y+P.h,vx:rnd(-1,1),vy:rnd(0.5,1.5),l:20,c:'#ffb347',s:2});}}
 if(IN.cur.D&&P.ground&&!ladAt(cx,P.y+P.h+2)&&tileAt(tx,Math.floor((P.y+P.h+1)/TS))===2)P.drop=10;
 if(!IN.cur.A&&!IN.cur.SP&&!IN.cur.U&&P.vy<-2)P.vy+=GRAV*lg*0.8;
 P.vy=Math.min(P.vy+GRAV*lg,D.sp.lowg?4:7);
 P.x+=P.vx;
 if(P.vx>0){const tx2=Math.floor((P.x+P.w)/TS);for(let ty=Math.floor(P.y/TS);ty<=Math.floor((P.y+P.h-0.01)/TS);ty++)if(tileAt(tx2,ty)===1){P.x=tx2*TS-P.w;P.vx=0;break;}}
 else if(P.vx<0){const tx2=Math.floor(P.x/TS);for(let ty=Math.floor(P.y/TS);ty<=Math.floor((P.y+P.h-0.01)/TS);ty++)if(tileAt(tx2,ty)===1){P.x=(tx2+1)*TS;P.vx=0;break;}}
 const oldB=P.y+P.h;P.y+=P.vy;const wasG=P.ground;P.ground=false;
 if(P.vy>=0){const b=P.y+P.h,ty=Math.floor(b/TS);for(let x2=Math.floor(P.x/TS);x2<=Math.floor((P.x+P.w-0.01)/TS);x2++){const t=tileAt(x2,ty);if(t===1||((t===2||t===4)&&oldB<=ty*TS+0.5&&!(P.drop>0&&t===2))){P.y=ty*TS-P.h;if(!wasG&&P.vy>3){for(let i=0;i<4;i++)G.parts.push({x:P.x+P.w/2,y:P.y+P.h,vx:rnd(-1,1),vy:rnd(-0.6,-0.1),l:14,c:'rgba(255,255,255,.5)',s:1});}P.vy=0;P.ground=true;break;}}}
 else{const ty=Math.floor(P.y/TS);for(let x2=Math.floor(P.x/TS);x2<=Math.floor((P.x+P.w-0.01)/TS);x2++)if(tileAt(x2,ty)===1){P.y=(ty+1)*TS;P.vy=0;break;}}
 if(P.ground&&Math.abs(P.vx)>0.3)P.fr+=Math.abs(P.vx)*0.09;else if(P.ground)P.fr=0;
 if(P.y>DH*TS){P.y=LV[0]*TS-P.h-2;P.vy=0;}}

function objLabel(o){switch(o.t){case'elev':return o.e?'🚀 Starhaven':'🛗 '+T('elev');case'npc':return'💬 '+nname(o.id);
 case'plot':{const p=S.plots[o.key];if(!p||!p.c)return'🌱 '+T('planttxt');const c=CROPS[p.c];if(p.g>=c.d)return ITEMS[p.c].ic+' '+T('harvest');if(!p.w)return'💧 '+T('water');return ITEMS[p.c].ic+' ⏳'+(c.d-p.g);}
 case'node':{const N=NODES[o.n];return(N.soft?'🤲 '+T('gather'):'⛏️ '+T('mine'))+' '+N.ic;}
 case'bed':return'🛏️ '+T('bed');case'stove':return'🍳 '+T('stove');case'bench':return'🔨 '+T('bench');case'smelter':return'🔥 '+T('smelter');case'build':return'🏗️ '+T('buildt');case'board':return'📋 '+T('board');
 case'console':return'🧬 '+T('console');case'archive':return'🏛️ '+T('archd');case'scope':return'🔭 '+T('scope');case'fish':return'🎣 '+T('fish');
 case'pen':{const p=S.pens[o.key];if(!p||!p.a)return'🏠 '+T('pen');const a=ANIMALS[p.a];return a.ic+' '+(p.prod?T('collect'):p.fed!==S.day?T('feed'):T('pet'));}
 case'trough':return'🌾 '+T('trough');case'hive':return'🐝 '+T('hive');case'decor':return'🧰 '+T('decor');case'furn':return ITEMS[o.id].ic+' '+iname(o.id);}return T('interact');}
const interactive=o=>o.t!=='deco'&&!(o.t==='node'&&S.nodes[o.key]&&S.nodes[o.key].d===S.day);
function findNear(){const P=G.P,cx=P.x+P.w/2,by=P.y+P.h;let best=null,bd=1e9;for(const o of G.objs){if(!interactive(o))continue;const w=o.t==='pen'?26:o.t==='fish'?24:14;const dx=Math.abs(o.x-cx),dy=Math.abs(o.y-by);if(dx<w&&dy<14){const d=dx+dy;if(d<bd){bd=d;best=o;}}}G.near=best;}
function interact(o){switch(o.t){
 case'elev':menuElevator();break;case'npc':talkNpc(o.id);break;case'plot':usePlot(o);break;case'node':mineNode(o);break;
 case'bed':confirmBox(T('sleep'),()=>sleep(false));break;case'stove':menuCraft('cook');break;case'bench':menuCraft('craft');break;
 case'smelter':if(!S.proj.forge)say('sys',T('forgecold'));else menuCraft('smelt');break;case'build':menuBuild();break;case'board':menuBoard();break;
 case'console':menuPause('research');break;case'archive':menuDonate();break;case'scope':useScope();break;case'fish':startFish(o);break;
 case'pen':usePen(o);break;case'trough':feedAll();break;case'hive':useHive(o);break;case'decor':menuDecor();break;case'furn':useFurn(o);break;}}
function talkNpc(id){const f=fr(id);const first=!f.met;f.met=1;
 QUESTS.forEach(q=>{const s=qst(q.id);if(s&&s.s===1)q.o.forEach(o=>{if(o.t==='talk'&&o.npc===id&&!s.tk[id]){s.tk[id]=1;questPing();}});});
 const tq=QUESTS.find(q=>{const s=qst(q.id);return s&&s.s===1&&(q.to||q.g)===id&&qComplete(q);});
 if(tq){turnIn(tq,()=>talkNpc(id));return;}talkNpc2(id,first);}
function talkNpc2(id,first){const f=fr(id),n=NPCS[id];const hs=hearts(id);
 for(const lv of[3,6,9]){if(hs>=lv&&!f.ev[lv]&&n.hr[lv]){f.ev[lv]=1;const rw=n.hr[lv];sayNpc(id,tr(n.hi[lv===9?1:0])+' 💝',()=>{toast('💝 '+nname(id)+' '+T('heartgift'));if(rw.rec){S.known[rw.rec]=1;toast('📖 '+T('recipe')+': '+iname(rw.rec));}else giveRw(rw);talkNpc2(id);});return;}}
 const aq=QUESTS.find(q=>q.g===id&&qAvail(q)&&q.i[0]);
 if(aq){say(id,tr(aq.i),[['📜 '+T('accept'),()=>{acceptQ(aq);talkMenu(id);}],[T('later'),()=>talkMenu(id)]]);return;}
 talkMenu(id,null,first);}
function npcLine(id){const n=NPCS[id];const pool=hearts(id)>=5?n.ln.concat(n.hi):n.ln;return tr(pick(pool));}
function talkMenu(id,line,first){const f=fr(id);if(f.t!==S.day){f.t=S.day;addFr(id,15);}
 if(id==='nova'&&S.proj.musichall&&S.flags.concert!==S.day){S.flags.concert=S.day;S.energy=Math.min(maxE(),S.energy+25);toast('🎵 '+T('concert'));}
 const ln=line||(first?(LANG?`Hej! Jag är ${nname(id)}, ${tr(NPCS[id].role).toLowerCase()}. `:`Hi! I'm ${nname(id)}, the ${tr(NPCS[id].role).toLowerCase()}. `)+npcLine(id):npcLine(id));
 const opts=[['💬 '+T('talk'),()=>talkMenu(id,npcLine(id))],['🎁 '+T('gift'),()=>menuGift(id)]];if(SHOPS[id])opts.push(['🛍️ '+T('shop'),()=>menuShop(id)]);opts.push(['👋 '+T('bye'),null]);say(id,ln,opts);}
function plotState(o){return S.plots[o.key]||(S.plots[o.key]={c:null,g:0,w:0,f:0});}
function seedFits(o,crop){return o.any||o.dome||!CROPS[crop].dome;}
function plantSeed(o,id){const p=plotState(o);if(p.c||!take(id))return;p.c=ITEMS[id].crop;p.g=0;p.f=0;sfx('pick');burst(o.x,o.y-4,'#8fd16a',6);}
function usePlot(o){const p=plotState(o);if(!p.c){menuSeeds(o);return;}const c=CROPS[p.c];
 if(p.g>=c.d){const n=1+(Math.random()<(p.f?0.35:0.12)?1:0);add(p.c,n);stat('harvest',n);if(c.dome)stat('domeharvest',n);sfx('pick');burst(o.x,o.y-8,'#b8f58a',10);if(c.r)p.g=c.d-c.r;else{p.c=null;p.g=0;p.f=0;}return;}
 if(!p.w){if(!useE(1))return;const rng=(S.tools.can-1)*2*TS+4;G.objs.filter(q=>q.t==='plot'&&q.l===o.l&&Math.abs(q.x-o.x)<=rng).forEach(q=>{const s=plotState(q);if(s.c&&!s.w){s.w=1;for(let i=0;i<5;i++)G.parts.push({x:q.x+rnd(-5,5),y:q.y-14,vx:rnd(-.3,.3),vy:rnd(.5,1.2),l:20,c:'#7fd0ff',s:2});}});sfx('water');return;}
 if(!p.f&&has('fertilizer')){confirmBox(T('fert')+'? 🥫',()=>{take('fertilizer');p.f=1;sfx('pick');});return;}
 toast(ITEMS[p.c].ic+' '+iname(p.c)+' · ⏳ '+(c.d-p.g)+' · 💧✔️');}
function mineNode(o){const N=NODES[o.n];const st=S.nodes[o.key]||(S.nodes[o.key]={d:0,h:0});if(st.d===S.day)return;if(!useE(N.soft?1:2))return;
 st.h++;o.shake=8;sfx('hit');for(let i=0;i<4;i++)G.parts.push({x:o.x,y:o.y-8,vx:rnd(-1.5,1.5),vy:rnd(-2,-0.5),l:22,c:N.soft?'#8fd16a':'#c9c0b0',s:2,g:1});
 const need=N.soft?N.h:Math.max(1,N.h-(S.tools.drill-1));
 if(st.h>=need){st.h=0;st.d=S.day;N.dr.forEach(([id,a,b])=>add(id,rint(a,b)));(N.x||[]).forEach(([id,ch,n])=>{if(Math.random()<ch)add(id,n);});if(N.art&&Math.random()<N.art)add(pick(ARTS),1);stat('mined');burst(o.x,o.y-8,'#ffe9a0',10);sfx('pick');}}
function freePens(){const keys=[];DECKS.ranch.o.forEach((a,i)=>{if(a[0]!=='pen')return;const rq=a[3]&&a[3].rq;if(rq&&!S.res[rq.split(':')[1]])return;const k='ranch_'+i;if(!S.pens[k]||!S.pens[k].a)keys.push(k);});return keys;}
function buyAnimal(k){const a=ANIMALS[k];const fp=freePens();if(!fp.length){toast(T('nopen'));sfx('err');return;}if(S.money<a.p){toast(T('nomoney'));sfx('err');return;}S.money-=a.p;S.pens[fp[0]]={a:k,fed:0,prod:0,love:0};sfx('fanfare');toast(a.ic+' '+tr(a.n)+' 💗');questPing();rebuildObjs();refresh();}
function usePen(o){const p=S.pens[o.key];if(!p||!p.a){say('sys',T('penempty'));return;}const a=ANIMALS[p.a];
 if(p.prod){p.prod=0;let n=1;if(a.x&&Math.random()<0.3)n++;if(S.res.husbandry&&Math.random()<0.25)n++;add(a.pr,n);sfx('pick');return;}
 if(p.fed!==S.day){if(!take('hay')){say('sys',T('nohay'));return;}p.fed=S.day;p.love=(p.love||0)+1;sfx('eat');}else sfx('quest');
 for(let i=0;i<3;i++)G.parts.push({x:o.x+rnd(-8,8),y:o.y-16,vx:0,vy:-0.4,l:40,ch:'💗',s:7});}
function feedAll(){let n=0;Object.values(S.pens).forEach(p=>{if(p&&p.a&&p.fed!==S.day&&take('hay')){p.fed=S.day;n++;}});if(n){toast('🧺 '+T('fedall')+': '+n);sfx('eat');}else if(!has('hay'))say('sys',T('nohay'));else toast('💗');}
function useHive(o){const h=S.hives[o.key]||(S.hives[o.key]={d:S.proj.beehives||S.day});if(S.day-h.d>=2){add('honey',rint(1,2));h.d=S.day;sfx('pick');}else toast('🐝 '+T('hivenot'));}

function placeFurn(id){const P=G.P;if(!P.ground||P.climb){toast(T('notground'));return;}if(!take(id))return;S.furn.push({id,d:G.D.id,x:Math.round(P.x+P.w/2),y:Math.round(P.y+P.h)});rebuildObjs();sfx('pick');questPing();}
function useFurn(o){const f=S.furn[o.fi];if(!f)return;if(f.id==='cat'&&S.flags.cat!==S.day){S.flags.cat=S.day;S.energy=Math.min(maxE(),S.energy+5);toast(T('cat'));sfx('quest');for(let i=0;i<3;i++)G.parts.push({x:o.x+rnd(-6,6),y:o.y-14,vx:0,vy:-0.4,l:40,ch:'💗',s:7});return;}
 say('sys',ITEMS[f.id].ic+' '+iname(f.id),[[T('pick'),()=>{S.furn.splice(o.fi,1);add(f.id,1,true);rebuildObjs();sfx('pick');}],[T('cancel'),null]]);}

function startFish(o){if(S.tools.rod<1){say('sys',T('needrod'));return;}if(!useE(3))return;G.fish={ph:0,t:rint(70,170),o};sfx('water');}
function chooseFish(deep){const maxD=[0,3,4,5,6][S.tools.rod];const bait=take('bait');let pool=FISH.filter(f=>f[5]<=maxD&&(!f[7]||(S.proj.bigtank&&(deep||f[0]==='dolphin'))));if(deep)pool=pool.filter(f=>f[5]>=2||f[0]==='boot');
 const ws=pool.map(f=>f[6]*(bait&&f[5]>=3?2.5:1)*(deep&&f[5]>=4?2:1));let r=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i];}return pool[0];}
function updFish(){const f=G.fish;if(f.ph===0){if(--f.t<=0){const fi=chooseFish(f.o.deep);f.fi=fi;const d=fi[5];f.ph=1;f.pos=0;f.dir=1;f.spd=0.011+d*0.0035;f.zw=clamp(0.3-d*0.03+(S.res.sonar?0.07:0)+S.tools.rod*0.015,0.1,0.45);f.zc=rnd(f.zw/2,1-f.zw/2);f.hits=0;f.miss=0;sfx('good');}}
 else if(f.ph===1){f.pos+=f.dir*f.spd;if(f.pos>1){f.pos=1;f.dir=-1;}if(f.pos<0){f.pos=0;f.dir=1;}}
 else if(f.ph===2){if(--f.t<=0)G.fish=null;}}
function fishPress(){const f=G.fish;if(!f)return;if(f.ph===0){G.fish=null;return;}if(f.ph===2){G.fish=null;return;}
 if(Math.abs(f.pos-f.zc)<=f.zw/2){f.hits++;sfx('good');f.zc=rnd(f.zw/2,1-f.zw/2);f.spd*=1.07;if(f.hits>=3){f.ph=2;f.t=110;f.ok=1;add(f.fi[0],1);if(f.fi[0]!=='boot')stat('fish');sfx('catch');}}
 else{f.miss++;sfx('bad');if(f.miss>=3){f.ph=2;f.t=90;f.ok=0;}}}

const TAU=Math.PI*2;
const cv=$('c'),cx=cv.getContext('2d');let K=2,VW=400,VH=300;
function resize(){const dpr=Math.min(3,window.devicePixelRatio||1);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);K=Math.max(0.7,Math.min(cv.height/(17*TS),cv.width/(22*TS)));VW=cv.width/K;VH=cv.height/K;for(const k in EC)delete EC[k];G.cam.snap=1;}
addEventListener('resize',resize);
function shade(hex,a){if(hex[0]!=='#')return hex;let n=parseInt(hex.slice(1,7),16),r=n>>16,g=n>>8&255,b=n&255;const f=a<0?0:255,t=Math.abs(a);r=Math.round(r+(f-r)*t);g=Math.round(g+(f-g)*t);b=Math.round(b+(f-b)*t);return`rgb(${r},${g},${b})`;}
function rgba(hex,a){const n=parseInt(hex.slice(1,7),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`;}
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function rrf(c,x,y,w,h,r,col){c.fillStyle=col;rr(c,x,y,w,h,r);c.fill();}

function handleInput(){const pr=IN.pr;if(G.mode==='boot')return;if(G.ignoreT>0){G.ignoreT--;return;}
 const ok=pr.B||pr.OK||pr.SP,no=pr.A||pr.BK;
 const rep=k=>{if(pr[k]){IN.hold[k]=0;return true;}if(IN.cur[k]){IN.hold[k]=(IN.hold[k]||0)+1;if(IN.hold[k]>22&&IN.hold[k]%6===0)return true;}else IN.hold[k]=0;return false;};
 const nav=()=>{if(rep('U'))navMove(0,-1);if(rep('D'))navMove(0,1);if(rep('L'))navMove(-1,0);if(rep('R'))navMove(1,0);if(IN.rsy){const sc=scroller(navRoot());if(sc)sc.scrollTop+=IN.rsy*9;}};
 if($('credits')&&!$('credits').classList.contains('hid')){if(ok||no)$('credits').classList.add('hid');return;}
 if(DLG.cur){const d=DLG.cur;if(d.opts&&DLG.shown>=DLG.full.length){nav();if(ok)navOk();else if(no||pr.ST){const bs=$('dlg').querySelectorAll('.do .f');if(bs.length)bs[bs.length-1].click();}}
  else if(ok||no||pr.X)dlgAdvance();return;}
 if(UI.stack.length||G.mode==='title'){nav();if(ok)navOk();
  if(UI.stack.length){if(pr.ST||(pr.Y&&topM().id==='pause'))closeAll();else if(no)back();if(pr.LB)menuTab(-1);if(pr.RB)menuTab(1);}return;}
 if(G.mode!=='play')return;
 if(G.fish){if(ok||pr.X)fishPress();else if(no||pr.ST)G.fish=null;return;}
 if(G.fading)return;
 if((pr.B||pr.X||pr.OK)&&G.near){interact(G.near);return;}
 if(pr.ST||pr.BK){menuPause();return;}if(pr.Y){menuPause('bag');return;}
 if(pr.A||pr.SP)G.P.jb=8;if(pr.UJ&&IN.dev!=='pad'&&!canClimbUp()&&!G.P.climb)G.P.jb=8;}
let last=performance.now(),acc=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(100,now-last);last=now;acc+=dt;inputFrame();try{handleInput();}catch(e){console.error(e);}
 let n=0;while(acc>=16.667&&n<6){try{update();}catch(e){console.error(e);}acc-=16.667;n++;}if(n>=6)acc=0;
 dlgTick();if(qpT&&G.t%15===0&&S){qpT=0;updTracker();for(const q of QUESTS){const s=qst(q.id);if(s&&s.s===1&&!QN[q.id]&&qComplete(q)){QN[q.id]=1;toast('✅ '+tr(q.n)+' → '+nname(q.to||q.g));sfx('quest');}}}
 if(++hudT%10===0)updHud();updPrompt();try{render();}catch(e){console.error(e);}}

/* ================= BOOT ================= */
function goFull(){const el=document.documentElement;if(document.fullscreenElement||document.webkitFullscreenElement)return;const rq=el.requestFullscreen||el.webkitRequestFullscreen;if(!rq)return;try{const p=rq.call(el,{navigationUI:'hide'});if(p&&p.then)p.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}catch(e){}}
function gateGo(){if(G.mode!=='boot')return;G.ignoreT=20;IN.latch={};$('gate').remove();auInit();if(SET.fs)goFull();showTitle();}
$('gate').addEventListener('click',()=>gateGo());
const auResume=()=>{if(AU.c&&AU.c.state==='suspended')AU.c.resume().catch(()=>{});};['touchend','click','keydown'].forEach(ev=>addEventListener(ev,auResume,{passive:true}));
function startGame(slot,isNew){const ld=isNew?null:loadSlot(slot);S=Object.assign(newState(slot),ld||{});if(SET.fs)goFull();$('title').classList.add('hid');closeAll();G.P=null;G.fish=null;G.mode='play';for(const k in QN)delete QN[k];
 if(S.boardDay!==S.day||!S.board.length)genBoard();enterDeck(S.deck,isNew?6*TS:S.px,isNew?null:S.py);
 QUESTS.forEach(q=>{const s=qst(q.id);if(s&&s.s===1&&qComplete(q))QN[q.id]=1;});
 $('hud').classList.remove('hid');updTouchVis();updHud();updTracker();if(isNew)setTimeout(intro,500);}
$('bBag').addEventListener('click',()=>{if(G.mode==='play'&&!uiOpen())menuPause('bag');});
$('bMenu').addEventListener('click',()=>{if(G.mode==='play'&&!uiOpen())menuPause();});
$('trk').addEventListener('click',()=>{if(G.mode==='play'&&!uiOpen())menuPause('quests');});
QS.m1.auto=1;
IN.dev=isTouch()?'touch':'kb';document.body.classList.toggle('kb',IN.dev!=='touch');
touchSetup();resize();requestAnimationFrame(frame);

</script>
</body>
</html>
