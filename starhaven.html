const TAU=Math.PI*2;
/* storybook ink & paper */
const INKC='#3b2c3e';let INKON=false,CHAR_NOSH=false;
const _isTrans=c=>typeof c.fillStyle==='string'&&c.fillStyle.startsWith('rgba');
function inkS(c,w){if(!INKON||_isTrans(c))return;c.strokeStyle=INKC;c.lineWidth=w||0.9;c.lineJoin='round';c.lineCap='round';c.stroke();}
const _tmpC={};function tmpCanvas(w,h,slot){const k=slot||'a';let t=_tmpC[k];if(!t){t=_tmpC[k]=document.createElement('canvas');}if(t.width<w)t.width=w;if(t.height<h)t.height=h;return t;}
function outlineCanvas(cv,r){const w=cv.width,h=cv.height;const t=document.createElement('canvas');t.width=w;t.height=h;const tx=t.getContext('2d');tx.drawImage(cv,0,0);tx.globalCompositeOperation='source-in';tx.fillStyle=INKC;tx.fillRect(0,0,w,h);
 const x=cv.getContext('2d');x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='destination-over';for(let i=0;i<12;i++){const a=i*Math.PI/6;x.drawImage(t,Math.cos(a)*r,Math.sin(a)*r);}x.restore();}
function makePaper(n,dark){const cv2=document.createElement('canvas');cv2.width=cv2.height=n;const x=cv2.getContext('2d');const R=srand(9173);
 for(let i=0;i<n*n/14;i++){const v=R();x.fillStyle=v<0.5?`rgba(120,90,60,${0.05+R()*0.07})`:`rgba(255,250,235,${0.05+R()*0.08})`;x.fillRect(R()*n,R()*n,1+R()*1.5,1+R()*1.5);}
 x.lineCap='round';for(let i=0;i<n/3;i++){x.strokeStyle=`rgba(${dark?'110,80,60':'150,120,90'},${0.04+R()*0.06})`;x.lineWidth=0.6+R()*0.6;const px=R()*n,py=R()*n,a=R()*TAU,l=4+R()*14;x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+Math.cos(a+0.5)*l*0.5,py+Math.sin(a+0.5)*l*0.5,px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke();}
 for(let i=0;i<n/8;i++){const g=x.createRadialGradient(0,0,0,0,0,1);const px=R()*n,py=R()*n,rr2=8+R()*26;const gg=x.createRadialGradient(px,py,0,px,py,rr2);gg.addColorStop(0,`rgba(140,100,70,${0.025+R()*0.03})`);gg.addColorStop(1,'rgba(140,100,70,0)');x.fillStyle=gg;x.fillRect(px-rr2,py-rr2,rr2*2,rr2*2);}
 return cv2;}
const PAPER=makePaper(256,1);let PAPER_PAT=null;
try{const pc2=makePaper(220,0);document.documentElement.style.setProperty('--paper-img',`url(${pc2.toDataURL()})`);}catch(e){}
function paperOverlay(c){if(!PAPER_PAT)PAPER_PAT=c.createPattern(PAPER,'repeat');c.save();c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='multiply';c.fillStyle='rgba(255,238,212,0.22)';c.fillRect(0,0,cv.width,cv.height);c.globalAlpha=0.9;c.fillStyle=PAPER_PAT;c.fillRect(0,0,cv.width,cv.height);c.restore();}
function inkChar(c,x,y,lk,fr,face,kid,seed){shadowE(c,x,y,7*(kid?0.86:1));const pad=4,w=30,h=42;const pw=Math.ceil((w+pad*2)*K),ph=Math.ceil((h+pad*2)*K);const oc=tmpCanvas(pw,ph,'ch'),ox2=oc.getContext('2d');ox2.setTransform(1,0,0,1,0,0);ox2.clearRect(0,0,oc.width,oc.height);
 ox2.setTransform(K,0,0,K,(w/2+pad-x)*K,(h+pad-y)*K);CHAR_NOSH=true;drawChar(ox2,x,y,lk,fr,face,kid,seed);CHAR_NOSH=false;
 const sc=tmpCanvas(pw,ph,'sil'),sx=sc.getContext('2d');sx.setTransform(1,0,0,1,0,0);sx.clearRect(0,0,sc.width,sc.height);sx.globalCompositeOperation='source-over';sx.drawImage(oc,0,0);sx.globalCompositeOperation='source-in';sx.fillStyle=INKC;sx.fillRect(0,0,pw,ph);sx.globalCompositeOperation='source-over';
 const X0=x-w/2-pad,Y0=y-h-pad,lw=pw/K,lh=ph/K,r=1.05;for(let i=0;i<8;i++){const a=i*Math.PI/4;c.drawImage(sc,0,0,pw,ph,X0+Math.cos(a)*r,Y0+Math.sin(a)*r,lw,lh);}c.drawImage(oc,0,0,pw,ph,X0,Y0,lw,lh);}
const cv=$('c'),cx=cv.getContext('2d');let K=2,VW=400,VH=300;
function resize(){const dpr=Math.min(3,window.devicePixelRatio||1);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);K=Math.max(0.7,Math.min(cv.height/(17*TS),cv.width/(22*TS)));VW=cv.width/K;VH=cv.height/K;for(const k in EC)delete EC[k];G.cam.snap=1;}
addEventListener('resize',resize);
function shade(hex,a){if(hex[0]!=='#')return hex;let n=parseInt(hex.slice(1,7),16),r=n>>16,g=n>>8&255,b=n&255;const f=a<0?0:255,t=Math.abs(a);r=Math.round(r+(f-r)*t);g=Math.round(g+(f-g)*t);b=Math.round(b+(f-b)*t);return`rgb(${r},${g},${b})`;}
function rgba(hex,a){const n=parseInt(hex.slice(1,7),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`;}
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function rrf(c,x,y,w,h,r,col){c.fillStyle=col;rr(c,x,y,w,h,r);c.fill();if(w>3&&h>2.4)inkS(c);}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(0,r),0,TAU);c.fill();if(r>2.2)inkS(c);}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,TAU);c.fill();if(rx>2.2&&ry>1.4)inkS(c);}
function shadowE(c,x,y,rx){c.fillStyle='rgba(10,8,30,.2)';ell(c,x,y,rx,rx*0.26);}
function glow(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);}
const EC={};
function emo(ch,sz){const k=icKey(ch)+'|'+sz;let e=EC[k];if(!e){const s=sz*K,px=Math.ceil(s*1.3)+2;e=document.createElement('canvas');e.width=e.height=px;drawGlyph(e.getContext('2d'),ch,s,(px-s)/2);outlineCanvas(e,Math.max(1,s*0.045));EC[k]=e;}return e;}
function E(c,ch,x,y,sz,a,flip){const e=emo(ch,sz);const w=e.width/K;if(a!=null)c.globalAlpha=a;if(flip){c.save();c.translate(x,0);c.scale(-1,1);c.drawImage(e,-w/2,y-w+sz*0.15,w,w);c.restore();}else c.drawImage(e,x-w/2,y-w+sz*0.15,w,w);if(a!=null)c.globalAlpha=1;}
const FONT='"Fredoka","Nunito",ui-rounded,"Trebuchet MS",sans-serif';
function label(c,t,x,y,col){c.font=`800 7px ${FONT}`;const w=richW(c,t,7)+10;c.fillStyle='rgba(40,24,40,.3)';rr(c,x-w/2+1,y-10,w,12,5);c.fill();c.fillStyle='#fbf3e2';rr(c,x-w/2,y-11,w,12,5);c.fill();c.strokeStyle=INKC;c.lineWidth=0.9;c.stroke();richText(c,t,x,y-4.8,7,INKC);}
const STARS=[];for(let i=0;i<240;i++)STARS.push({x:Math.random()*1400,y:Math.random()*700,s:Math.random()<0.12?1.3:0.6,p:0.04+Math.random()*0.22,tw:Math.random()*6,c:pick(['#ffffff','#ffffff','#fff0cf','#cfe0ff','#ffd8f0'])});
function drawSpace(c,camx,camy){const g=c.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#0b0f2a');g.addColorStop(0.6,'#1a1f4c');g.addColorStop(1,'#2a2560');c.fillStyle=g;c.fillRect(0,0,VW,VH);
 const nx=-(camx*0.03)%900;for(const[ox,oy,r,col,a]of[[220,90,190,'#a070ff',0.18],[640,260,220,'#50a8e8',0.15],[880,120,160,'#ff80c0',0.12]])for(const k of[0,900])glow(c,nx+ox+k,oy-camy*0.02,r,col,a);
 for(const s of STARS){const x=((s.x-camx*s.p)%1400+1400)%1400,y=((s.y-camy*s.p*0.4)%700+700)%700;if(x>VW||y>VH)continue;c.globalAlpha=0.4+0.6*Math.abs(Math.sin(G.t*0.02+s.tw));c.fillStyle=s.c;circ(c,x,y,s.s);if(s.s>1)glow(c,x,y,4,'#ffffff',0.25);}c.globalAlpha=1;
 const prog=S?PROJECTS.filter(p=>!p.opt&&S.proj[p.id]).length:2;const r=8+prog*3.5;const px=VW*0.78-camx*0.015,py=VH*0.28-camy*0.01;drawPlanet(c,px,py,r);}
function drawPlanet(c,px,py,r){glow(c,px,py,r*1.7,'#8ce6ff',0.3);const pg=c.createRadialGradient(px-r*0.4,py-r*0.45,r*0.1,px,py,r);pg.addColorStop(0,'#d6fbe0');pg.addColorStop(0.45,'#5fc58a');pg.addColorStop(1,'#245a7a');c.fillStyle=pg;circ(c,px,py,r);
 c.fillStyle='rgba(255,255,255,.35)';ell(c,px-r*0.2,py-r*0.1,r*0.5,r*0.12);ell(c,px+r*0.25,py+r*0.35,r*0.35,r*0.09);}
function drawSky(c,camx,camy){const t=S.time;let top='#7cc8f2',bot='#e2f5ff';if(t>=1080&&t<1200){top='#f2a07e';bot='#ffe1b0';}else if(t>=1200||t<390){top='#141a48';bot='#3a3a7a';}
 const g=c.createLinearGradient(0,0,0,VH);g.addColorStop(0,top);g.addColorStop(1,bot);c.fillStyle=g;c.fillRect(0,0,VW,VH);
 if(t>=1200||t<390){for(const s of STARS){if(s.y>400)continue;const x=((s.x-camx*s.p*0.3)%1400+1400)%1400;if(x>VW)continue;c.globalAlpha=0.5+0.5*Math.sin(G.t*0.02+s.tw);c.fillStyle='#fff';circ(c,x,s.y*0.5,s.s);}c.globalAlpha=1;c.fillStyle='#fff8dc';glow(c,VW*0.8-camx*0.01,44,30,'#fff8dc',0.4);circ(c,VW*0.8-camx*0.01,44,10);}
 else{glow(c,VW*0.8-camx*0.01,42,46,'#fff2b0',0.55);c.fillStyle='#fff6c8';circ(c,VW*0.8-camx*0.01,42,14);}
 for(let i=0;i<6;i++){const x=((i*260+G.t*0.08-camx*0.2)%1560+1560)%1560-100,y=30+i*17-camy*0.1;c.fillStyle='rgba(255,255,255,.85)';circ(c,x,y,9);circ(c,x+11,y-5,11);circ(c,x+23,y,8);rr(c,x-6,y,36,8,4);c.fill();}
 for(const[p,col,h]of[[0.12,'#8ac0dc',130],[0.25,'#6fb58f',95],[0.4,'#5aa673',60]]){c.fillStyle=col;c.beginPath();c.moveTo(0,VH);for(let x=0;x<=VW+8;x+=8){const wx=x+camx*p;c.lineTo(x,VH-h-Math.sin(wx*0.008)*22-Math.sin(wx*0.019)*10+camy*0.1*p);}c.lineTo(VW,VH);c.closePath();c.fill();}}

function drawChar(c,x,y,lk,fr,face,kid,seed){const walk=fr>=0,ph=walk?fr*Math.PI/2:0,sw=walk?Math.sin(ph):0;const bob=walk?-Math.abs(Math.cos(ph))*1.1:Math.sin(G.t*0.045+(seed||x))*0.4;
 c.save();c.translate(x,y);if(kid)c.scale(0.86,0.86);if(!CHAR_NOSH)shadowE(c,0,0,7);c.scale(face<0?-1:1,1);
 c.fillStyle='#3d3656';ell(c,-2.6+sw*2.3,-1.8,2.8,1.95);ell(c,2.8-sw*2.3,-1.8,2.8,1.95);

  const now={};for(const[a,b]of runs){const k=a+'_'+b;if(open[k]&&open[k].y1===y-1){open[k].y1=y;now[k]=open[k];}else{const r={x0:a,x1:b,y0:y,y1:y};rects.push(r);now[k]=r;}}

 rects.forEach(r=>{r.kind=(r.y1<2||(r.x0===0&&r.x1===0)||(r.x0===w-1))?'wall':r.y0>=LV[0]?'ground':'floor';r.X=r.x0*TS;r.Y=r.y0*TS;r.W=(r.x1-r.x0+1)*TS;r.H=(r.y1-r.y0+1)*TS;});
