<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1424">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Frostlight Station</title>
<style>
:root{--bg:#0b1424;--pan:#fdf7ec;--pan2:#f3e8d6;--ink:#2b2836;--amb:#f3a446;--amb2:#d9702e;--ice:#bfe3f5;--navy:#1b2a44;--red:#df5b57;--grn:#4fa85a;--mut:#857a70;--line:#e4d5bd;--sh:0 6px 22px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:"Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
img{pointer-events:none;-webkit-user-drag:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.card{background:rgba(253,247,236,.93);border-radius:14px;box-shadow:var(--sh);border:2px solid rgba(255,255,255,.6)}
#topL{position:absolute;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));padding:7px 10px;width:188px;font-size:12px}
#clock{display:flex;align-items:center;gap:8px}#clock img{width:34px;height:34px}#clock b{display:block;font-size:14px}
#money{display:flex;align-items:center;gap:6px;margin-top:3px;font-weight:900;font-size:14px}#money img{width:20px;height:20px}
.bar{display:flex;align-items:center;gap:6px;margin-top:3px}.bar img{width:17px;height:17px}.bar i{flex:1;height:9px;background:#d9ccb8;border-radius:6px;overflow:hidden;display:block}.bar s{display:block;height:100%;width:50%;border-radius:6px;transition:width .3s}
#hpB{background:linear-gradient(#f2847b,#cf4743)}#wmB{background:linear-gradient(#ffc274,#e8782e)}#enB{background:linear-gradient(#9be08a,#4aa356)}
.bar.low i{animation:pulse 1s infinite}@keyframes pulse{50%{background:#f6b0a8}}
#compass{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:3px 6px;border-radius:12px;background:rgba(20,30,50,.45)}
#compass canvas{display:block;width:260px;height:26px}
#topR{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:6px;pointer-events:auto}
.rb{width:44px;height:44px;border-radius:12px;background:rgba(253,247,236,.93);box-shadow:var(--sh);display:grid;place-items:center;position:relative}.rb img{width:28px;height:28px}
.rb .dot{position:absolute;right:3px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid #fff}
#tracker{position:absolute;right:max(8px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 52px);width:224px;font-size:12px;padding:7px 10px;max-height:40vh;overflow:hidden}
#wp{position:absolute;left:0;top:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;margin:-22px 0 0 -60px;width:120px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}#wp img{width:30px;height:30px;animation:wpb 1.2s ease-in-out infinite}#wpTxt{margin-top:1px;padding:1px 8px;border-radius:9px;background:rgba(20,30,50,.75);color:#ffd86a;font-size:12px;font-weight:800;white-space:nowrap}
#wpArrow{position:absolute;left:50%;top:15px;width:0;height:0;margin:-9px 0 0 -9px;border:9px solid transparent;border-left:16px solid #ffb84a;transform-origin:4px 9px;translate:26px 0}@keyframes wpb{50%{transform:translateY(-4px)}}
#tracker .next{background:#fff1d6;border-radius:8px;padding:4px 6px;margin-bottom:6px;border-left:3px solid var(--amb2)}
#tracker h4{margin:0 0 3px;font-size:11px;color:var(--amb2);text-transform:uppercase;letter-spacing:.06em}
#tracker div{margin-bottom:4px;line-height:1.25}#tracker .ok{color:var(--grn);font-weight:800}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 2px rgba(0,0,0,.25);transition:all .12s}
#cross.on{width:16px;height:16px;margin:-8px 0 0 -8px;background:transparent;border:2px solid #fff}
#prompt{position:absolute;left:50%;top:calc(50% + 20px);transform:translateX(-50%);padding:5px 12px;border-radius:12px;background:rgba(20,30,50,.72);color:#fff;font-size:14px;font-weight:700;white-space:nowrap;display:flex;gap:10px;align-items:center}
#prompt:empty{display:none}#prompt kbd{display:inline-block;padding:1px 6px;border-radius:6px;background:var(--amb);color:#2b2836;font-family:inherit;font-weight:900;margin-right:4px;font-size:12px}
#hpbar2{position:absolute;left:50%;top:calc(50% + 50px);transform:translateX(-50%);width:120px;height:7px;border-radius:5px;background:rgba(0,0,0,.4);overflow:hidden}#hpbar2 s{display:block;height:100%;background:#fff;text-decoration:none}
#hotbar{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:5px;pointer-events:auto}
.slot{position:relative;width:50px;height:50px;border-radius:10px;background:#efe3cf;border:2px solid #e2d2b8;display:grid;place-items:center;flex:none}
.slot img{width:40px;height:40px}.slot .n{position:absolute;right:3px;bottom:0;font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}
.slot .k{position:absolute;left:4px;top:1px;font-size:10px;color:var(--mut);font-weight:900}
.slot.sel{border-color:var(--amb2);background:#ffe6c0;box-shadow:0 0 0 2px var(--amb)}
.slot.pick{border-color:#3aa0ff;background:#dff0ff}
#itemName{position:absolute;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 66px);transform:translateX(-50%);color:#fff;font-weight:800;font-size:14px;text-shadow:0 1px 3px #000;transition:opacity .4s;white-space:nowrap}
#toasts{position:absolute;left:max(8px,env(safe-area-inset-left));top:200px;display:flex;flex-direction:column;gap:5px;width:min(300px,62vw)}
.toast{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:13px;font-weight:700;animation:tin .25s;transition:opacity .5s}
.toast img{width:26px;height:26px;flex:none}
@keyframes tin{from{transform:translateX(-20px);opacity:0}}
#saved{position:absolute;right:14px;bottom:80px;padding:4px 10px;border-radius:10px;background:rgba(20,30,50,.7);color:#cfe;font-size:12px;font-weight:800;opacity:0;transition:opacity .6s}
#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7);opacity:0;transition:opacity .8s;pointer-events:none}
#banner h2{margin:0;font-size:32px;letter-spacing:.04em}#banner p{margin:4px 0 0;font-size:16px;font-weight:700}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 160px rgba(120,190,255,0);transition:box-shadow 1s}
#lockHint{position:absolute;left:50%;top:60%;transform:translateX(-50%);padding:6px 14px;border-radius:12px;background:rgba(20,30,50,.7);color:#fff;font-weight:700;font-size:14px}
/* touch */
#touch{position:absolute;inset:0;pointer-events:none;z-index:1}#topR,#hotbar{z-index:3}
body:not(.touch) #touch{display:none}
body.touch #lockHint{display:none}
#joyZone{position:absolute;left:0;bottom:0;width:42%;height:70%;pointer-events:auto}
#lookZone{position:absolute;right:0;top:0;width:58%;height:100%;pointer-events:auto}
#joyBase{position:absolute;width:124px;height:124px;margin:-62px;border-radius:50%;background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.35);display:none}
#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,255,255,.55)}
.tb{position:absolute;pointer-events:auto;width:62px;height:62px;border-radius:50%;background:rgba(253,247,236,.72);box-shadow:var(--sh);display:grid;place-items:center;border:2px solid rgba(255,255,255,.7)}
.tb img{width:34px;height:34px}.tb.dn{background:rgba(255,214,150,.9);transform:scale(.94)}
#tUse{right:calc(max(14px,env(safe-area-inset-right)) + 8px);bottom:150px;width:80px;height:80px}#tUse img{width:46px;height:46px}
#tAct{right:calc(max(14px,env(safe-area-inset-right)) + 100px);bottom:120px;width:70px;height:70px}
#tJump{right:calc(max(14px,env(safe-area-inset-right)) + 14px);bottom:76px;width:58px;height:58px}
#tRun{right:calc(max(14px,env(safe-area-inset-right)) + 94px);bottom:200px;width:50px;height:50px}#tRun.on{background:rgba(160,220,140,.9)}
#tEat{right:calc(max(14px,env(safe-area-inset-right)) + 186px);bottom:90px;width:54px;height:54px}
body.touch #hotbar{left:calc(50% - 40px)}
@media (max-width:760px){.slot{width:40px;height:40px}.slot img{width:32px;height:32px}#tracker{width:170px;font-size:11px}#topL{width:160px}#compass canvas{width:170px}}
@media (max-width:560px){body.touch #hotbar{left:50%;bottom:max(6px,env(safe-area-inset-bottom))}#tUse{bottom:170px}#tAct{bottom:150px}#tJump{bottom:100px}#tRun{bottom:250px}#tEat{bottom:110px}#tracker{display:none}#compass{display:none}}
@media (max-height:440px){#tracker{max-height:30vh}#toasts{top:150px}}
/* panels */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,14,26,.5)}
.pbox{width:min(940px,97vw);height:min(660px,94vh);background:var(--pan);border-radius:18px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;border:3px solid #fff}
.phead{display:flex;align-items:center;gap:6px;padding:7px;background:var(--navy)}
#ptabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;touch-action:pan-x}
.tab{padding:7px 11px;border-radius:10px;background:rgba(255,255,255,.12);color:#e9eef7;font-weight:800;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab img{width:20px;height:20px}.tab.on{background:var(--pan);color:var(--ink)}
.xb{width:40px;height:40px;border-radius:10px;background:var(--red);color:#fff;font-size:22px;font-weight:900;flex:none}
#pbody{flex:1;overflow-y:auto;padding:12px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
h3{margin:4px 0 8px;font-size:17px}h3 small{font-weight:600;color:var(--mut);font-size:12px}
.btn{padding:8px 14px;border-radius:11px;background:var(--amb);color:#2b2836;font-weight:900;box-shadow:0 3px 0 var(--amb2);font-size:14px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--amb2)}
.btn.alt{background:#d9e8f2;box-shadow:0 3px 0 #9ab5c8}.btn.grn{background:#8fd18f;box-shadow:0 3px 0 #4a9a52}.btn.red{background:#f19a90;box-shadow:0 3px 0 #c45a52}
.btn[disabled]{opacity:.45;pointer-events:none}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.inv{display:flex;gap:12px;flex-wrap:wrap}.inv .grid{flex:1;min-width:280px;align-content:flex-start}
.det{width:260px;flex:none;background:var(--pan2);border-radius:14px;padding:10px;min-height:200px}
@media (max-width:640px){.det{width:100%}}
.det .big{display:flex;gap:10px;align-items:center}.det .big img{width:64px;height:64px}.det p{margin:6px 0;font-size:13px}
.tags{display:flex;gap:4px;flex-wrap:wrap}.tag{font-size:11px;padding:2px 7px;border-radius:8px;background:#e2d2b8;font-weight:800}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--pan2);text-align:left;width:100%}
.li img{width:40px;height:40px;flex:none}.li .t{flex:1;font-size:13px}.li .t b{font-size:14px;display:block}.li .p{font-weight:900;display:flex;gap:4px;align-items:center;white-space:nowrap}.li .p img{width:18px;height:18px}
.li.no{opacity:.55}.li.done{background:#dcefd8}
.ing{display:inline-flex;align-items:center;gap:2px;margin-right:8px;font-size:12px;font-weight:800}.ing img{width:20px;height:20px}.ing.miss{color:var(--red)}
.cols{display:flex;gap:12px;flex-wrap:wrap}.cols>*{flex:1;min-width:260px}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:5px}
.coll div{background:var(--pan2);border-radius:10px;display:grid;place-items:center;aspect-ratio:1;position:relative}
.coll img{width:80%;height:80%}.coll .unk img{filter:brightness(0) opacity(.25)}
.sk{margin:6px 0}.sk b{display:flex;justify-content:space-between;font-size:13px}.sk i{display:block;height:10px;background:#e2d2b8;border-radius:6px;overflow:hidden}.sk s{display:block;height:100%;background:linear-gradient(90deg,var(--amb),var(--amb2));text-decoration:none}
.subt{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}.subt button{padding:5px 10px;border-radius:9px;background:var(--pan2);font-weight:800;font-size:12px}.subt button.on{background:var(--navy);color:#fff}
.hearts{display:inline-flex;gap:1px}.hearts img{width:14px;height:14px}
.gfocus{outline:3px solid #3aa0ff!important;outline-offset:2px;z-index:2}
#mapCv{width:100%;max-width:640px;aspect-ratio:1;display:block;margin:0 auto;border-radius:14px;background:#244;touch-action:none}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px;border-radius:10px;background:var(--pan2);margin-bottom:6px;font-weight:700;font-size:14px}
.set input[type=range]{width:160px}
textarea{width:100%;height:90px;font-size:11px;border-radius:10px;border:2px solid var(--line);padding:6px;user-select:text;-webkit-user-select:text}
.lore{background:#f6edd8;border-radius:12px;padding:12px;font-family:Georgia,serif;font-size:14px;line-height:1.5;margin-bottom:8px;border-left:4px solid var(--amb)}
/* dialog */
#dlg{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(780px,97vw);z-index:15;display:flex;gap:12px;padding:12px;align-items:flex-start;max-height:70vh}
#portrait{width:96px;height:96px;border-radius:16px;flex:none;background:#cfe3ef}
.dtx{flex:1;min-width:0;display:flex;flex-direction:column;max-height:calc(70vh - 24px)}
#dName{font-weight:900;font-size:16px;display:flex;align-items:center;gap:8px}
#dText{font-size:15px;line-height:1.4;margin:6px 0 8px;overflow-y:auto;touch-action:pan-y}
#dOpts{display:flex;flex-wrap:wrap;gap:6px;overflow-y:auto;touch-action:pan-y}
#dOpts .btn{font-size:13px;padding:7px 11px}
@media (max-width:560px){#portrait{width:64px;height:64px}}
/* fishing */
#fishUI{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:12;width:min(420px,90vw);padding:10px 14px;text-align:center}
#fTitle{font-weight:900;font-size:16px}
#fBar{position:relative;height:34px;margin:8px 0;border-radius:12px;background:linear-gradient(90deg,#1e4a6a,#2a6a8a,#1e4a6a);overflow:hidden;border:2px solid #fff}
#fZone{position:absolute;top:0;bottom:0;background:rgba(140,230,140,.55);border-left:2px solid #c8ffc8;border-right:2px solid #c8ffc8}
#fFish{position:absolute;top:2px;width:30px;height:26px;margin-left:-15px}
#fProg{height:10px;border-radius:6px;background:#e2d2b8;overflow:hidden}#fProg s{display:block;height:100%;width:0;background:linear-gradient(90deg,#9be08a,#4aa356);text-decoration:none}
#fHint{font-size:12px;color:var(--mut);margin-top:6px;font-weight:700}
/* title */
#title{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,20,40,.1),rgba(5,10,22,.65))}
.tbox{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;max-height:100vh;overflow:auto}
#logo{width:auto;height:min(260px,36vh,40vw);max-width:92vw}
#tBtns{display:flex;flex-direction:column;gap:9px;width:min(300px,80vw)}
#tBtns .btn{font-size:17px;padding:11px}
.tfoot{color:#cfe0f0;font-size:12px;max-width:520px;text-shadow:0 1px 3px #000}
#fade{position:fixed;inset:0;background:#05080f;z-index:40;opacity:0;pointer-events:none;transition:opacity .7s;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:800}
#fade.on{opacity:1;pointer-events:auto}
#splash{position:fixed;inset:0;z-index:50;background:#0b1424;display:grid;place-items:center;transition:opacity .8s}
#splash canvas{width:min(560px,90vw);height:auto}
</style>
</head>
<body>
<canvas id="cv" tabindex="0"></canvas>
<div id="vignette"></div>
<div id="hud" class="hidden">
  <div id="topL" class="card">
    <div id="clock"><img id="wxIcon" alt=""><div><b id="dayTxt">Day 1</b><span id="timeTxt">6:00</span></div></div>
    <div id="money"><img data-ic="coin" alt=""><span id="moneyTxt">0</span></div>
    <div class="bar" id="hpRow"><img data-ic="heart" alt=""><i><s id="hpB"></s></i></div>
    <div class="bar" id="wmRow"><img data-ic="flame" alt=""><i><s id="wmB"></s></i></div>
    <div class="bar" id="enRow"><img data-ic="bolt" alt=""><i><s id="enB"></s></i></div>
  </div>
  <div id="compass"><canvas id="compCv" width="520" height="52"></canvas></div>
  <div id="topR">
    <button class="rb" id="bMap" aria-label="Map"><img data-ic="map" alt=""></button>
    <button class="rb" id="bQuest" aria-label="Quests"><img data-ic="scroll" alt=""><span class="dot hidden" id="qDot"></span></button>
    <button class="rb" id="bBag" aria-label="Inventory"><img data-ic="bag" alt=""></button>
    <button class="rb" id="bMenu" aria-label="Menu"><img data-ic="menu" alt=""><span class="dot hidden" id="mDot"></span></button>
  </div>
  <div id="tracker" class="card"></div>
  <div id="wp" class="hidden"><div id="wpArrow"></div><img id="wpIc" alt=""><span id="wpTxt"></span></div>
  <div id="cross"></div>
  <div id="prompt"></div>
  <div id="hpbar2" class="hidden"><s></s></div>
  <div id="toasts"></div>
  <div id="banner"><h2 id="bnT"></h2><p id="bnS"></p></div>
  <div id="itemName"></div>
  <div id="hotbar" class="card"></div>
  <div id="saved">Saved</div>
  <div id="lockHint" class="hidden">Click to look around</div>
  <div id="touch">
    <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
    <div id="lookZone"></div>
    <button class="tb" id="tUse" aria-label="Use"><img data-ic="use" alt=""></button>
    <button class="tb" id="tAct" aria-label="Interact"><img data-ic="hand" alt=""></button>
    <button class="tb" id="tJump" aria-label="Jump"><img data-ic="jump" alt=""></button>
    <button class="tb" id="tRun" aria-label="Sprint"><img data-ic="run" alt=""></button>
    <button class="tb" id="tEat" aria-label="Eat"><img data-ic="eat" alt=""></button>
  </div>
</div>
<div id="panel" class="ov hidden"><div class="pbox"><div class="phead"><div id="ptabs"></div><button class="xb fz" id="pClose" aria-label="Close">&times;</button></div><div id="pbody"></div></div></div>
<div id="dlg" class="card hidden"><canvas id="portrait" width="192" height="192"></canvas><div class="dtx"><div id="dName"></div><div id="dText"></div><div id="dOpts"></div></div></div>
<div id="fishUI" class="card hidden"><div id="fTitle">Reel it in!</div><div id="fBar"><div id="fZone"></div><img id="fFish" alt=""></div><div id="fProg"><s></s></div><div id="fHint">Hold USE to pull the green zone right</div></div>
<div id="title" class="hidden"><div class="tbox"><canvas id="logo" width="1280" height="520"></canvas><div id="tBtns"></div><div class="tfoot" id="tFoot"></div></div></div>
<div id="fade"></div>
<div id="splash"><canvas id="splashCv" width="1120" height="640"></canvas></div>
<script>
'use strict';
/* ===================== FROSTLIGHT STATION ===================== */
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,D2R=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const rand=Math.random,ri=(a,b)=>a+Math.floor(rand()*(b-a+1)),pick=a=>a[Math.floor(rand()*a.length)];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,z){let h=(Math.imul(x|0,374761393)+Math.imul(z|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}

class MB{

const NPCS={
 maren:{name:'Maren Holt',role:'Station Commander',skin:'#f0c8a8',hair:'#c8c0b0',hat:null,coat:'#c8302a',scarf:'#f4ead4',bg:'#d8e4f0',glasses:true,
  loves:['coffee','smokedsalmon','snowglobe','compass'],likes:['cocoa','bun','plank','ibar','berrypie'],hates:['oldboot','tincan','scrap','lichen'],bday:[0,9],
  lines:['Frostlight has stood here for forty years. With your help it\'ll stand forty more.','Keep an eye on the sky. Weather turns fast up here.','A station is only as warm as the people in it.','If you see the supply ship come in, tell Bjorn. He gets excited.','I log everything. Even the number of cups of coffee. Too many.','The generator hums like an old friend these days.','Have you been up to the observatory? Elin practically lives there.'],
  hl:['You remind me of myself, my first winter here. Stubborn and curious.','I\'m glad you came to Frostlight. I mean that.','When I retire, I want to know this place is in good hands. Yours, maybe.']},
 oskar:{name:'Oskar Lind',role:'Station Cook',skin:'#f4d0b0',hair:'#d88a3a',hat:'#f4f4f4',pom:false,hatBand:'#e0e0e0',coat:'#f4f0e8',scarf:'#d04a3a',bg:'#f4e4c8',beard:'#c87a32',
  loves:['pumpkin','cloudberry','chowder','salmon','feast'],likes:['potato','egg','mushroom','cod','tomato','butter'],hates:['kelp','scrap','oldboot'],bday:[1,4],
  lines:['Soup\'s on! It\'s always soup weather in the Arctic.','The secret ingredient is butter. It\'s always butter.','Bring me cloudberries and I\'ll bake you something that will make you cry.','Cold hands, warm stew. That\'s my motto.','Ivan keeps promising me a halibut. Still waiting!','My grandmother cooked on an icebreaker. Rough seas, perfect pancakes.'],
  hl:['You know what? You\'re the best taste tester I\'ve ever had.','I saved you the crispy bits. Don\'t tell the others.','Someday I\'ll open a little cafe here. Frostlight Fika. You\'ll be my first customer.']},
 felix:{name:'Felix Berg',role:'Mechanic',skin:'#e8b890',hair:'#3a2a20',hat:'#f0a030',coat:'#3a5a8a',scarf:'#f0a030',bg:'#e0e4ec',
  loves:['gear','circuit','gbar','meteorite'],likes:['ibar','cbar','coffee','scrap','battery'],hates:['berrytea','salad','poppy'],bday:[2,6],
  lines:['If it\'s broken, I can fix it. If it\'s not broken, I can improve it.','The smelter eats coal like Oskar eats butter.','Copper for wire, iron for gears, silver for circuits. Simple.','Did you know the wind turbine blueprints are older than me?','Grease under my nails since I was six.','Upgrade your tools at my bench. Copper first, then iron.'],
  hl:['You\'ve got a mechanic\'s hands. I can tell.','I made you a spare wrench. Kidding. Unless you want one.','You\'re alright. More than alright.']},
 lena:{name:'Lena Vogel',role:'Botanist',skin:'#f8d8c0',hair:'#e8c070',hairLong:true,hat:null,coat:'#5a9a5a',scarf:'#f0d0e0',bg:'#e0f0d8',
  loves:['sunflower','aurorabloom','poppy','strawberry'],likes:['lettuce','basil','mint','cloudberry','lichen','fertilizer'],hates:['coal','scrap','fishsoup'],bday:[0,3],
  lines:['Under glass, every season is summer.','Water every day! Plants are like people, they get grumpy when thirsty.','The tundra blooms so fast in Thaw. Blink and you miss it.','Arctic poppies follow the sun all day. Little satellite dishes.','I talk to my tomatoes. They seem to appreciate it.','Seeds are tiny promises.'],
  hl:['You have a green thumb. Both thumbs, actually.','I named a seedling after you. It\'s doing wonderfully.','Some of my happiest days here have been gardening with you.']},
 ivan:{name:'Ivan Petrov',role:'Fisherman',skin:'#e0a880',hair:'#5a5a5a',hat:'#2a4a7a',coat:'#e0b030',scarf:'#2a4a7a',bg:'#d0e4f0',beard:'#7a7a7a',
  loves:['halibut','redfish','glowlure','sharkg'],likes:['cod','herring','bait','rope','coffee'],hates:['salad','mint','sunflower'],bday:[3,2],
  lines:['The sea gives, the sea takes. Mostly it gives cod.','Fish bite more at dawn and dusk. And when you\'re not looking.','Drill a hole in the bay ice and you\'ll find polar cod. Sweet little things.','I once saw a shark that was older than this station. True story.','Bait helps. Patience helps more.','When the sea smokes in winter, the big ones come up.'],
  hl:['You\'re a natural with a rod, friend.','Here\'s a secret: the Leviathan only rises in a blizzard. Off the pier\'s end.','Fishing\'s better with company. Who knew.']},
 aki:{name:'Dr. Aki Tanaka',role:'Glaciologist',skin:'#f0d0b0',hair:'#1a1a22',hat:'#7a5ab0',coat:'#e8e8ee',scarf:'#7a5ab0',bg:'#e8e4f4',glasses:true,
  loves:['icecore','icecrystal','fossil','sapphire'],likes:['rocksample','snowsample','coffee','tea','quartz'],hates:['oldboot','kalechips','fishsoup'],bday:[2,12],
  lines:['Each layer of ice is a year. The glacier is a library.','The glacier moves about a meter a day. Slowly, slowly.','Don\'t lean over the crevasse. I say that a lot.','Ice cores are time capsules. Bubbles of ancient air!','Some of the ice here is ten thousand years old.','There\'s a cave in the glacier. The light inside is... strange.'],
  hl:['You ask the best questions. Keep asking them.','I\'m naming a new ice formation after you. It\'s very pretty.','Working with you makes the long nights shorter.']},
 priya:{name:'Priya Sharma',role:'Meteorologist',skin:'#c08a60',hair:'#1a1210',hairLong:true,hat:'#e0607a',coat:'#3a8ac0',scarf:'#f0c040',bg:'#d8ecf8',
  loves:['coffee','smoothie','snowglobe','auroradata'],likes:['snowsample','battery','cocoa','minttea'],hates:['clay','oldboot','mussel'],bday:[1,11],
  lines:['The barometer says... yes, more snow.','A blizzard\'s coming when the wind turns north and the ravens go quiet.','Sun dogs! Look for bright spots beside the sun on cold clear days.','I check the forecast tablet in the Main Hall every morning. You should too.','Weather is just the sky\'s mood.','Polar Night is my favorite. The stars! The auroras!'],
  hl:['You\'re the only one who listens to my weather rants. Thank you.','I predicted you\'d stop by. I\'m very good at forecasts.','Clear skies ahead. For us, I mean.']},
 sofia:{name:'Dr. Sofia Reyes',role:'Station Doctor',skin:'#e0b090',hair:'#4a2a1a',hairLong:true,hat:null,coat:'#f4f4f8',scarf:'#5ab0a0',bg:'#e0f4f0',
  loves:['angelica','berrypie','candle','minttea'],likes:['cloudjam','salad','lingonberry','medkit'],hates:['coffee','scrap','sharkg'],bday:[3,8],
  lines:['Wear a hat! Most of your warmth escapes from your head. Well, some of it.','If your warmth runs out, your health goes next. Come see me.','Hot food warms you from the inside.','Angelica was an old remedy for colds up here.','Sleep is medicine too.','I can patch you up in the Lab infirmary, for a small fee.'],
  hl:['You look healthy. Good. Keep it that way.','Doctor\'s orders: take a break and have cocoa with me.','You make this place feel like home.']},
 tomas:{name:'Tomas Novak',role:'Radio Operator',skin:'#f0c8a8',hair:'#8a5a3a',hat:'#4a4a5a',coat:'#6a7a3a',scarf:'#c8302a',bg:'#e8e8d8',
  loves:['battery','circuit','postcard','pocketwatch'],likes:['wire','coffee','seaglass','candle'],hates:['salad','lettuce','oldboot'],bday:[1,7],
  lines:['Frostlight Radio, broadcasting from the edge of the world!','I hear whale song on the low frequencies sometimes.','Your mail comes through the terminal in the Main Hall.','Some nights the aurora scrambles every signal. Pure static, pure magic.','Morse code is a love language. Change my mind.','The supply ship radios in every seventh day.'],
  hl:['You\'re my favorite person to talk to that isn\'t a radio.','I dedicated a song to you on tonight\'s broadcast.','Over and out? Never with you.']},
 elin:{name:'Elin Strand',role:'Astronomer',skin:'#f8e0d0',hair:'#2a2a3a',hairLong:true,hat:'#2a3a6a',coat:'#5a4a8a',scarf:'#f0c040',pomC:'#f0c040',bg:'#d8d8f0',
  loves:['aurorashard','meteorite','auroradata','cocoa'],likes:['icecrystal','quartz','amethyst','berrytea'],hates:['kale','oldboot','clay'],bday:[3,12],
  lines:['The aurora is the solar wind saying hello.','Clear night tonight? Come up to the observatory.','Green aurora is oxygen, about a hundred kilometers up. Purple is nitrogen.','In Polar Night the sun doesn\'t rise for weeks. The sky becomes the show.','I keep a log of every aurora. It\'s a long log.','Make a wish on a meteor. Or ten.'],
  hl:['You see the sky the way I do. That\'s rare.','I found a new star. Well, catalogued one. I called it yours.','Stay for the next aurora with me?']},
 bjorn:{name:'Grandpa Bjorn',role:'Quartermaster',skin:'#f0c8b0',hair:'#f0f0f0',hat:'#8a3a2a',coat:'#7a5a3a',scarf:'#3a6a4a',bg:'#f0e4d0',beard:'#f4f4f4',glasses:true,
  loves:['sextant','pennant','tusk','bun','berrypie'],likes:['bone','antler','compass','cocoa','artifact'],hates:['smoothie','salad','glass'],bday:[2,1],
  lines:['When I was young we had no generator. Just whale oil and stubbornness.','The old expedition hut is out west. The Vega Borealis crew... a sad tale.','A good parka is worth more than gold up here.','I\'ve got hats, mittens, boots. Come and browse!','Find any old trinkets? Donate them to the Lab museum.','Legend says the expedition found a crystal that held the aurora itself.'],
  hl:['You remind me of my granddaughter. She\'s brave too.','I\'ve told you all my stories. Twice. And you still listen.','Take care out there, little one.']},
 nuka:{name:'Nuka Ataq',role:'Tracker & Musher',skin:'#d0a070',hair:'#1a1410',hat:'#e8e0d0',hatBand:'#8a5a3a',coat:'#8a5a3a',scarf:'#e8e0d0',bg:'#e8dcc8',
  loves:['antler','kibble','smokedsalmon','carving'],likes:['bone','fiber','char','feather','wool'],hates:['glass','snowman','sugar'],bday:[0,13],
  lines:['The dogs know the land better than any map.','Read the snow. It tells you who passed by, and when.','Never run from a bear. Stand tall, back away slowly.','Reindeer here are short and round. Built for the cold.','Pet the dogs every day. They remember kindness.','The land is quiet if you listen. It is never silent.'],
  hl:['The dogs like you. That means I like you.','You walk the land with respect now. Good.','When the dogs howl at the aurora, they sing for friends. Tonight they sing for you.']},
};

/* ---------- Lore: journal pages ---------- */
const PAGES=[
 'Aug 2, 1911. The Vega Borealis lies at anchor in the southern bay. The crew is in fine spirits. We have come to chart this island and, if Old Lund\'s tales are true, to find the "Heart of the Lights". - Capt. Edda Rask',
 'Aug 19. Built our hut in the western lee, out of the wind. Lund says the glacier sings at night. I told him that is the wind. He insists it is not.',
 'Sept 3. Found copper in the eastern hills, and fossils of sea creatures high on the slopes. This frozen land was once a warm ocean.',
 'Sept 28. First snow that stays. The tundra berries are gone. Lund dried cloudberries in the sun like little gold coins.',
 'Oct 15. The sea is freezing. The ship cannot leave until Thaw. We are wintering here. Morale holds. We play cards by candlelight.',
 'Nov 6. The sun set today and will not rise until February. The aurora is magnificent. Green curtains, and once, deep violet.',
 'Nov 30. Lund crossed the crevasse on a snow bridge and came back pale. A cave, he says, inside the glacier, full of light that moves.',
 'Dec 21. Midwinter. We feasted on salted char and the last of the jam. Toasted to home. The aurora danced all night.',
 'Jan 9. I went to the cave myself. Crystals, everywhere, and at its heart, a great stone that glows with the very colors of the sky.',
 'Jan 30. We took nothing from the cave. It felt wrong. Some lights are meant to stay where they shine.',
 'Feb 18. The sun returned! Just a sliver of gold on the horizon. We wept like children.',
 'June 1, 1912. The ice breaks. We sail home. I leave this journal in pieces across the island, for whoever comes next. Look after the lights. - E.R.'
];

 for(const sx of[-1,1])for(const sz of[-1,1])m.box(sx*Wd*.55-.045*(1+Wd),0,sz*L*.32-.045*(1+Wd),sx*Wd*.55+.045*(1+Wd),lg+H*.3,sz*L*.32+.045*(1+Wd),sz>0?c:shadeC(c,.9));

function zonePoint(zone,R){for(let tries=0;tries<200;tries++){let x,z;
  if(zone==='tundra'){x=-200+R()*330;z=-60+R()*210}else if(zone==='hills'){x=-60+R()*240;z=-120+R()*100}else if(zone==='station'){x=-40+R()*80;z=70+R()*70}
  else if(zone==='coast'||zone==='beach'||zone==='cliff'){const a=R()*TAU,d=170+R()*70;x=Math.cos(a)*d*1.1;z=Math.sin(a)*d-20}
  else if(zone==='ice'){x=BAY.x-40+R()*60;z=BAY.z-40+R()*80}else if(zone==='north'){x=-140+R()*300;z=-215+R()*70}else if(zone==='sea'){const a=R()*TAU;x=Math.cos(a)*300;z=Math.sin(a)*280}
  const h=terrH(x,z);
  if(zone==='sea'){if(h<-6)return[x,z];continue}
  if(zone==='ice'){if(inBay(x,z))return[x,z];continue}
  if(zone==='beach'){if(h>.3&&h<1.8&&!inBay(x,z))return[x,z];continue}
  if(zone==='coast'){if(h>.3&&h<3)return[x,z];continue}

  if(h<1.5)continue;if(Math.abs(z-CREVZ(x))<12)continue;if(zone!=='station'&&Math.hypot(x-PLAT.x,z-PLAT.z)<PLAT.r)continue;if(zone==='north'&&z>-150)continue;return[x,z]}
 return[0,0]}

const IN={mx:0,mz:0,lx:0,ly:0,run:false,jump:false,use:false,useHeld:false,act:false,eat:false};
function fwd(){return[-Math.sin(P.yaw)*Math.cos(P.pitch),Math.sin(P.pitch),-Math.cos(P.yaw)*Math.cos(P.pitch)]}
function eyePos(){return[P.x,P.y+P.eye+(SET.bob?Math.sin(P.bob)*.04:0),P.z]}
function collideXZ(x,z,y){const r=.34;const i0=Math.floor((x-r+HALF)/8),i1=Math.floor((x+r+HALF)/8),j0=Math.floor((z-r+HALF)/8),j1=Math.floor((z+r+HALF)/8);
 for(let it=0;it<2;it++)for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const k=cgk(i,j);const L=CGRID[k];
  if(L)for(const c of L){if(c.off)continue;if(y+1.7<c.y0||y+.35>c.y1)continue;if(x+r>c.x0&&x-r<c.x1&&z+r>c.z0&&z-r<c.z1){const pl=x+r-c.x0,pr=c.x1-(x-r),pt=z+r-c.z0,pb=c.z1-(z-r);const m=Math.min(pl,pr,pt,pb);if(m===pl)x=c.x0-r;else if(m===pr)x=c.x1+r;else if(m===pt)z=c.z0-r;else z=c.z1+r}}
  const N=NGRID[k];if(N)for(const n of N){const nt=NT[n.t];if(!nt.col||!nodeAlive(n))continue;const rr=nt.col*(n.t==='tree'?1:n.s*1.3)+r;const dx=x-n.x,dz=z-n.z,d=Math.hypot(dx,dz);if(d<rr&&d>0.001&&y<n.y+2){x=n.x+dx/d*rr;z=n.z+dz/d*rr}}}
 for(const p of S.placed){if(p.t==='flag'||p.t==='snowman'&&false)continue;const rr=(p.t==='campfire'?.6:p.t==='planter'?.85:.45)+r;const dx=x-p.x,dz=z-p.z,d=Math.hypot(dx,dz);if(d<rr&&d>.001){x=p.x+dx/d*rr;z=p.z+dz/d*rr}}
 return[x,z]}
function waterLvlAt(x,z){return inLake(x,z)?LAKE.l:0}
function blockedWater(x,z,y){if(Math.abs(z-CREVZ(x))<8.3&&!(S.proj.bridge&&Math.abs(x)<2.1))return true;const g=groundAt(x,z,y);const wl=waterLvlAt(x,z);if(g>=wl-.8)return false;if(inBay(x,z))return false;if(inLake(x,z)&&lakeFrozen())return false;return true}
function updatePlayer(dt){const busy=uiBlocking();let mx=busy?0:IN.mx,mz=busy?0:IN.mz;
 if(FS.phase){mx=0;mz=0}
 const sens=SET.sens;if(!busy){P.yaw-=IN.lx*sens;P.pitch=clamp(P.pitch-IN.ly*sens*(SET.inv?-1:1),-1.45,1.45)}IN.lx=IN.ly=0;
 if(P.sit&&(Math.abs(mx)+Math.abs(mz)>.2||IN.jump)){P.sit=0}
 if(P.sit){S.en=Math.min(maxEn(),S.en+dt*.8);mx=mz=0}
 let l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l;l=1}
 const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
 let sp=4.3;if(IN.run&&l>.1){sp*=S.res.sprint?1.85:1.6}if(S.en<=0)sp*=.65;if(S.wx==='blizzard'&&!P.inside)sp*=.85;
 let vx=(fx*mz+rx*mx)*sp+P.vx,vz=(fz*mz+rz*mx)*sp+P.vz;P.vx*=Math.pow(.02,dt);P.vz*=Math.pow(.02,dt);
 let nx=P.x+vx*dt,nz=P.z+vz*dt;[nx,nz]=collideXZ(nx,nz,P.y);
 if(blockedWater(nx,nz,P.y)){if(!blockedWater(nx,P.z,P.y))nz=P.z;else if(!blockedWater(P.x,nz,P.y))nx=P.x;else{nx=P.x;nz=P.z}}
 nx=clamp(nx,-HALF+4,HALF-4);nz=clamp(nz,-HALF+4,HALF-4);
 const moved=Math.hypot(nx-P.x,nz-P.z);P.x=nx;P.z=nz;
 P.vy-=22*dt;P.y+=P.vy*dt;const g=groundAt(P.x,P.z,P.y);
 if(P.y<=g){if(P.vy<-14)S.hp=Math.max(1,S.hp-(-P.vy-14)*3);P.y=g;P.vy=0;P.onG=true}else P.onG=P.y-g<.08;
 if(P.onG&&IN.jump&&!busy&&!P.sit){P.vy=7;P.onG=false;S.en=Math.max(0,S.en-.3)}IN.jump=false;
 if(P.onG&&moved>.001){P.bob+=moved*2.2;stepT+=moved;if(stepT>(IN.run?1.9:1.6)){stepT=0;sfx(P.inside?'stepin':'step')}}
 if(P.onG&&!blockedWater(P.x,P.z,P.y))P.lastSafe=[P.x,P.y,P.z];
 if(P.y<-20){P.x=P.lastSafe[0];P.y=P.lastSafe[1]+1;P.z=P.lastSafe[2];toast('Careful!','excl')}
 // inside?
 let ins=null;for(const d of INDOOR){if(d.on&&!d.on())continue;if(P.x>d.x0&&P.x<d.x1&&P.z>d.z0&&P.z<d.z1&&P.y>d.y0&&P.y<d.y1){ins=d;break}}
 if(ins!==P.inside){if(ins&&ins.name)toast(ins.name,'house');P.inside=ins}
 if(P.useCD>0)P.useCD-=dt;if(P.swingT>0)P.swingT-=dt}
let stepT=0;

let TGT=null;
function raySphere(o,d,c,r){const ox=o[0]-c[0],oy=o[1]-c[1],oz=o[2]-c[2];const b=ox*d[0]+oy*d[1]+oz*d[2];const cc=ox*ox+oy*oy+oz*oz-r*r;const h=b*b-cc;if(h<0)return-1;const t=-b-Math.sqrt(h);return t<0?(cc<0?0:-1):t}
function findTarget(){const o=eyePos(),d=fwd();let best=null,bt=3.6,npcB=null,npcT=9;
 const test=(c,r,obj,max)=>{const t=raySphere(o,d,c,r);if(t>=0&&t<Math.min(bt,max||3.6)){bt=t;best=obj}};
 for(const id of NPC_IDS){const e=NPCE[id];if(npcAsleep(e))continue;if(Math.abs(e.x-P.x)>6||Math.abs(e.z-P.z)>6)continue;const tn=raySphere(o,d,[e.x,e.y+1.05,e.z],.75);if(tn>=0&&tn<4&&tn<npcT){npcT=tn;npcB={k:'npc',id}}}if(npcB)return npcB;
 for(const a of ANI){if(Math.abs(a.x-P.x)>6||Math.abs(a.z-P.z)>6)continue;if(!animalVisible(a))continue;test([a.x,a.y+.4+a.fy,a.z],a.sp==='polarbear'||a.sp==='muskox'||a.sp==='reindeer'||a.sp==='walrus'?1:.5,{k:'ani',a})}
 for(const it of INTS){if(Math.abs(it.x-P.x)>8||Math.abs(it.z-P.z)>8)continue;if(it.cond&&!it.cond())continue;test([it.x,it.y,it.z],it.r,{k:'int',it},3.4+it.r*.3)}
 const i0=Math.floor((P.x+HALF)/8),j0=Math.floor((P.z+HALF)/8);
 for(let i=i0-1;i<=i0+1;i++)for(let j=j0-1;j<=j0+1;j++){const N=NGRID[cgk(i,j)];if(N)for(const n of N){if(!nodeAlive(n))continue;const t=n.t;const yy=t==='tree'?1.2:t==='rock'||NT[t].tool==='pick'?.6:.35;const rr=t==='tree'?.9:t==='forage'||t==='beach'||t==='page'||t==='antler'||t==='nest'||t==='wool'?.55:t==='sample'?.6:t==='bush'||t==='birch'||t==='dig'?.8:1.1*n.s;test([n.x,n.y+yy,n.z],rr,{k:'node',n})}}
 PLOTS.forEach((p,i)=>{if(p.ext&&!S.proj.ghex)return;if(Math.abs(p.x-P.x)>5||Math.abs(p.z-P.z)>5)return;test([p.x,p.y+.15,p.z],.85,{k:'plot',i})});
 for(const p of S.placed){if(Math.abs(p.x-P.x)>5||Math.abs(p.z-P.z)>5)continue;test([p.x,p.y+.5,p.z],.7,{k:'placed',p})}
 for(const h of S.holes){if(Math.abs(h.x-P.x)>6||Math.abs(h.z-P.z)>6)continue;test([h.x,h.y+.1,h.z],.7,{k:'hole',h},6)}
 return best}
function targetLabel(t){if(!t)return'';const it=heldIt();
 if(t.k==='npc')return'Talk to '+NPCS[t.id].name;
 if(t.k==='ani'){if(t.a.dog)return'Pet the husky';if(t.a.hen)return'Pet the chicken';return(ANIMALS[t.a.sp]||{}).name||'Animal'}
 if(t.k==='int'){const l=t.it.label;return typeof l==='function'?l():l}
 if(t.k==='node'){const n=t.n,nt=NT[n.t];if(n.t==='bush')return(ITEMS[n.b].name)+(bushRipe(n)?' bush':' bush (not in season)');if(n.t==='forage'||n.t==='beach')return'Pick '+ITEMS[n.f].name;if(n.t==='sample')return'Sample Site: '+ITEMS[n.smp].name+(it&&it.tool==='kit'?'':' (use Sample Kit)');
  if(nt.tool)return nt.lbl+(it&&it.tool===nt.tool?'':' (needs '+(nt.tool==='axe'?'axe':'pickaxe')+')');return nt.lbl}
 if(t.k==='plot'){const d=S.plots[t.i];if(!d||!d.c)return'Empty Planter'+(it&&it.seed?'':' (hold seeds)');const cr=CROPS[d.c];if(d.g>=cr.days)return'Harvest '+cr.name;return cr.name+' (day '+d.g+'/'+cr.days+')'+(d.w?' - watered':' - needs water')}
 if(t.k==='placed'){const p=t.p;if(p.t==='planter'){const d=p.d||{};if(!d.c)return'Planter Box (empty)';const cr=CROPS[d.c];return d.g>=cr.days?'Harvest '+cr.name:cr.name+' ('+d.g+'/'+cr.days+')'+(d.w?'':' - needs water')}return ITEMS[p.t].name}
 if(t.k==='hole')return'Ice Fishing Hole';return''}

/* ===================== ACTIONS ===================== */
function maxEn(){return 100+(S.res.endure?30:0)}
function maxHp(){return 100+(S.res.hardy?30:0)}
function spend(n){const c=n*(S.res.swing?.7:1);if(S.en<c*.5){toast('Too tired... eat something or sleep.','bolt');sfx('err');return false}S.en=Math.max(0,S.en-c);return true}
function doInteract(){if(uiBlocking())return;const t=TGT;if(!t){const h=held();if(h&&ITEMS[h.id].cat==='food')eatHeld();return}
 if(t.k==='npc')return talkTo(t.id);
 if(t.k==='ani'){const a=t.a;if(a.dog){S.st.dogpets++;if(S.dogDay!==S.dayAbs){S.dogDay=S.dayAbs;S.st.dogdays++;addFP('nuka',8)}sfx('bark');toast('The husky wags happily!','dog');const h=held();if(h&&h.id==='kibble'){removeItem('kibble',1);addFP('nuka',15);toast('The husky gobbles the kibble!','paw')}return}
  if(a.hen){sfx('cluck');toast('Bawk!','paw');return}toast((ANIMALS[a.sp]||{}).name+': '+(ANIMALS[a.sp]||{}).d,'paw');return}
 if(t.k==='int'){if(t.it.act)t.it.act();else if(t.it.kind==='cavepool')toast('Cast your rod into the pool!','fish');return}
 if(t.k==='node')return interactNode(t.n);
 if(t.k==='plot')return plotAct(t.i,false);
 if(t.k==='placed')return placedAct(t.p);
 if(t.k==='hole'){const h=held();if(h&&ITEMS[h.id].tool==='rod')return startCast();toast('Hold your fishing rod and press USE.','fish')}}
function doUse(){if(uiBlocking())return;if(FS.phase)return fishUse();if(P.useCD>0)return;const h=held();const it=h?ITEMS[h.id]:null;const t=TGT;
 if(!it){if(t)return doInteract();return}
 if(it.cat==='food'||it.id==='medkit'||it.id==='heatpack')return eatHeld();
 if(it.seed){if(t&&t.k==='plot')return plotAct(t.i,true);if(t&&t.k==='placed'&&t.p.t==='planter')return placedAct(t.p,true);toast('Plant seeds in a planter.','seed');return}
 if(it.id==='fertilizer'){if(t&&(t.k==='plot'||(t.k==='placed'&&t.p.t==='planter'))){const d=t.k==='plot'?S.plots[t.i]:t.p.d;if(d&&d.c&&!d.f){d.f=1;removeItem('fertilizer',1);toast('Fertilized!','sparkle');return}}toast('Use on a planted crop.','sack');return}
 if(it.place)return placeHeld(it);
 const tool=it.tool;P.useCD=.35;
 if(tool==='axe'||tool==='pick'){swing();if(t&&t.k==='node'&&NT[t.n.t].tool===tool)return hitNode(t.n,it);if(t&&t.k==='node'&&NT[t.n.t].tool){toast('Use a '+(NT[t.n.t].tool==='axe'?'axe':'pickaxe')+' on that.','excl');return}if(t)return doInteract();return}
 if(tool==='rod')return startCast();
 if(tool==='can')return useCan(t);
 if(tool==='auger')return drillHole();
 if(tool==='camera')return takePhoto();
 if(tool==='kit'){if(t&&t.k==='node'&&t.n.t==='sample')return takeSample(t.n);toast('Find a sample site (colored flag posts).','flask');return}
 if(t)return doInteract();toast('You can\'t use '+it.name+' here.','question')}
function swing(){P.swingT=.35;sfx('swoosh')}
function hitNode(n,it){const nt=NT[n.t];if(nt.tier&&it.tier<nt.tier){toast('Your '+it.name+' isn\'t strong enough. Upgrade it at the workbench.','lock');sfx('clink');return}
 if(!spend(2-skillLv(nt.tool==='axe'?'foraging':'mining')*.08))return;
 n.hp-=it.tier*(it.tier>=4?3:1);sfx(nt.tool==='axe'?'chop':'mine');HITFX.push({x:n.x,y:n.y+1,z:n.z,t:0,c:nt.tool==='axe'?[.6,.45,.3]:[.6,.6,.62]});
 if(n.hp<=0){n.hp=nt.hp;S.nodes[n.id]=S.dayAbs+nt.rsp;dirtyAt(n.x,n.z);nodeDrops(n)}}
function chance(p){return rand()<p}
function nodeDrops(n){const t=n.t,geo=S.res.geology;
 if(t==='tree'){addItem('wood',ri(3,5));if(chance(.35))addItem('resin',1);if(chance(.05))addItem('feather',1);S.st.chopped++;addXP('foraging',6);sfx('fall')}
 else if(t==='birch'){addItem('wood',ri(1,2));if(chance(.5))addItem('willow',1);S.st.chopped++;addXP('foraging',3)}
 else if(t==='drift'){addItem('wood',ri(2,3));if(chance(.15))addItem('bone',1);if(chance(.1))addItem('scrap',1);S.st.chopped++;addXP('foraging',3)}
 else{S.st.mined++;addXP('mining',t==='rock'?4:7);const ex=geo&&chance(.4)?1:0;
  if(t==='rock'){addItem('stone',ri(2,4));if(chance(.15))addItem('coal',1);if(chance(geo?.14:.07))addItem('quartz',1);if(chance(.08))addItem(n.y<10?'clay':'sand',ri(1,2));if(chance(.015))addItem('fossil',1)}
  else if(t==='copper'){addItem('copper',ri(2,3)+ex);addItem('stone',1)}else if(t==='iron'){addItem('iron',ri(2,3)+ex)}else if(t==='coal'){addItem('coal',ri(2,4)+ex)}
  else if(t==='silver'){addItem('silver',ri(2,3)+ex)}else if(t==='gold'){addItem('goldore',ri(2,3)+ex)}
  else if(t==='geode'){const r=rand();addItem(r<.4?'quartz':r<.65?'amethyst':r<.87?'garnet':'sapphire',1);if(chance(.06))addItem('meteorite',1);if(chance(.3))addItem('quartz',1)}
  else if(t==='ice'){addItem('icecrystal',ri(1,2));if(chance(.1))addItem('snowsample',1)}else if(t==='aurora'){addItem('aurorashard',ri(1,2));addItem('icecrystal',1)}}
 checkAch()}
function interactNode(n){const t=n.t;const bot=S.res.botany&&chance(.3)?2:1;
 if(NT[t].tool&&t!=='sample'){const it=bestTool(NT[t].tool);toast(it?'Hold your '+it.name+' and press USE.':'You need a '+(NT[t].tool==='axe'?'axe':'pickaxe')+'.','question');return}
 if(t==='sample'){const h=heldIt();if(h&&h.tool==='kit')return takeSample(n);toast('Hold the Sample Kit and press USE here.','flask');return}
 if(t==='bush'){if(!bushRipe(n)){toast('No berries on this '+ITEMS[n.b].name+' bush this season.','berry');return}addItem(n.b,ri(2,4)*bot);S.nodes[n.id]=S.dayAbs+3;addXP('foraging',5);S.st.forage++}
 else if(t==='forage'){addItem(n.f,(n.f==='fiber'?ri(2,3):1)*bot);S.nodes[n.id]=S.dayAbs+2+ri(0,1);addXP('foraging',4);S.st.forage++}
 else if(t==='beach'){addItem(n.f,ri(1,2)*bot);S.nodes[n.id]=S.dayAbs+2;addXP('foraging',3);S.st.forage++}
 else if(t==='dig'){const arts=Object.keys(ITEMS).filter(i=>ITEMS[i].cat==='artifact'&&!S.coll.found[i]&&!['fossil','meteorite','compass'].includes(i));
  if(arts.length&&chance(.4))addItem(pick(arts),1);else addItem(pick(['stone','bone','coal','clay','sand','scrap','oldboot','tincan','seaglass','quartz','fossil','harpoon','rationtin']),1);S.nodes[n.id]=S.dayAbs+4;addXP('foraging',5)}
 else if(t==='page'){S.coll.pages[n.pg]=1;S.st.pages=Object.keys(S.coll.pages).length;sfx('quest');showPage(n.pg);dirtyAt(n.x,n.z);checkQuestsSoon();return}
 else if(t==='antler'){addItem('antler',1);S.nodes[n.id]=S.dayAbs+5;addXP('foraging',5)}
 else if(t==='wool'){addItem('wool',S.season===0?2:1);S.nodes[n.id]=S.dayAbs+(S.season===0?2:4);addXP('foraging',5)}
 else if(t==='nest'){addItem('down',ri(1,2));if(chance(.5))addItem('feather',1);S.nodes[n.id]=S.dayAbs+4;addXP('foraging',4)}
 sfx('pick');dirtyAt(n.x,n.z);checkAch()}
function takeSample(n){if(n.smp==='auroradata'&&!(isNight()&&S.aurora)){toast('Aurora readings need an aurora night.','aurora');return}if(n.smp==='icecore'&&S.q.m9&&false){}
 if(!spend(1))return;addItem(n.smp,1);S.nodes[n.id]=S.dayAbs+1;dirtyAt(n.x,n.z);addXP('research',6);sfx('pick')}
function eatHeld(){const h=held();if(!h)return;const it=ITEMS[h.id];if(!(it.e||it.hp||it.w)){toast('You can\'t eat that.','question');return}
 S.en=Math.min(maxEn(),S.en+(it.e||0));S.hp=Math.min(maxHp(),S.hp+(it.hp||0));S.warm=Math.min(100,S.warm+(it.w||0));removeItem(h.id,1);sfx('eat');
 toast(it.name+(it.e?' +'+it.e+' energy':'')+(it.w?' +'+it.w+' warmth':'')+(it.hp?' +'+it.hp+' health':''),'eat');P.useCD=.5}
function useCan(t){const it=heldIt();const cap=it.tier>1?40:15;
 const w=lookWater(5);if(w&&!w.ice||(t&&t.k==='int'&&/Water Barrel/.test(t.it.label))){S.can=cap;toast('Watering can filled ('+cap+').','wcan');sfx('splash');return}
 let d=null;if(t&&t.k==='plot')d=S.plots[t.i];else if(t&&t.k==='placed'&&t.p.t==='planter')d=t.p.d;
 if(!d||!d.c){toast(S.can>0?'Aim at a planted crop.':'Your can is empty. Refill at water or the greenhouse barrel.','wcan');return}
 if(d.w){toast('Already watered today.','wcan');return}if(S.can<=0){toast('Your can is empty! Refill at water or the greenhouse barrel.','wcan');return}
 if(!spend(.6))return;S.can--;d.w=1;plotDirty=true;if(t.k==='placed')dirtyAt(t.p.x,t.p.z);sfx('water');addXP('farming',1)}
function refillCan(){const c=bestTool('can');if(!c){toast('You need a watering can.','wcan');return}S.can=c.tier>1?40:15;toast('Watering can filled.','wcan');sfx('splash')}
function plotAct(i,useSeed){let d=S.plots[i];const h=held();
 if(d&&d.c){const cr=CROPS[d.c];if(d.g>=cr.days){harvestCrop(d);S.plots[i]=null;plotDirty=true;return}toast(cr.name+': '+d.g+'/'+cr.days+' days. '+(d.w?'Watered today.':'Needs water!'),'seed');return}
 if(h&&ITEMS[h.id].seed){S.plots[i]={c:ITEMS[h.id].seed,g:0,w:0};removeItem(h.id,1);plotDirty=true;sfx('plant');addXP('farming',2);return}
 toast('Hold seeds to plant here.','seed')}
function harvestCrop(d){const n=S.res.soil&&chance(.25)?2:1;addItem(d.c,n);S.coll.crops[d.c]=1;S.st.harvest++;addXP('farming',8+CROPS[d.c].days);sfx('pick');checkAch();checkQuestsSoon()}
function placedAct(p,useSeed){
 if(p.t==='planter'){const d=p.d||(p.d={});const h=held();if(d.c){const cr=CROPS[d.c];if(d.g>=cr.days){harvestCrop(d);p.d={};dirtyAt(p.x,p.z);return}}
  else if(h&&ITEMS[h.id].seed){const cr=CROPS[ITEMS[h.id].seed];if(!cr.seasons.includes(S.season)){toast(cr.name+' can\'t grow outdoors in '+SEASONS[S.season]+'. Use the greenhouse.','seed');return}p.d={c:cr.id,g:0,w:0};removeItem(h.id,1);dirtyAt(p.x,p.z);sfx('plant');return}}

function lookWater(maxD){const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw);let t0=P.pitch<-.05?clamp((P.eye+1)/Math.tan(-P.pitch),1.5,maxD):Math.min(10,maxD);

 for(let k=0;k<=maxD*2;k++){const a=probe(t0+k*.5);if(a)return a;const b=probe(t0-k*.5);if(b)return b}return null}
function lookGround(maxD){const o=eyePos(),d=fwd();for(let t=.5;t<maxD;t+=.2){const x=o[0]+d[0]*t,y=o[1]+d[1]*t,z=o[2]+d[2]*t;if(y<=groundAt(x,z,y)+.02)return[x,groundAt(x,z,y),z]}return null}

function drawLogo(cvs,small){const x=cvs.getContext('2d');const W=cvs.width,Hh=cvs.height;x.clearRect(0,0,W,Hh);
 const g=x.createLinearGradient(0,0,0,Hh);g.addColorStop(0,'rgba(10,20,46,0)');g.addColorStop(1,'rgba(10,20,46,0)');
 // aurora ribbons
 for(let k=0;k<3;k++){x.beginPath();for(let i=0;i<=40;i++){const px=i/40*W,py=Hh*.28+Math.sin(i*.35+k*1.7)*Hh*.08+k*Hh*.06;i?x.lineTo(px,py):x.moveTo(px,py)}x.lineWidth=Hh*.07;x.strokeStyle=['rgba(90,240,160,.35)','rgba(160,110,255,.28)','rgba(90,220,230,.25)'][k];x.lineCap='round';x.stroke()}
 // mountains
 x.fillStyle='#e8f0f8';x.beginPath();x.moveTo(W*.18,Hh*.62);x.lineTo(W*.3,Hh*.38);x.lineTo(W*.38,Hh*.5);x.lineTo(W*.5,Hh*.3);x.lineTo(W*.62,Hh*.5);x.lineTo(W*.7,Hh*.4);x.lineTo(W*.82,Hh*.62);x.closePath();x.fill();
 x.fillStyle='#b8cce0';x.beginPath();x.moveTo(W*.5,Hh*.3);x.lineTo(W*.62,Hh*.5);x.lineTo(W*.55,Hh*.62);x.lineTo(W*.47,Hh*.62);x.closePath();x.fill();
 // cabin
 x.fillStyle='#a8432e';x.fillRect(W*.45,Hh*.52,W*.1,Hh*.1);x.fillStyle='#f4f8fc';x.beginPath();x.moveTo(W*.44,Hh*.53);x.lineTo(W*.5,Hh*.45);x.lineTo(W*.56,Hh*.53);x.closePath();x.fill();x.fillStyle='#ffd06a';x.fillRect(W*.47,Hh*.555,W*.018,Hh*.03);x.fillRect(W*.515,Hh*.555,W*.018,Hh*.03);
 x.fillStyle='rgba(255,210,120,.25)';x.beginPath();x.arc(W*.5,Hh*.57,W*.07,0,TAU);x.fill();
 // text
 const fs=Hh*.2;x.font=`900 ${fs}px "Trebuchet MS","Segoe UI",sans-serif`;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';
 x.lineWidth=fs*.16;x.strokeStyle='#1b2a44';x.strokeText('FROSTLIGHT',W/2,Hh*.74);const tg=x.createLinearGradient(0,Hh*.64,0,Hh*.84);tg.addColorStop(0,'#ffffff');tg.addColorStop(1,'#bfe3f5');x.fillStyle=tg;x.fillText('FROSTLIGHT',W/2,Hh*.74);
 x.font=`800 ${fs*.42}px "Trebuchet MS","Segoe UI",sans-serif`;x.lineWidth=fs*.1;x.strokeText('ARCTIC  RESEARCH  STATION',W/2,Hh*.9);x.fillStyle='#ffd27a';x.fillText('ARCTIC  RESEARCH  STATION',W/2,Hh*.9);
 // snow sparkles
 for(let i=0;i<40;i++){x.fillStyle='rgba(255,255,255,.8)';x.beginPath();x.arc(hash2(i,1)*W,hash2(i,2)*Hh*.6,1+hash2(i,3)*2.5,0,TAU);x.fill()}}
