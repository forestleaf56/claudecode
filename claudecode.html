<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mia — Local Voice Call</title>
<style>
  :root{
    /* LOCAL MIA — violet / mint on-device theme */
    --bg0:#0c0a18; --bg1:#191436;
    --plate:#1e1a3a; --plate-edge:#352c5f;
    --glow:#a78bfa;                 /* primary accent (violet) */
    --mint:#7cf5c0;                 /* "offline / local" accent */
    --ink:#d8d2f2; --ink-dim:#8a83ad;
    --call:#34d07c; --end:#f0564f;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 0%, var(--bg1), var(--bg0) 70%);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    min-height:100dvh;overflow:hidden;user-select:none;
    padding:max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
  }
  header{text-align:center;position:relative;width:100%}
  header h1{font-size:20px;font-weight:600;letter-spacing:.06em}
  header .sub{font-size:12px;color:var(--ink-dim);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
  header .badge{
    display:inline-flex;align-items:center;gap:5px;margin-top:8px;
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
    color:var(--mint);border:1px solid rgba(124,245,192,.35);
    background:rgba(124,245,192,.08);border-radius:999px;padding:3px 10px;
  }
  header .badge b{color:var(--mint)}
  #gear{
    position:absolute;right:0;top:0;background:none;border:none;cursor:pointer;
    color:var(--ink-dim);font-size:22px;padding:6px;line-height:1;
  }
  #gear:hover{color:var(--ink)}
  #chatBtn{
    position:absolute;left:0;top:0;background:none;border:none;cursor:pointer;
    color:var(--ink-dim);font-size:20px;padding:6px;line-height:1;
  }
  #chatBtn:hover{color:var(--ink)}
  body.oncall #chatBtn{display:none}

  /* ---- text chat panel ---- */
  #chat{
    position:fixed;left:0;right:0;top:64px;bottom:0;z-index:6;
    background:linear-gradient(180deg, rgba(12,10,24,.97), rgba(12,10,24,.99));
    display:flex;flex-direction:column;
    padding:10px 12px max(12px, env(safe-area-inset-bottom));
  }
  #chat.hidden{display:none}
  #chatMsgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px}
  .bub{max-width:82%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .bub.user{align-self:flex-end;background:#3a2d6b;color:#ece7ff;border-bottom-right-radius:5px}
  .bub.mia{align-self:flex-start;background:var(--plate);border:1px solid var(--plate-edge);border-bottom-left-radius:5px}
  .bub.typing{color:var(--ink-dim);font-style:italic}
  .bubcards{align-self:flex-start;display:flex;gap:8px;flex-wrap:wrap}
  .bubcards.user{align-self:flex-end}
  #chatAttach{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
  #chatRow{display:flex;gap:8px;align-items:center}
  #chatRow button{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--plate-edge);
    background:var(--plate);cursor:pointer;display:flex;align-items:center;justify-content:center;
    flex:none;color:var(--glow);font-size:17px;
  }
  #chatRow button svg{width:20px;height:20px;fill:var(--ink-dim)}
  #chatInput{
    flex:1;padding:12px 14px;border-radius:22px;border:1px solid var(--plate-edge);
    background:#120f26;color:var(--ink);font-size:15px;outline:none;min-width:0;
  }
  #chatInput:focus{border-color:var(--glow)}
  body.chatmode #btnRow, body.chatmode #attachArea, body.chatmode #hint, body.chatmode #status{display:none}

  /* ---- settings ---- */
  #logBox{
    max-height:200px;overflow-y:auto;background:#120f26;border:1px solid var(--plate-edge);
    border-radius:12px;padding:10px;font-size:12px;line-height:1.5;margin-top:6px;
  }
  #logBox .lrole{color:var(--glow);font-weight:700}
  #logBox .litem{margin-bottom:8px;word-break:break-word}
  #logBox .ltime{color:var(--ink-dim);font-size:10px}
  #logBox a{color:var(--mint);text-decoration:none;font-weight:700}
  #logBox img{max-width:64px;max-height:64px;border-radius:8px;vertical-align:middle;margin-right:6px}
  #clearLog{
    margin-top:10px;width:100%;padding:10px;border:1px solid var(--plate-edge);border-radius:12px;
    background:transparent;color:#f0968f;font-size:13px;cursor:pointer;
  }

  #faceWrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-height:60vh}
  #face{
    width:min(78vw,52vh,420px);height:min(78vw,52vh,420px);
    filter:drop-shadow(0 18px 50px rgba(0,0,0,.55));
  }
  #halo{
    position:absolute;width:min(88vw,60vh,480px);height:min(88vw,60vh,480px);
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(167,139,250,.12) 0%, rgba(167,139,250,0) 62%);
    transition:opacity .6s;opacity:.55;
  }
  body.oncall #halo{opacity:1}

  #status{
    min-height:22px;font-size:14px;color:var(--ink-dim);letter-spacing:.08em;
    text-transform:uppercase;margin-bottom:22px;transition:color .3s;text-align:center;
    max-width:92vw;
  }
  body.state-listening #status{color:var(--glow)}
  body.state-speaking  #status{color:var(--mint)}

  #callBtn{
    width:84px;height:84px;border-radius:50%;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:var(--call);
    box-shadow:0 0 0 0 rgba(52,208,124,.45), 0 10px 26px rgba(0,0,0,.45);
    transition:background .25s, transform .12s;
    animation:pulse 2.4s infinite;
  }
  #callBtn:active{transform:scale(.93)}
  #callBtn svg{width:38px;height:38px;fill:#06281a;transition:transform .3s, fill .25s}
  body.oncall #callBtn{background:var(--end);animation:none}
  body.oncall #callBtn svg{transform:rotate(135deg);fill:#3d0d0b}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(52,208,124,.45),0 10px 26px rgba(0,0,0,.45)}
    70%{box-shadow:0 0 0 26px rgba(52,208,124,0),0 10px 26px rgba(0,0,0,.45)}
    100%{box-shadow:0 0 0 0 rgba(52,208,124,0),0 10px 26px rgba(0,0,0,.45)}
  }
  @media (prefers-reduced-motion: reduce){ #callBtn{animation:none} }
  #hint{font-size:12px;color:var(--ink-dim);margin-top:14px;text-align:center;max-width:300px;line-height:1.5}

  /* ---- button row, camera & attach ---- */
  #btnRow{display:flex;align-items:center;justify-content:center;gap:26px;width:100%}
  #camBtn, #attachBtn{
    width:56px;height:56px;border-radius:50%;border:1px solid var(--plate-edge);
    background:var(--plate);cursor:pointer;display:none;
    align-items:center;justify-content:center;transition:background .25s,border-color .25s;
  }
  body.oncall #camBtn, body.oncall #attachBtn{display:flex}
  #camBtn svg, #attachBtn svg{width:26px;height:26px;fill:var(--ink-dim);transition:fill .25s}
  body.camon #camBtn{background:#2a1f52;border-color:var(--glow)}
  body.camon #camBtn svg{fill:var(--glow)}
  #attachBtn:active{transform:scale(.93)}

  /* ---- attachment & generated-result cards ---- */
  #attachArea{
    display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;
    min-height:0;margin-bottom:10px;max-width:92vw;
  }
  .fcard{
    display:flex;align-items:center;gap:10px;
    background:var(--plate);border:1px solid var(--plate-edge);border-radius:14px;
    padding:8px 12px;max-width:86vw;animation:cardin .25s ease;
  }
  @keyframes cardin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .fcard img{width:52px;height:52px;object-fit:cover;border-radius:9px}
  .fcard .fname{font-size:13px;color:var(--ink);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fcard .fsub{font-size:11px;color:var(--ink-dim)}
  .fcard a.dl, .fcard button.rm{
    border:none;border-radius:10px;cursor:pointer;font-size:13px;padding:8px 12px;
    text-decoration:none;font-weight:700;
  }
  .fcard a.dl{background:var(--call);color:#06281a}
  .fcard button.rm{background:transparent;color:var(--ink-dim);font-size:16px;padding:6px}
  .fcard .spin{
    width:20px;height:20px;border:3px solid var(--plate-edge);border-top-color:var(--glow);
    border-radius:50%;animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #camPreview{
    position:fixed;right:14px;bottom:max(14px, env(safe-area-inset-bottom));
    width:108px;height:144px;border-radius:14px;overflow:hidden;display:none;
    border:2px solid rgba(167,139,250,.5);box-shadow:0 8px 22px rgba(0,0,0,.5);z-index:5;
  }
  body.camon #camPreview{display:block}
  #camVideo{width:100%;height:100%;object-fit:cover}
  #camFlip{
    position:absolute;right:4px;bottom:4px;width:30px;height:30px;border-radius:50%;
    border:none;background:rgba(10,16,32,.7);color:var(--glow);font-size:16px;cursor:pointer;
  }

  /* ---- settings overlay ---- */
  #setup{
    position:fixed;inset:0;background:rgba(8,7,20,.93);backdrop-filter:blur(6px);
    display:flex;align-items:flex-start;justify-content:center;padding:20px;z-index:10;
    overflow-y:auto;
  }
  #setup.hidden{display:none}
  .card{
    background:var(--plate);border:1px solid var(--plate-edge);border-radius:20px;
    padding:26px 22px;max-width:400px;width:100%;margin:auto 0 20px;
  }
  .card h2{font-size:18px;margin-bottom:6px}
  .card p{font-size:13px;color:var(--ink-dim);line-height:1.55;margin-bottom:6px}
  .card p a{color:var(--glow);text-decoration:none}
  .card label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin:16px 0 6px}
  .card input, .card select{
    width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--plate-edge);
    background:#120f26;color:var(--ink);font-size:14px;outline:none;
  }
  .card input:focus, .card select:focus{border-color:var(--glow)}
  .meta{font-size:12px;color:var(--ink-dim);margin-top:6px;line-height:1.5}
  .meta.ok{color:var(--mint)}
  .meta.warn{color:#f0c36f}
  .meta.err{color:#f0968f}
  .btn2{
    margin-top:10px;width:100%;padding:12px;border:1px solid var(--glow);border-radius:12px;cursor:pointer;
    background:rgba(167,139,250,.12);color:var(--glow);font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn2:disabled{opacity:.5;cursor:default}
  #progWrap, #voiceProgWrap{height:8px;border-radius:6px;background:#120f26;border:1px solid var(--plate-edge);
    margin-top:10px;overflow:hidden;display:none}
  #progWrap.show, #voiceProgWrap.show{display:block}
  #progBar, #voiceProg{height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--mint));transition:width .2s}
  #saveKeys{
    margin-top:20px;width:100%;padding:14px;border:none;border-radius:14px;cursor:pointer;
    background:var(--call);color:#06281a;font-size:15px;font-weight:700;
  }
  #setupErr{color:#f0968f;font-size:12px;margin-top:10px;min-height:16px}
  .hide{display:none !important}
</style>
</head>
<body>

<header>
  <h1>Mia</h1>
  <div class="sub">local voice call</div>
  <div class="badge">⬇ <b>On-device AI</b> · Offline</div>
  <button id="chatBtn" aria-label="Text chat">💬</button>
  <button id="gear" aria-label="Settings">⚙</button>
</header>

<div id="faceWrap">
  <div id="halo"></div>
  <canvas id="face" width="600" height="600"></canvas>
</div>

<div id="status">&nbsp;</div>
<div id="attachArea"></div>
<div id="btnRow">
  <button id="camBtn" aria-label="Toggle camera eyes">
    <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
  </button>
  <button id="callBtn" aria-label="Start call">
    <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
  </button>
  <button id="attachBtn" aria-label="Attach a file">
    <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5S13.5 3.62 13.5 5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5C7 20.54 9.46 23 12.5 23s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
  </button>
</div>
<input type="file" id="fileInput" accept="image/*,.pdf,.txt,.md,.csv,.json,.html,text/*" hidden>

<!-- text chat -->
<div id="chat" class="hidden">
  <div id="chatMsgs"></div>
  <div id="chatAttach"></div>
  <div id="chatRow">
    <button id="chatAttachBtn" aria-label="Attach a file">
      <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5S13.5 3.62 13.5 5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5C7 20.54 9.46 23 12.5 23s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
    </button>
    <input id="chatInput" autocomplete="off" placeholder="Write to Mia…">
    <button id="chatSend" aria-label="Send">➤</button>
  </div>
</div>

<div id="camPreview">
  <video id="camVideo" autoplay playsinline muted></video>
  <button id="camFlip" aria-label="Flip camera">⟲</button>
</div>
<div id="hint">Tap to call Mia. Everything runs on your device.</div>

<!-- settings / first-run model setup -->
<div id="setup" class="hidden">
  <div class="card">
    <h2 id="suTitle">Set up Mia — 100% on your device</h2>
    <p id="suDesc"></p>

    <label for="langSel" id="suLang">Language</label>
    <select id="langSel">
      <option value="en">English</option>
      <option value="sv">Svenska</option>
    </select>

    <label id="suModel">On-device AI model</label>
    <select id="modelSel"></select>
    <div id="modelMeta" class="meta"></div>
    <button id="dlModel" class="btn2">⬇ <span id="dlModelTxt">Download &amp; load model</span></button>
    <div id="progWrap"><div id="progBar"></div></div>
    <div id="modelStatus" class="meta"></div>

    <label id="suVoice">Voice</label>
    <select id="voiceMode">
      <option value="browser">Built-in browser voice (offline)</option>
      <option value="piper">Realistic offline voice (download)</option>
    </select>
    <select id="browserVoiceSel"></select>
    <div id="piperRow" class="hide">
      <select id="piperVoiceSel"></select>
      <button id="dlVoice" class="btn2">⬇ <span id="dlVoiceTxt">Download &amp; use voice</span></button>
      <div id="voiceProgWrap"><div id="voiceProg"></div></div>
      <div id="voiceStatus" class="meta"></div>
    </div>

    <button id="saveKeys">Done</button>
    <div id="setupErr"></div>

    <label id="suLog">Conversation log</label>
    <div id="logBox"></div>
    <button id="clearLog">Clear log &amp; memory</button>
  </div>
</div>

<script type="module">
'use strict';
/* ============================================================
   MIA — LOCAL, OFFLINE one-button voice call with an animated robot
   STT: Web Speech API (browser)
   LLM: WebLLM — runs the model on-device (WebGPU), cached for offline
   TTS: built-in browser voices, or optional realistic offline Piper voice
   No API keys. No Gemini. No ElevenLabs.
   ============================================================ */

/* Register the offline service worker (needs http/localhost, not file://).
   It caches the WebLLM / vits-web library code, WASM and model downloads so Mia
   keeps working after the network drops — the missing piece that made it answer
   online but not offline. When the worker first takes control we reload once, so
   that load's imports/model fetches actually pass through it and get cached. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  let swReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swReloaded) return;
    swReloaded = true;
    location.reload();
  });
}

/* System prompt — identical to the online (Gemini) version. Both languages
   share the same English base, and differ only by the final language line
   (T().speakRule): " Always answer in English." / " Svara alltid på svenska." */
const SYSTEM_PROMPT_BASE = "Act as a person with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Your name is Mia. Always give short answers. Always be honest.";
const GEN_RULES = " If the user asks you to create/write a document, file, list, letter, recipe or similar, put the full content inside markers exactly like [[FILE:filename.ext]] content [[/FILE]] using extension .txt, .md, .html or .csv — and keep your spoken words outside the markers very short. If the user asks you to create, draw, generate or make a picture/image, do NOT describe it in words; instead output exactly one marker like [[IMAGE: detailed image description in English]] plus a very short spoken comment.";

/* ---------------- language ---------------- */
let LANG = localStorage.getItem('mia_lang') || 'en';
const I18N = {
  en: {
    sub:'local voice call', hintIdle:'Tap to call Mia. Everything runs on your device.',
    hintOn:'Say hi — Mia is listening.', listening:'Listening…', thinking:'Thinking…',
    speaking:'Mia is speaking', connecting:'Waking Mia up…', ended:'Call ended',
    loadingModel:'Loading model…', dlModel:'Downloading model…',
    micBlocked:'Microphone blocked — allow mic access and try again.',
    noSR:'Speech recognition is not supported in this browser. Please use Chrome or Edge.',
    glitch:"Sorry, my brain hiccupped. Say that again?",
    fallbackGreet:"Hey, it's Mia. What's up?",
    greetCue:'(The call just connected. Greet me briefly as if you picked up the phone.)',
    camOn:'Camera eyes on — ask Mia what she sees.', camOff:'Camera eyes off.',
    camFail:'Camera not available — check permission.',
    camCue:'(You are seeing through my camera right now. The attached image is your current live view — refer to it naturally when relevant.)',
    attachCue:'(I attached a file to this message: NAME. Its content is included — refer to it when relevant.)',
    attached:'Attached — ask Mia about it.', tooBig:'File too large (max 10 MB).',
    unsupported:'Unsupported file type. Use images, PDF or text files.',
    madeFile:"Done — here's your file.", madeImage:'Done — your image is coming up.',
    imgFail:'Image generation needs an internet connection.',
    noModel:'Pick and download an on-device model first (⚙ settings).',
    needWebGPU:'This browser has no WebGPU, which on-device AI needs. Use Chrome or Edge (desktop, or Android with WebGPU).',
    appOnly:'That model is a Google LiteRT model — it only runs in the native AI Edge Gallery app, not in a web browser. Pick a browser model instead.',
    appOnlyMeta:'Google LiteRT — runs only in the native AI Edge Gallery app, not in a browser. Closest browser model: ALT.',
    fileWarn:'Heads up: phones block the microphone when a page is opened as a file. Serve it from localhost or a website for voice — text chat still works.',
    noVision:' (Heads up: your current on-device model has no vision, so I can only go by what you tell me.)',
    noRead:' (You attached NAME, but this local model cannot read that file type.)',
    suTitle:'Set up Mia — 100% on your device',
    suDesc:'No accounts, no API keys, nothing leaves your device. Download a small AI model once, then Mia works fully offline — chat and voice included. First download can take a while and is cached in your browser.',
    suLang:'Language', suModel:'On-device AI model', suVoice:'Voice',
    suSave:'Done', suLog:'Conversation log', suClear:'Clear log & memory', suEmpty:'(empty)',
    dlBtn:'Download & load model', dlBtnLoaded:'Model ready — reload',
    modelReady:'✓ Ready & cached — works offline.', modelLoading:'Loading…',
    modelPick:'Pick a model, then download it once.', modelErr:'Could not load model: ',
    voiceReady:'✓ Realistic voice ready (offline).', voiceDl:'Downloading voice…',
    voiceErr:'Realistic voice unavailable — using browser voice.',
    voiceBrowserNote:'Uses your device / browser voices. Fully offline.',
    voicePiperNote:'Tap download to fetch this neural voice (~20–60 MB). Then it speaks offline.',
    dlVoiceBtn:'Download & use voice', dlVoiceLoaded:'Downloaded — re-download',
    voiceDlErr:'Voice download failed — will use browser voice. ',
    lYou:'You', lMia:'Mia', lMade:'Mia made: ', lAtt:'You attached: ',
    speakRule:' Always answer in English.'
  },
  sv: {
    sub:'lokalt röstsamtal', hintIdle:'Tryck för att ringa Mia. Allt körs på din enhet.',
    hintOn:'Säg hej — Mia lyssnar.', listening:'Lyssnar…', thinking:'Tänker…',
    speaking:'Mia pratar', connecting:'Väcker Mia…', ended:'Samtalet avslutat',
    loadingModel:'Laddar modell…', dlModel:'Laddar ner modell…',
    micBlocked:'Mikrofonen är blockerad — tillåt mikrofonåtkomst och försök igen.',
    noSR:'Taligenkänning stöds inte i den här webbläsaren. Använd Chrome eller Edge.',
    glitch:'Förlåt, det hakade upp sig. Kan du säga det igen?',

let webllm = null;      // the imported module
let engine = null;      // MLCEngine instance
let loadedModelId = null;

const WEBLLM_URL = 'https://esm.run/@mlc-ai/web-llm@0.2.84';

/* Every model from the on-device gallery, plus a few extras.

   runnable:false → Google LiteRT models that only run in a native app

const MODELS = [
  { id:'gemma3-1b-it-q4f16_1-MLC',                   name:'Gemma3-1B-IT',                  size:'~0.9 GB', note:'Google Gemma 3 · compact', runnable:true },

/* Some models ship an mlc-chat-config that WebLLM rejects unless we override
   it. Gemma 3 sets both context_window_size and sliding_window_size > 0, which
   errors out. We disable the full context window and KEEP the small sliding
   window: this both fixes loading AND keeps the KV cache tiny, which stops the
   out-of-memory crash on phones. */
const MODEL_CHAT_OPTS = {
  // context_window_size:-1 keeps Gemma 3's native sliding window (512), which
  // fixes the load error and keeps the KV cache tiny → no OOM crash on phones.
  'gemma3-1b-it-q4f16_1-MLC': { context_window_size: -1 }
};

async function loadWebLLM(){
  if (webllm) return webllm;
  webllm = await import(WEBLLM_URL);
  return webllm;
}
async function buildModelList(){ try { await loadWebLLM(); } catch(e){} return MODELS; }

function currentModelId(){ return localStorage.getItem('mia_model') || null; }
function modelInfo(id){ return MODELS.find(m => m.id === id) || null; }

/* A module Web Worker built from a Blob, so the app stays a single file.
   Running WebLLM inside the worker keeps the main thread — and therefore the
   robot animation and the whole UI — smooth and responsive while the model
   is decoding. (On the main thread, decoding froze rAF → flicker + jank.) */
let miaWorker = null;
function makeWorker(){
  const src =
    'import { WebWorkerMLCEngineHandler } from "' + WEBLLM_URL + '";\n' +
    'const handler = new WebWorkerMLCEngineHandler();\n' +
    'self.onmessage = (e) => handler.onmessage(e);\n';
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  return new Worker(url, { type: 'module' });
}

/* Load (downloading + caching if needed) the given model into the engine. */
async function ensureModel(modelId, onProgress){
  await loadWebLLM();
  if (engine && loadedModelId === modelId) return engine;
  const chatOpts = MODEL_CHAT_OPTS[modelId];
  if (!engine){
    // Preferred: off-main-thread worker engine.
    if (webllm.CreateWebWorkerMLCEngine){
      try {
        miaWorker = makeWorker();
        engine = await webllm.CreateWebWorkerMLCEngine(miaWorker, modelId, { initProgressCallback: onProgress }, chatOpts);
        loadedModelId = modelId;
        return engine;
      } catch(e){
        console.warn('worker engine unavailable, using main thread:', e && e.message);
        try { miaWorker && miaWorker.terminate(); } catch(_){}
        miaWorker = null; engine = null;
      }
    }
    // Fallback: main-thread engine.
    engine = new webllm.MLCEngine();
    if (onProgress) engine.setInitProgressCallback(onProgress);
    await engine.reload(modelId, chatOpts);
    loadedModelId = modelId;
    return engine;
  }
  // Engine exists but a different model was picked → reload it.
  if (onProgress && engine.setInitProgressCallback) engine.setInitProgressCallback(onProgress);
  await engine.reload(modelId, chatOpts);
  loadedModelId = modelId;
  return engine;
}

/* Make sure the selected model is ready for a turn (used by call/chat). */
async function ensureModelReady(){
  const id = currentModelId();
  if (!id){ const e = new Error(T().noModel); e.noModel = true; throw e; }
  const info = modelInfo(id);
  if (info && info.runnable === false){ const e = new Error(T().appOnly); e.noModel = true; throw e; }
  if (engine && loadedModelId === id) return engine;
  if (!('gpu' in navigator)){ const e = new Error(T().needWebGPU); e.noModel = true; throw e; }
  setState(S.THINKING, T().loadingModel);
  await ensureModel(id, (p) => { statusEl.textContent = (p && p.text ? p.text : T().loadingModel).slice(0,60); });
  return engine;
}

/* One LLM call over an OpenAI-style message array. */
async function llmChat(messages){
  const eng = await ensureModelReady();
  // Model is loaded — show "Thinking…" instead of leaving the last load message
  // ("Finished loading on WebGPU") on screen while the model generates.
  if (onCall) setState(S.THINKING, T().thinking);
  // Necessary offline settings: on-device models are slow and, at temperature
  // 1.0 with a 1024-token budget, ramble without stopping — which left the app
  // stuck after "Finished loading on WebGPU". Lower temperature + penalties make
  // them stop, and a smaller budget keeps a spoken reply quick.
  const out = await eng.chat.completions.create({
    messages,
    temperature: 0.6,
    top_p: 0.9,
    frequency_penalty: 0.4,
    presence_penalty: 0.2,
    max_tokens: 240
  });
  let txt = (out?.choices?.[0]?.message?.content || '');
  // Necessary offline-only cleanup: some local models (e.g. DeepSeek-R1) emit
  // <think>…</think> reasoning that Gemini never produced — never speak it.
  txt = txt.replace(/<think>[\s\S]*?<\/think>/gi, '');   // paired blocks
  txt = txt.replace(/<think>[\s\S]*$/i, '');             // unclosed / truncated block
  txt = txt.replace(/<\/?think>/gi, '').trim();
  return txt;
}

/* ---------------- persistence: memory, log, blobs ---------------- */
const idb = {
  db: null,
  open(){
    if (this.db) return Promise.resolve();
    return new Promise((res, rej) => {
      const r = indexedDB.open('mia', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('blobs');
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  async put(key, blob){
    await this.open();
    return new Promise((res, rej) => {
      const tx = this.db.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').put(blob, key);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  },
  async get(key){
    await this.open();
    return new Promise((res, rej) => {
      const q = this.db.transaction('blobs').objectStore('blobs').get(key);
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => rej(q.error);
    });
  },
  async clear(){
    await this.open();
    return new Promise((res) => {
      const tx = this.db.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').clear();
      tx.oncomplete = res; tx.onerror = res;
    });
  }
};

  if (convLog.length > 2000) convLog = convLog.slice(-2000);

/* ---------------- robot face (canvas) — violet/mint local palette ---- */
const face = (() => {
  const cv = document.getElementById('face');
  const cx = cv.getContext('2d');
  const W = cv.width, H = cv.height, CX = W/2, CY = H/2;

  const cur = { eyeH:1, browTilt:0, browRaise:0, pupilX:0, pupilY:0,
                mouthOpen:.08, mouthCurve:.25, headBob:0, glow:.6 };
  const tgt = Object.assign({}, cur);
  let expression = 'idle';
  let blinkT = 0, nextBlink = 2 + Math.random()*3;
  let wanderT = 0, t = 0;
  let mouthLevel = 0;

  function setExpression(e){
    expression = e;
    switch(e){
      case 'idle':      Object.assign(tgt,{eyeH:1, browTilt:0,  browRaise:0,  mouthOpen:.07, mouthCurve:.5,  glow:.7}); break;
      case 'listening': Object.assign(tgt,{eyeH:1.12,browTilt:0, browRaise:.5, mouthOpen:.05, mouthCurve:.55, glow:1}); break;
      case 'thinking':  Object.assign(tgt,{eyeH:.78,browTilt:.5, browRaise:.3, mouthOpen:.04, mouthCurve:.3,  pupilX:.5, pupilY:-.6, glow:.8}); break;
      case 'speaking':  Object.assign(tgt,{eyeH:1, browTilt:0,  browRaise:.2, mouthCurve:.45, glow:1}); break;
      case 'happy':     Object.assign(tgt,{eyeH:.5, browTilt:-.25,browRaise:.6,mouthCurve:1,   glow:1.15}); break;
      case 'surprised': Object.assign(tgt,{eyeH:1.3,browTilt:0,  browRaise:1,  mouthOpen:.5,  mouthCurve:.25, glow:1.1}); break;
    }
  }
  function setMouthLevel(v){ mouthLevel = v; }

  function ease(dt){
    for (const k in tgt) cur[k] += (tgt[k]-cur[k]) * Math.min(1, dt*7);
  }

  function draw(dt){
    t += dt;
    blinkT += dt;
    let blink = 1;
    if (blinkT > nextBlink){
      const p = (blinkT - nextBlink) / .22;
      if (p >= 1){ blinkT = 0; nextBlink = 1.8 + Math.random()*3.5; }
      else blink = Math.abs(1 - p*2);
    }
    if (expression === 'idle' || expression === 'listening'){
      wanderT += dt;
      if (wanderT > 2.4){ wanderT = 0; tgt.pupilX = (Math.random()*2-1)*.5; tgt.pupilY = (Math.random()*2-1)*.3; }
    }
    if (expression === 'speaking'){ tgt.pupilX = Math.sin(t*.6)*.15; tgt.pupilY = 0; }
    if (mouthLevel > 0.01) tgt.mouthOpen = .06 + mouthLevel*.85;
    tgt.headBob = Math.sin(t*1.2)*(expression==='speaking'? 6:3);
    ease(dt);

    cx.clearRect(0,0,W,H);
    cx.save();
    cx.translate(CX, CY + cur.headBob);

    const r = 210;
    const grad = cx.createLinearGradient(0,-r,0,r);
    grad.addColorStop(0,'#2e2a54'); grad.addColorStop(1,'#181334');
    cx.fillStyle = grad;
    roundRect(-r, -r*.92, r*2, r*1.84, 118); cx.fill();
    cx.lineWidth = 5; cx.strokeStyle = '#3d3568'; cx.stroke();

    cx.strokeStyle = '#352c5f'; cx.lineWidth = 8;
    cx.beginPath(); cx.moveTo(0,-r*.92); cx.lineTo(0,-r*1.12); cx.stroke();
    cx.fillStyle = `rgba(124,245,192,${.4 + .6*cur.glow*(0.6+0.4*Math.sin(t*3))})`;
    cx.beginPath(); cx.arc(0,-r*1.2, 13, 0, 7); cx.fill();

    cx.fillStyle = '#352c5f';
    roundRect(-r-16, -34, 20, 68, 10); cx.fill();
    roundRect( r-4,  -34, 20, 68, 10); cx.fill();

    cx.fillStyle = '#120f26';
    roundRect(-r*.8, -r*.68, r*1.6, r*1.36, 84); cx.fill();

    const eyeY = -42, eyeDX = 80;
    const eh = 54 * cur.eyeH * blink, ew = 40;
    for (const s of [-1,1]){
      const ex = s*eyeDX + cur.pupilX*14;
      const g = cx.createRadialGradient(ex, eyeY, 4, ex, eyeY, 58);
      g.addColorStop(0, `rgba(167,139,250,${.5*cur.glow})`);
      g.addColorStop(1, 'rgba(167,139,250,0)');
      cx.fillStyle = g;
      cx.beginPath(); cx.arc(ex, eyeY, 60, 0, 7); cx.fill();

      const eg = cx.createLinearGradient(ex, eyeY-eh, ex, eyeY+eh);
      eg.addColorStop(0,'#d6c9ff'); eg.addColorStop(1,'#9b7bf0');
      cx.fillStyle = eg;
      cx.beginPath();
      cx.ellipse(ex, eyeY + cur.pupilY*8, ew, Math.max(3, eh), 0, 0, 7);
      cx.fill();
      cx.fillStyle = 'rgba(255,255,255,.9)';
      cx.beginPath();
      cx.ellipse(ex - 11 + cur.pupilX*6, eyeY - eh*.35 + cur.pupilY*8, 10, Math.max(2, eh*.24), 0, 0, 7);
      cx.fill();
      cx.fillStyle = 'rgba(255,255,255,.55)';
      cx.beginPath();
      cx.ellipse(ex + 12 + cur.pupilX*6, eyeY + eh*.3 + cur.pupilY*8, 5, Math.max(1.5, eh*.1), 0, 0, 7);
      cx.fill();
    }

    cx.strokeStyle = `rgba(167,139,250,${.7*cur.glow})`;
    cx.lineWidth = 7; cx.lineCap = 'round';
    for (const s of [-1,1]){
      const bx = s*eyeDX, by = eyeY - 66 - cur.browRaise*16;
      const tilt = cur.browTilt * 12 * s;
      cx.beginPath();
      cx.moveTo(bx - 28, by + 6 + tilt);
      cx.quadraticCurveTo(bx, by - 8, bx + 28, by + 6 - tilt);
      cx.stroke();
    }

    const my = 84, mw = 96;
    const open = Math.max(.03, cur.mouthOpen);
    const curve = cur.mouthCurve;
    cx.fillStyle = '#a78bfa';
    cx.beginPath();
    cx.moveTo(-mw/2, my - curve*18);
    cx.quadraticCurveTo(0, my - curve*18 - open*8, mw/2, my - curve*18);
    cx.quadraticCurveTo(mw/2 + open*6, my + open*46*.5, mw/2, my + open*46 + curve*14);
    cx.quadraticCurveTo(0, my + open*46 + curve*30, -mw/2, my + open*46 + curve*14);
    cx.quadraticCurveTo(-mw/2 - open*6, my + open*46*.5, -mw/2, my - curve*18);
    cx.closePath();
    cx.fill();
    if (open > .18){
      cx.fillStyle = '#120f26';
      cx.beginPath();
      cx.ellipse(0, my + open*24, mw*.32, open*18, 0, 0, 7);
      cx.fill();
    }

    if (curve > .3){
      const blush = Math.min(1, (curve - .3) / .6);
      cx.fillStyle = `rgba(244,138,158,${.12 + .28*blush})`;
      cx.beginPath(); cx.ellipse(-eyeDX-16, 36, 24, 13, 0, 0, 7); cx.fill();
      cx.beginPath(); cx.ellipse( eyeDX+16, 36, 24, 13, 0, 0, 7); cx.fill();
    }

    cx.restore();
  }

  function roundRect(x,y,w,h,rad){
    cx.beginPath();
    cx.moveTo(x+rad,y);
    cx.arcTo(x+w,y,x+w,y+h,rad);
    cx.arcTo(x+w,y+h,x,y+h,rad);
    cx.arcTo(x,y+h,x,y,rad);
    cx.arcTo(x,y,x+w,y,rad);
    cx.closePath();
  }

  let last = performance.now();
  (function loop(now){
    const dt = Math.min(.05, (now-last)/1000); last = now;
    draw(dt);
    requestAnimationFrame(loop);
  })(last);

  setExpression('idle');
  return { setExpression, setMouthLevel };
})();

/* ---------------- lip sync ---------------- */
function startLipSyncFromAnalyser(){
  function tick(){
    if (state !== S.SPEAKING) { face.setMouthLevel(0); return; }
    let level = 0;
    if (analyser && ampData){
      analyser.getByteTimeDomainData(ampData);
      let sum = 0;
      for (let i=0;i<ampData.length;i++){ const d = (ampData[i]-128)/128; sum += d*d; }
      level = Math.min(1, Math.sqrt(sum/ampData.length) * 5.5);
    } else {
      fakeMouthTimer += .08;
      level = Math.max(0, Math.sin(fakeMouthTimer*7)*.5 + .35 + Math.sin(fakeMouthTimer*13)*.2);
    }
    face.setMouthLevel(level);
    requestAnimationFrame(tick);
  }
  tick();
}

const attachArea = document.getElementById('attachArea');
const attachBtn  = document.getElementById('attachBtn');
const fileInput  = document.getElementById('fileInput');
let attachment = null;   // {kind:'image'|'pdf'|'text', ...}

attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const f = fileInput.files[0];
  fileInput.value = '';
  if (!f) return;
  if (f.size > 10*1024*1024){ hintEl.textContent = T().tooBig; return; }
  try {
    if (f.type.startsWith('image/')){
      attachment = { kind:'image', mime:'image/jpeg', dataB64: await imageToB64(f), name:f.name, file:f };
      addAttachmentCard(f.name, URL.createObjectURL(f));
    } else if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)){
      attachment = { kind:'pdf', mime:'application/pdf', dataB64: await fileToB64(f), name:f.name, file:f };
      addAttachmentCard(f.name, null);
    } else if (f.type.startsWith('text/') || /\.(txt|md|csv|json|html)$/i.test(f.name)){
      let text = await f.text();
      if (text.length > 100000) text = text.slice(0, 100000);
      attachment = { kind:'text', text, name:f.name, file:f };
      addAttachmentCard(f.name, null);
    } else {
      hintEl.textContent = T().unsupported; return;
    }
    logAttach(attachment.kind === 'image' ? 'image' : 'file', f.name, f);
    hintEl.textContent = T().attached;
  } catch(e){ hintEl.textContent = '⚠ ' + e.message; }
});

function fileToB64(f){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(new Error('read failed'));
    r.readAsDataURL(f);
  });
}
function imageToB64(f){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const maxSide = 1024;
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', .85).split(',')[1]);
    };
    img.onerror = () => rej(new Error('image read failed'));
    img.src = URL.createObjectURL(f);
  });
}

/* parse [[FILE:...]]...[[/FILE]] and [[IMAGE:...]] out of Mia's reply */
function processReply(reply, container){
  let spoken = reply;
  spoken = spoken.replace(/\[\[SEARCH:[^\]]*\]\]/ig, ' ');
  const files = [];
  spoken = spoken.replace(/\[\[FILE:([^\]]+)\]\]([\s\S]*?)\[\[\/FILE\]\]/g, (m, fname, content) => {
    files.push({ name: fname.trim(), content: content.trim() });
    return ' ';
  });
  let imagePrompt = null;
  spoken = spoken.replace(/\[\[IMAGE:([^\]]*)\]\]/g, (m, desc) => {
    imagePrompt = desc.trim();
    return ' ';
  });
  spoken = spoken.replace(/\s+/g, ' ').trim();

  for (const f of files){
    const mime = /\.html?$/i.test(f.name) ? 'text/html' :
                 /\.csv$/i.test(f.name)  ? 'text/csv'  :
                 /\.md$/i.test(f.name)   ? 'text/markdown' : 'text/plain';
    addResultCard({ name: f.name, blob: new Blob([f.content], { type: mime }), kind:'file' }, container);
  }
  if (imagePrompt) generateImage(imagePrompt, container);

  if (!spoken) spoken = files.length ? T().madeFile : (imagePrompt ? T().madeImage : '');
  return spoken || T().madeFile;
}

/* ---------------- image generation (keyless, online only) ---------------- */
async function generateImage(prompt, container){
  const pending = addResultCard({ name: 'image…', pending: true }, container);
  try {
    const res = await fetch('https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=768&height=768&nologo=true');
    if (!res.ok) throw new Error('image HTTP ' + res.status);
    const blob = await res.blob();
    pending.remove();
    const thumbURL = URL.createObjectURL(blob);
    addResultCard({ name: 'mia-image-' + Date.now() + '.png', blob, thumbURL, kind:'image' }, container);
  } catch(e){
    pending.remove(); refreshAttachBtnVisibility();
    hintEl.textContent = '⚠ ' + T().imgFail;
  }
}

/* ---------------- speech recognition (browser) ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/* Exact same speech-recognition setup as the working online version:
   continuous session, restart on silence/error while we should be listening. */
function startListening(){
  if (!onCall) return;
  setState(S.LISTENING, T().listening);
  try { recog && recog.abort(); } catch(e){}
  recog = new SR();
  recog.lang = LANG === 'sv' ? 'sv-SE' : 'en-US';
  // continuous = true keeps the mic session open for your whole turn,
  // so Android's recognition chime plays once per turn instead of on
  // every silence-restart.
  recog.continuous = true;
  recog.interimResults = false;
  recog.maxAlternatives = 1;

  let got = false;
  recog.onresult = (ev) => {
    if (got || state !== S.LISTENING) return;
    const last = ev.results[ev.results.length - 1];
    if (!last.isFinal) return;
    const text = last[0].transcript.trim();
    if (!text) return;
    got = true;
    handleUserSpeech(text);
  };
  recog.onerror = (ev) => {
    if (!onCall) return;
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed'){
      endCall(T().micBlocked);
      return;
    }
    if (state === S.LISTENING) setTimeout(() => { if (onCall && state === S.LISTENING) startListening(); }, 400);
  };
  recog.onend = () => {
    if (onCall && !got && state === S.LISTENING){
      setTimeout(() => { if (onCall && state === S.LISTENING) startListening(); }, 300);
    }
  };
  try { recog.start(); } catch(e){ /* already started */ }
}
function stopListening(){
  if (recog){ try{ recog.onend = null; recog.abort(); }catch(e){} recog = null; }
}

/* ---------------- keyless web search (online only) ---------------- */
let lastGrounded = false;
async function webSearch(query){
  const target = 'https://duckduckgo.com/html/?q=' + encodeURIComponent(query);
  const res = await fetch('https://r.jina.ai/' + target, { headers:{ 'Accept':'text/plain' } });
  if (!res.ok) throw new Error('search HTTP ' + res.status);
  let text = await res.text();
  text = text.replace(/\n{3,}/g, '\n\n').trim();
  return text.slice(0, 6000);
}

/* ---------------- ask the local model ---------------- */
async function askMia(userText, imageB64){
  lastGrounded = false;
  const reply = await askMiaOnce(userText, imageB64);
  const m = reply.match(/\[\[SEARCH:([^\]]*)\]\]/i);
  if (!m) return reply;
  const query = m[1].trim();
  if (!query) return reply.replace(/\[\[SEARCH:[^\]]*\]\]/ig, '').trim();
  try {
    const results = await webSearch(query);
    if (history.length && history[history.length-1].role === 'assistant') history.pop();
    const idx = history.length;
    const answer = await askMiaOnce(
      '(Web search results for "' + query + '":\n' + results +
      '\nAnswer my previous question using these results. Be brief and spoken-friendly. Do not use the search marker again.)'
    );
    history.splice(idx, 1);
    saveHistory();
    lastGrounded = true;
    return answer;
  } catch(e){
    if (history.length && history[history.length-1].role === 'assistant') history.pop();
    const idx = history.length;
    const answer = await askMiaOnce('(The web search failed — you are offline or blocked. Tell me briefly you could not check right now, and do not use the search marker again.)');
    history.splice(idx, 1);
    saveHistory();
    return answer;
  }
}

async function askMiaOnce(userText, imageB64){
  // persistent history is text-only
  history.push({ role:'user', content: userText });
  if (history.length > 40) history = history.slice(-40);
  saveHistory();

  // build the outgoing turn (attachments/vision only affect this request)
  let outHistory = history;
  const modelId = currentModelId() || '';
  const modelVision = /vision|-VL-|VL-/i.test(modelId);

  if (attachment || imageB64){
    let content;
    if (attachment && attachment.kind === 'text'){
      content = userText + '\n\n--- ' + attachment.name + ' ---\n' + attachment.text + '\n--- end of file ---';
    } else if ((imageB64 || (attachment && attachment.kind === 'image')) && modelVision){
      // vision-capable local model: send the actual image
      content = [{ type:'text', text: (imageB64 ? T().camCue + ' ' : '') + userText }];
      if (imageB64) content.push({ type:'image_url', image_url:{ url:'data:image/jpeg;base64,' + imageB64 } });
      if (attachment && attachment.kind === 'image')
        content.push({ type:'image_url', image_url:{ url:'data:' + attachment.mime + ';base64,' + attachment.dataB64 } });
    } else {
      // text-only local model can't see images / read PDFs
      let note = '';
      if (imageB64 || (attachment && attachment.kind === 'image')) note += T().noVision;
      if (attachment && (attachment.kind === 'pdf' || attachment.kind === 'image')) note += T().noRead.replace('NAME', attachment.name);
      content = userText + note;
    }
    outHistory = history.slice(0, -1).concat([{ role:'user', content }]);
  }

  // Necessary offline change: on-device models get slow/unstable with long
  // context, so send only a short recent window. Full history is still kept.
  const windowed = outHistory.slice(-8);
  const messages = [{ role:'system', content: SYSTEM_PROMPT() }, ...windowed];
  const reply = await llmChat(messages);
  if (!reply) throw new Error('Empty reply from local model');
  history.push({ role:'assistant', content: reply });
  saveHistory();
  return reply;
}

function inferExpression(text){
  const t = text.toLowerCase();
  if (/\bhaha|\blol|😄|😂|great|love|awesome|amazing/.test(t)) return 'happy';
  if (/\bwow|really\?|no way|seriously\?|what\?!/.test(t)) return 'surprised';
  if (text.includes('!')) return 'happy';
  return 'speaking';
}

/* ---------------- TTS: local (browser or Piper) ---------------- */
async function speak(text){
  setState(S.SPEAKING, T().speaking);
  const expr = inferExpression(text);
  let usedSynth = false;
  try {
    if (voiceMode === 'piper'){
      const blob = await piperTTS(text);
      await playBlob(blob, expr);
    } else {
      usedSynth = true;
      await speakBrowser(text, expr);
    }
  } catch(e){
    // realistic voice failed → fall back to built-in browser voices
    hintEl.textContent = '⚠ ' + T().voiceErr;
    usedSynth = true;
    await speakBrowser(text, expr);
  }
  if (!onCall) return;
  if (usedSynth){
    // speechSynthesis and the mic fight over Android's audio session. Fully
    // release the TTS engine ONCE and let the audio drain before we start
    // recognition — otherwise the mic stays "listening" but never returns a
    // result. (The realistic/audio voice doesn't touch speechSynthesis, so it
    // starts listening immediately, just like online Mia's ElevenLabs audio.)
    try { speechSynthesis.cancel(); } catch(e){}
    setTimeout(() => { if (onCall) startListening(); }, 400);
  } else {
    startListening();
  }
}

function playBlob(blob, expr){
  return new Promise((resolve) => {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;
    try {
      if (audioCtx){
        const src = audioCtx.createMediaElementSource(audio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        ampData = new Uint8Array(analyser.fftSize);
        src.connect(analyser); analyser.connect(audioCtx.destination);
      }
    } catch(e){ analyser = null; }
    audio.onplay = () => {
      face.setExpression(expr);
      if (expr !== 'speaking') setTimeout(() => { if (state === S.SPEAKING) face.setExpression('speaking'); }, 1100);
      startLipSyncFromAnalyser();
    };
    audio.onended = () => { URL.revokeObjectURL(url); currentAudio = null; face.setMouthLevel(0); resolve(); };
    audio.onerror  = () => { URL.revokeObjectURL(url); currentAudio = null; resolve(); };
    audio.play().catch(() => resolve());
  });
}

/* Android/iOS require a user gesture to unlock speech synthesis. After the
   model load + inference awaits, the gesture is "used up" and speak() is
   silently dropped — which looked like "voice doesn't work, only text". So we
   unlock it with a silent utterance during the call-button tap itself. */
let ttsPrimed = false;
function primeTTS(){
  if (ttsPrimed || !('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
    speechSynthesis.resume();
    ttsPrimed = true;
  } catch(e){}
}
function pickBrowserVoice(voices){
  if (!voices || !voices.length) return null;
  const norm = (l) => (l || '').toLowerCase().replace('_', '-');
  const chosen = localStorage.getItem('mia_browser_voice') || '';
  if (chosen){ const v = voices.find(x => x.name === chosen); if (v) return v; }
  const want = LANG === 'sv' ? 'sv' : 'en';
  // Only ever pick a voice that actually matches the target language, so the
  // device's default (which showed up as a Norwegian-sounding voice) is never
  // used for English or Swedish.
  const matches = voices.filter(x => norm(x.lang).startsWith(want));
  if (!matches.length) return null;   // no matching voice installed → let the engine default handle it
  return (
    (want === 'en' && matches.find(x => norm(x.lang).startsWith('en-us'))) ||
    (want === 'en' && matches.find(x => norm(x.lang).startsWith('en-gb'))) ||
    matches.find(x => x.localService && /female|google|samantha|zira|karen|serena|alva|klara|swedish/i.test(x.name)) ||
    matches.find(x => x.localService) ||
    matches.find(x => /google/i.test(x.name)) ||
    matches[0]
  );
}
function speakBrowser(text, expr){
  return new Promise((resolve) => {
    if (!('speechSynthesis' in window) || !text){ return resolve(); }

    const go = (voices) => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = LANG === 'sv' ? 'sv-SE' : 'en-US';
      const v = pickBrowserVoice(voices || []); if (v) u.voice = v;
      u.rate = 1.02; u.pitch = 1.1;
      analyser = null;
      let done = false;
      const finish = () => {
        if (done) return; done = true;
        clearTimeout(watchdog);
        face.setMouthLevel(0); resolve();
      };
      // Android sometimes never fires onend — a watchdog guarantees the turn
      // never hangs. (No periodic resume(): reactivating the speech engine
      // grabs audio focus and was killing the microphone mid-call.)
      const ms = Math.min(45000, 2000 + text.length * 90);
      const watchdog = setTimeout(finish, ms);
      u.onstart = () => { face.setExpression('speaking'); startLipSyncFromAnalyser(); };
      u.onend = finish;
      u.onerror = finish;
      try { speechSynthesis.cancel(); } catch(e){}
      try { speechSynthesis.speak(u); } catch(e){ finish(); }
    };

    const have = speechSynthesis.getVoices();
    if (have && have.length){ go(have); return; }
    // voices not ready yet — wait briefly for them, then speak regardless
    let started = false;
    const t = setTimeout(() => { if (!started){ started = true; go(speechSynthesis.getVoices()); } }, 900);
    const onVoices = () => {
      if (!started){ started = true; clearTimeout(t); go(speechSynthesis.getVoices()); }
      speechSynthesis.removeEventListener('voiceschanged', onVoices);
    };
    speechSynthesis.addEventListener('voiceschanged', onVoices);
  });
}

/* ---------------- text chat ---------------- */
const chatEl    = document.getElementById('chat');
const chatMsgs  = document.getElementById('chatMsgs');
const chatInput = document.getElementById('chatInput');
let chatOpen = false;
let chatBusy = false;

function scrollChat(){ chatMsgs.scrollTop = chatMsgs.scrollHeight; }
function addBubble(role, text){
  const b = document.createElement('div');
  b.className = 'bub ' + role;
  b.textContent = text;
  chatMsgs.appendChild(b);
  scrollChat();
  return b;
}
function chatCardHolder(){
  const w = document.createElement('div');
  w.className = 'bubcards';
  chatMsgs.appendChild(w);
  return w;
}
function addSavedCard(entry){
  const holder = document.createElement('div');
  holder.className = 'bubcards' + (entry.t === 'att' ? ' user' : '');
  const card = document.createElement('div');
  card.className = 'fcard';
  card.innerHTML =
    (entry.kind === 'image' ? `<img alt="">` : '') +
    `<div><div class="fname"></div>` + (entry.t === 'att' ? `<div class="fsub">📎</div>` : '') + `</div>
     <a class="dl" href="#" download>⬇</a>`;
  card.querySelector('.fname').textContent = entry.name;
  if (entry.kind === 'image'){
    const img = card.querySelector('img');
    idb.get(entry.blobId).then(b => {
      if (b){ img.src = URL.createObjectURL(b); img.onload = scrollChat; }
      else img.remove();
    });
  }
  card.querySelector('a.dl').addEventListener('click', async (ev) => {
    ev.preventDefault();
    const b = await idb.get(entry.blobId);
    if (!b) return;
    const url = URL.createObjectURL(b);
    const tmp = document.createElement('a');
    tmp.href = url; tmp.download = entry.name; tmp.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  });
  holder.appendChild(card);
  chatMsgs.appendChild(holder);
}

function toggleChat(){
  if (onCall) return;
  chatOpen = !chatOpen;
  chatEl.classList.toggle('hidden', !chatOpen);
  document.body.classList.toggle('chatmode', chatOpen);
  if (chatOpen){
    chatMsgs.innerHTML = '';
    for (const e of convLog.slice(-100)){
      if (e.t === 'msg'){
        addBubble(e.role === 'user' ? 'user' : 'mia', e.text);
        if (e.searched){
          const badge = document.createElement('div');
          badge.className = 'bub mia typing';
          badge.textContent = '🔎 web';
          chatMsgs.appendChild(badge);
        }
      }
      else addSavedCard(e);
    }
    chatInput.focus();
    scrollChat();
  } else {
    attachment = null;
    clearAttachmentCard();
  }
}
document.getElementById('chatBtn').addEventListener('click', toggleChat);
document.getElementById('chatAttachBtn').addEventListener('click', () => fileInput.click());

async function sendChat(){
  const text = chatInput.value.trim();
  if (!text || chatBusy) return;
  if (!currentModelId()){ showSetup(); return; }
  chatInput.value = '';
  chatBusy = true;
  if (attachment && attachment.file){
    const holder = document.createElement('div');
    holder.className = 'bubcards user';
    const url = URL.createObjectURL(attachment.file);
    const card = document.createElement('div');
    card.className = 'fcard';
    card.innerHTML =
      (attachment.kind === 'image' ? `<img src="${url}" alt="">` : '') +
      `<div><div class="fname"></div><div class="fsub">📎</div></div>
       <a class="dl" download>⬇</a>`;
    card.querySelector('.fname').textContent = attachment.name;
    const a = card.querySelector('a.dl');
    a.href = url; a.download = attachment.name;
    holder.appendChild(card);
    chatMsgs.appendChild(holder);
  }
  addBubble('user', text);
  logMsg('user', text);
  const typing = addBubble('mia typing', '…');
  try {
    const reply = await askMia(text, null);
    typing.remove();
    const holder = chatCardHolder();
    const spoken = processReply(reply, holder);
    if (!holder.children.length) holder.remove();
    if (history.length && history[history.length-1].role === 'assistant')
      history[history.length-1] = { role:'assistant', content: spoken };
    saveHistory();
    addBubble('mia', spoken);
    if (lastGrounded){
      const badge = document.createElement('div');
      badge.className = 'bub mia typing';
      badge.textContent = '🔎 web';
      chatMsgs.appendChild(badge);
      scrollChat();
    }
    logMsg('model', spoken, lastGrounded);
    attachment = null; clearAttachmentCard();
  } catch(e){
    typing.remove();
    if (e.noModel){ chatBusy = false; showSetup(); return; }
    if (history.length && history[history.length-1].role === 'user') history.pop();
    saveHistory();
    addBubble('mia', '⚠ ' + (e.message || 'Error'));
  }
  chatBusy = false;
}
document.getElementById('chatSend').addEventListener('click', sendChat);
chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });

/* ---------------- conversation flow ---------------- */
async function handleUserSpeech(text){
  stopListening();
  setState(S.THINKING, T().thinking);
  const frame = camStream ? captureFrame() : null;
  logMsg('user', text);
  try {
    const reply = await askMia(text, frame);
    if (!onCall) return;
    const spoken = processReply(reply);
    if (history.length && history[history.length-1].role === 'assistant')
      history[history.length-1] = { role:'assistant', content: spoken };
    saveHistory();
    logMsg('model', spoken, lastGrounded);
    await speak(spoken);
  } catch(e){
    if (!onCall) return;
    if (e.noModel){ endCall(); showSetup(); return; }
    if (history.length && history[history.length-1].role === 'user') history.pop();
    saveHistory();
    hintEl.textContent = '⚠ ' + (e.message || 'Unknown error');
    await speakBrowser(T().glitch, 'speaking');
    if (onCall){ try { speechSynthesis.cancel(); } catch(e2){} setTimeout(() => { if (onCall) startListening(); }, 400); }
  }
}

/* ---------------- call control ---------------- */
async function startCall(){
  if (!SR){ hintEl.textContent = T().noSR; return; }
  if (!currentModelId()){ showSetup(); return; }
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
  } catch(e){ audioCtx = null; }
  onCall = true;
  if (chatOpen) toggleChat();
  document.body.classList.add('oncall');
  callBtn.setAttribute('aria-label','End call');
  hintEl.textContent = T().hintOn;
  stopListening();
  setState(S.THINKING, T().connecting);
  try {
    await ensureModelReady();
  } catch(e){
    hintEl.textContent = '⚠ ' + (e.message || 'Model not ready');
    endCall(); showSetup(); return;
  }
  // Necessary offline change: a tiny local model can't improvise a greeting
  // from the meta-cue — it just echoes it ("Samtalet kopplades precis…"). Use a
  // clean fixed greeting instead: instant and correct in both languages.
  const greeting = T().fallbackGreet;
  logMsg('model', greeting);
  if (onCall) await speak(greeting);   // speak() starts listening with the correct handoff
}

function endCall(msg){
  onCall = false;
  stopListening();
  stopCamera();
  attachment = null;
  attachArea.innerHTML = '';
  refreshAttachBtnVisibility();
  if (currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.body.classList.remove('oncall');
  callBtn.setAttribute('aria-label','Start call');
  setState(S.OFF, msg || T().ended);
  hintEl.textContent = T().hintIdle;
  setTimeout(() => { if (!onCall) statusEl.textContent = ' '; }, 2500);
}

callBtn.addEventListener('click', () => { primeTTS(); onCall ? endCall() : startCall(); });
applyLang();
// Phones block mic access on file:// — tell the user how to get voice working.
if (location.protocol === 'file:') setTimeout(() => { if (!onCall) hintEl.textContent = T().fileWarn; }, 60);
</script>
