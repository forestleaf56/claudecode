/* ---------------- speech recognition (browser) ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/* ONLINE  : browser Web Speech API — fast, but Android streams audio to
             Google, so it does NOT work offline.
   OFFLINE : on-device Whisper (transformers.js) with a simple voice-activity
             detector. Fully local once the recognizer is downloaded (and it is
             cached by transformers.js just like the AI model). */
function sttMode(){ return localStorage.getItem('mia_stt_mode') || 'auto'; }
function whisperReady(){ return !!transcriber || localStorage.getItem('mia_whisper_ready') === '1'; }
function useOfflineSTT(){
  const m = sttMode();
  if (m === 'offline') return true;
  if (m === 'online') return false;
  return !navigator.onLine;               // auto
}

function startListening(){
  if (!onCall) return;
  if (useOfflineSTT()){
    if (whisperReady() || !SR){ startWhisperListening(); return; }
    if (!navigator.onLine){ setState(S.LISTENING, T().listening); hintEl.textContent = T().sttNeedDl; return; }
  }
  startWebSpeechListening();
}
function stopListening(){
  stopWebSpeech();
  stopWhisperCapture();
}

/* ---- online: Web Speech API (unchanged from the working version) ---- */
function startWebSpeechListening(){
  if (!onCall) return;
  if (!SR){ startWhisperListening(); return; }
  setState(S.LISTENING, T().listening);
  try { recog && recog.abort(); } catch(e){}
  recog = new SR();
  recog.lang = LANG === 'sv' ? 'sv-SE' : 'en-US';
  recog.continuous = true;
  recog.interimResults = false;
  recog.maxAlternatives = 1;

  let got = false;
  recog.onresult = (ev) => {
    if (got || state !== S.LISTENING) return;
    const last = ev.results[ev.results.length - 1];
    if (!last.isFinal) return;
    const text = last[0].transcript.trim();
    if (!text) return;
    got = true;
    handleUserSpeech(text);
  };
  recog.onerror = (ev) => {
    if (!onCall) return;
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed'){ endCall(T().micBlocked); return; }
    if (ev.error === 'network' && sttMode() === 'auto' && whisperReady()){ startWhisperListening(); return; }
    if (state === S.LISTENING) setTimeout(() => { if (onCall && state === S.LISTENING) startWebSpeechListening(); }, 400);
  };
  recog.onend = () => {
    if (onCall && !got && state === S.LISTENING){
      setTimeout(() => { if (onCall && state === S.LISTENING) startWebSpeechListening(); }, 300);
    }
  };
  try { recog.start(); } catch(e){ /* already started */ }
}
function stopWebSpeech(){
  if (recog){ try{ recog.onend = null; recog.abort(); }catch(e){} recog = null; }
}

/* ---- offline: on-device Whisper via transformers.js ---- */
const WHISPER_MODEL = 'Xenova/whisper-tiny';   // multilingual, cached in the browser like the AI model
async function loadWhisper(onProgress){
  if (transcriber) return transcriber;
  if (whisperLoadPromise) return whisperLoadPromise;
  whisperLoadPromise = (async () => {
    if (!whisperMod) whisperMod = await import('https://esm.run/@huggingface/transformers');
    // fp32 avoids the q8 quantized graph, whose MatMulNBits/DequantizeLinear
    // nodes onnxruntime-web can't build ("Missing required scale …"). Slightly
    // larger download, but the session actually creates and runs.
    const pipe = await whisperMod.pipeline('automatic-speech-recognition', WHISPER_MODEL, {
      dtype: 'fp32', progress_callback: onProgress
    });
    transcriber = pipe;
    localStorage.setItem('mia_whisper_ready', '1');
    return transcriber;
  })();
  try { return await whisperLoadPromise; }
  catch(e){ whisperLoadPromise = null; throw e; }
}
async function whisperTranscribe(float32_16k){
  const t = await loadWhisper();
  const out = await t(float32_16k, { language: LANG === 'sv' ? 'sv' : 'en', task: 'transcribe' });
  return ((out && out.text) || '').replace(/\s+/g, ' ').trim();
}
/* Free the recognizer's memory (its ONNX sessions) after each transcription.
   Otherwise the LLM (WebGPU) + Whisper + the realistic voice are all resident
   at once, which exhausts phone RAM and the OS kills apps (the "webserver
   crash / localhost unreachable" right before Mia answers). It reloads from the
   browser cache before the next turn — a bit slower, but it doesn't crash. */
async function disposeWhisper(){
  const t = transcriber;
  transcriber = null; whisperLoadPromise = null;
  try { if (t && t.dispose) await t.dispose(); } catch(e){}
}

/* mic voice-activity capture: collect audio while the user talks, and when they
   go quiet, transcribe the utterance with Whisper. */
let vadStream = null, vadCtx = null, vadSrc = null, vadProc = null;
let vadSamples = [], vadHadSpeech = false, vadSilence = 0, vadRunning = false;
async function startWhisperListening(){
  if (!onCall) return;
  setState(S.LISTENING, T().listening);
  if (vadRunning) return;
  vadRunning = true;
  try {
    if (!vadStream) vadStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (!vadCtx) vadCtx = new (window.AudioContext || window.webkitAudioContext)();
    await vadCtx.resume();
    vadSrc = vadCtx.createMediaStreamSource(vadStream);
    vadProc = vadCtx.createScriptProcessor(4096, 1, 1);
    vadSamples = []; vadHadSpeech = false; vadSilence = 0;
    vadProc.onaudioprocess = (e) => {
      if (!onCall || state !== S.LISTENING || !vadRunning) return;
      const input = e.inputBuffer.getChannelData(0);
      let sum = 0; for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
      const rms = Math.sqrt(sum / input.length);
      const dt = input.length / vadCtx.sampleRate;
      if (rms > 0.014){                       // speaking
        vadHadSpeech = true; vadSilence = 0;
        for (let i = 0; i < input.length; i++) vadSamples.push(input[i]);
      } else if (vadHadSpeech){                // trailing silence
        vadSilence += dt;
        for (let i = 0; i < input.length; i++) vadSamples.push(input[i]);
        if (vadSilence > 0.9 && vadSamples.length > vadCtx.sampleRate * 0.35){
          const captured = vadSamples; const rate = vadCtx.sampleRate;
          vadSamples = []; vadHadSpeech = false; vadSilence = 0;
          finalizeWhisper(captured, rate);
        }
      } else {
        if (vadSamples.length > vadCtx.sampleRate * 2) vadSamples = [];   // cap idle buffer
      }
    };
    vadSrc.connect(vadProc);
    vadProc.connect(vadCtx.destination);       // needed for onaudioprocess to fire (outputs silence)
  } catch(e){
    vadRunning = false;
    if (e && e.name === 'NotAllowedError'){ endCall(T().micBlocked); return; }
    hintEl.textContent = '⚠ ' + (e && e.message ? e.message : 'mic error');
  }
}
function stopWhisperCapture(){
  vadRunning = false;
  try { if (vadProc){ vadProc.onaudioprocess = null; vadProc.disconnect(); vadProc = null; } } catch(e){}
  try { if (vadSrc){ vadSrc.disconnect(); vadSrc = null; } } catch(e){}
  // Fully release the mic + its audio context so it can't fight TTS playback
  // (mic held open was a likely reason the offline answer wasn't heard). They
  // are recreated on the next listen.
  try { if (vadStream){ vadStream.getTracks().forEach(t => t.stop()); vadStream = null; } } catch(e){}
  try { if (vadCtx){ vadCtx.close(); vadCtx = null; } } catch(e){}
}
async function finalizeWhisper(samples, rate){
  stopWhisperCapture();
  setState(S.THINKING, T().thinking);
  let text = '';
  try {
    text = await whisperTranscribe(resampleTo16k(samples, rate));
  } catch(e){
    if (!onCall) return;
    hintEl.textContent = '⚠ ' + T().sttErr + (e && e.message ? e.message : e);
    startWhisperListening();
    return;
  }
  if (!onCall) return;
  // whisper emits things like "[BLANK_AUDIO]" / "(silence)" for non-speech
  const clean = text.replace(/\[[^\]]*\]|\([^)]*\)/g, '').trim();
  if (!clean){ startWhisperListening(); return; }   // nothing said → keep listening
  // Free the recognizer before the LLM + voice run, so the phone isn't holding
  // all three models at once (that OOM-crashed the device).
  await disposeWhisper();
  handleUserSpeech(clean);
}
function resampleTo16k(samples, rate){
  const src = samples instanceof Float32Array ? samples : Float32Array.from(samples);
  if (rate === 16000) return src;
  const ratio = rate / 16000;
  const outLen = Math.floor(src.length / ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) out[i] = src[Math.floor(i * ratio)] || 0;
  return out;
}

/* ---------------- keyless web search (online only) ---------------- */
let lastGrounded = false;
async function webSearch(query){
  const target = 'https://duckduckgo.com/html/?q=' + encodeURIComponent(query);
  const res = await fetch('https://r.jina.ai/' + target, { headers:{ 'Accept':'text/plain' } });
  if (!res.ok) throw new Error('search HTTP ' + res.status);
  let text = await res.text();
  text = text.replace(/\n{3,}/g, '\n\n').trim();
  return text.slice(0, 6000);
}

/* ---------------- ask the local model ---------------- */
async function askMia(userText, imageB64){
  lastGrounded = false;
  const reply = await askMiaOnce(userText, imageB64);
  const m = reply.match(/\[\[SEARCH:([^\]]*)\]\]/i);
  if (!m) return reply;
  const query = m[1].trim();
  if (!query) return reply.replace(/\[\[SEARCH:[^\]]*\]\]/ig, '').trim();
  try {
    const results = await webSearch(query);
    if (history.length && history[history.length-1].role === 'assistant') history.pop();
    const idx = history.length;
    const answer = await askMiaOnce(
      '(Web search results for "' + query + '":\n' + results +
      '\nAnswer my previous question using these results. Be brief and spoken-friendly. Do not use the search marker again.)'
    );
    history.splice(idx, 1);
    saveHistory();
    lastGrounded = true;
    return answer;
  } catch(e){
    if (history.length && history[history.length-1].role === 'assistant') history.pop();
    const idx = history.length;
    const answer = await askMiaOnce('(The web search failed — you are offline or blocked. Tell me briefly you could not check right now, and do not use the search marker again.)');
    history.splice(idx, 1);
    saveHistory();
    return answer;
  }
}

async function askMiaOnce(userText, imageB64){
  // persistent history is text-only
  history.push({ role:'user', content: userText });
  if (history.length > 40) history = history.slice(-40);
  saveHistory();

  // build the outgoing turn (attachments/vision only affect this request)
  let outHistory = history;
  const modelId = currentModelId() || '';
  const modelVision = /vision|-VL-|VL-/i.test(modelId);

  if (attachment || imageB64){
    let content;
    if (attachment && attachment.kind === 'text'){
      content = userText + '\n\n--- ' + attachment.name + ' ---\n' + attachment.text + '\n--- end of file ---';
    } else if ((imageB64 || (attachment && attachment.kind === 'image')) && modelVision){
      // vision-capable local model: send the actual image
      content = [{ type:'text', text: (imageB64 ? T().camCue + ' ' : '') + userText }];
      if (imageB64) content.push({ type:'image_url', image_url:{ url:'data:image/jpeg;base64,' + imageB64 } });
      if (attachment && attachment.kind === 'image')
        content.push({ type:'image_url', image_url:{ url:'data:' + attachment.mime + ';base64,' + attachment.dataB64 } });
    } else {
      // text-only local model can't see images / read PDFs
      let note = '';
      if (imageB64 || (attachment && attachment.kind === 'image')) note += T().noVision;
      if (attachment && (attachment.kind === 'pdf' || attachment.kind === 'image')) note += T().noRead.replace('NAME', attachment.name);
      content = userText + note;
    }
    outHistory = history.slice(0, -1).concat([{ role:'user', content }]);
  }

  // Send only a short recent window — less prompt to prefill each turn = faster
  // on mobile WebGPU. Full history is still kept for the log/memory.
  const windowed = outHistory.slice(-4);
  const messages = [{ role:'system', content: SYSTEM_PROMPT() }, ...windowed];
  const reply = await llmChat(messages);
  if (!reply) throw new Error('Empty reply from local model');
  history.push({ role:'assistant', content: reply });
  saveHistory();
  return reply;
}

function inferExpression(text){
  const t = (text || '').toLowerCase();
  if (/😂|🤣|😆|\bhaha|\bhehe|\blol|\blmao|hilarious/.test(t)) return 'laugh';
  if (/❤️|😍|🥰|😘|💕|💋|\blove you|\bmiss you|\bdarling|\bsweetheart/.test(t)) return 'love';
  if (/🎉|🥳|🚀|🔥|✨|\bawesome|\bamazing|\bincredible|\bcan'?t wait|\bwoo+\b|\byes+!/.test(t)) return 'excited';
  if (/😮|😲|😱|🤯|\bwow\b|\bwhoa\b|no way|seriously\?|really\?!|what\?!|unbelievable/.test(t)) return 'surprised';
  if (/😢|😭|😞|😔|💔|\bsorry\b|\bsad\b|\bunfortunately\b|\bmiss\b|\bshame\b/.test(t)) return 'sad';
  if (/😠|😡|🤬|\bannoying\b|\bridiculous\b|\bhow dare\b|\bstupid\b/.test(t)) return 'angry';
  if (/😉|😏|😜|\bwink|\bjust kidding|\bkidding\b|\bbetween us\b/.test(t)) return 'cheeky';
  if (/🤔|🧐|\bhmm+\b|\bi think\b|\bperhaps\b|\bmaybe\b|\bactually\b|\bconsider\b/.test(t)) return 'thoughtful';
  if (/😊|😄|😁|🙂|\bglad\b|\bhappy\b|\bgreat\b|\bnice\b|\blovely\b|\bwonderful\b/.test(t)) return 'happy';
  if (/\?\s*$/.test(t.trim()) || /\bcurious\b|\btell me\b|\bwhat about you\b/.test(t)) return 'curious';
  if (text.includes('!')) return 'warm';
  return 'speaking';
}

/* Guard against degenerate model output — e.g. "aaaaaaaaah…" or a word
   repeated hundreds of times — which TTS would otherwise drone on for a
   very long time and never stop. Collapses long runs and caps length. */
function cleanForSpeech(text){
  if (!text) return text;
  let t = String(text);
  // strip emojis / pictographs so the voice never reads them aloud
  // (the written reply keeps them for the text chat)
  try {
    t = t.replace(/\p{Extended_Pictographic}/gu, '')
         .replace(/[\u{1F3FB}-\u{1F3FF}\u{1F1E6}-\u{1F1FF}️‍⃣]/gu, '');
  } catch(e){
    t = t.replace(/[←-⇿⌀-➿⬀-⯿️‍]/g, '')
         .replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, '');   // surrogate-pair emoji fallback
  }
  t = t.replace(/\s{2,}/g, ' ');
  t = t.replace(/(\S)\1{4,}/g, '$1$1$1');                     // long single-char runs (aaaaa → aaa)
  t = t.replace(/(\S{2,8}?)\1{4,}/g, '$1$1');                 // long short-chunk runs (hahaha…)
  t = t.replace(/\b(\w{1,20})(?:\s+\1\b){2,}/gi, '$1 $1');    // a word repeated many times
  if (t.length > 600) t = t.slice(0, 600).trim();
  return t.trim();
}

/* ---------------- TTS: local (browser or Piper) ---------------- */
async function speak(text){
  const expr = inferExpression(text);   // from the original text (incl. emojis)
  text = cleanForSpeech(text);          // strip emojis + runaway for the voice
  setState(S.SPEAKING, T().speaking);
  let usedSynth = false;
  try {
    if (voiceMode === 'piper'){
      const blob = await piperTTS(text);
      await playBlob(blob, expr);
    } else {
      usedSynth = true;
      await speakBrowser(text, expr);
    }
  } catch(e){
    // realistic voice failed → fall back to built-in browser voices
    hintEl.textContent = '⚠ ' + T().voiceErr;
    usedSynth = true;
    await speakBrowser(text, expr);
  }
  if (!onCall) return;
  if (usedSynth){
    // speechSynthesis and the mic fight over Android's audio session. Fully
    // release the TTS engine ONCE and let the audio drain before we start
    // recognition — otherwise the mic stays "listening" but never returns a
    // result. (The realistic/audio voice doesn't touch speechSynthesis, so it
    // starts listening immediately, just like online Mia's ElevenLabs audio.)
    try { speechSynthesis.cancel(); } catch(e){}
    setTimeout(() => { if (onCall) startListening(); }, 400);
  } else {
    startListening();
  }
}

function playBlob(blob, expr){
  return new Promise((resolve) => {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;
    try {
      if (audioCtx){
        const src = audioCtx.createMediaElementSource(audio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        ampData = new Uint8Array(analyser.fftSize);
        src.connect(analyser); analyser.connect(audioCtx.destination);
      }
    } catch(e){ analyser = null; }
    audio.onplay = () => {
      face.setExpression(expr);
      if (expr !== 'speaking') setTimeout(() => { if (state === S.SPEAKING) face.setExpression('speaking'); }, 1100);
      startLipSyncFromAnalyser();
    };
    audio.onended = () => { URL.revokeObjectURL(url); currentAudio = null; face.setMouthLevel(0); resolve(); };
    audio.onerror  = () => { URL.revokeObjectURL(url); currentAudio = null; resolve(); };
    audio.play().catch(() => resolve());
  });
}

/* Android/iOS require a user gesture to unlock speech synthesis. After the
   model load + inference awaits, the gesture is "used up" and speak() is
   silently dropped — which looked like "voice doesn't work, only text". So we
   unlock it with a silent utterance during the call-button tap itself. */
let ttsPrimed = false;
function primeTTS(){
  if (ttsPrimed || !('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
    speechSynthesis.resume();
    ttsPrimed = true;
  } catch(e){}
}
function pickBrowserVoice(voices){
  if (!voices || !voices.length) return null;
  const norm = (l) => (l || '').toLowerCase().replace('_', '-');
  const chosen = localStorage.getItem('mia_browser_voice') || '';
  if (chosen){ const v = voices.find(x => x.name === chosen); if (v) return v; }
  const want = LANG === 'sv' ? 'sv' : 'en';
  // Only ever pick a voice that actually matches the target language, so the
  // device's default (which showed up as a Norwegian-sounding voice) is never
  // used for English or Swedish.
  const matches = voices.filter(x => norm(x.lang).startsWith(want));
  if (!matches.length) return null;   // no matching voice installed → let the engine default handle it
  return (
    (want === 'en' && matches.find(x => norm(x.lang).startsWith('en-us'))) ||
    (want === 'en' && matches.find(x => norm(x.lang).startsWith('en-gb'))) ||
    matches.find(x => x.localService && /female|google|samantha|zira|karen|serena|alva|klara|swedish/i.test(x.name)) ||
    matches.find(x => x.localService) ||
    matches.find(x => /google/i.test(x.name)) ||
    matches[0]
  );
}
function speakBrowser(text, expr){
  return new Promise((resolve) => {
    if (!('speechSynthesis' in window) || !text){ return resolve(); }

    const go = (voices) => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = LANG === 'sv' ? 'sv-SE' : 'en-US';
      const v = pickBrowserVoice(voices || []); if (v) u.voice = v;
      u.rate = 1.02; u.pitch = 1.1;
      analyser = null;
      let done = false;
      const finish = () => {
        if (done) return; done = true;
        clearTimeout(watchdog);
        face.setMouthLevel(0); resolve();
      };
      // Android sometimes never fires onend — a watchdog guarantees the turn
      // never hangs. (No periodic resume(): reactivating the speech engine
      // grabs audio focus and was killing the microphone mid-call.)
      const ms = Math.min(45000, 2000 + text.length * 90);
      const watchdog = setTimeout(finish, ms);
      u.onstart = () => { face.setExpression('speaking'); startLipSyncFromAnalyser(); };
      u.onend = finish;
      u.onerror = finish;
      try { speechSynthesis.cancel(); } catch(e){}
      try { speechSynthesis.speak(u); } catch(e){ finish(); }
    };

    const have = speechSynthesis.getVoices();
    if (have && have.length){ go(have); return; }
    // voices not ready yet — wait briefly for them, then speak regardless
    let started = false;
    const t = setTimeout(() => { if (!started){ started = true; go(speechSynthesis.getVoices()); } }, 900);
    const onVoices = () => {
      if (!started){ started = true; clearTimeout(t); go(speechSynthesis.getVoices()); }
      speechSynthesis.removeEventListener('voiceschanged', onVoices);
    };
    speechSynthesis.addEventListener('voiceschanged', onVoices);
  });
}

/* ---------------- text chat ---------------- */
const chatEl    = document.getElementById('chat');
const chatMsgs  = document.getElementById('chatMsgs');
const chatInput = document.getElementById('chatInput');
let chatOpen = false;
let chatBusy = false;

function scrollChat(){ chatMsgs.scrollTop = chatMsgs.scrollHeight; }
function addBubble(role, text){
  const b = document.createElement('div');
  b.className = 'bub ' + role;
  b.textContent = text;
  chatMsgs.appendChild(b);
  scrollChat();
  return b;
}
function chatCardHolder(){
  const w = document.createElement('div');
  w.className = 'bubcards';
  chatMsgs.appendChild(w);
  return w;
}
function addSavedCard(entry){
  const holder = document.createElement('div');
  holder.className = 'bubcards' + (entry.t === 'att' ? ' user' : '');
  const card = document.createElement('div');
  card.className = 'fcard';
  card.innerHTML =
    (entry.kind === 'image' ? `<img alt="">` : '') +
    `<div><div class="fname"></div>` + (entry.t === 'att' ? `<div class="fsub">📎</div>` : '') + `</div>
     <a class="dl" href="#" download>⬇</a>`;
  card.querySelector('.fname').textContent = entry.name;
  if (entry.kind === 'image'){
    const img = card.querySelector('img');
    idb.get(entry.blobId).then(b => {
      if (b){ img.src = URL.createObjectURL(b); img.onload = scrollChat; }
      else img.remove();
    });
  }
  card.querySelector('a.dl').addEventListener('click', async (ev) => {
    ev.preventDefault();
    const b = await idb.get(entry.blobId);
    if (!b) return;
    const url = URL.createObjectURL(b);
    const tmp = document.createElement('a');
    tmp.href = url; tmp.download = entry.name; tmp.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  });
  holder.appendChild(card);
  chatMsgs.appendChild(holder);
}

function rebuildChat(){
  chatMsgs.innerHTML = '';
  for (const e of convLog.slice(-100)){
    if (e.t === 'msg'){
      addBubble(e.role === 'user' ? 'user' : 'mia', e.text);
      if (e.searched){
        const badge = document.createElement('div');
        badge.className = 'bub mia typing';
        badge.textContent = '🔎 web';
        chatMsgs.appendChild(badge);
      }
    }
    else addSavedCard(e);
  }
  scrollChat();
}

function toggleChat(){
  if (onCall) return;
  chatOpen = !chatOpen;
  chatEl.classList.toggle('hidden', !chatOpen);
  document.body.classList.toggle('chatmode', chatOpen);
  if (chatOpen){
    rebuildChat();
    chatInput.focus();
    scrollChat();
  } else {
    attachment = null;
    clearAttachmentCard();
  }
}
document.getElementById('chatBtn').addEventListener('click', toggleChat);
document.getElementById('chatAttachBtn').addEventListener('click', () => fileInput.click());

async function sendChat(){
  const text = chatInput.value.trim();
  if (!text || chatBusy) return;
  if (!currentModelId()){ showSetup(); return; }
  chatInput.value = '';
  chatBusy = true;
  if (attachment && attachment.file){
    const holder = document.createElement('div');
    holder.className = 'bubcards user';
    const url = URL.createObjectURL(attachment.file);
    const card = document.createElement('div');
    card.className = 'fcard';
    card.innerHTML =
      (attachment.kind === 'image' ? `<img src="${url}" alt="">` : '') +
      `<div><div class="fname"></div><div class="fsub">📎</div></div>
       <a class="dl" download>⬇</a>`;
    card.querySelector('.fname').textContent = attachment.name;
    const a = card.querySelector('a.dl');
    a.href = url; a.download = attachment.name;
    holder.appendChild(card);
    chatMsgs.appendChild(holder);
  }
  addBubble('user', text);
  logMsg('user', text);
  const typing = addBubble('mia typing', '…');
  try {
    const reply = await askMia(text, null);
    typing.remove();
    const holder = chatCardHolder();
    const spoken = processReply(reply, holder);
    if (!holder.children.length) holder.remove();
    if (history.length && history[history.length-1].role === 'assistant')
      history[history.length-1] = { role:'assistant', content: spoken };
    saveHistory();
    addBubble('mia', spoken);
    if (lastGrounded){
      const badge = document.createElement('div');
      badge.className = 'bub mia typing';
      badge.textContent = '🔎 web';
      chatMsgs.appendChild(badge);
      scrollChat();
    }
    logMsg('model', spoken, lastGrounded);
    attachment = null; clearAttachmentCard();
  } catch(e){
    typing.remove();
    if (e.noModel){ chatBusy = false; showSetup(); return; }
    if (history.length && history[history.length-1].role === 'user') history.pop();
    saveHistory();
    addBubble('mia', '⚠ ' + (e.message || 'Error'));
  }
  chatBusy = false;
}
document.getElementById('chatSend').addEventListener('click', sendChat);
chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });

/* ---------------- conversation flow ---------------- */
async function handleUserSpeech(text){
  stopListening();
  setState(S.THINKING, T().thinking);
  const frame = camStream ? captureFrame() : null;
  logMsg('user', text);
  try {
    const reply = await askMia(text, frame);
    if (!onCall) return;
    const spoken = processReply(reply);
    if (history.length && history[history.length-1].role === 'assistant')
      history[history.length-1] = { role:'assistant', content: spoken };
    saveHistory();
    logMsg('model', spoken, lastGrounded);
    await speak(spoken);
  } catch(e){
    if (!onCall) return;
    if (e.noModel){ endCall(); showSetup(); return; }
    if (history.length && history[history.length-1].role === 'user') history.pop();
    saveHistory();
    hintEl.textContent = '⚠ ' + (e.message || 'Unknown error');
    await speakBrowser(T().glitch, 'speaking');
    if (onCall){ try { speechSynthesis.cancel(); } catch(e2){} setTimeout(() => { if (onCall) startListening(); }, 400); }
  }
}

/* ---------------- call control ---------------- */
async function startCall(){
  if (!SR){ hintEl.textContent = T().noSR; return; }
  if (!currentModelId()){ showSetup(); return; }
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
  } catch(e){ audioCtx = null; }
  onCall = true;
  if (chatOpen) toggleChat();
  document.body.classList.add('oncall');
  callBtn.setAttribute('aria-label','End call');
  hintEl.textContent = T().hintOn;
  stopListening();
  setState(S.THINKING, T().connecting);
  try {
    await ensureModelReady();
  } catch(e){
    hintEl.textContent = '⚠ ' + (e.message || 'Model not ready');
    endCall(); showSetup(); return;
  }
  // Necessary offline change: a tiny local model can't improvise a greeting
  // from the meta-cue — it just echoes it ("Samtalet kopplades precis…"). Use a
  // clean fixed greeting instead: instant and correct in both languages.
  const greeting = T().fallbackGreet;
  logMsg('model', greeting);
  if (onCall) await speak(greeting);   // speak() starts listening with the correct handoff
}

function endCall(msg){
  onCall = false;
  stopListening();
  try { if (vadStream){ vadStream.getTracks().forEach(t => t.stop()); vadStream = null; } } catch(e){}
  stopCamera();
  attachment = null;
  attachArea.innerHTML = '';
  refreshAttachBtnVisibility();
  if (currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.body.classList.remove('oncall');
  callBtn.setAttribute('aria-label','Start call');
  setState(S.OFF, msg || T().ended);
  hintEl.textContent = T().hintIdle;
  setTimeout(() => { if (!onCall) statusEl.textContent = ' '; }, 2500);
}

callBtn.addEventListener('click', () => { primeTTS(); onCall ? endCall() : startCall(); });
applyPersona();
// Phones block mic access on file:// — tell the user how to get voice working.
if (location.protocol === 'file:') setTimeout(() => { if (!onCall) hintEl.textContent = T().fileWarn; }, 60);

/* First run → open setup so the user downloads a model. Done LAST, so every
   variable showSetup touches is already initialized (no temporal dead zone). */
if (!currentModelId()) showSetup();
</script>
