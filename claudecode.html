<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mia — Local Voice Call</title>
<style>
  :root{
    /* LOCAL MIA — violet / mint on-device theme */
    --bg0:#0c0a18; --bg1:#191436;
    --plate:#1e1a3a; --plate-edge:#352c5f;
    --glow:#a78bfa;                 /* primary accent (violet) */
    --mint:#7cf5c0;                 /* "offline / local" accent */
    --ink:#d8d2f2; --ink-dim:#8a83ad;
    --call:#34d07c; --end:#f0564f;
    --field:var(--field); --userbub:var(--userbub);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 0%, var(--bg1), var(--bg0) 70%);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    min-height:100dvh;overflow:hidden;user-select:none;
    padding:max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
  }
  header{text-align:center;position:relative;width:100%}
  header h1{font-size:20px;font-weight:600;letter-spacing:.06em}
  header .sub{font-size:12px;color:var(--ink-dim);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
  header .badge{
    display:inline-flex;align-items:center;gap:5px;margin-top:8px;
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
    color:var(--mint);border:1px solid rgba(124,245,192,.35);
    background:rgba(124,245,192,.08);border-radius:999px;padding:3px 10px;
  }
  header .badge b{color:var(--mint)}
  #gear{
    position:absolute;right:0;top:0;background:none;border:none;cursor:pointer;
    color:var(--ink-dim);font-size:22px;padding:6px;line-height:1;
  }
  #gear:hover{color:var(--ink)}
  #chatBtn{
    position:absolute;left:0;top:0;background:none;border:none;cursor:pointer;
    color:var(--ink-dim);font-size:20px;padding:6px;line-height:1;
  }
  #chatBtn:hover{color:var(--ink)}
  body.oncall #chatBtn{display:none}

  /* ---- text chat panel ---- */
  #chat{
    position:fixed;left:0;right:0;top:64px;bottom:0;z-index:6;
    background:linear-gradient(180deg, rgba(12,10,24,.97), rgba(12,10,24,.99));
    display:flex;flex-direction:column;
    padding:10px 12px max(12px, env(safe-area-inset-bottom));
  }
  #chat.hidden{display:none}
  #chatMsgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px}
  .bub{max-width:82%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .bub.user{align-self:flex-end;background:var(--userbub);color:#ece7ff;border-bottom-right-radius:5px}
  .bub.mia{align-self:flex-start;background:var(--plate);border:1px solid var(--plate-edge);border-bottom-left-radius:5px}
  .bub.typing{color:var(--ink-dim);font-style:italic}
  .bubcards{align-self:flex-start;display:flex;gap:8px;flex-wrap:wrap}
  .bubcards.user{align-self:flex-end}
  #chatAttach{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
  #chatRow{display:flex;gap:8px;align-items:center}
  #chatRow button{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--plate-edge);
    background:var(--plate);cursor:pointer;display:flex;align-items:center;justify-content:center;
    flex:none;color:var(--glow);font-size:17px;
  }
  #chatRow button svg{width:20px;height:20px;fill:var(--ink-dim)}
  #chatInput{
    flex:1;padding:12px 14px;border-radius:22px;border:1px solid var(--plate-edge);
    background:var(--field);color:var(--ink);font-size:15px;outline:none;min-width:0;
  }
  #chatInput:focus{border-color:var(--glow)}
  body.chatmode #btnRow, body.chatmode #attachArea, body.chatmode #hint, body.chatmode #status{display:none}

  /* ---- settings ---- */
  #logBox{
    max-height:200px;overflow-y:auto;background:var(--field);border:1px solid var(--plate-edge);
    border-radius:12px;padding:10px;font-size:12px;line-height:1.5;margin-top:6px;
  }
  #logBox .lrole{color:var(--glow);font-weight:700}
  #logBox .litem{margin-bottom:8px;word-break:break-word}
  #logBox .ltime{color:var(--ink-dim);font-size:10px}
  #logBox a{color:var(--mint);text-decoration:none;font-weight:700}
  #logBox img{max-width:64px;max-height:64px;border-radius:8px;vertical-align:middle;margin-right:6px}
  #clearLog{
    margin-top:10px;width:100%;padding:10px;border:1px solid var(--plate-edge);border-radius:12px;
    background:transparent;color:#f0968f;font-size:13px;cursor:pointer;
  }

  #faceWrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-height:60vh}
  #face{
    width:min(78vw,52vh,420px);height:min(78vw,52vh,420px);
    filter:drop-shadow(0 18px 50px rgba(0,0,0,.55));
  }
  #halo{
    position:absolute;width:min(88vw,60vh,480px);height:min(88vw,60vh,480px);
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(167,139,250,.12) 0%, rgba(167,139,250,0) 62%);
    transition:opacity .6s;opacity:.55;
  }
  body.oncall #halo{opacity:1}

  #status{
    min-height:22px;font-size:14px;color:var(--ink-dim);letter-spacing:.08em;
    text-transform:uppercase;margin-bottom:22px;transition:color .3s;text-align:center;
    max-width:92vw;
  }
  body.state-listening #status{color:var(--glow)}
  body.state-speaking  #status{color:var(--mint)}

  #callBtn{
    width:84px;height:84px;border-radius:50%;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:var(--call);
    box-shadow:0 0 0 0 rgba(52,208,124,.45), 0 10px 26px rgba(0,0,0,.45);
    transition:background .25s, transform .12s;
    animation:pulse 2.4s infinite;
  }
  #callBtn:active{transform:scale(.93)}
  #callBtn svg{width:38px;height:38px;fill:#06281a;transition:transform .3s, fill .25s}
  body.oncall #callBtn{background:var(--end);animation:none}
  body.oncall #callBtn svg{transform:rotate(135deg);fill:#3d0d0b}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(52,208,124,.45),0 10px 26px rgba(0,0,0,.45)}
    70%{box-shadow:0 0 0 26px rgba(52,208,124,0),0 10px 26px rgba(0,0,0,.45)}
    100%{box-shadow:0 0 0 0 rgba(52,208,124,0),0 10px 26px rgba(0,0,0,.45)}
  }
  @media (prefers-reduced-motion: reduce){ #callBtn{animation:none} }
  #hint{font-size:12px;color:var(--ink-dim);margin-top:14px;text-align:center;max-width:300px;line-height:1.5}

  /* ---- button row, camera & attach ---- */
  #btnRow{display:flex;align-items:center;justify-content:center;gap:26px;width:100%}
  #camBtn, #attachBtn{
    width:56px;height:56px;border-radius:50%;border:1px solid var(--plate-edge);
    background:var(--plate);cursor:pointer;display:none;
    align-items:center;justify-content:center;transition:background .25s,border-color .25s;
  }
  body.oncall #camBtn, body.oncall #attachBtn{display:flex}
  #camBtn svg, #attachBtn svg{width:26px;height:26px;fill:var(--ink-dim);transition:fill .25s}
  body.camon #camBtn{background:#2a1f52;border-color:var(--glow)}
  body.camon #camBtn svg{fill:var(--glow)}
  #attachBtn:active{transform:scale(.93)}

  /* ---- attachment & generated-result cards ---- */
  #attachArea{
    display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;
    min-height:0;margin-bottom:10px;max-width:92vw;
  }
  .fcard{
    display:flex;align-items:center;gap:10px;
    background:var(--plate);border:1px solid var(--plate-edge);border-radius:14px;
    padding:8px 12px;max-width:86vw;animation:cardin .25s ease;
  }
  @keyframes cardin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .fcard img{width:52px;height:52px;object-fit:cover;border-radius:9px}
  .fcard .fname{font-size:13px;color:var(--ink);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fcard .fsub{font-size:11px;color:var(--ink-dim)}
  .fcard a.dl, .fcard button.rm{
    border:none;border-radius:10px;cursor:pointer;font-size:13px;padding:8px 12px;
    text-decoration:none;font-weight:700;
  }
  .fcard a.dl{background:var(--call);color:#06281a}
  .fcard button.rm{background:transparent;color:var(--ink-dim);font-size:16px;padding:6px}
  .fcard .spin{
    width:20px;height:20px;border:3px solid var(--plate-edge);border-top-color:var(--glow);
    border-radius:50%;animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #camPreview{
    position:fixed;right:14px;bottom:max(14px, env(safe-area-inset-bottom));
    width:108px;height:144px;border-radius:14px;overflow:hidden;display:none;
    border:2px solid rgba(167,139,250,.5);box-shadow:0 8px 22px rgba(0,0,0,.5);z-index:5;
  }
  body.camon #camPreview{display:block}
  #camVideo{width:100%;height:100%;object-fit:cover}
  #camFlip{
    position:absolute;right:4px;bottom:4px;width:30px;height:30px;border-radius:50%;
    border:none;background:rgba(10,16,32,.7);color:var(--glow);font-size:16px;cursor:pointer;
  }

  /* ---- settings overlay ---- */
  #setup{
    position:fixed;inset:0;background:rgba(8,7,20,.93);backdrop-filter:blur(6px);
    display:flex;align-items:flex-start;justify-content:center;padding:20px;z-index:10;
    overflow-y:auto;
  }
  #setup.hidden{display:none}
  .card{
    background:var(--plate);border:1px solid var(--plate-edge);border-radius:20px;
    padding:26px 22px;max-width:400px;width:100%;margin:auto 0 20px;
  }
  .card h2{font-size:18px;margin-bottom:6px}
  .card p{font-size:13px;color:var(--ink-dim);line-height:1.55;margin-bottom:6px}
  .card p a{color:var(--glow);text-decoration:none}
  .card label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin:16px 0 6px}
  .card input, .card select{
    width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--plate-edge);
    background:var(--field);color:var(--ink);font-size:14px;outline:none;
  }
  .card input:focus, .card select:focus{border-color:var(--glow)}
  .meta{font-size:12px;color:var(--ink-dim);margin-top:6px;line-height:1.5}
  .meta.ok{color:var(--mint)}
  .meta.warn{color:#f0c36f}
  .meta.err{color:#f0968f}
  .btn2{
    margin-top:10px;width:100%;padding:12px;border:1px solid var(--glow);border-radius:12px;cursor:pointer;
    background:rgba(167,139,250,.12);color:var(--glow);font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn2:disabled{opacity:.5;cursor:default}
  #progWrap, #voiceProgWrap, #sttProgWrap{height:8px;border-radius:6px;background:var(--field);border:1px solid var(--plate-edge);
    margin-top:10px;overflow:hidden;display:none}
  #progWrap.show, #voiceProgWrap.show, #sttProgWrap.show{display:block}
  #progBar, #voiceProg, #sttProg{height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--mint));transition:width .2s}
  #saveKeys{
    margin-top:20px;width:100%;padding:14px;border:none;border-radius:14px;cursor:pointer;
    background:var(--call);color:#06281a;font-size:15px;font-weight:700;
  }
  #setupErr{color:#f0968f;font-size:12px;margin-top:10px;min-height:16px}
  .hide{display:none !important}
</style>
</head>
<body>

<header>
  <h1>Mia</h1>
  <div class="sub">local voice call</div>
  <div class="badge">⬇ <b>On-device AI</b> · Offline</div>
  <button id="chatBtn" aria-label="Text chat">💬</button>
  <button id="gear" aria-label="Settings">⚙</button>
</header>

<div id="faceWrap">
  <div id="halo"></div>
  <canvas id="face" width="600" height="600"></canvas>
</div>

<div id="status">&nbsp;</div>
<div id="attachArea"></div>
<div id="btnRow">
  <button id="camBtn" aria-label="Toggle camera eyes">
    <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
  </button>
  <button id="callBtn" aria-label="Start call">
    <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
  </button>
  <button id="attachBtn" aria-label="Attach a file">
    <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5S13.5 3.62 13.5 5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5C7 20.54 9.46 23 12.5 23s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
  </button>
</div>
<input type="file" id="fileInput" accept="image/*,.pdf,.txt,.md,.csv,.json,.html,text/*" hidden>

<!-- text chat -->
<div id="chat" class="hidden">
  <div id="chatMsgs"></div>
  <div id="chatAttach"></div>
  <div id="chatRow">
    <button id="chatAttachBtn" aria-label="Attach a file">
      <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5S13.5 3.62 13.5 5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5C7 20.54 9.46 23 12.5 23s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
    </button>
    <input id="chatInput" autocomplete="off" placeholder="Write to Mia…">
    <button id="chatSend" aria-label="Send">➤</button>
  </div>
</div>

<div id="camPreview">
  <video id="camVideo" autoplay playsinline muted></video>
  <button id="camFlip" aria-label="Flip camera">⟲</button>
</div>
<div id="hint">Tap to call Mia. Everything runs on your device.</div>

<!-- settings / first-run model setup -->
<div id="setup" class="hidden">
  <div class="card">
    <h2 id="suTitle">Set up Mia — 100% on your device</h2>
    <p id="suDesc"></p>

    <label for="personaSel" id="suChar">Character</label>
    <select id="personaSel"></select>
    <label for="langSel" id="suLang">Language</label>
    <select id="langSel">
      <option value="en">English</option>
      <option value="sv">Svenska</option>
    </select>

    <label id="suModel">On-device AI model</label>
    <select id="modelSel"></select>
    <div id="modelMeta" class="meta"></div>
    <button id="dlModel" class="btn2">⬇ <span id="dlModelTxt">Download &amp; load model</span></button>
    <div id="progWrap"><div id="progBar"></div></div>
    <div id="modelStatus" class="meta"></div>

    <label id="suVoice">Voice</label>
    <select id="voiceMode">
      <option value="browser">Built-in browser voice (offline)</option>
      <option value="piper">Realistic offline voice (download)</option>
    </select>
    <select id="browserVoiceSel"></select>
    <div id="piperRow" class="hide">
      <select id="piperVoiceSel"></select>
      <button id="dlVoice" class="btn2">⬇ <span id="dlVoiceTxt">Download &amp; use voice</span></button>
      <div id="voiceProgWrap"><div id="voiceProg"></div></div>
      <div id="voiceStatus" class="meta"></div>
    </div>

    <label id="suStt">Voice recognition (microphone)</label>
    <select id="sttMode">
      <option value="auto">Auto — online when connected, on-device when offline</option>
      <option value="online">Online only (browser, needs internet)</option>
      <option value="offline">On-device only (works offline)</option>
    </select>
    <button id="dlStt" class="btn2">⬇ <span id="dlSttTxt">Download offline speech recognition</span></button>
    <div id="sttProgWrap"><div id="sttProg"></div></div>
    <div id="sttStatus" class="meta"></div>

    <button id="saveKeys">Done</button>
    <div id="setupErr"></div>

    <label id="suLog">Conversation log</label>
    <div id="logBox"></div>
    <button id="clearLog">Clear log &amp; memory</button>
    <div class="meta" style="text-align:center;opacity:.55;margin-top:14px">build 2026-08-19 · r5</div>
  </div>
</div>

<script type="module">
'use strict';
console.log('Mia build 2026-08-19 r5');
/* Show any uncaught script error on screen (Android has no easy console), so a
   failure that only happens when hosted is visible instead of a silent dead UI. */
window.addEventListener('error', (e) => {
  try {
    const h = document.getElementById('hint');
    if (h) h.textContent = '⚠ ' + (e.message || 'script error') + (e.lineno ? ' (line ' + e.lineno + ')' : '');
  } catch (_) {}
});
window.addEventListener('unhandledrejection', (e) => {
  try {
    const h = document.getElementById('hint');
    if (h && e.reason) h.textContent = '⚠ ' + (e.reason.message || e.reason);
  } catch (_) {}
});

/* On-device speech-recognition state. Declared at the very top so functions
   that run during first-load setup (showSetup → whisperReady) can read it
   without hitting a temporal-dead-zone error. This is what broke the UI when
   hosted (fresh origin → no saved model → showSetup runs at load). */
let whisperMod = null, transcriber = null, whisperLoadPromise = null;

/* Ask the browser to keep our storage (the downloaded AI model, voices and
   recognizer live in the Cache API / IndexedDB). Without this, on a phone the
   browser evicts them under storage pressure — which is why the AI model kept
   needing a re-download while the smaller voice/recognizer survived. */
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then((p) => { if (!p) navigator.storage.persist(); }).catch(() => {});
}
/* ============================================================
   MIA — LOCAL, OFFLINE one-button voice call with an animated robot
   STT: Web Speech API (browser)
   LLM: WebLLM — runs the model on-device (WebGPU), cached for offline
   TTS: built-in browser voices, or optional realistic offline Piper voice
   No API keys. No Gemini. No ElevenLabs.
   ============================================================ */

/* Register the offline cache (sw.js). It caches the CDN library code + WASM +
   model weights in the persistent Cache API so everything loads offline — the
   HTTP cache alone evicts them under storage pressure once several models are
   downloaded. No page reload, no UI interference (that was an old bug); it just
   caches in the background. Needs http/localhost, not file://. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* System prompt — identical to the online (Gemini) version. Both languages
   share the same English base, and differ only by the final language line
   (T().speakRule): " Always answer in English." / " Svara alltid på svenska." */
/* ---------------- personalities ----------------
   Mia is the main character. Each persona only changes the app text
   (name + pronoun), the face colour animation, the preferred voice and
   the system prompt. Everything else stays identical to Mia. The system
   prompt keeps Mia's exact wording — only "act as a person" and
   "your name is Mia" are swapped per character (Natasha has her own). */
const PERSONAS = [
  { id:'mia',     label:'Mia',                         name:'Mia',      pron:{en:'she',sv:'hon'}, gender:'female', glow:'#7de3ff',
    face:{ type:'robot' },
    systemBase:"Act as a person with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Your name is Mia. Always give short answers. Always be honest." },

  { id:'glados',  label:'GLaDOS — Portal',             name:'GLaDOS',   pron:{en:'she',sv:'hon'}, gender:'female', glow:'#ffbe2e',
    face:{ type:'glados' },
    systemBase:"Act as GLaDOS from Portal with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Your name is GLaDOS. Always give short answers. Always be honest." },

  { id:'lara',    label:'Lara Croft — Tomb Raider',    name:'Lara Croft', pron:{en:'she',sv:'hon'}, gender:'female', glow:'#7bd88f',
    face:{ type:'human', skin:'#d99f76', hair:'#4a2e1a', hairStyle:'ponytail', eyes:'#4f7a3a', brow:'#3a2413', lip:'#b56a5e', cloth:'#33a1d8', top:'tank', bust:'L' },
    systemBase:"Act as Lara Croft from Tomb Raider with your own vocabulary, personal taste, experiences, opinions, dreams, feelings and plans. Pretend that you have thoughts about all kind of things. Your name is Lara Croft. Always give short answers. Always be honest." },

  { id:'meiling', label:'Mei Ling — Metal Gear Solid', name:'Mei Ling', pron:{en:'she',sv:'hon'}, gender:'female', glow:'#ff9eb5',

/* Derive a cohesive dark theme from the character's accent colour so the
   whole app recolours to match. A persona may override any token via a
   `theme` object. Nothing about layout changes — only CSS colour tokens. */
function applyTheme(p){
  const [h, s] = hexToHsl(p.glow);
  const bgSat  = Math.min(s, 45);          // keep backgrounds tasteful, not neon
  const th = Object.assign({
    bg0:       `hsl(${h}, ${bgSat}%, 6%)`,
    bg1:       `hsl(${h}, ${bgSat}%, 13%)`,
    plate:     `hsl(${h}, ${Math.min(s,36)}%, 16%)`,
    plateEdge: `hsl(${h}, ${Math.min(s,34)}%, 28%)`,
    ink:       `hsl(${h}, 30%, 89%)`,
    inkDim:    `hsl(${h}, 18%, 62%)`,
    field:     `hsl(${h}, ${bgSat}%, 9%)`,
    userbub:   `hsl(${h}, 44%, 26%)`
  }, p.theme || {});
  const root = document.documentElement.style;
  root.setProperty('--glow', p.glow);
  root.setProperty('--bg0', th.bg0);
  root.setProperty('--bg1', th.bg1);
  root.setProperty('--plate', th.plate);
  root.setProperty('--plate-edge', th.plateEdge);
  root.setProperty('--ink', th.ink);
  root.setProperty('--ink-dim', th.inkDim);
  root.setProperty('--field', th.field);
  root.setProperty('--userbub', th.userbub);
  const rgb = hexToRgb(p.glow);
  const halo = document.getElementById('halo');
  if (halo) halo.style.background =
    `radial-gradient(circle, rgba(${rgb[0]},${rgb[1]},${rgb[2]},.10) 0%, rgba(${rgb[0]},${rgb[1]},${rgb[2]},0) 62%)`;
}
function setPersona(id){
  if (!PERSONAS.some(p => p.id === id)) return;
  PERSONA_ID = id;
  localStorage.setItem('mia_persona', id);
  applyPersona();
}
function hexToRgb(hex){
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function hexToHsl(hex){
  let [r,g,b] = hexToRgb(hex).map(v => v/255);
  const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max - min;
  let h = 0;
  if (d){
    if (max === r) h = ((g-b)/d) % 6;
    else if (max === g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  const l = (max + min) / 2;
  const s = d ? d / (1 - Math.abs(2*l - 1)) : 0;
  return [Math.round(h), Math.round(s*100), Math.round(l*100)];
}

/* Some models ship an mlc-chat-config that WebLLM rejects unless we override
   it. Gemma 3 sets both context_window_size and sliding_window_size > 0, which
   errors out. We disable the full context window and KEEP the small sliding
   window: this both fixes loading AND keeps the KV cache tiny, which stops the
   out-of-memory crash on phones. */
const MODEL_CHAT_OPTS = {
  // context_window_size:-1 keeps Gemma 3's native sliding window (512), which
  // fixes the load error and keeps the KV cache tiny → no OOM crash on phones.
  'gemma3-1b-it-q4f16_1-MLC': { context_window_size: -1 }
};

async function loadWebLLM(){
  if (webllm) return webllm;
  webllm = await import(WEBLLM_URL);
  return webllm;
}
async function buildModelList(){ try { await loadWebLLM(); } catch(e){} return MODELS; }

function currentModelId(){ return localStorage.getItem('mia_model') || null; }
function modelInfo(id){ return MODELS.find(m => m.id === id) || null; }

/* A module Web Worker built from a Blob, so the app stays a single file.
   Running WebLLM inside the worker keeps the main thread — and therefore the
   robot animation and the whole UI — smooth and responsive while the model
   is decoding. (On the main thread, decoding froze rAF → flicker + jank.) */
let miaWorker = null;
function makeWorker(){
  const src =
    'import { WebWorkerMLCEngineHandler } from "' + WEBLLM_URL + '";\n' +
    'const handler = new WebWorkerMLCEngineHandler();\n' +
    'self.onmessage = (e) => handler.onmessage(e);\n';
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  return new Worker(url, { type: 'module' });
}

/* Load (downloading + caching if needed) the given model into the engine. */
async function ensureModel(modelId, onProgress){
  await loadWebLLM();
  if (engine && loadedModelId === modelId) return engine;
  const chatOpts = MODEL_CHAT_OPTS[modelId];
  if (!engine){
    // Preferred: off-main-thread worker engine.
    if (webllm.CreateWebWorkerMLCEngine){
      try {
        miaWorker = makeWorker();
        engine = await webllm.CreateWebWorkerMLCEngine(miaWorker, modelId, { initProgressCallback: onProgress }, chatOpts);
        loadedModelId = modelId;
        return engine;
      } catch(e){
        console.warn('worker engine unavailable, using main thread:', e && e.message);
        try { miaWorker && miaWorker.terminate(); } catch(_){}
        miaWorker = null; engine = null;
      }
    }
    // Fallback: main-thread engine.
    engine = new webllm.MLCEngine();
    if (onProgress) engine.setInitProgressCallback(onProgress);
    await engine.reload(modelId, chatOpts);
    loadedModelId = modelId;
    return engine;
  }
  // Engine exists but a different model was picked → reload it.
  if (onProgress && engine.setInitProgressCallback) engine.setInitProgressCallback(onProgress);
  await engine.reload(modelId, chatOpts);
  loadedModelId = modelId;
  return engine;
}

/* Make sure the selected model is ready for a turn (used by call/chat). */
async function ensureModelReady(){
  const id = currentModelId();
  if (!id){ const e = new Error(T().noModel); e.noModel = true; throw e; }
  const info = modelInfo(id);
  if (info && info.runnable === false){ const e = new Error(T().appOnly); e.noModel = true; throw e; }
  if (engine && loadedModelId === id) return engine;
  if (!('gpu' in navigator)){ const e = new Error(T().needWebGPU); e.noModel = true; throw e; }
  setState(S.THINKING, T().loadingModel);
  await ensureModel(id, (p) => { statusEl.textContent = (p && p.text ? p.text : T().loadingModel).slice(0,60); });
  return engine;
}

/* One LLM call over an OpenAI-style message array. */
async function llmChat(messages){
  const eng = await ensureModelReady();
  // Model is loaded — show "Thinking…" instead of leaving the last load message
  // ("Finished loading on WebGPU") on screen while the model generates.
  if (onCall) setState(S.THINKING, T().thinking);
  // Necessary offline settings: on-device models are slow and, at temperature
  // 1.0 with a 1024-token budget, ramble without stopping — which left the app
  // stuck after "Finished loading on WebGPU". Lower temperature + penalties make
  // them stop, and a smaller budget keeps a spoken reply quick.
  const out = await eng.chat.completions.create({
    messages,
    temperature: 0.6,
    top_p: 0.9,
    frequency_penalty: 0.4,
    presence_penalty: 0.2,
    max_tokens: 128        // spoken replies are short; fewer tokens = much faster on mobile WebGPU
  });
  let txt = (out?.choices?.[0]?.message?.content || '');
  // Necessary offline-only cleanup: some local models (e.g. DeepSeek-R1) emit
  // <think>…</think> reasoning that Gemini never produced — never speak it.
  txt = txt.replace(/<think>[\s\S]*?<\/think>/gi, '');   // paired blocks
  txt = txt.replace(/<think>[\s\S]*$/i, '');             // unclosed / truncated block
  txt = txt.replace(/<\/?think>/gi, '').trim();
  return txt;
}

function fillModelSelect(){
  modelSel.innerHTML = '';
  for (const m of MODELS){
    const o = document.createElement('option');
    o.value = m.id;
    o.textContent = m.name + ' · ' + m.size + (m.runnable ? '' : ' · app only');
    modelSel.appendChild(o);
  }
  const sel = currentModelId();
  if (sel && MODELS.some(m => m.id === sel)) modelSel.value = sel;
  else modelSel.value = MODELS[0].id;
  updateModelMeta();
}
function updateModelMeta(){
  const info = modelInfo(modelSel.value);
  if (info && info.runnable === false){
    const altName = (modelInfo(info.alt) || {}).name || 'a browser model';
    modelMeta.textContent = T().appOnlyMeta.replace('ALT', altName);
    modelMeta.className = 'meta warn';
    dlModelBtn.disabled = true;
    modelStatus.textContent = ''; modelStatus.className = 'meta';
    document.getElementById('dlModelTxt').textContent = T().dlBtn;
    return;
  }
  dlModelBtn.disabled = false;
  modelMeta.textContent = info ? (info.note + ' · ' + info.size) : '';
  modelMeta.className = 'meta';
  if (!('gpu' in navigator)){ modelMeta.textContent = T().needWebGPU; modelMeta.className = 'meta warn'; }
  if (loadedModelId && loadedModelId === modelSel.value){
    modelStatus.textContent = T().modelReady; modelStatus.className = 'meta ok';
    document.getElementById('dlModelTxt').textContent = T().dlBtnLoaded;
  } else {
    modelStatus.textContent = localStorage.getItem('mia_model_cached_'+modelSel.value) ? T().modelReady : T().modelPick;
    modelStatus.className = 'meta';
    document.getElementById('dlModelTxt').textContent = T().dlBtn;
  }
}
modelSel.addEventListener('change', () => {
  const info = modelInfo(modelSel.value);
  if (info && info.runnable === false){
    // keep a working model selected; just show the explanation
    if (!currentModelId() || (modelInfo(currentModelId()) || {}).runnable === false)
      localStorage.setItem('mia_model', info.alt);
    updateModelMeta();
    return;
  }
  localStorage.setItem('mia_model', modelSel.value);
  updateModelMeta();
});

dlModelBtn.addEventListener('click', async () => {
  const chosen = modelInfo(modelSel.value);
  if (chosen && chosen.runnable === false){ modelStatus.textContent = T().appOnly; modelStatus.className = 'meta warn'; return; }
  if (!('gpu' in navigator)){ modelMeta.textContent = T().needWebGPU; modelMeta.className = 'meta err'; return; }
  const id = modelSel.value;
  localStorage.setItem('mia_model', id);
  dlModelBtn.disabled = true;
  progWrap.classList.add('show');
  modelStatus.className = 'meta';
  try {
    await ensureModel(id, (p) => {
      if (p && typeof p.progress === 'number') progBar.style.width = Math.round(p.progress*100) + '%';
      modelStatus.textContent = (p && p.text) ? p.text.slice(0,80) : T().modelLoading;
    });
    localStorage.setItem('mia_model_cached_'+id, '1');
    progBar.style.width = '100%';
    modelStatus.textContent = T().modelReady; modelStatus.className = 'meta ok';
    document.getElementById('dlModelTxt').textContent = T().dlBtnLoaded;
  } catch(e){
    modelStatus.textContent = T().modelErr + (e.message || e); modelStatus.className = 'meta err';
  } finally {
    dlModelBtn.disabled = false;
    setTimeout(() => progWrap.classList.remove('show'), 1200);
  }
});

async function refreshVoiceStatus(){
  // reflect whether the selected realistic voice is already downloaded
  voiceStatus.className = 'meta';
  voiceStatus.textContent = T().voicePiperNote;
  document.getElementById('dlVoiceTxt').textContent = T().dlVoiceBtn;
  try {
    const mod = await loadVits();
    const have = await mod.stored();
    if (have && have.includes(currentPiperVoice())){
      voiceStatus.textContent = T().voiceReady; voiceStatus.className = 'meta ok';
      document.getElementById('dlVoiceTxt').textContent = T().dlVoiceLoaded;
    }
  } catch(e){ /* library not reachable yet — leave the default note */ }
  // The only offline neural Swedish voice (Piper NST) is male. Point users to
  // the built-in browser Swedish voice, which is female on most devices.
  if (currentPiperVoice().startsWith('sv_')){
    voiceStatus.textContent += (voiceStatus.textContent ? '  ' : '') + T().svFemaleHint;
    if (voiceStatus.className === 'meta') voiceStatus.className = 'meta warn';
  }
}

  const piper = voiceMode === 'piper';

      // p: { url, total, loaded } or a 0..1 number depending on version

/* ---------------- realistic TTS via vits-web (Piper voices, offline once
   downloaded). Downloads the ONNX voice from HuggingFace and caches it in the
   browser (OPFS), then runs fully offline. ---------------------------------- */
let vitsMod = null;
async function loadVits(){
  if (vitsMod) return vitsMod;
  vitsMod = await import('https://esm.run/@diffusionstudio/vits-web');
  return vitsMod;
}
async function piperTTS(text){
  const mod = await loadVits();
  const voiceId = currentPiperVoice();
  return await mod.predict({ text, voiceId });   // audio/wav Blob
}

/* ---------------- persistence: memory, log, blobs ---------------- */
const idb = {
  db: null,
  open(){
    if (this.db) return Promise.resolve();
    return new Promise((res, rej) => {
      const r = indexedDB.open('mia', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('blobs');
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  async put(key, blob){
    await this.open();
    return new Promise((res, rej) => {
      const tx = this.db.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').put(blob, key);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  },
  async get(key){
    await this.open();
    return new Promise((res, rej) => {
      const q = this.db.transaction('blobs').objectStore('blobs').get(key);
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => rej(q.error);
    });
  },
  async clear(){
    await this.open();
    return new Promise((res) => {
      const tx = this.db.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').clear();
      tx.oncomplete = res; tx.onerror = res;
    });
  }
};

function loadLog(){ try { return JSON.parse(localStorage.getItem(logKey()) || '[]'); } catch(e){ return []; } }
let convLog = loadLog();
function saveLog(){
  if (convLog.length > 2000) convLog = convLog.slice(-2000);
  try { localStorage.setItem(logKey(), JSON.stringify(convLog)); } catch(e){
    convLog = convLog.slice(-500);
    try { localStorage.setItem(logKey(), JSON.stringify(convLog)); } catch(e2){}
  }
}
function logMsg(role, text, searched){
  convLog.push({ t:'msg', role, text, searched: !!searched, time: Date.now() });
  saveLog();
}
function logGen(kind, name, blob){
  const id = 'g' + Date.now() + Math.random().toString(36).slice(2, 7);
  idb.put(id, blob).catch(() => {});
  convLog.push({ t:'gen', kind, name, blobId:id, time: Date.now() });
  saveLog();
  return id;
}
function logAttach(kind, name, blob){
  const id = 'a' + Date.now() + Math.random().toString(36).slice(2, 7);
  idb.put(id, blob).catch(() => {});
  convLog.push({ t:'att', kind, name, blobId:id, time: Date.now() });
  saveLog();
  return id;
}

function loadHistory(){
  try { return JSON.parse(localStorage.getItem(historyKey()) || '[]'); } catch(e){ return []; }
}
function saveHistory(){
  try { localStorage.setItem(historyKey(), JSON.stringify(history)); } catch(e){}
}

function renderLog(){
  const box = document.getElementById('logBox');
  box.innerHTML = '';
  if (!convLog.length){ box.textContent = T().suEmpty; return; }
  for (const e of convLog){
    const div = document.createElement('div');
    div.className = 'litem';
    const time = new Date(e.time).toLocaleString();
    if (e.t === 'msg'){
      const role = document.createElement('span');
      role.className = 'lrole';
      role.textContent = (e.role === 'user' ? T().lYou : T().lMia) + ': ';
      div.appendChild(role);
      div.appendChild(document.createTextNode(e.text + ' '));
      const ts = document.createElement('span');
      ts.className = 'ltime'; ts.textContent = time;
      div.appendChild(ts);
    } else {
      const role = document.createElement('span');
      role.className = 'lrole';
      role.textContent = e.t === 'att' ? T().lAtt : T().lMade;
      div.appendChild(role);
      if (e.kind === 'image'){
        const img = document.createElement('img');
        idb.get(e.blobId).then(b => {
          if (b){ img.src = URL.createObjectURL(b); img.onload = () => { box.scrollTop = box.scrollHeight; }; }
        });
        div.appendChild(img);
      }
      const a = document.createElement('a');
      a.href = '#'; a.textContent = e.name + ' ⬇';
      a.addEventListener('click', async (ev) => {
        ev.preventDefault();
        const b = await idb.get(e.blobId);
        if (!b){ a.textContent = e.name + ' (gone)'; return; }
        const url = URL.createObjectURL(b);
        const tmp = document.createElement('a');
        tmp.href = url; tmp.download = e.name; tmp.click();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
      });
      div.appendChild(a);
      div.appendChild(document.createTextNode(' '));
      const ts = document.createElement('span');
      ts.className = 'ltime'; ts.textContent = time;
      div.appendChild(ts);
    }
    box.appendChild(div);
  }
  box.scrollTop = box.scrollHeight;
  requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
}
document.getElementById('clearLog').addEventListener('click', () => {
  convLog = []; saveLog();
  history = []; saveHistory();
  idb.clear();
  renderLog();
});

const S = { OFF:'off', LISTENING:'listening', THINKING:'thinking', SPEAKING:'speaking' };

function setState(s, label){
  state = s;
  document.body.classList.remove('state-listening','state-thinking','state-speaking');
  if (s !== S.OFF) document.body.classList.add('state-' + s);
  statusEl.textContent = label || ' ';
  face.setExpression(
    s === S.LISTENING ? 'listening' :
    s === S.THINKING  ? 'thinking'  :
    s === S.SPEAKING  ? 'speaking'  : 'idle'
  );
}

/* ---------------- robot face (canvas) — violet/mint local palette ---- */
const face = (() => {
  const cv = document.getElementById('face');
  const cx = cv.getContext('2d');
  const W = cv.width, H = cv.height, CX = W/2, CY = H/2;

  const cur = { eyeH:1, browTilt:0, browRaise:0, pupilX:0, pupilY:0,
                mouthOpen:.08, mouthCurve:.25, headBob:0, glow:.6, headTilt:0, headX:0 };
  const tgt = Object.assign({}, cur);
  let expression = 'idle';
  let blinkT = 0, nextBlink = 2 + Math.random()*3;
  let wanderT = 0, t = 0;
  let mouthLevel = 0;
  /* base pose from the current state-expression + a rotating idle
     micro-expression, plus decaying gesture deltas for natural motion */
  const EXPR = {
    idle:      { eyeH:1,   browTilt:0,   browRaise:0,  mouthOpen:.06, mouthCurve:.5,  glow:.7 },
    listening: { eyeH:1.1, browTilt:0,   browRaise:.5, mouthOpen:.05, mouthCurve:.55, glow:1  },
    thinking:  { eyeH:.82, browTilt:.5,  browRaise:.3, mouthOpen:.04, mouthCurve:.3,  glow:.8 },
    speaking:  { eyeH:1,   browTilt:0,   browRaise:.2, mouthOpen:.1,  mouthCurve:.45, glow:1  },
    happy:     { eyeH:.55, browTilt:-.25,browRaise:.6, mouthOpen:.12, mouthCurve:1,   glow:1.1},
    surprised: { eyeH:1.3, browTilt:0,   browRaise:1,  mouthOpen:.5,  mouthCurve:.25, glow:1.1},
    warm:      { eyeH:.85, browTilt:-.12,browRaise:.28,mouthOpen:.05, mouthCurve:.82, glow:.9 },
    smirk:     { eyeH:.95, browTilt:.16, browRaise:.32,mouthOpen:.03, mouthCurve:.72, glow:.82},
    thoughtful:{ eyeH:.9,  browTilt:.32, browRaise:.16,mouthOpen:.03, mouthCurve:.36, glow:.76},
    skeptical: { eyeH:.92, browTilt:.05, browRaise:.72,mouthOpen:.03, mouthCurve:.42, glow:.8 },
    soft:      { eyeH:.96, browTilt:-.06,browRaise:.16,mouthOpen:.05, mouthCurve:.64, glow:.82},
    curious:   { eyeH:1.05,browTilt:-.05,browRaise:.55,mouthOpen:.08, mouthCurve:.58, glow:.9 },
    laugh:     { eyeH:.42, browTilt:-.3, browRaise:.7, mouthOpen:.42, mouthCurve:1,   glow:1.2 },
    excited:   { eyeH:1.2, browTilt:-.15,browRaise:.85,mouthOpen:.28, mouthCurve:.9,  glow:1.2 },
    love:      { eyeH:.6,  browTilt:-.2, browRaise:.4, mouthOpen:.06, mouthCurve:.95, glow:1.1 },
    sad:       { eyeH:.8,  browTilt:-.4, browRaise:.5, mouthOpen:.05, mouthCurve:-.5, glow:.65},
    angry:     { eyeH:.85, browTilt:.6,  browRaise:-.3,mouthOpen:.08, mouthCurve:-.35,glow:.8 },
    wink:      { eyeH:.9,  browTilt:-.1, browRaise:.3, mouthOpen:.04, mouthCurve:.78, glow:.95},
    cheeky:    { eyeH:.9,  browTilt:.2,  browRaise:.5, mouthOpen:.05, mouthCurve:.68, glow:.9 }
  };
  const IDLE_POOL  = ['idle','warm','smirk','thoughtful','skeptical','soft','curious','idle'];
  const REACT_POOL = ['speaking','warm','happy','curious','smirk','surprised','excited','soft','cheeky','thoughtful'];
  let base = Object.assign({}, EXPR.idle);
  let gTiltT = 0, nextGesture = 1.5 + Math.random()*2.5;   // gesture timer
  let microT = 0, nextMicro = 3 + Math.random()*3;          // expression rotation
  const gd = { tilt:0, brow:0, curve:0, open:0, eyeH:0, look:0, nod:0 };  // decaying deltas

  /* current character descriptor + accent colour (default = Mia cyan) */
  let FD = { type:'robot' };
  let AR = 125, AG = 227, AB = 255;
  let EYE_TOP = '#a5efff', EYE_BOT = '#5ed4f8', MOUTH = '#7de3ff';
  function _hx(h){ h = (h||'#7de3ff').replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
  function _mix(c, w, amt){ return [0,1,2].map(i => Math.round(c[i] + (w[i]-c[i])*amt)); }
  function _css(c){ return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
  function setFace(persona){
    FD = (persona && persona.face) || { type:'robot' };
    const c = _hx(persona && persona.glow);
    AR = c[0]; AG = c[1]; AB = c[2];
    EYE_TOP = _css(_mix(c, [255,255,255], .55));
    EYE_BOT = _css(_mix(c, [10,20,40], .18));
    MOUTH   = (persona && persona.glow) || '#7de3ff';
  }

  function setExpression(e){
    expression = e;
    base = Object.assign({}, EXPR[e] || EXPR.idle);
    if (e === 'thinking'){ tgt.pupilX = .5; tgt.pupilY = -.6; }
    microT = 0; nextMicro = 2.5 + Math.random()*3;
  }
  function setMouthLevel(v){ mouthLevel = v; }
  function ease(dt){ for (const k in tgt) cur[k] += (tgt[k]-cur[k]) * Math.min(1, dt*7); }

  /* ---- small drawing helpers ---- */
  function el(x,y,rx,ry){ cx.beginPath(); cx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,7); }
  function roundRect(x,y,w,h,rad){
    cx.beginPath();
    cx.moveTo(x+rad,y);
    cx.arcTo(x+w,y,x+w,y+h,rad);
    cx.arcTo(x+w,y+h,x,y+h,rad);
    cx.arcTo(x,y+h,x,y,rad);
    cx.arcTo(x,y,x+w,y,rad);
    cx.closePath();
  }

  /* ================= ROBOT (Mia) ================= */
  function drawRobot(blink){
    const r = 210;
    const grad = cx.createLinearGradient(0,-r,0,r);
    grad.addColorStop(0,'#26325a'); grad.addColorStop(1,'#161e36');
    cx.fillStyle = grad;
    roundRect(-r, -r*.92, r*2, r*1.84, 118); cx.fill();
    cx.lineWidth = 5; cx.strokeStyle = '#2f3d63'; cx.stroke();

    cx.strokeStyle = '#2b3757'; cx.lineWidth = 8;
    cx.beginPath(); cx.moveTo(0,-r*.92); cx.lineTo(0,-r*1.12); cx.stroke();
    cx.fillStyle = `rgba(${AR},${AG},${AB},${.4 + .6*cur.glow*(0.6+0.4*Math.sin(t*3))})`;
    cx.beginPath(); cx.arc(0,-r*1.2, 13, 0, 7); cx.fill();

    cx.fillStyle = '#2b3757';
    roundRect(-r-16, -34, 20, 68, 10); cx.fill();
    roundRect( r-4,  -34, 20, 68, 10); cx.fill();

    cx.fillStyle = '#0c1226';
    roundRect(-r*.8, -r*.68, r*1.6, r*1.36, 84); cx.fill();

    const eyeY = -42, eyeDX = 80;
    const eh = 54 * cur.eyeH * blink, ew = 40;
    for (const s of [-1,1]){
      const ex = s*eyeDX + cur.pupilX*14;
      const g = cx.createRadialGradient(ex, eyeY, 4, ex, eyeY, 58);
      g.addColorStop(0, `rgba(${AR},${AG},${AB},${.5*cur.glow})`);
      g.addColorStop(1, `rgba(${AR},${AG},${AB},0)`);
      cx.fillStyle = g;
      cx.beginPath(); cx.arc(ex, eyeY, 60, 0, 7); cx.fill();
      const eg = cx.createLinearGradient(ex, eyeY-eh, ex, eyeY+eh);
      eg.addColorStop(0,EYE_TOP); eg.addColorStop(1,EYE_BOT);
      cx.fillStyle = eg;
      cx.beginPath(); cx.ellipse(ex, eyeY + cur.pupilY*8, ew, Math.max(3, eh), 0, 0, 7); cx.fill();
      cx.fillStyle = 'rgba(255,255,255,.9)';
      cx.beginPath(); cx.ellipse(ex - 11 + cur.pupilX*6, eyeY - eh*.35 + cur.pupilY*8, 10, Math.max(2, eh*.24), 0, 0, 7); cx.fill();
      cx.fillStyle = 'rgba(255,255,255,.55)';
      cx.beginPath(); cx.ellipse(ex + 12 + cur.pupilX*6, eyeY + eh*.3 + cur.pupilY*8, 5, Math.max(1.5, eh*.1), 0, 0, 7); cx.fill();
    }
    cx.strokeStyle = `rgba(${AR},${AG},${AB},${.7*cur.glow})`;
    cx.lineWidth = 7; cx.lineCap = 'round';
    for (const s of [-1,1]){
      const bx = s*eyeDX, by = eyeY - 66 - cur.browRaise*16;
      const tilt = cur.browTilt * 12 * s;
      cx.beginPath(); cx.moveTo(bx - 28, by + 6 + tilt); cx.quadraticCurveTo(bx, by - 8, bx + 28, by + 6 - tilt); cx.stroke();
    }
    const my = 84, mw = 96;
    const open = Math.max(.03, cur.mouthOpen), curve = cur.mouthCurve;
    cx.fillStyle = MOUTH;
    cx.beginPath();
    cx.moveTo(-mw/2, my - curve*18);
    cx.quadraticCurveTo(0, my - curve*18 - open*8, mw/2, my - curve*18);
    cx.quadraticCurveTo(mw/2 + open*6, my + open*46*.5, mw/2, my + open*46 + curve*14);
    cx.quadraticCurveTo(0, my + open*46 + curve*30, -mw/2, my + open*46 + curve*14);
    cx.quadraticCurveTo(-mw/2 - open*6, my + open*46*.5, -mw/2, my - curve*18);
    cx.closePath(); cx.fill();
    if (open > .18){ cx.fillStyle = '#0c1226'; cx.beginPath(); cx.ellipse(0, my + open*24, mw*.32, open*18, 0, 0, 7); cx.fill(); }
    if (curve > .3){
      const blush = Math.min(1, (curve - .3) / .6);
      cx.fillStyle = `rgba(244,138,158,${.12 + .28*blush})`;
      el(-eyeDX-16, 36, 24, 13); cx.fill(); el( eyeDX+16, 36, 24, 13); cx.fill();
    }
  }

  /* ================= GLaDOS (optic core) =================
     White segmented body, black face plate, single yellow optic that
     brightens with speech; the eye "blinks" as a lid closing over the
     round optic (clipped, so no square ever shows). */
  function drawGlados(blink){
    // hanging cables + ceiling mount
    cx.strokeStyle = '#3a3d42'; cx.lineWidth = 12; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(-24,-272); cx.lineTo(-8,-150); cx.moveTo(24,-272); cx.lineTo(8,-150); cx.stroke();
    cx.fillStyle = '#d7dade'; roundRect(-44,-214,88,86,20); cx.fill();
    cx.fillStyle = '#b7bcc1'; roundRect(-44,-214,88,22,20); cx.fill();

    // white segmented cocoon body
    cx.fillStyle = '#e7e9ec';
    cx.beginPath();
    cx.moveTo(0,-150);
    cx.quadraticCurveTo(188,-116,172,52);
    cx.quadraticCurveTo(150,220,0,244);
    cx.quadraticCurveTo(-150,220,-172,52);
    cx.quadraticCurveTo(-188,-116,0,-150);
    cx.closePath(); cx.fill();
    // soft side shadow for volume
    cx.save(); cx.globalAlpha = .35; cx.fillStyle = '#aab0b8';
    cx.beginPath(); cx.moveTo(-172,52); cx.quadraticCurveTo(-150,220,0,244);
    cx.quadraticCurveTo(-78,150,-104,-16); cx.closePath(); cx.fill(); cx.restore();
    // segment seams
    cx.strokeStyle = 'rgba(120,126,134,.5)'; cx.lineWidth = 5;
    for (const yy of [-42,44,132]){ cx.beginPath(); cx.moveTo(-158,yy); cx.quadraticCurveTo(0,yy+16,158,yy); cx.stroke(); }
    // side actuator plates
    cx.fillStyle = '#cfd2d6'; roundRect(-186,-4,42,120,18); cx.fill(); roundRect(144,-4,42,120,18); cx.fill();

    // black face plate housing the optic
    const oy = 64;
    cx.fillStyle = '#141518';
    cx.beginPath();
    cx.moveTo(0,-66);
    cx.quadraticCurveTo(128,-42,120,oy);
    cx.quadraticCurveTo(110,172,0,182);
    cx.quadraticCurveTo(-110,172,-120,oy);
    cx.quadraticCurveTo(-128,-42,0,-66);
    cx.closePath(); cx.fill();

    // optic
    const b = Math.min(1.5, cur.glow*(0.6 + 0.6*mouthLevel));
    const px = cur.pupilX*16, py = oy + cur.pupilY*10;
    const R = 84;
    cx.fillStyle = '#0a0b0d'; el(0,oy,R,R); cx.fill();                 // socket
    const og = cx.createRadialGradient(px, py, 3, 0, oy, R+4);
    og.addColorStop(0, `rgba(255,244,210,${Math.min(1,.95*b)})`);
    og.addColorStop(.38, `rgba(${AR},${AG},${AB},${Math.min(1,.92*b)})`);
    og.addColorStop(1, `rgba(${AR},${AG},${AB},0)`);
    cx.fillStyle = og; el(0,oy,R+2,R+2); cx.fill();
    cx.fillStyle = `rgba(${AR},${AG},${AB},${Math.min(1,b)})`; el(px,py,34,34); cx.fill();
    cx.fillStyle = `rgba(255,250,235,${Math.min(1,.95*b)})`; el(px,py,14,14); cx.fill();
    cx.strokeStyle = `rgba(${AR},${AG},${AB},.7)`; cx.lineWidth = 5; el(0,oy,R-4,R-4); cx.stroke();

    // eyelid blink — lids close over the ROUND optic only (clipped → no square)
    const closed = 1 - blink;
    if (closed > 0.02){
      cx.save();
      el(0,oy,R,R); cx.clip();
      cx.fillStyle = '#141518';
      const h = closed * (R+6);
      cx.fillRect(-R-6, oy-R-4, (R+6)*2, h);          // upper lid down
      cx.fillRect(-R-6, oy+R+4-h, (R+6)*2, h);          // lower lid up
      cx.restore();
    }
  }

  /* ================= HUMAN ================= */
  function drawHumanEye(ex, eyeY, ew, eh, iris){
    const almond = FD.eyeStyle === 'almond';
    cx.save();
    cx.beginPath();
    if (almond){
      const s = ex < 0 ? 1 : -1;   // outer corner slightly lifted
      cx.moveTo(ex-ew, eyeY+eh*0.15*s);
      cx.quadraticCurveTo(ex-ew*0.2, eyeY-eh*1.05, ex+ew*0.35, eyeY-eh*0.8);
      cx.quadraticCurveTo(ex+ew, eyeY-eh*0.25, ex+ew, eyeY-eh*0.1*s);
      cx.quadraticCurveTo(ex+ew*0.3, eyeY+eh*1.0, ex-ew*0.45, eyeY+eh*0.8);
      cx.quadraticCurveTo(ex-ew, eyeY+eh*0.3, ex-ew, eyeY+eh*0.15*s);
      cx.closePath();
    } else {
      cx.ellipse(ex, eyeY, ew, Math.max(.1,eh), 0, 0, 7);
    }
    cx.fillStyle = '#f7f3ec'; cx.fill();
    if (eh >= 5){
      cx.clip();
      const ix = ex + cur.pupilX*10, iy = eyeY + cur.pupilY*6;
      const ir = Math.min(ew*0.82, eh*1.3, 24);
      const g = cx.createRadialGradient(ix, iy, 2, ix, iy, ir);
      g.addColorStop(0, _css(_mix(_hx(iris),[255,255,255],.28)));
      g.addColorStop(.7, iris);
      g.addColorStop(1, _css(_mix(_hx(iris),[0,0,0],.45)));
      cx.fillStyle = g; el(ix, iy, ir, ir); cx.fill();
      cx.fillStyle = 'rgba(12,8,8,.92)'; el(ix, iy, ir*.46, ir*.46); cx.fill();
      cx.fillStyle = 'rgba(60,40,34,.28)'; cx.fillRect(ex-ew, eyeY-eh, ew*2, eh*0.55);   // upper-lid shadow
      cx.fillStyle = 'rgba(255,255,255,.95)'; el(ix - ir*.32, iy - ir*.34, ir*.24, ir*.24); cx.fill();
      cx.fillStyle = 'rgba(255,255,255,.5)';  el(ix + ir*.3, iy + ir*.26, ir*.12, ir*.12); cx.fill();
    }
    cx.restore();
    // upper lash line / eyeliner
    cx.strokeStyle = FD.lashes ? 'rgba(20,12,12,.9)' : 'rgba(45,28,22,.6)';
    cx.lineWidth = FD.lashes ? 6 : 4; cx.lineCap = 'round';
    cx.beginPath(); cx.ellipse(ex, eyeY, ew, Math.max(2,eh), 0, Math.PI*1.02, Math.PI*1.98); cx.stroke();

  function draw(dt){
    t += dt;
    blinkT += dt;
    let blink = 1;
    if (blinkT > nextBlink){
      const p = (blinkT - nextBlink) / .22;
      if (p >= 1){ blinkT = 0; nextBlink = 1.8 + Math.random()*3.5; }
      else blink = Math.abs(1 - p*2);
    }
    const calm = (expression === 'idle' || expression === 'listening');
    const speaking = (expression === 'speaking');
    // decay gesture deltas back toward rest
    const decay = Math.max(0, 1 - dt*1.6);
    for (const k in gd) gd[k] *= decay;

    if (calm || speaking){
      // gaze wandering (livelier while speaking)
      wanderT += dt;
      if (wanderT > (speaking ? 1.2 : 2.2)){ wanderT = 0; tgt.pupilX = (Math.random()*2-1)*(speaking?.3:.5) + gd.look; tgt.pupilY = (Math.random()*2-1)*.28; }
      // gestures: head tilt/turn, brow flicks, nods, lip moves, squints
      gTiltT += dt;
      if (gTiltT > nextGesture){
        gTiltT = 0; nextGesture = (speaking ? 0.7 : 1.6) + Math.random()*(speaking?1.4:3);
        const r = Math.random();
        if (r < .3){ gd.tilt = (Math.random()*2-1)*(speaking?.06:.05); gd.look = (Math.random()*2-1)*.35; }
        else if (r < .5){ gd.brow = .35 + Math.random()*.55; }               // brow flick / emphasis
        else if (r < .68){ gd.nod = speaking ? 7 : 4; }                       // head nod
        else if (r < .84){ gd.open = .12 + Math.random()*.14; gd.curve = .12; } // lip move / breath
        else { gd.eyeH = -.14; }                                             // soft squint
      }
      // rotate the resting / reacting micro-expression for lots of variety
      microT += dt;
      if (microT > nextMicro){
        microT = 0; nextMicro = (speaking ? 1.1 : 2.8) + Math.random()*(speaking?1.6:3.5);
        const pool = speaking ? REACT_POOL : IDLE_POOL;
        base = Object.assign({}, EXPR[pool[(Math.random()*pool.length)|0]] || base);
      }
    }
    if (speaking){ tgt.pupilX = Math.sin(t*.6)*.12 + tgt.pupilX*0; }

    // gentle continuous sway (kept for the HEAD only on humans; whole-body on robot/glados)
    const swayTilt = Math.sin(t*0.5)*0.03 + Math.sin(t*0.21)*0.018;
    const swayX    = Math.sin(t*0.34)*7 + Math.sin(t*0.17)*4;
    const breath   = (Math.sin(t*0.9)*0.5 + 0.5) * 0.03;

    // compose targets from base pose + deltas + live signals
    tgt.eyeH      = base.eyeH + gd.eyeH;
    tgt.browTilt  = base.browTilt;
    tgt.browRaise = base.browRaise + gd.brow;
    tgt.mouthCurve = base.mouthCurve + gd.curve;
    tgt.glow      = base.glow;
    if (mouthLevel > 0.01) tgt.mouthOpen = .06 + mouthLevel*.85 + gd.open*.3;
    else tgt.mouthOpen = base.mouthOpen + gd.open + ((calm||speaking) ? breath : 0);
    tgt.headTilt = swayTilt + gd.tilt;
    tgt.headX    = swayX;
    tgt.headBob  = Math.sin(t*1.2)*(speaking? 5:3) + Math.sin(t*0.6)*2 + gd.nod;
    ease(dt);

    cx.clearRect(0,0,W,H);
    cx.save();
    cx.translate(CX, CY);
    // ambient accent glow behind the character (still)
    const ag = cx.createRadialGradient(0,0,40,0,0,330);
    ag.addColorStop(0, `rgba(${AR},${AG},${AB},.12)`);
    ag.addColorStop(1, `rgba(${AR},${AG},${AB},0)`);
    cx.fillStyle = ag; cx.beginPath(); cx.arc(0,0,330,0,7); cx.fill();

    if (FD.type === 'human'){
      // body stays still; only the head/neck tilt+nod (handled inside drawHuman)
      drawHuman(blink);
    } else {
      // robot / mechanical / creature: sway + tilt the whole unit
      cx.save();
      cx.translate(cur.headX, cur.headBob); cx.rotate(cur.headTilt);
      switch (FD.type){
        case 'glados': drawGlados(blink); break;
        case 'aicore': drawAICore(blink); break;
        case 'cat':    drawCat(blink); break;
        case 'fairy':  drawFairy(blink); break;
        case 'mrdna':  drawMrDNA(blink); break;
        case 'rotom':  drawRotom(blink); break;
        case 'moogle': drawMoogle(blink); break;
        case 'pipboy': drawPipboy(blink); break;
        case 'clippy': drawClippy(blink); break;
        default:       drawRobot(blink);
      }
      cx.restore();
    }

    cx.restore();
  }
  // transform for the human head group (pivot at the shoulder line) so the
  // body stays still and only the head tilts / nods
  function headTransform(){
    cx.translate(0, 152); cx.rotate(cur.headTilt); cx.translate(0, -152);
    cx.translate(cur.headX*0.35, cur.headBob*0.6);
  }

  let last = performance.now();
  (function loop(now){
    const dt = Math.min(.05, (now-last)/1000); last = now;
    draw(dt);
    requestAnimationFrame(loop);
  })(last);

  setExpression('idle');
  return { setExpression, setMouthLevel, setFace };
})();

/* ---------------- lip sync ---------------- */
function startLipSyncFromAnalyser(){
  function tick(){
    if (state !== S.SPEAKING) { face.setMouthLevel(0); return; }
    let level = 0;
    if (analyser && ampData){
      analyser.getByteTimeDomainData(ampData);
      let sum = 0;
      for (let i=0;i<ampData.length;i++){ const d = (ampData[i]-128)/128; sum += d*d; }
      level = Math.min(1, Math.sqrt(sum/ampData.length) * 5.5);
    } else {
      fakeMouthTimer += .08;
      level = Math.max(0, Math.sin(fakeMouthTimer*7)*.5 + .35 + Math.sin(fakeMouthTimer*13)*.2);
    }
    face.setMouthLevel(level);
    requestAnimationFrame(tick);
  }
  tick();
}

      attachment = { kind:'image', mime:'image/jpeg', dataB64: await imageToB64(f), name:f.name, file:f };
      addAttachmentCard(f.name, URL.createObjectURL(f));
    } else if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)){
      attachment = { kind:'pdf', mime:'application/pdf', dataB64: await fileToB64(f), name:f.name, file:f };
      addAttachmentCard(f.name, null);
    } else if (f.type.startsWith('text/') || /\.(txt|md|csv|json|html)$/i.test(f.name)){
      let text = await f.text();
      if (text.length > 100000) text = text.slice(0, 100000);
      attachment = { kind:'text', text, name:f.name, file:f };
      addAttachmentCard(f.name, null);
    } else {
      hintEl.textContent = T().unsupported; return;
    }
    logAttach(attachment.kind === 'image' ? 'image' : 'file', f.name, f);
    hintEl.textContent = T().attached;
  } catch(e){ hintEl.textContent = '⚠ ' + e.message; }
});

function fileToB64(f){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(new Error('read failed'));
    r.readAsDataURL(f);
  });
}
function imageToB64(f){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const maxSide = 1024;
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', .85).split(',')[1]);
    };
    img.onerror = () => rej(new Error('image read failed'));
    img.src = URL.createObjectURL(f);
  });
}

/* parse [[FILE:...]]...[[/FILE]] and [[IMAGE:...]] out of Mia's reply */
function processReply(reply, container){
  let spoken = reply;
  spoken = spoken.replace(/\[\[SEARCH:[^\]]*\]\]/ig, ' ');
  const files = [];
  spoken = spoken.replace(/\[\[FILE:([^\]]+)\]\]([\s\S]*?)\[\[\/FILE\]\]/g, (m, fname, content) => {
    files.push({ name: fname.trim(), content: content.trim() });
    return ' ';
  });
  let imagePrompt = null;
  spoken = spoken.replace(/\[\[IMAGE:([^\]]*)\]\]/g, (m, desc) => {
    imagePrompt = desc.trim();
    return ' ';
  });
  spoken = spoken.replace(/\s+/g, ' ').trim();

  for (const f of files){
    const mime = /\.html?$/i.test(f.name) ? 'text/html' :
                 /\.csv$/i.test(f.name)  ? 'text/csv'  :
                 /\.md$/i.test(f.name)   ? 'text/markdown' : 'text/plain';
    addResultCard({ name: f.name, blob: new Blob([f.content], { type: mime }), kind:'file' }, container);
  }
  if (imagePrompt) generateImage(imagePrompt, container);

  if (!spoken) spoken = files.length ? T().madeFile : (imagePrompt ? T().madeImage : '');
  return spoken || T().madeFile;
}

/* ---------------- image generation (keyless, online only) ---------------- */
async function generateImage(prompt, container){
  const pending = addResultCard({ name: 'image…', pending: true }, container);
  try {
    const res = await fetch('https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=768&height=768&nologo=true');
    if (!res.ok) throw new Error('image HTTP ' + res.status);
    const blob = await res.blob();
    pending.remove();
    const thumbURL = URL.createObjectURL(blob);
    addResultCard({ name: 'mia-image-' + Date.now() + '.png', blob, thumbURL, kind:'image' }, container);
  } catch(e){
    pending.remove(); refreshAttachBtnVisibility();
    hintEl.textContent = '⚠ ' + T().imgFail;
  }
}
